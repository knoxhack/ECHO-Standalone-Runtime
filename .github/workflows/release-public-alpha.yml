name: Release Public Alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-public-alpha.yml
      - build.gradle
      - scripts/public-alpha-package-audit.mjs
      - scripts/verify-release-index-product.mjs
      - README.md
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish.
        required: true
        default: v0.1.0-standalone-runtime-alpha

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PUBLIC_ALPHA_RELEASE_TAG: v0.1.0-standalone-runtime-alpha

jobs:
  release-public-alpha:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Stage public alpha release assets
        run: .\gradlew.bat packagePublicAlphaRelease --console=plain
      - name: Attest public alpha checksums
        uses: actions/attest@v4
        with:
          subject-checksums: build/public-alpha/checksums.txt
      - name: Create release if needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || env.PUBLIC_ALPHA_RELEASE_TAG }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "ECHO Standalone Runtime $env:RELEASE_TAG" --prerelease --notes "Public alpha Standalone Runtime release assets generated by the Release Public Alpha workflow."
          }
      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || env.PUBLIC_ALPHA_RELEASE_TAG }}
        run: gh release upload $env:RELEASE_TAG build/public-alpha/* --repo $env:GITHUB_REPOSITORY --clobber
      - name: Upload workflow artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: echo-standalone-runtime-public-alpha
          path: build/public-alpha
          if-no-files-found: error
