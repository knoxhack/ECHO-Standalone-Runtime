                || movement.worldAware != true
                || movement.successfulMove.moved != true
                || movement.successfulMove.to.key != '1,0,0'
                || movement.blockedMove.moved != false
                || movement.blockedMove.reason != 'blocked_cell'
                || movement.finalPlayerPosition.key != '1,0,0'
                || movement.blockedCellRejected != true) {
            throw new GradleException('Phase 14.10 entity movement report did not prove open movement and blocked-cell rejection')
        }
        def health = json.parse(file('reports/echo/standalone/entity-health.json'))
        if (health.schema != 'echo.standalone.entity_health.v2'
                || health.damageApplied != 10
                || health.hostileHealthAfterDamage != 25
                || health.hostileAlive != true
                || health.healthMutationDeterministic != true) {
            throw new GradleException('Phase 14.10 entity health report did not prove deterministic damage mutation')
        }
        def ai = json.parse(file('reports/echo/standalone/entity-ai.json'))
        if (ai.schema != 'echo.standalone.entity_ai.v2'
                || ai.tickMovements != 1
                || ai.tickAttacks != 0
                || ai.targetId != 'player-001'
                || ai.hostileAiState != 'PURSUING'
                || ai.pursuitMovedTowardPlayer != true) {
            throw new GradleException('Phase 14.10 entity AI report did not prove hostile pursuit')
        }
        def saveHooks = json.parse(file('reports/echo/standalone/entity-save-hooks.json'))
        if (saveHooks.schema != 'echo.standalone.entity_save_hooks.v2'
                || saveHooks.filesWritten != 3
                || saveHooks.manifestTrackedSummary != true
                || saveHooks.manifestTrackedPlayer != true
                || saveHooks.manifestTrackedHostile != true
                || saveHooks.corruptionHealthy != true
                || !saveHooks.writtenPaths.contains('entities/scavenger-001.json')) {
            throw new GradleException('Phase 14.10 entity save-hook report did not prove manifest and corruption coverage')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-data/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-world/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-entity/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone entity runtime source ${sourceFile}")
            }
        }
    }
