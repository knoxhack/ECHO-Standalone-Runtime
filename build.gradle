                status        : distributionStatus,
                summary       : 'Distribution verifier confirms launcher and OpenGL standalone runtime app images plus portable runtime zip are present with SHA-256 package fingerprints.',
                rendererTarget: 'opengl',
                smoke         : [
                        status                  : distributionStatus,
                        artifacts               : artifacts.size(),
                        errors                  : missingRequired.size(),
                        warnings                : releaseWarnings.size(),
