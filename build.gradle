                        portableZipSha256       : portableZipSha256,
                        setupArtifactPresent    : artifacts.find { it.artifactId == 'launcher-setup-exe' }.exists,
                        setupArtifactBytes      : artifacts.find { it.artifactId == 'launcher-setup-exe' }.bytes,
                        setupArtifactSha256     : artifacts.find { it.artifactId == 'launcher-setup-exe' }.sha256,
                        nativeAccessLaunchPolicy: 'PASS_ENABLE_NATIVE_ACCESS_ALL_UNNAMED',
                        launcherRoot            : launcherRoot.absolutePath.replace('\\', '/'),
                        launcherVersion         : launcherVersion,
                        runtimeJavaVersion      : runtimeJavaVersion,
                        mainClass               : 'dev.echo.standalone.runtime.client.EchoClientMain'
                ]
        ])
}

def echoStandaloneBuildOpenGlPackage = {
    def appName = 'EchoStandaloneRuntime'
    def installLibDir = project(':echo-runtime-client')
            .layout
            .buildDirectory
            .dir('install/echo-runtime-client/lib')
            .get()
            .asFile
    if (!installLibDir.isDirectory()) {
        throw new GradleException("Missing OpenGL client install lib directory: ${installLibDir}")
    }
    def mainJar = installLibDir.listFiles()
            .find { it.name.startsWith('echo-runtime-client-') && it.name.endsWith('.jar') }
    if (mainJar == null) {
        throw new GradleException("Missing echo-runtime-client jar in ${installLibDir}")
    }

    def jpackageCommand = { File destinationBase, File runtimeImage ->
        def command = [
                'jpackage',
                '--type', 'app-image',
                '--name', appName,
                '--app-version', '0.1.0',
                '--vendor', 'ECHO',
                '--input', installLibDir.absolutePath,
                '--main-jar', mainJar.name,
                '--main-class', 'dev.echo.standalone.runtime.client.EchoClientMain',
                '--dest', destinationBase.absolutePath,
                '--java-options', '--enable-native-access=ALL-UNNAMED',
                '--java-options', '-Dfile.encoding=UTF-8',
                '--win-console'
        ]
        if (runtimeImage != null) {
            command.addAll(['--runtime-image', runtimeImage.absolutePath])
        }
        command
    }
    def runJpackage = { File destinationBase, File runtimeImage ->
        def process = new ProcessBuilder(jpackageCommand(destinationBase, runtimeImage))
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("jpackage OpenGL client image failed (${exitCode}):\n${output}")
        }
    }

    def runtimeCacheBase = new File(buildDir, 'jpackage-opengl-runtime-cache')
    def runtimeCacheDir = new File(runtimeCacheBase, 'runtime')
    def runtimeCacheRelease = new File(runtimeCacheDir, 'release')
    if (!runtimeCacheRelease.isFile()) {
        def seedBase = new File(buildDir, 'jpackage-opengl-runtime-seed')
        delete seedBase
        seedBase.mkdirs()
        runJpackage(seedBase, null)
        def seedRuntime = new File(seedBase, "${appName}/runtime")
        if (!new File(seedRuntime, 'release').isFile()) {
            throw new GradleException("jpackage seed did not create bundled runtime: ${seedRuntime}")
        }
        delete runtimeCacheBase
        runtimeCacheBase.mkdirs()
        copy {
            from seedRuntime
            into runtimeCacheDir
        }
        delete seedBase
    }

    def imageBase = new File(buildDir, 'jpackage-opengl-client')
    def imageDir = new File(imageBase, appName)
    def distributionsDir = new File(buildDir, 'distributions')
    def portableZip = new File(distributionsDir, 'EchoStandaloneRuntime-portable-opengl-client.zip')
    delete imageBase
    delete portableZip
    imageBase.mkdirs()
    distributionsDir.mkdirs()

    runJpackage(imageBase, runtimeCacheDir)

    def exe = new File(imageDir, "${appName}.exe")
    def cfg = new File(imageDir, "app/${appName}.cfg")
    if (!exe.isFile()) {
        throw new GradleException("jpackage did not create ${exe}")
    }
    if (!cfg.isFile()) {
        throw new GradleException("jpackage did not create ${cfg}")
    }
    def cfgText = cfg.getText('UTF-8')
    if (!cfgText.contains('dev.echo.standalone.runtime.client.EchoClientMain')) {
        throw new GradleException("Packaged runtime config does not target EchoClientMain")
    }
    if (cfgText.contains('dev.echo.standalone.runtime.app.EchoRuntimeMain')) {
        throw new GradleException("Packaged runtime config still targets superseded EchoRuntimeMain")
    }

    echoStandaloneDeterministicZip(imageBase, portableZip)

    def report = file('reports/echo/standalone/packaged-opengl-client-image.json')
    report.parentFile.mkdirs()
    def portableZipSha256 = echoStandaloneSha256(portableZip)
    report.text = echoStandaloneJson([
            schema                    : 'echo.standalone.packaged_opengl_client_image.v1',
            generatedAt               : '1970-01-01T00:00:00Z',
            generator                 : 'refreshStandalonePackagedRuntimeImage',
            status                    : 'PASS',
            summary                   : 'Packaged runtime image targets the current LWJGL/OpenGL standalone client.',
            rendererTarget            : 'opengl',
            nativeModLoaderCommandUsed: false,
            applicationName           : appName,
            mainClass                 : 'dev.echo.standalone.runtime.client.EchoClientMain',
            supersededMainClassAbsent : true,
            imagePath                 : imageDir.absolutePath.replace('\\', '/'),
            executable                : exe.absolutePath.replace('\\', '/'),
            configPath                : cfg.absolutePath.replace('\\', '/'),
            portableZipPath           : portableZip.absolutePath.replace('\\', '/'),
            executableBytes           : exe.length(),
            portableZipBytes          : portableZip.length(),
            executableSha256          : echoStandaloneSha256(exe),
            portableZipSha256         : portableZipSha256
    ])
    echoStandaloneWriteDistributionReports(imageDir, portableZip, exe, cfg, portableZipSha256)
    [
            imageDir        : imageDir,
            executable      : exe,
            config          : cfg,
            runtimeCache    : runtimeCacheDir,
            portableZip     : portableZip,
            portableZipBytes: portableZip.length(),
            portableZipSha256: portableZipSha256,
            portableZipEntryCount: echoStandaloneZipEntryCount(portableZip)
    ]
}

tasks.register('refreshStandalonePackagedRuntimeImage') {
    group = 'distribution'
    description = 'Builds a jpackage app image and portable zip for the current OpenGL standalone client.'
    dependsOn ':echo-runtime-client:installDist'

    doLast {
        echoStandaloneBuildOpenGlPackage()
    }
}

tasks.register('runStandalonePlayerRuntimeAuthorityAudit') {
    group = 'verification'
    description = 'Writes machine evidence that the packaged/player launch path is the LWJGL/OpenGL client and legacy app/windowed/headless paths are evidence-only.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')
    dependsOn tasks.named('verifyStandaloneRuntimeArchitecture')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath, schema: '']
            }
            try {
                def parsed = new groovy.json.JsonSlurper().parse(reportFile)
                parsed.path = relativePath
                parsed
            } catch (Exception exception) {
                return [status: 'INVALID_JSON', path: relativePath, schema: '', error: exception.message ?: '']
            }
        }
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def text = { Object value -> String.valueOf(value ?: '') }
        def count = { Object value ->
            try {
                value instanceof Number ? value.longValue() : String.valueOf(value ?: '0').toLong()
            } catch (Exception ignored) {
                0L
            }
        }
        def sha = { Object value -> text(value).length() == 64 }
        def packageImage = readReport('reports/echo/standalone/packaged-opengl-client-image.json')
        def firstRun = readReport('reports/echo/standalone/distribution-first-run-checks.json')
        def distribution = readReport('reports/echo/standalone/distribution-artifacts.json')
        def runtimeDistribution = readReport('reports/echo/standalone/runtime-distribution.json')
        def launcher = readReport('reports/echo/standalone/launcher-smoke.json')
        def boundaries = readReport('reports/echo/standalone/runtime-boundaries.json')
        def checks = []
        def addCheck = { String id, boolean passed, Object detail ->
            checks << [
                    id    : id,
                    status: passed ? 'PASS' : 'FAILED',
                    detail: detail
            ]
        }

        addCheck('player.package-main-class', text(packageImage.status) == 'PASS'
                && text(packageImage.rendererTarget) == 'opengl'
                && bool(packageImage.nativeModLoaderCommandUsed) == false
                && text(packageImage.mainClass) == 'dev.echo.standalone.runtime.client.EchoClientMain'
                && bool(packageImage.supersededMainClassAbsent)
                && count(packageImage.executableBytes) > 0
                && count(packageImage.portableZipBytes) > 0
                && sha(packageImage.executableSha256)
                && sha(packageImage.portableZipSha256),
                [
                        report                  : packageImage.path,
                        status                  : packageImage.status,
                        rendererTarget          : packageImage.rendererTarget,
                        mainClass               : packageImage.mainClass,
                        supersededMainClassAbsent: packageImage.supersededMainClassAbsent,
                        executable              : packageImage.executable,
                        portableZipPath         : packageImage.portableZipPath
                ])
        addCheck('player.first-run-config', text(firstRun.status) == 'PASS'
                && text(firstRun.rendererTarget) == 'opengl'
                && bool(firstRun.nativeModLoaderCommandUsed) == false
                && text(firstRun.mainClass) == 'dev.echo.standalone.runtime.client.EchoClientMain'
                && bool(firstRun.configMainClassPresent)
                && bool(firstRun.nativeAccessEnabled)
                && bool(firstRun.bundledRuntimePresent)
                && bool(firstRun.replacesPackagedExeSmoke) == false
                && bool(firstRun.replacesHumanPlaytest) == false,
                [
                        report                : firstRun.path,
                        status                : firstRun.status,
                        mainClass             : firstRun.mainClass,
                        configMainClassPresent: firstRun.configMainClassPresent,
                        bundledRuntimePresent : firstRun.bundledRuntimePresent,
                        standaloneModuleJarCount: firstRun.standaloneModuleJarCount
                ])
        addCheck('player.distribution-artifacts', ['PASS', 'PASS_WITH_WARNINGS'].contains(text(distribution.status))
                && text(distribution.rendererTarget) == 'opengl'
                && text(distribution.mainClass) == 'dev.echo.standalone.runtime.client.EchoClientMain'
                && text(runtimeDistribution.rendererTarget) == 'opengl'
                && text(runtimeDistribution.smoke?.mainClass) == 'dev.echo.standalone.runtime.client.EchoClientMain',
                [
                        distributionReport: distribution.path,
                        distributionStatus: distribution.status,
                        runtimeDistributionReport: runtimeDistribution.path,
                        runtimeDistributionStatus: runtimeDistribution.status,
                        mainClass         : distribution.mainClass
                ])
        addCheck('player.launcher-handoff', text(launcher.status) == 'PASS'
                && text(launcher.rendererTarget) == 'opengl'
                && bool(launcher.nativeModLoaderCommandUsed) == false
                && bool(launcher.standaloneOpenGlClientTarget)
                && bool(launcher.platformHandoffPreserved)
                && bool(launcher.supportBundleComplete)
                && ((List) (launcher.diagnostics ?: [])).contains('standaloneLaunchTask=:echo-runtime-client:run')
                && ((List) (launcher.diagnostics ?: [])).contains('runtimeFamily=echo-standalone-client'),
                [
                        report                    : launcher.path,
                        status                    : launcher.status,
                        standaloneOpenGlClientTarget: launcher.standaloneOpenGlClientTarget,
                        launchTicksRun            : launcher.launchTicksRun,
                        supportBundleComplete     : launcher.supportBundleComplete,
                        diagnostics               : launcher.diagnostics
                ])
        addCheck('player.runtime-boundary', text(boundaries.status) == 'PASS'
                && bool(boundaries.contractFirstBoundary)
                && bool(boundaries.nativeModLoaderCommandUsed) == false
                && count(boundaries.clientEngineBoundaryViolations) == 0,
                [
                        report                        : boundaries.path,
                        status                        : boundaries.status,
                        contractFirstBoundary          : boundaries.contractFirstBoundary,
                        clientEngineBoundaryViolations : boundaries.clientEngineBoundaryViolations,
                        checkedClientEngine            : boundaries.checkedClientEngine
                ])
        addCheck('legacy.paths-evidence-only', true,
                [
                        defaultPlayerLaunchTask: ':echo-runtime-client:run',
                        playerMainClass       : 'dev.echo.standalone.runtime.client.EchoClientMain',
                        evidenceOnlyEntrypoints: [
                                [
                                        id       : 'headless-app-runtime',
                                        project  : ':echo-runtime-app',
                                        mainClass: 'dev.echo.standalone.runtime.app.EchoRuntimeMain',
                                        role     : 'headless smoke and lifecycle evidence only'
                                ],
                                [
                                        id       : 'windowed-runtime-smoke',
                                        report   : 'reports/echo/standalone/runtime-windowed.json',
                                        role     : 'deterministic window lifecycle and crash-recovery evidence only'
                                ],
                                [
                                        id       : 'software-renderer',
                                        report   : 'reports/echo/standalone/runtime-render.json',
                                        role     : 'headless deterministic framebuffer evidence only'
                                ]
                        ]
                ])

        def failed = checks.findAll { it.status != 'PASS' }
        def report = file('reports/echo/standalone/player-runtime-authority.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.player_runtime_authority.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePlayerRuntimeAuthorityAudit',
                status                    : failed.isEmpty() ? 'PASS' : 'FAILED',
                summary                   : failed.isEmpty()
                        ? 'Player-facing standalone launch authority is locked to the LWJGL/OpenGL client path; legacy app/headless/windowed paths remain evidence-only.'
                        : 'Player-facing standalone launch authority is not locked to the LWJGL/OpenGL client path.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                playerFacingRuntimePath   : 'echo-runtime-client',
                playerLaunchTask          : ':echo-runtime-client:run',
                playerMainClass           : 'dev.echo.standalone.runtime.client.EchoClientMain',
                packagedExecutable        : packageImage.executable ?: '',
                packagedPortableZip       : packageImage.portableZipPath ?: '',
                supersededMainClass       : 'dev.echo.standalone.runtime.app.EchoRuntimeMain',
                supersededMainClassAllowedForPlayerLaunch: false,
                legacyRuntimePathsEvidenceOnly: true,
                legacyEvidenceOnlyReports : [
                        'reports/echo/standalone/runtime-boot.json',
                        'reports/echo/standalone/runtime-windowed.json',
                        'reports/echo/standalone/runtime-render.json'
                ],
                checkCount                : checks.size(),
                checksPassed              : checks.count { it.status == 'PASS' },
                failedChecks              : failed,
                checks                    : checks,
                evidenceReports           : [
                        'reports/echo/standalone/packaged-opengl-client-image.json',
                        'reports/echo/standalone/distribution-first-run-checks.json',
                        'reports/echo/standalone/distribution-artifacts.json',
                        'reports/echo/standalone/runtime-distribution.json',
                        'reports/echo/standalone/launcher-smoke.json',
                        'reports/echo/standalone/runtime-boundaries.json'
                ]
        ])
    }
}

tasks.register('runStandalonePackageReproducibilityStrict') {
    group = 'verification'
    description = 'Builds the OpenGL portable package twice and verifies byte, entry-count, and SHA-256 reproducibility.'
    dependsOn ':echo-runtime-client:installDist'

    doLast {
        def firstStartedAt = java.time.Instant.now()
        def first = echoStandaloneBuildOpenGlPackage()
        def firstEndedAt = java.time.Instant.now()
        def secondStartedAt = java.time.Instant.now()
        def second = echoStandaloneBuildOpenGlPackage()
        def secondEndedAt = java.time.Instant.now()
        def bytesMatch = first.portableZipBytes == second.portableZipBytes
        def entryCountMatch = first.portableZipEntryCount == second.portableZipEntryCount
        def sha256Match = first.portableZipSha256 == second.portableZipSha256
        def stable = bytesMatch && entryCountMatch && sha256Match

        def report = file('reports/echo/standalone/distribution-package-reproducibility-strict.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                       : 'echo.standalone.distribution_package_reproducibility.v1',
                generatedAt                  : '1970-01-01T00:00:00Z',
                generator                    : 'runStandalonePackageReproducibilityStrict',
                status                       : stable ? 'PASS' : 'FAILED',
                summary                      : stable
                        ? 'Strict two-refresh OpenGL portable package reproducibility passed.'
                        : 'Strict two-refresh OpenGL portable package reproducibility failed.',
                rendererTarget               : 'opengl',
                nativeModLoaderCommandUsed   : false,
                portableZip                  : second.portableZip.absolutePath.replace('\\', '/'),
                runtimeImage                 : second.imageDir.absolutePath.replace('\\', '/'),
                runtimeCache                 : [
                        path  : second.runtimeCache.absolutePath.replace('\\', '/'),
                        bytes : new File(second.runtimeCache, 'lib/modules').isFile()
                                ? new File(second.runtimeCache, 'lib/modules').length()
                                : 0,
                        sha256: new File(second.runtimeCache, 'lib/modules').isFile()
                                ? echoStandaloneSha256(new File(second.runtimeCache, 'lib/modules'))
                                : ''
                ],
                current                      : [
                        bytes     : second.portableZipBytes,
                        entryCount: second.portableZipEntryCount,
                        sha256    : second.portableZipSha256
                ],
                stable                       : [
                        refreshes      : 2,
                        bytesMatch     : bytesMatch,
                        entryCountMatch: entryCountMatch,
                        sha256Match    : sha256Match,
                        first          : [
                                startedAt : firstStartedAt.toString(),
                                endedAt   : firstEndedAt.toString(),
                                bytes     : first.portableZipBytes,
                                entryCount: first.portableZipEntryCount,
                                sha256    : first.portableZipSha256
                        ],
                        second         : [
                                startedAt : secondStartedAt.toString(),
                                endedAt   : secondEndedAt.toString(),
                                bytes     : second.portableZipBytes,
                                entryCount: second.portableZipEntryCount,
                                sha256    : second.portableZipSha256
                        ]
                ],
                deterministicZip             : [
                        sortedEntries    : true,
                        fixedEntryTimeUtc: '1980-01-01T00:00:00Z',
                        compression      : 'BEST_COMPRESSION'
                ],
                preservesStrictWallClockHash : stable,
                releaseWarning               : stable ? '' : 'Package inputs are still unstable across two refreshes.'
        ])
        echoStandaloneWriteDistributionReports(second.imageDir, second.portableZip, second.executable, second.config, second.portableZipSha256)
        if (!stable) {
            throw new GradleException("OpenGL package reproducibility failed; see ${report}")
        }
    }
}

tasks.register('runStandalonePortableZipInstallSmoke') {
    group = 'verification'
    description = 'Extracts the OpenGL portable zip, launches the extracted EXE, and verifies clean removal of the extracted install tree.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def appName = 'EchoStandaloneRuntime'
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def installParent = new File(buildDir, 'tmp/portable-zip-install-smoke')
        def installRoot = new File(installParent, 'install')
        def stdout = new File(buildDir, 'tmp/portable-zip-install-smoke.stdout.log')
        def stderr = new File(buildDir, 'tmp/portable-zip-install-smoke.stderr.log')
        def report = file('reports/echo/standalone/portable-zip-install-smoke.json')
        report.parentFile.mkdirs()
        echoStandaloneRequireWindowLaunchOptIn(
                'runStandalonePortableZipInstallSmoke',
                'reports/echo/standalone/portable-zip-install-smoke.json',
                'echo.standalone.portable_zip_install_smoke.v1',
                [
                        summary                         : 'Portable zip install smoke was skipped before extracting or launching the visible OpenGL EXE because window launch cleanup requires explicit opt-in.',
                        portableZipPath                 : portableZip.absolutePath.replace('\\', '/'),
                        replacesHumanPlaytest           : false,
                        replacesManualInstallerEvidence : false,
                        requiredNextAction              : 'Re-run with -PechoStandaloneAllowWindowLaunch=true when a visible EXE probe is intended.'
                ]
        )
        stdout.parentFile.mkdirs()
        stdout.text = ''
        stderr.text = ''
        if (!portableZip.isFile()) {
            throw new GradleException("Missing OpenGL portable zip: ${portableZip}")
        }

        delete installParent
        installRoot.mkdirs()
        copy {
            from zipTree(portableZip)
            into installRoot
        }

        def extractedRoot = new File(installRoot, appName)
        def extractedExe = new File(extractedRoot, "${appName}.exe")
        def extractedConfig = new File(extractedRoot, "app/${appName}.cfg")
        def extractedRelease = new File(extractedRoot, 'runtime/release')
        def extractedAppDir = new File(extractedRoot, 'app')
        boolean extractedExecutablePresent = extractedExe.isFile()
        boolean extractedConfigPresent = extractedConfig.isFile()
        boolean extractedRuntimePresent = extractedRelease.isFile()
        int moduleJarCount = extractedAppDir.isDirectory()
                ? extractedAppDir.listFiles().count { it.name.startsWith('echo-runtime-') && it.name.endsWith('.jar') }
                : 0
        long extractedFileCount = 0L
        if (extractedRoot.isDirectory()) {
            extractedRoot.eachFileRecurse { file ->
                if (file.isFile()) {
                    extractedFileCount++
                }
            }
        }
        def configText = extractedConfig.isFile() ? extractedConfig.getText('UTF-8') : ''
        def startedAt = java.time.Instant.now()
        def samples = []
        int durationSeconds = 12
        int processSamples = 0
        int visibleSamples = 0
        int missingProcessSamples = 0
        String windowTitle = ''
        boolean aliveAfterProbe = false
        int exitCode = -1
        def process = null
        if (extractedExecutablePresent && extractedConfigPresent) {
            process = new ProcessBuilder(extractedExe.absolutePath)
                    .directory(extractedRoot)
                    .redirectOutput(stdout)
                    .redirectError(stderr)
                    .start()
            for (int second = 1; second <= durationSeconds; second++) {
                Thread.sleep(1000L)
                def sample = echoStandaloneWindowsProcessSample(process.pid())
                boolean alive = Boolean.valueOf(sample.pidAlive.toString())
                boolean visible = Boolean.valueOf(sample.visible.toString())
                if (alive) {
                    processSamples++
                } else {
                    missingProcessSamples++
                }
                if (visible) {
                    visibleSamples++
                    if (windowTitle.isEmpty() && sample.windowTitle != null) {
                        windowTitle = sample.windowTitle.toString()
                    }
                }
                samples.add([
                        second         : second,
                        processCount   : Integer.valueOf(sample.processCount.toString()),
                        visible        : visible,
                        pidAlive       : alive,
                        workingSetBytes: Long.valueOf(sample.workingSetBytes.toString()),
                        probeError     : sample.probeError ?: ''
                ])
                if (!alive) {
                    break
                }
            }
            aliveAfterProbe = process.isAlive()
            if (aliveAfterProbe) {
                new ProcessBuilder('cmd', '/c', 'taskkill', '/PID', Long.toString(process.pid()), '/T', '/F')
                        .redirectErrorStream(true)
                        .start()
                        .waitFor()
            }
            exitCode = process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                    ? process.exitValue()
                    : -1
        }
        def endedAt = java.time.Instant.now()
        delete installRoot
        boolean installTreeRemoved = !installRoot.exists()
        boolean passed = extractedExecutablePresent
                && extractedConfigPresent
                && extractedRuntimePresent
                && configText.contains('dev.echo.standalone.runtime.client.EchoClientMain')
                && !configText.contains('dev.echo.standalone.runtime.app.EchoRuntimeMain')
                && moduleJarCount >= 18
                && extractedFileCount > 0
                && processSamples >= 10
                && visibleSamples > 0
                && missingProcessSamples == 0
                && aliveAfterProbe
                && installTreeRemoved
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.portable_zip_install_smoke.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePortableZipInstallSmoke',
                status                    : passed ? 'PASS' : 'FAILED',
                summary                   : passed
                        ? 'Portable OpenGL zip extracted, launched from the extracted install root, and removed cleanly.'
                        : 'Portable OpenGL zip extract/run/remove smoke did not satisfy beta distribution requirements.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesHumanPlaytest     : false,
                replacesManualInstallerEvidence: false,
                portableZipPath           : portableZip.absolutePath.replace('\\', '/'),
                portableZipBytes          : portableZip.length(),
                portableZipSha256         : echoStandaloneSha256(portableZip),
                installParent             : installParent.absolutePath.replace('\\', '/'),
                extractedRoot             : extractedRoot.absolutePath.replace('\\', '/'),
                executable                : extractedExe.absolutePath.replace('\\', '/'),
                configPath                : extractedConfig.absolutePath.replace('\\', '/'),
                runtimeReleasePath        : extractedRelease.absolutePath.replace('\\', '/'),
                extractedExecutablePresent: extractedExecutablePresent,
                extractedConfigPresent    : extractedConfigPresent,
                extractedRuntimePresent   : extractedRuntimePresent,
                extractedFileCount        : extractedFileCount,
                moduleJars                : moduleJarCount,
                currentClientMainClass    : configText.contains('dev.echo.standalone.runtime.client.EchoClientMain'),
                supersededMainClassAbsent : !configText.contains('dev.echo.standalone.runtime.app.EchoRuntimeMain'),
                startedAt                 : startedAt.toString(),
                endedAt                   : endedAt.toString(),
                durationSeconds           : durationSeconds,
                processSamples            : processSamples,
                visibleSamples            : visibleSamples,
                missingProcessSamples     : missingProcessSamples,
                windowTitle               : windowTitle,
                aliveAfterProbe           : aliveAfterProbe,
                exitCodeAfterCleanup      : exitCode,
                installTreeRemoved        : installTreeRemoved,
                stdoutPath                : stdout.absolutePath.replace('\\', '/'),
                stderrPath                : stderr.absolutePath.replace('\\', '/'),
                samples                   : samples
        ])
        if (!passed) {
            throw new GradleException("Portable zip install smoke failed; see ${report}")
        }
    }
}

tasks.register('runStandaloneCleanInstallCaptureRehearsal') {
    group = 'verification'
    description = 'Runs the clean install/uninstall capture helper in no-side-effect rehearsal mode and proves it refuses to mint public-release evidence.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def launcherRoot = echoStandaloneResolveLauncherRoot()
        def launcherPackage = echoStandaloneReadJsonFile(new File(launcherRoot, 'package.json'))
        def setupExe = echoStandaloneLauncherSetupExe(launcherRoot, launcherPackage)
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def captureScript = file('scripts/capture-clean-install-uninstall-evidence.ps1')
        def report = file('reports/echo/standalone/clean-install-capture-rehearsal.json')
        def rehearsalEvidenceFile = file('build/tmp/clean-install-capture-rehearsal/manual-install-uninstall-evidence.json')
        report.parentFile.mkdirs()
        rehearsalEvidenceFile.parentFile.mkdirs()
        if (rehearsalEvidenceFile.isFile()) {
            rehearsalEvidenceFile.delete()
        }

        if (!captureScript.isFile()) {
            throw new GradleException("Missing clean install capture helper: ${captureScript}")
        }

        def missingLauncherArtifacts = []
        if (!setupExe.isFile()) {
            missingLauncherArtifacts.add([
                    id    : 'launcher-setup-exe',
                    path  : setupExe.absolutePath.replace('\\', '/'),
                    detail: 'Build the launcher NSIS setup artifact before running the clean install capture rehearsal.'
            ])
        }
        if (!launcherExe.isFile()) {
            missingLauncherArtifacts.add([
                    id    : 'launcher-exe',
                    path  : launcherExe.absolutePath.replace('\\', '/'),
                    detail: 'Build the launcher unpacked Windows image before running the clean install capture rehearsal.'
            ])
        }
        if (!missingLauncherArtifacts.isEmpty()) {
            def captureScriptSha256 = echoStandaloneSha256(captureScript)
            report.text = echoStandaloneJson([
                    schema                    : 'echo.standalone.clean_install_capture_rehearsal.v1',
                    generatedAt               : '1970-01-01T00:00:00Z',
                    generator                 : 'runStandaloneCleanInstallCaptureRehearsal',
                    status                    : 'BLOCKED_MISSING_ARTIFACTS',
                    summary                   : 'Clean install/uninstall capture rehearsal could not run because external launcher artifacts are missing.',
                    rendererTarget            : 'opengl',
                    nativeModLoaderCommandUsed: false,
                    replacesManualInstallEvidence: false,
                    helperPath                : captureScript.path.replace('\\', '/'),
                    helperSha256              : captureScriptSha256,
                    setupArtifactPath         : setupExe.absolutePath.replace('\\', '/'),
                    launcherExePath           : launcherExe.absolutePath.replace('\\', '/'),
                    rehearsalEvidencePath     : rehearsalEvidenceFile.absolutePath.replace('\\', '/'),
                    helperExitCode            : null,
                    expectedHelperExitCode    : 2,
                    missingArtifactCount      : missingLauncherArtifacts.size(),
                    missingArtifacts          : missingLauncherArtifacts
            ])
            println "Clean install capture rehearsal blocked; missing launcher artifact(s): "
                    + missingLauncherArtifacts.collect { it.path }.join(', ')
            return
        }

        def setupSha256 = echoStandaloneSha256(setupExe)
        def launcherSha256 = echoStandaloneSha256(launcherExe)
        def captureScriptSha256 = echoStandaloneSha256(captureScript)
        def command = [
                'powershell',
                '-NoProfile',
                '-NonInteractive',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                captureScript.absolutePath,
                '-SetupArtifactPath',
                setupExe.absolutePath,
                '-ExpectedSetupSha256',
                setupSha256,
                '-ExpectedLauncherExeSha256',
                launcherSha256,
                '-CaptureScriptSha256',
                captureScriptSha256,
                '-OutputPath',
                rehearsalEvidenceFile.absolutePath,
                '-EnvironmentType',
                'WINDOWS_VM',
                '-RehearsalOnly'
        ]
        def process = new ProcessBuilder(command)
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        if (output.trim()) {
            println output.trim()
        }
        if (!rehearsalEvidenceFile.isFile()) {
            throw new GradleException("Clean install rehearsal did not write evidence: ${rehearsalEvidenceFile}")
        }

        def evidence = echoStandaloneReadJsonFile(rehearsalEvidenceFile)
        def checks = evidence.checks instanceof Collection ? evidence.checks : []
        def checksById = checks.collectEntries { check -> [(String.valueOf(check.id)): check] }
        def failedChecks = evidence.failedChecks instanceof Collection
                ? evidence.failedChecks.collect { String.valueOf(it) }
                : []
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def passed = exitCode == 2
                && evidence.schema == 'echo.standalone.manual_install_uninstall_evidence.v1'
                && evidence.status == 'FAILED'
                && bool(evidence.rehearsalOnly)
                && bool(evidence.skipInstall)
                && bool(evidence.skipUninstall)
                && bool(evidence.nonInteractive)
                && (evidence.setupArtifactSha256 ?: '').toString().equalsIgnoreCase(setupSha256)
                && (evidence.expectedLauncherExeSha256 ?: '').toString().equalsIgnoreCase(launcherSha256)
                && (evidence.captureScriptSha256 ?: '').toString().equalsIgnoreCase(captureScriptSha256)
                && checksById['setup.sha256']?.passed == true
                && checksById['captureScript.sha256']?.passed == true
                && failedChecks.contains('installer.exitCode')
                && failedChecks.contains('launcher.supportBundleExported')
                && failedChecks.contains('uninstaller.exitCode')

        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.clean_install_capture_rehearsal.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneCleanInstallCaptureRehearsal',
                status                    : passed ? 'PASS' : 'FAILED',
                summary                   : passed
                        ? 'Clean install/uninstall capture helper rehearsal wrote structured evidence and refused to pass without a disposable install/uninstall run.'
                        : 'Clean install/uninstall capture helper rehearsal did not satisfy no-side-effect evidence checks.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesManualInstallEvidence: false,
                helperPath                : captureScript.path.replace('\\', '/'),
                helperSha256              : captureScriptSha256,
                setupArtifactPath         : setupExe.absolutePath.replace('\\', '/'),
                setupArtifactSha256       : setupSha256,
                launcherExePath           : launcherExe.absolutePath.replace('\\', '/'),
                launcherExeSha256         : launcherSha256,
                rehearsalEvidencePath     : rehearsalEvidenceFile.absolutePath.replace('\\', '/'),
                helperExitCode            : exitCode,
                expectedHelperExitCode    : 2,
                helperStatus              : evidence.status ?: 'UNKNOWN',
                helperSchema              : evidence.schema ?: '',
                helperRehearsalOnly       : evidence.rehearsalOnly == true,
                helperSkipInstall         : evidence.skipInstall == true,
                helperSkipUninstall       : evidence.skipUninstall == true,
                helperNonInteractive      : evidence.nonInteractive == true,
                checkCount                : checks.size(),
                failedCheckCount          : failedChecks.size(),
                expectedFailureChecksPresent: [
                        'environment.disposableEvidence',
                        'environment.freshProfileOrVmSnapshotEvidence',
                        'preinstall.cleanStateEvidence',
                        'installer.exitCode',
                        'launcher.supportBundleExported',
                        'uninstaller.exitCode',
                        'uninstall.cleanStateEvidence'
                ].every { failedChecks.contains(it) },
                failedChecks              : failedChecks
        ])
        if (!passed) {
            throw new GradleException("Clean install capture rehearsal failed; see ${report}")
        }
    }
}

tasks.register('runStandaloneInstallUninstallEvidenceAudit') {
    group = 'verification'
    description = 'Audits manual or VM-backed clean install/uninstall evidence for the standalone OpenGL launcher setup.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')
    dependsOn tasks.named('runStandaloneCleanInstallCaptureRehearsal')

    doLast {
        def launcherRoot = echoStandaloneResolveLauncherRoot()
        def launcherPackageJson = new File(launcherRoot, 'package.json')
        def launcherPackage = echoStandaloneReadJsonFile(launcherPackageJson)
        def setupExe = echoStandaloneLauncherSetupExe(launcherRoot, launcherPackage)
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def manualEvidenceFile = file('reports/echo/standalone/manual-install-uninstall-evidence.json')
        def templateFile = file('reports/echo/standalone/distribution-install-uninstall-evidence-template.json')
        def report = file('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        def captureScript = file('scripts/capture-clean-install-uninstall-evidence.ps1')
        def captureRehearsalReport = file('reports/echo/standalone/clean-install-capture-rehearsal.json')
        def captureRehearsal = captureRehearsalReport.isFile()
                ? echoStandaloneReadJsonFile(captureRehearsalReport)
                : [status: 'MISSING', schema: '']
        report.parentFile.mkdirs()

        def setupSha256 = setupExe.isFile() ? echoStandaloneSha256(setupExe) : ''
        def launcherSha256 = launcherExe.isFile() ? echoStandaloneSha256(launcherExe) : ''
        def captureScriptSha256 = captureScript.isFile() ? echoStandaloneSha256(captureScript) : ''
        def setupSignature = setupExe.isFile()
                ? echoStandaloneAuthenticode('launcher-setup-exe', setupExe)
                : [artifactId: 'launcher-setup-exe', path: setupExe.absolutePath.replace('\\', '/'), exists: false, status: 'MISSING', signed: false]
        def launcherSignature = launcherExe.isFile()
                ? echoStandaloneAuthenticode('launcher-exe', launcherExe)
                : [artifactId: 'launcher-exe', path: launcherExe.absolutePath.replace('\\', '/'), exists: false, status: 'MISSING', signed: false]
        def template = [
                schema                         : 'echo.standalone.manual_install_uninstall_evidence.v1',
                status                         : 'PENDING_MANUAL_OR_VM_RUN',
                rendererTarget                 : 'opengl',
                nativeModLoaderCommandUsed     : false,
                tester                         : '',
                runStartedAt                   : '',
                runEndedAt                     : '',
                machineId                      : '',
                osVersion                      : '',
                environmentType                : 'WINDOWS_VM_OR_DISPOSABLE_PROFILE',
                disposableEnvironment          : false,
                disposableEnvironmentEvidence  : '',
                freshProfileOrVmSnapshot       : false,
                freshProfileOrVmSnapshotEvidence: '',
                captureScriptPath              : captureScript.path.replace('\\', '/'),
                captureScriptSha256            : captureScriptSha256,
                preInstallNoExistingEchoLauncher: false,
                preInstallNoRunningEchoProcesses: false,
                preInstallCleanStateEvidence   : '',
                setupArtifactPath              : setupExe.absolutePath.replace('\\', '/'),
                setupArtifactSha256            : setupSha256,
                expectedLauncherExeSha256      : launcherSha256,
                installerExitCode              : null,
                installDir                     : 'C:/Users/<tester>/AppData/Local/Programs/ECHO Launcher',
                installedLauncherExePath       : 'C:/Users/<tester>/AppData/Local/Programs/ECHO Launcher/ECHOLauncher.exe',
                installedLauncherExeExists     : false,
                installedLauncherExeSha256     : '',
                installedLauncherExeSignatureStatus: '',
                installedLauncherExeSignatureSubject: '',
                startMenuShortcutPresent       : false,
                desktopShortcutPresent         : false,
                uninstallRegistryKeyPresent    : false,
                aumid                          : '',
                launcherFirstRunOpened         : false,
                runtimeDetected                : false,
                supportBundleExported          : false,
                supportBundleArchivePath       : '',
                supportBundleArchiveSha256     : '',
                supportBundleManifestPresent   : false,
                uninstallerExitCode            : null,
                uninstallRemovedInstallDir     : false,
                uninstallRemovedShortcuts      : false,
                postUninstallNoRunningEchoProcesses: false,
                residualFilesOnlyAppData       : false,
                postUninstallCleanStateEvidence: '',
                oldSpacedInstallDirMigrationStatus: 'SKIPPED_NOT_APPLICABLE',
                notes                          : 'Run in a disposable Windows profile or VM against the exact setupArtifactSha256 above.'
        ]
        templateFile.text = echoStandaloneJson(template)

        def evidence = null
        def parseStatus = 'MISSING'
        if (manualEvidenceFile.isFile()) {
            try {
                evidence = new groovy.json.JsonSlurper().parse(manualEvidenceFile)
                parseStatus = 'PASS'
                if (evidence.schema == 'echo.standalone.evidence.bootstrap.v1') {
                    evidence = null
                    parseStatus = 'PLACEHOLDER'
                }
            } catch (Exception ignored) {
                evidence = null
                parseStatus = 'INVALID_JSON'
            }
        }

        def checks = []
        def addCheck = { String id, boolean passed, Object actual, Object expected, String detail ->
            checks.add([
                    id      : id,
                    passed  : passed,
                    actual  : actual,
                    expected: expected,
                    detail  : detail
            ])
        }
        if (evidence != null) {
            def nonEmpty = { Object value -> (value ?: '').toString().trim().length() > 0 }
            def sha256Like = { Object value -> (value ?: '').toString().trim() ==~ /(?i)[a-f0-9]{64}/ }
            def cleanEnvironmentTypes = [
                    'WINDOWS_VM',
                    'DISPOSABLE_WINDOWS_PROFILE',
                    'DISPOSABLE_WINDOWS_USER',
                    'CI_DISPOSABLE_WINDOWS_VM',
                    'CLEAN_WINDOWS_PROFILE'
            ]
            addCheck('manualEvidence.status', evidence.status == 'PASS', evidence.status, 'PASS',
                    'Manual or VM install/uninstall evidence must be explicitly marked PASS.')
            addCheck('manualEvidence.schema', evidence.schema == 'echo.standalone.manual_install_uninstall_evidence.v1',
                    evidence.schema ?: '', 'echo.standalone.manual_install_uninstall_evidence.v1',
                    'Manual install/uninstall evidence must use the current evidence schema.')
            addCheck('manualEvidence.rendererTarget', evidence.rendererTarget == 'opengl', evidence.rendererTarget, 'opengl',
                    'Evidence must target the OpenGL standalone runtime.')
            addCheck('manualEvidence.nativeModLoaderCommandUsed', evidence.nativeModLoaderCommandUsed == false,
                    evidence.nativeModLoaderCommandUsed, false,
                    'Clean install/uninstall evidence must not use the native mod loader command.')
            addCheck('manualEvidence.tester', nonEmpty(evidence.tester), evidence.tester ?: '', 'non-empty tester',
                    'Evidence must identify the tester or operator who ran the disposable install/uninstall pass.')
            addCheck('manualEvidence.runStartedAt', nonEmpty(evidence.runStartedAt), evidence.runStartedAt ?: '', 'non-empty timestamp',
                    'Evidence must record the install/uninstall run start wall-clock timestamp.')
            addCheck('manualEvidence.runEndedAt', nonEmpty(evidence.runEndedAt), evidence.runEndedAt ?: '', 'non-empty timestamp',
                    'Evidence must record the install/uninstall run end wall-clock timestamp.')
            addCheck('manualEvidence.machineId', nonEmpty(evidence.machineId), evidence.machineId ?: '', 'non-empty machine id',
                    'Evidence must record the disposable machine/profile identifier.')
            addCheck('manualEvidence.osVersion', nonEmpty(evidence.osVersion), evidence.osVersion ?: '', 'non-empty OS version',
                    'Evidence must record the Windows version used for the clean install/uninstall run.')
            addCheck('environment.type', cleanEnvironmentTypes.contains((evidence.environmentType ?: '').toString()),
                    evidence.environmentType ?: '', cleanEnvironmentTypes.join(' or '),
                    'Evidence must be captured from a Windows VM or disposable Windows profile.')
            addCheck('environment.disposable', evidence.disposableEnvironment == true, evidence.disposableEnvironment, true,
                    'Evidence must explicitly mark the environment as disposable.')
            addCheck('environment.disposableEvidence', nonEmpty(evidence.disposableEnvironmentEvidence),
                    evidence.disposableEnvironmentEvidence ?: '', 'non-empty disposable environment proof',
                    'Evidence must describe the disposable VM/profile/user or CI VM run used for capture.')
            addCheck('environment.freshProfileOrVmSnapshot', evidence.freshProfileOrVmSnapshot == true,
                    evidence.freshProfileOrVmSnapshot, true,
                    'Evidence must start from a fresh profile or VM snapshot.')
            addCheck('environment.freshProfileOrVmSnapshotEvidence', nonEmpty(evidence.freshProfileOrVmSnapshotEvidence),
                    evidence.freshProfileOrVmSnapshotEvidence ?: '', 'non-empty fresh snapshot proof',
                    'Evidence must describe the fresh profile or VM snapshot used for capture.')
            addCheck('preinstall.noExistingLauncher', evidence.preInstallNoExistingEchoLauncher == true,
                    evidence.preInstallNoExistingEchoLauncher, true,
                    'Evidence must prove no existing ECHO Launcher install was present before install.')
            addCheck('preinstall.noRunningEchoProcesses', evidence.preInstallNoRunningEchoProcesses == true,
                    evidence.preInstallNoRunningEchoProcesses, true,
                    'Evidence must prove no ECHO processes were running before install.')
            addCheck('preinstall.cleanStateEvidence', nonEmpty(evidence.preInstallCleanStateEvidence),
                    evidence.preInstallCleanStateEvidence ?: '', 'non-empty pre-install clean-state proof',
                    'Evidence must describe how the pre-install clean state was verified.')
            addCheck('captureScript.sha256', captureScriptSha256 && (evidence.captureScriptSha256 ?: '').toString().equalsIgnoreCase(captureScriptSha256),
                    evidence.captureScriptSha256 ?: '', captureScriptSha256,
                    'Manual install/uninstall evidence must be captured by the current checked-in capture script.')
            addCheck('setup.sha256', setupSha256 && evidence.setupArtifactSha256 == setupSha256,
                    evidence.setupArtifactSha256 ?: '', setupSha256,
                    'Evidence must match the current setup artifact hash.')
            addCheck('installer.exitCode', evidence.installerExitCode == 0, evidence.installerExitCode, 0,
                    'Installer must exit successfully.')
            addCheck('installed.launcherExists', evidence.installedLauncherExeExists == true,
                    evidence.installedLauncherExeExists, true,
                    'Installed launcher executable must exist after install.')
            addCheck('installed.launcherSha256Format', sha256Like(evidence.installedLauncherExeSha256),
                    evidence.installedLauncherExeSha256 ?: '', '64 hex SHA-256',
                    'Installed launcher executable hash must be a SHA-256 digest.')
            addCheck('installed.launcherSha256MatchesCurrentArtifact',
                    launcherSha256 && (evidence.installedLauncherExeSha256 ?: '').toString().equalsIgnoreCase(launcherSha256),
                    evidence.installedLauncherExeSha256 ?: '', launcherSha256,
                    'Installed launcher executable hash must match the current launcher executable artifact.')
            addCheck('installed.launcherSignatureStatus',
                    launcherSignature.signed ? evidence.installedLauncherExeSignatureStatus == 'Valid' : nonEmpty(evidence.installedLauncherExeSignatureStatus),
                    evidence.installedLauncherExeSignatureStatus ?: '',
                    launcherSignature.signed ? 'Valid' : 'recorded signature status',
                    'Installed launcher executable signature status must be recorded and valid once release signing is enabled.')
            addCheck('installed.launcherSignatureSubject',
                    launcherSignature.signed ? (evidence.installedLauncherExeSignatureSubject ?: '').toString() == (launcherSignature.signerSubject ?: '').toString() : true,
                    evidence.installedLauncherExeSignatureSubject ?: '',
                    launcherSignature.signed ? launcherSignature.signerSubject : 'not required until release signing is enabled',
                    'Installed launcher executable signature subject must match the current launcher artifact once release signing is enabled.')
            addCheck('shortcut.startMenu', evidence.startMenuShortcutPresent == true,
                    evidence.startMenuShortcutPresent, true,
                    'Start menu shortcut must be present after install.')
            addCheck('registry.uninstallKey', evidence.uninstallRegistryKeyPresent == true,
                    evidence.uninstallRegistryKeyPresent, true,
                    'Uninstall registry key must be present after install.')
            addCheck('launcher.firstRun', evidence.launcherFirstRunOpened == true,
                    evidence.launcherFirstRunOpened, true,
                    'Launcher must open successfully on first run.')
            addCheck('launcher.runtimeDetected', evidence.runtimeDetected == true,
                    evidence.runtimeDetected, true,
                    'Launcher must detect the standalone OpenGL runtime.')
            addCheck('launcher.supportBundleExported', evidence.supportBundleExported == true,
                    evidence.supportBundleExported, true,
                    'Launcher must export the support bundle from the installed app.')
            addCheck('launcher.supportBundlePath', nonEmpty(evidence.supportBundleArchivePath),
                    evidence.supportBundleArchivePath ?: '', 'non-empty support bundle archive path',
                    'Evidence must record the installed app support bundle archive path.')
            addCheck('launcher.supportBundleSha256', sha256Like(evidence.supportBundleArchiveSha256),
                    evidence.supportBundleArchiveSha256 ?: '', '64 hex SHA-256',
                    'Evidence must record the installed app support bundle archive SHA-256.')
            addCheck('launcher.supportBundleManifest', evidence.supportBundleManifestPresent == true,
                    evidence.supportBundleManifestPresent, true,
                    'Installed app support bundle must include a manifest.')
            addCheck('uninstaller.exitCode', evidence.uninstallerExitCode == 0, evidence.uninstallerExitCode, 0,
                    'Uninstaller must exit successfully.')
            addCheck('uninstall.removedInstallDir', evidence.uninstallRemovedInstallDir == true,
                    evidence.uninstallRemovedInstallDir, true,
                    'Uninstall must remove the install directory.')
            addCheck('uninstall.removedShortcuts', evidence.uninstallRemovedShortcuts == true,
                    evidence.uninstallRemovedShortcuts, true,
                    'Uninstall must remove shortcuts.')
            addCheck('uninstall.noRunningEchoProcesses', evidence.postUninstallNoRunningEchoProcesses == true,
                    evidence.postUninstallNoRunningEchoProcesses, true,
                    'Uninstall must leave no ECHO launcher/runtime processes running.')
            addCheck('uninstall.residualFiles', evidence.residualFilesOnlyAppData == true,
                    evidence.residualFilesOnlyAppData, true,
                    'Only expected AppData profile/cache residue may remain after uninstall.')
            addCheck('uninstall.cleanStateEvidence', nonEmpty(evidence.postUninstallCleanStateEvidence),
                    evidence.postUninstallCleanStateEvidence ?: '', 'non-empty post-uninstall cleanup proof',
                    'Evidence must describe the post-uninstall cleanup verification.')
            def migrationStatus = evidence.oldSpacedInstallDirMigrationStatus ?: ''
            addCheck('migration.oldSpacedInstallDir',
                    ['PASS', 'SKIPPED_NOT_APPLICABLE'].contains(migrationStatus),
                    migrationStatus, 'PASS or SKIPPED_NOT_APPLICABLE',
                    'Old spaced install directory migration must either pass or be explicitly not applicable.')
        }
        def failedChecks = checks.findAll { it.passed != true }
        def evidenceStatus = evidence == null
                ? (parseStatus == 'INVALID_JSON' ? 'INVALID_JSON' : 'PENDING_MANUAL_OR_VM_RUN')
                : (failedChecks.isEmpty() ? 'PASS' : 'FAILED')
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.distribution_install_uninstall_evidence.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneInstallUninstallEvidenceAudit',
                status                    : evidenceStatus,
                summary                   : evidenceStatus == 'PASS'
                        ? 'Clean install/uninstall evidence matches the current OpenGL launcher setup artifact.'
                        : 'Clean install/uninstall evidence is pending or incomplete; template generated for a disposable Windows profile or VM run.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                manualEvidenceInput       : manualEvidenceFile.path.replace('\\', '/'),
                manualEvidencePresent     : manualEvidenceFile.isFile(),
                manualEvidenceParseStatus : parseStatus,
                requiredEvidenceTemplate  : templateFile.path.replace('\\', '/'),
                captureScript             : captureScript.path.replace('\\', '/'),
                captureScriptSha256       : captureScriptSha256,
                captureRehearsal          : [
                        path       : captureRehearsalReport.path.replace('\\', '/'),
                        present    : captureRehearsalReport.isFile(),
                        schema     : captureRehearsal.schema ?: '',
                        status     : captureRehearsal.status ?: 'UNKNOWN',
                        replacesManualInstallEvidence: captureRehearsal.replacesManualInstallEvidence == true,
                        helperExitCode: captureRehearsal.helperExitCode,
                        expectedHelperExitCode: captureRehearsal.expectedHelperExitCode
                ],
                currentArtifacts          : [
                        launcherRoot   : launcherRoot.absolutePath.replace('\\', '/'),
                        setupExe       : setupExe.absolutePath.replace('\\', '/'),
                        setupExePresent: setupExe.isFile(),
                        setupExeBytes  : setupExe.isFile() ? setupExe.length() : 0L,
                        setupExeSha256 : setupSha256,
                        setupSignature : setupSignature,
                        launcherExe    : launcherExe.absolutePath.replace('\\', '/'),
                        launcherExePresent: launcherExe.isFile(),
                        launcherExeSha256 : launcherSha256,
                        launcherSignature: launcherSignature,
                        launcherVersion: launcherPackage.version ?: '',
                        captureScript  : captureScript.path.replace('\\', '/'),
                        captureScriptPresent: captureScript.isFile(),
                        captureScriptSha256: captureScriptSha256,
                        portableZip    : portableZip.absolutePath.replace('\\', '/'),
                        portableZipPresent: portableZip.isFile(),
                        portableZipSha256 : portableZip.isFile() ? echoStandaloneSha256(portableZip) : ''
                ],
                checks                    : checks,
                blockers                  : evidence == null
                        ? [[id: 'manualEvidence.recorded', status: evidenceStatus, detail: 'Record manual-install-uninstall-evidence.json from the generated template.']]
                        : failedChecks.collect { [id: it.id, status: 'FAILED', detail: it.detail, actual: it.actual, expected: it.expected] },
                requiredNextActions       : evidenceStatus == 'PASS' ? [] : [
                        "Run ${captureScript.path.replace('\\', '/')} against the current setup EXE in a disposable Windows profile or VM.",
                        'Record the VM/profile/user proof, fresh snapshot proof, pre-install clean-state proof, and post-uninstall cleanup proof in the captured evidence.',
                        'Launch the installed ECHO Launcher once and export a support bundle.',
                        'Uninstall from that profile and record the result in reports/echo/standalone/manual-install-uninstall-evidence.json.'
                ]
        ])
    }
}

tasks.register('runStandaloneDistributionSigningSetupAudit') {
    group = 'verification'
    description = 'Audits Windows signing, launcher signing config, and setup/uninstall metadata for public release readiness.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')
    dependsOn tasks.named('runStandaloneReleaseSigningEvidencePlan')
    dependsOn tasks.named('runStandaloneReleaseSigningFailureRehearsal')
    dependsOn tasks.named('runStandaloneInstallUninstallEvidenceAudit')

    doLast {
        def launcherRoot = echoStandaloneResolveLauncherRoot()
        def launcherPackageJson = new File(launcherRoot, 'package.json')
        def launcherPackage = echoStandaloneReadJsonFile(launcherPackageJson)
        def setupExe = echoStandaloneLauncherSetupExe(launcherRoot, launcherPackage)
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def runtimeExe = new File(buildDir, 'jpackage-opengl-client/EchoStandaloneRuntime/EchoStandaloneRuntime.exe')
        def installerScript = new File(launcherRoot, 'build/installer.nsh')
        def latestYml = new File(launcherRoot, 'installer-artifacts/latest.yml')
        def setupBlockmap = new File(setupExe.parentFile, "${setupExe.name}.blockmap")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def signingHelper = file('scripts/sign-release-artifacts.ps1')
        def signingHelperSha256 = signingHelper.isFile() ? echoStandaloneSha256(signingHelper) : ''
        def releaseSigningEvidenceReport = file('reports/echo/standalone/release-signing-evidence.json')
        def releaseSigningEvidence = releaseSigningEvidenceReport.isFile()
                ? echoStandaloneReadJsonFile(releaseSigningEvidenceReport)
                : [status: 'MISSING', schema: '']
        def releaseSigningFailureRehearsalReport = file('reports/echo/standalone/release-signing-failure-rehearsal.json')
        def releaseSigningFailureRehearsal = releaseSigningFailureRehearsalReport.isFile()
                ? echoStandaloneReadJsonFile(releaseSigningFailureRehearsalReport)
                : [status: 'MISSING', schema: '']
        def installEvidenceReport = file('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        def installEvidence = installEvidenceReport.isFile()
                ? new groovy.json.JsonSlurper().parse(installEvidenceReport)
                : [status: 'MISSING']
        def signableArtifacts = [
                echoStandaloneAuthenticode('runtime-exe', runtimeExe),
                echoStandaloneAuthenticode('launcher-exe', launcherExe),
                echoStandaloneAuthenticode('launcher-setup-exe', setupExe)
        ]
        def signableArtifactShaById = [
                'runtime-exe'       : runtimeExe.isFile() ? echoStandaloneSha256(runtimeExe) : '',
                'launcher-exe'      : launcherExe.isFile() ? echoStandaloneSha256(launcherExe) : '',
                'launcher-setup-exe': setupExe.isFile() ? echoStandaloneSha256(setupExe) : ''
        ]
        def missingSignable = signableArtifacts.findAll { !it.exists }
        def unsignedSignable = signableArtifacts.findAll { it.exists && !it.signed }
        def winConfig = launcherPackage.build?.win ?: [:]
        def nsisConfig = launcherPackage.build?.nsis ?: [:]
        def textValue = { Object value -> String.valueOf(value ?: '').trim() }
        def normalizeThumbprint = { Object value -> textValue(value).replaceAll('[^A-Fa-f0-9]', '').toUpperCase(java.util.Locale.ROOT) }
        def publisherNames = []
        if (winConfig.publisherName instanceof Collection) {
            publisherNames.addAll(winConfig.publisherName.collect { textValue(it) }.findAll { it })
        } else if (textValue(winConfig.publisherName)) {
            publisherNames.add(textValue(winConfig.publisherName))
        }
        def signingConfig = [
                packageJson         : launcherPackageJson.absolutePath.replace('\\', '/'),
                signAndEditExecutable: winConfig.signAndEditExecutable,
                signingDisabled     : winConfig.signAndEditExecutable == false,
                certificateSubject  : winConfig.certificateSubject ?: '',
                certificateSha1     : winConfig.certificateSha1 ?: '',
                certificateFile     : winConfig.certificateFile ?: '',
                publisherName       : winConfig.publisherName ?: '',
                publisherNames      : publisherNames
        ]
        def expectedCertificateSubject = textValue(signingConfig.certificateSubject)
        def expectedCertificateSha1 = normalizeThumbprint(signingConfig.certificateSha1)
        def signingIdentityConfigured = expectedCertificateSubject
                || expectedCertificateSha1
                || !publisherNames.isEmpty()
        def signingValidation = signableArtifacts.collect { artifact ->
            def signerSubject = textValue(artifact.signerSubject)
            def signerThumbprint = normalizeThumbprint(artifact.signerThumbprint)
            def timestampSubject = textValue(artifact.timestampSubject)
            def expectedSubjectMatches = expectedCertificateSubject
                    && signerSubject.toLowerCase(java.util.Locale.ROOT)
                    .contains(expectedCertificateSubject.toLowerCase(java.util.Locale.ROOT))
            def expectedThumbprintMatches = expectedCertificateSha1
                    && signerThumbprint.equalsIgnoreCase(expectedCertificateSha1)
            def publisherMatches = !publisherNames.isEmpty()
                    && publisherNames.any { publisher ->
                signerSubject.toLowerCase(java.util.Locale.ROOT)
                        .contains(textValue(publisher).toLowerCase(java.util.Locale.ROOT))
            }
            def releaseIdentityMatched = expectedCertificateSha1
                    ? expectedThumbprintMatches
                    : (expectedCertificateSubject ? expectedSubjectMatches : publisherMatches)
            [
                    artifactId               : artifact.artifactId,
                    exists                   : artifact.exists,
                    signed                   : artifact.signed,
                    status                   : artifact.status,
                    signerSubject            : artifact.signerSubject,
                    signerThumbprint         : artifact.signerThumbprint,
                    timestampSubject         : artifact.timestampSubject,
                    timestampPresent         : timestampSubject.length() > 0,
                    expectedSubjectConfigured: expectedCertificateSubject.length() > 0,
                    expectedSubjectMatches   : expectedSubjectMatches,
                    expectedSha1Configured   : expectedCertificateSha1.length() > 0,
                    expectedSha1Matches      : expectedThumbprintMatches,
                    publisherNamesConfigured : !publisherNames.isEmpty(),
                    publisherNameMatches     : publisherMatches,
                    releaseIdentityMatched   : releaseIdentityMatched,
                    publicReleaseSignatureReady: artifact.exists
                            && artifact.signed
                            && timestampSubject.length() > 0
                            && signingIdentityConfigured
                            && releaseIdentityMatched
            ]
        }
        def invalidSignedSignable = signingValidation.findAll {
            it.exists && it.signed && !it.publicReleaseSignatureReady
        }
        def releaseSigningEvidenceArtifacts = releaseSigningEvidence.artifacts instanceof Collection
                ? releaseSigningEvidence.artifacts
                : []
        def releaseSigningEvidenceArtifactsById = releaseSigningEvidenceArtifacts.collectEntries { artifact ->
            [(String.valueOf(artifact.artifactId)): artifact]
        }
        def releaseSigningEvidenceReady = releaseSigningEvidence.status == 'PASS'
                && releaseSigningEvidence.signRequested == true
                && String.valueOf(releaseSigningEvidence.captureScriptSha256 ?: '').equalsIgnoreCase(signingHelperSha256)
                && releaseSigningEvidence.signingAttestationReady == true
                && releaseSigningEvidence.expectedUnsignedHashesConfigured == true
                && releaseSigningEvidence.expectedUnsignedHashesMatched == true
                && ['runtime-exe', 'launcher-exe', 'launcher-setup-exe'].every { artifactId ->
            def artifact = releaseSigningEvidenceArtifactsById[artifactId]
            artifact != null
                    && artifact.publicReleaseSignatureReady == true
                    && String.valueOf(artifact.sha256 ?: '').equalsIgnoreCase(signableArtifactShaById[artifactId])
        }
        def packageVersion = launcherPackage.version ?: ''
        def expectedSetupArtifactName = packageVersion
                ? "ECHO-Launcher-${packageVersion}-Setup.exe"
                : ''
        def latestMetadata = echoStandaloneElectronLatestYml(latestYml)
        def setupSha512 = setupExe.isFile() ? echoStandaloneSha512Base64(setupExe) : ''
        def latestSizeMatches = setupExe.isFile() && latestMetadata.fileSize == setupExe.length()
        def latestTopLevelShaMatches = setupExe.isFile() && latestMetadata.sha512 == setupSha512
        def latestFileShaMatches = setupExe.isFile() && latestMetadata.fileSha512 == setupSha512
        def latestYmlMatchesSetupBytes = latestSizeMatches && latestTopLevelShaMatches && latestFileShaMatches
        def updateMetadata = [
                packageJsonVersion                 : packageVersion,
                expectedSetupArtifactName          : expectedSetupArtifactName,
                setupFilenameMatchesPackageVersion : setupExe.name == expectedSetupArtifactName,
                latestYmlPresent                   : latestYml.isFile(),
                latestYmlPath                      : latestYml.absolutePath.replace('\\', '/'),
                latestYmlVersion                   : latestMetadata.version,
                latestYmlVersionMatchesPackageJson : packageVersion && latestMetadata.version == packageVersion,
                latestYmlPathValue                 : latestMetadata.path,
                latestYmlPathMatchesSetup          : latestMetadata.path == setupExe.name,
                latestYmlFileUrl                   : latestMetadata.fileUrl,
                latestYmlFileUrlMatchesSetup       : latestMetadata.fileUrl == setupExe.name,
                latestYmlSize                      : latestMetadata.fileSize,
                latestYmlSizeMatchesSetupBytes     : latestSizeMatches,
                latestYmlSha512                    : latestMetadata.sha512,
                latestYmlSha512MatchesSetupBytes   : latestTopLevelShaMatches,
                latestYmlFileSha512                : latestMetadata.fileSha512,
                latestYmlFileSha512MatchesSetupBytes: latestFileShaMatches,
                latestYmlMatchesSetupBytes         : latestYmlMatchesSetupBytes,
                blockmapPresent                    : setupBlockmap.isFile(),
                blockmapPath                       : setupBlockmap.absolutePath.replace('\\', '/'),
                blockmapBytes                      : setupBlockmap.isFile() ? setupBlockmap.length() : 0L,
                blockmapSha256                     : setupBlockmap.isFile() ? echoStandaloneSha256(setupBlockmap) : '',
                blockmapMatchesSetupName           : setupBlockmap.name == "${setupExe.name}.blockmap",
                publishProvider                    : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.provider ?: '' : '',
                publishOwner                       : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.owner ?: '' : '',
                publishRepo                        : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.repo ?: '' : '',
                publishReleaseType                 : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.releaseType ?: '' : ''
        ]
        def updateMetadataReady = updateMetadata.setupFilenameMatchesPackageVersion
                && updateMetadata.latestYmlPresent
                && updateMetadata.latestYmlVersionMatchesPackageJson
                && updateMetadata.latestYmlPathMatchesSetup
                && updateMetadata.latestYmlFileUrlMatchesSetup
                && updateMetadata.latestYmlMatchesSetupBytes
                && updateMetadata.blockmapPresent
                && updateMetadata.blockmapMatchesSetupName
        def setupMetadata = [
                packageScript                  : launcherPackage.scripts?.get('package:win') ?: '',
                setupArtifactPresent           : setupExe.isFile(),
                setupArtifactPath              : setupExe.absolutePath.replace('\\', '/'),
                setupArtifactBytes             : setupExe.isFile() ? setupExe.length() : 0L,
                setupArtifactSha256            : setupExe.isFile() ? echoStandaloneSha256(setupExe) : '',
                installerScriptPresent         : installerScript.isFile(),
                installerScriptPath            : installerScript.absolutePath.replace('\\', '/'),
                target                         : winConfig.target ?: [],
                artifactName                   : winConfig.artifactName ?: '',
                oneClick                       : nsisConfig.oneClick,
                perMachine                     : nsisConfig.perMachine,
                allowToChangeInstallationDirectory: nsisConfig.allowToChangeInstallationDirectory,
                shortcutName                   : nsisConfig.shortcutName ?: '',
                uninstallDisplayName           : nsisConfig.uninstallDisplayName ?: '',
                installerIcon                  : nsisConfig.installerIcon ?: '',
                uninstallerIcon                : nsisConfig.uninstallerIcon ?: '',
                cleanInstallUninstallEvidence  : installEvidence.status ?: 'UNKNOWN',
                cleanInstallUninstallEvidenceReady: installEvidence.status == 'PASS',
                cleanInstallUninstallEvidenceReport: 'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                cleanInstallUninstallEvidenceTemplate: installEvidence.requiredEvidenceTemplate ?: 'reports/echo/standalone/distribution-install-uninstall-evidence-template.json'
        ]
        def setupReady = setupExe.isFile()
                && installerScript.isFile()
                && nsisConfig.uninstallDisplayName
                && nsisConfig.shortcutName
                && updateMetadataReady
                && installEvidence.status == 'PASS'
        def signingReady = missingSignable.isEmpty()
                && signingValidation.every { it.publicReleaseSignatureReady }
                && invalidSignedSignable.isEmpty()
                && signingConfig.signAndEditExecutable != false
                && signingIdentityConfigured
                && releaseSigningEvidenceReady
        def publicReleaseReady = signingReady && setupReady
        def status = missingSignable.isEmpty()
                ? (publicReleaseReady ? 'PASS' : 'PENDING_SIGNING')
                : 'FAILED'
        def report = file('reports/echo/standalone/distribution-signing-setup.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.distribution_signing_setup.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneDistributionSigningSetupAudit',
                status                    : status,
                summary                   : publicReleaseReady
                        ? 'Windows signing and setup metadata are ready for public release.'
                        : 'Windows signing/setup audit captured current blockers; public release remains held until signable artifacts are validly signed and install/uninstall is evidenced.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                launcherRoot              : launcherRoot.absolutePath.replace('\\', '/'),
                publicReleaseReady        : publicReleaseReady,
                signableArtifacts         : signableArtifacts,
                signing                   : signingConfig,
                releaseSigningHelper      : [
                        path   : signingHelper.path.replace('\\', '/'),
                        present: signingHelper.isFile(),
                        sha256 : signingHelperSha256,
                        output : 'reports/echo/standalone/release-signing-evidence.json',
                        timestampServerDefault: 'http://timestamp.digicert.com'
                ],
                releaseSigningEvidence    : [
                        path       : 'reports/echo/standalone/release-signing-evidence.json',
                        present    : releaseSigningEvidenceReport.isFile(),
                        schema     : releaseSigningEvidence.schema ?: '',
                        status     : releaseSigningEvidence.status ?: 'UNKNOWN',
                        placeholder: releaseSigningEvidence.schema == 'echo.standalone.evidence.bootstrap.v1',
                        signRequested: releaseSigningEvidence.signRequested == true,
                        identityConfigured: releaseSigningEvidence.identityConfigured == true,
                        signingAttestationReady: releaseSigningEvidence.signingAttestationReady == true,
                        expectedUnsignedHashesConfigured: releaseSigningEvidence.expectedUnsignedHashesConfigured == true,
                        expectedUnsignedHashesMatched: releaseSigningEvidence.expectedUnsignedHashesMatched == true,
                        currentSignedArtifactHashesMatch: ['runtime-exe', 'launcher-exe', 'launcher-setup-exe'].every { artifactId ->
                            def artifact = releaseSigningEvidenceArtifactsById[artifactId]
                            artifact != null
                                    && String.valueOf(artifact.sha256 ?: '').equalsIgnoreCase(signableArtifactShaById[artifactId])
                        },
                        ready     : releaseSigningEvidenceReady,
                        artifactCount: releaseSigningEvidence.artifacts instanceof Collection
                                ? releaseSigningEvidence.artifacts.size()
                                : 0
                ],
                releaseSigningFailureRehearsal: [
                        path       : 'reports/echo/standalone/release-signing-failure-rehearsal.json',
                        present    : releaseSigningFailureRehearsalReport.isFile(),
                        schema     : releaseSigningFailureRehearsal.schema ?: '',
                        status     : releaseSigningFailureRehearsal.status ?: 'UNKNOWN',
                        replacesSignedArtifacts: releaseSigningFailureRehearsal.replacesSignedArtifacts == true,
                        helperExitCode: releaseSigningFailureRehearsal.helperExitCode,
                        expectedHelperExitCode: releaseSigningFailureRehearsal.expectedHelperExitCode
                ],
                signingValidation         : [
                        identityConfigured: signingIdentityConfigured,
                        expectedCertificateSubject: expectedCertificateSubject,
                        expectedCertificateSha1   : expectedCertificateSha1,
                        expectedPublisherNames    : publisherNames,
                        timestampRequired         : true,
                        allReleaseSignaturesReady : signingValidation.every { it.publicReleaseSignatureReady },
                        artifacts                 : signingValidation
                ],
                setup                     : setupMetadata,
                updateMetadata            : updateMetadata,
                installUninstallEvidence  : installEvidence,
                stablePortablePackage     : [
                        path  : portableZip.absolutePath.replace('\\', '/'),
                        bytes : portableZip.isFile() ? portableZip.length() : 0L,
                        sha256: portableZip.isFile() ? echoStandaloneSha256(portableZip) : '',
                        reproducibilityEvidence: 'reports/echo/standalone/distribution-package-reproducibility-strict.json'
                ],
                blockers                  : [
                        missingSignableArtifacts: missingSignable.collect { it.artifactId },
                        unsignedArtifacts       : unsignedSignable.collect { it.artifactId },
                        invalidSignedArtifacts  : invalidSignedSignable.collect { it.artifactId },
                        signingConfigDisabled   : signingConfig.signingDisabled,
                        signingIdentityConfigured: signingIdentityConfigured,
                        signingIdentityMissing  : !signingIdentityConfigured,
                        releaseSigningEvidenceReady: releaseSigningEvidenceReady,
                        timestampRequired       : true,
                        updateMetadataReady      : updateMetadataReady,
                        cleanInstallUninstallEvidence: installEvidence.status ?: 'UNKNOWN',
                        cleanInstallUninstallEvidenceReady: installEvidence.status == 'PASS',
                        cleanInstallUninstallEvidenceReport: 'reports/echo/standalone/distribution-install-uninstall-evidence.json'
                ],
                requiredNextActions       : [
                        'Enable Windows signing config with a release certificate.',
                        'Declare the release signing identity in launcher build.win certificateSubject, certificateSha1, or publisherName.',
                        "Run ${signingHelper.path.replace('\\', '/')} with -Sign, expected unsigned SHA-256 values, SigningOperator, and SigningRunEvidence against runtime-exe, launcher-exe, and launcher-setup-exe.",
                        'Ensure every public-release signature is timestamped and matches the configured release identity.',
                        'Record clean install and uninstall evidence from the generated template in a disposable Windows profile or VM.'
                ]
        ])
    }
}

tasks.register('runStandaloneAudioHardwareEvidenceTemplate') {
    group = 'verification'
    description = 'Writes an explicit pending real-device audio hardware verification report unless completed hardware evidence already exists.'

    doLast {
        def report = file('reports/echo/standalone/audio-hardware-verification.json')
        def captureScript = file('scripts/capture-audio-hardware-evidence.ps1')
        def captureScriptSha256 = captureScript.isFile() ? echoStandaloneSha256(captureScript) : ''
        report.parentFile.mkdirs()
        if (report.isFile()) {
            try {
                def existing = new groovy.json.JsonSlurper().parse(report)
                if (existing.status == 'PASS'
                        && existing.hardwareAudioEvidenceComplete == true
                        && existing.replacesAutomatedAudioEvidence == false
                        && (existing.captureScriptSha256 ?: '').toString().equalsIgnoreCase(captureScriptSha256)) {
                    return
                }
            } catch (Exception ignored) {
            }
        }
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.audio_hardware_verification.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneAudioHardwareEvidenceTemplate',
                status                    : 'PENDING_HARDWARE_AUDIO_RUN',
                summary                   : 'Real speaker or headset audio verification is still required; deterministic Java Sound and fallback smokes do not replace it.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                hardwareAudioEvidenceComplete: false,
                replacesAutomatedAudioEvidence: false,
                captureScriptPath         : captureScript.path.replace('\\', '/'),
                captureScriptSha256       : captureScriptSha256,
                requiredEvidence          : [
                        'tester identity',
                        'machine and OS version',
                        'physical output device label',
                        'speaker/headset device type',
                        'Windows audio endpoint evidence',
                        'music cue heard',
                        'UI cue heard',
                        'world SFX cue heard',
                        'ambience cue heard',
                        'volume and mute behavior checked',
                        'ScreenCore diagnostics device/fallback row checked',
                        'support bundle audio diagnostics captured',
                        'no crackle/dropout/latency issue or explicit issue note'
                ],
                automatedEvidence         : [
                        'reports/echo/standalone/runtime-audio-device.json',
                        'reports/echo/standalone/audio-device-output.json',
                        'reports/echo/standalone/audio-device-fallback.json',
                        'reports/echo/standalone/audio-device-volume-controls.json',
                        'reports/echo/standalone/client-machine-terminal-surfaces.json',
                        'reports/echo/standalone/full-audio-particles-weather-ambience.json'
                ]
        ])
    }
}

tasks.register('runStandalonePublicReleaseGateAudit') {
    group = 'verification'
    description = 'Writes public-release distribution gate evidence without failing while release blockers remain.'
    dependsOn tasks.named('runStandalonePackageReproducibilityStrict')
    dependsOn tasks.named('runStandaloneDistributionSigningSetupAudit')
    if (echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()) {
        dependsOn tasks.named('runStandalonePackagedOpenGlImageSmoke')
        dependsOn tasks.named('runStandalonePackagedOpenGlImageStrictRehearsal')
    } else {
        dependsOn tasks.named('writeStandaloneVisibleWindowLaunchOptInReports')
    }
    dependsOn tasks.named('runStandaloneFullWorkspaceBuildSmoke')
    dependsOn tasks.named('runStandaloneManualPlaytestEvidenceTemplate')
    dependsOn tasks.named('runStandaloneManualWallclockCaptureRehearsal')
    dependsOn tasks.named('runStandaloneAudioHardwareEvidenceTemplate')
    dependsOn tasks.named('runStandaloneFullMechanicsParityAudit')
    dependsOn tasks.named('runStandaloneOpenlandsFullRouteContractSmoke')
    dependsOn tasks.named('runStandalonePlayerRuntimeAuthorityAudit')
    dependsOn tasks.named('verifyReleaseIndexProductRouting')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath]
            }
            try {
                return new groovy.json.JsonSlurper().parse(reportFile)
            } catch (Exception ignored) {
                return [status: 'INVALID_JSON', path: relativePath]
            }
        }
        def signing = readReport('reports/echo/standalone/distribution-signing-setup.json')
        def install = readReport('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        def reproducibility = readReport('reports/echo/standalone/distribution-package-reproducibility-strict.json')
        def manual = readReport('reports/echo/standalone/manual-playtest-report.json')
        def manualCapture = readReport('reports/echo/standalone/manual-wallclock-capture-rehearsal.json')
        def audioHardware = readReport('reports/echo/standalone/audio-hardware-verification.json')
        def smoke = readReport('reports/echo/standalone/packaged-exe-wallclock-smoke.json')
        def strictRehearsal = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json')
        def strict30m = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-30m.json')
        def strict60m = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-60m.json')
        def workspace = readReport('reports/echo/standalone/full-workspace-build-smoke.json')
        def mechanicsParity = readReport('reports/echo/standalone/full-mechanics-parity-audit.json')
        def openlandsFullRoute = readReport('reports/echo/standalone/openlands-full-route-contract.json')
        def playerRuntimeAuthority = readReport('reports/echo/standalone/player-runtime-authority.json')
        def reportInt = { Object value ->
            try {
                value instanceof Number ? value.intValue() : String.valueOf(value ?: '0').toInteger()
            } catch (Exception ignored) {
                0
            }
        }

        def manualSessions = manual.requiredSessions ?: []
        def pendingManualSessions = manualSessions.findAll { it.status != 'PASS' }.collect { it.id ?: 'unknown-session' }
        def manualCaptureSessionSummaries = manualCapture.requiredSessions instanceof Collection ? manualCapture.requiredSessions : []
        def manualCaptureValidatedCurrentArtifacts = manualCapture.status == 'PASS'
                && manualCapture.manualEvidenceComplete == true
                && manualCapture.completedHumanEvidenceReady == true
                && manualCapture.packageHashConsistent == true
                && manualCapture.manualCaptureScriptSha256Matches == true
                && manualCapture.replacesHumanPlaytest == false
                && manualCaptureSessionSummaries.size() == 2
                && manualCaptureSessionSummaries.every { it.passed == true }
        def audioHardwareVerified = String.valueOf(audioHardware.schema ?: '') == 'echo.standalone.audio_hardware_verification.v1'
                && audioHardware.status == 'PASS'
                && audioHardware.hardwareAudioEvidenceComplete == true
                && audioHardware.replacesAutomatedAudioEvidence == false
                && audioHardware.heardMusicCue == true
                && audioHardware.heardUiCue == true
                && audioHardware.heardWorldSfxCue == true
                && audioHardware.heardAmbienceCue == true
                && audioHardware.volumeMuteBehaviorChecked == true
                && audioHardware.screenCoreDiagnosticsChecked == true
                && audioHardware.supportBundleAudioDiagnosticsCaptured == true
                && audioHardware.noCrackleDropoutOrLatencyIssue == true
                && String.valueOf(audioHardware.outputDeviceLabel ?: '').trim().length() > 0
                && String.valueOf(audioHardware.hardwareTesterAttestation ?: '').trim().length() > 0
        def blockers = []
        if (signing.status != 'PASS' || signing.publicReleaseReady != true) {
            blockers.add([
                    id            : 'distribution.signing-setup',
                    status        : signing.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/distribution-signing-setup.json',
                    detail        : 'Signing/setup audit must pass with signed EXEs and installer/update metadata ready for public release.'
            ])
        }
        if (install.status != 'PASS') {
            blockers.add([
                    id            : 'distribution.clean-install-uninstall',
                    status        : install.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                    detail        : 'Clean install/uninstall evidence must pass from a disposable Windows profile or VM run.'
            ])
        }
        if (reproducibility.status != 'PASS'
                || reproducibility.stable?.sha256Match != true
                || reproducibility.stable?.bytesMatch != true
                || reproducibility.stable?.entryCountMatch != true) {
            blockers.add([
                    id            : 'distribution.reproducibility',
                    status        : reproducibility.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/distribution-package-reproducibility-strict.json',
                    detail        : 'Strict two-refresh portable package reproducibility must pass.'
            ])
        }
        if (manual.manualEvidenceComplete != true
                || !pendingManualSessions.isEmpty()
                || !manualCaptureValidatedCurrentArtifacts) {
            blockers.add([
                    id            : 'manual.wallclock',
                    status        : manualCapture.status ?: manual.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/manual-playtest-report.json',
                    validatorReport: 'reports/echo/standalone/manual-wallclock-capture-rehearsal.json',
                    detail        : manualCaptureValidatedCurrentArtifacts
                            ? "Pending human sessions: ${pendingManualSessions.join(', ')}"
                            : 'Manual wall-clock evidence must pass the current-artifact capture validator before public release.'
            ])
        }
        if (!audioHardwareVerified) {
            blockers.add([
                    id            : 'manual.audio-hardware',
                    status        : audioHardware.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/audio-hardware-verification.json',
                    detail        : 'Real speaker/headset hardware audio verification must pass; deterministic Java Sound, fallback, and diagnostics smokes do not replace it.'
            ])
        }
        if (smoke.status != 'PASS') {
            blockers.add([
                    id            : 'packaged.smoke',
                    status        : smoke.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                    detail        : 'Packaged OpenGL smoke must pass.'
            ])
        }
        if (strictRehearsal.status != 'PASS') {
            blockers.add([
                    id            : 'packaged.strict-rehearsal',
                    status        : strictRehearsal.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json',
                    detail        : 'Packaged OpenGL strict rehearsal must pass.'
            ])
        }
        if (strict30m.status != 'PASS'
                || strict30m.releaseRunAccepted != true
                || strict30m.replacesHumanPlaytest != false
                || reportInt(strict30m.completedDurationSeconds) < 1800) {
            blockers.add([
                    id            : 'packaged.strict-30m-monitor',
                    status        : strict30m.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/packaged-exe-wallclock-strict-30m.json',
                    detail        : 'A real 30-minute packaged OpenGL EXE process/window monitor must pass; this does not replace human wall-clock playtest sessions.'
            ])
        }
        if (strict60m.status != 'PASS'
                || strict60m.releaseRunAccepted != true
                || strict60m.replacesHumanPlaytest != false
                || reportInt(strict60m.completedDurationSeconds) < 3600) {
            blockers.add([
                    id            : 'packaged.strict-60m-monitor',
                    status        : strict60m.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json',
                    detail        : 'A real 60-minute packaged OpenGL EXE process/window monitor must pass; this does not replace human wall-clock playtest sessions.'
            ])
        }
        if (workspace.status != 'PASS'
                || workspace.evidence?.buildSuccessful != true
                || workspace.evidence?.fullWorkspaceTask != true
                || workspace.evidence?.detectedWorkspaceOwnsBuildEchoWorkspace != true) {
            blockers.add([
                    id            : 'workspace.full-build',
                    status        : workspace.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/full-workspace-build-smoke.json',
                    detail        : 'Full ECHO workspace build smoke must pass against the Gradle workspace that owns buildEchoWorkspace.'
            ])
        }
        if (mechanicsParity.status != 'PASS'
                || mechanicsParity.publicReleaseReady != true
                || mechanicsParity.fullMechanicsCoverage != true) {
            blockers.add([
                    id            : 'mechanics.full-parity',
                    status        : mechanicsParity.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/full-mechanics-parity-audit.json',
                    detail        : 'Full public-release mechanics parity must be proven by dedicated coverage reports; the beta Minecraft-like mechanics contract is only a subset.'
            ])
        }
        if (openlandsFullRoute.status != 'PASS'
                || openlandsFullRoute.publicReleaseContentPolishReady != true
                || openlandsFullRoute.publicReleaseAssetPolishReady != true) {
            blockers.add([
                    id            : 'openlands.public-art-content-polish',
                    status        : openlandsFullRoute.publicReleasePolishStatus ?: openlandsFullRoute.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/openlands-full-route-contract.json',
                    detail        : 'Openlands first-hour route evidence can pass for beta, but public release requires final art/content review and cannot ship beta-only placeholder asset coverage.'
            ])
        }
        if (playerRuntimeAuthority.status != 'PASS'
                || playerRuntimeAuthority.playerFacingRuntimePath != 'echo-runtime-client'
                || playerRuntimeAuthority.playerMainClass != 'dev.echo.standalone.runtime.client.EchoClientMain'
                || playerRuntimeAuthority.supersededMainClassAllowedForPlayerLaunch != false
                || playerRuntimeAuthority.legacyRuntimePathsEvidenceOnly != true) {
            blockers.add([
                    id            : 'player.runtime-authority',
                    status        : playerRuntimeAuthority.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/player-runtime-authority.json',
                    detail        : 'Public release must package and launch the LWJGL/OpenGL client path; legacy app, headless, and windowed smoke paths are evidence-only.'
            ])
        }

        def publicReleaseReady = blockers.isEmpty()
        def report = file('reports/echo/standalone/public-release-gate.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.public_release_gate.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePublicReleaseGateAudit',
                status                    : publicReleaseReady ? 'PASS' : 'BLOCKED',
                summary                   : publicReleaseReady
                        ? 'Public release distribution gate passed.'
                        : 'Public release distribution gate is blocked by incomplete release evidence.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                publicReleaseReady        : publicReleaseReady,
                blockerCount              : blockers.size(),
                blockers                  : blockers,
                manualCaptureStatus       : manualCapture.status ?: 'UNKNOWN',
                manualCaptureValidatedCurrentArtifacts: manualCaptureValidatedCurrentArtifacts,
                manualCapturePackageHashConsistent: manualCapture.packageHashConsistent == true,
                manualCaptureScriptSha256Matches: manualCapture.manualCaptureScriptSha256Matches == true,
                manualCaptureCompletedHumanEvidenceReady: manualCapture.completedHumanEvidenceReady == true,
                audioHardwareStatus       : audioHardware.status ?: 'UNKNOWN',
                audioHardwareVerified     : audioHardwareVerified,
                openlandsPublicContentPolishStatus: openlandsFullRoute.publicReleasePolishStatus ?: openlandsFullRoute.status ?: 'UNKNOWN',
                openlandsPublicContentPolishReady: openlandsFullRoute.publicReleaseContentPolishReady == true,
                openlandsPublicAssetPolishReady: openlandsFullRoute.publicReleaseAssetPolishReady == true,
                playerRuntimeAuthorityStatus: playerRuntimeAuthority.status ?: 'UNKNOWN',
                playerRuntimeAuthorityReady: playerRuntimeAuthority.status == 'PASS',
                playerFacingRuntimePath   : playerRuntimeAuthority.playerFacingRuntimePath ?: 'UNKNOWN',
                playerMainClass           : playerRuntimeAuthority.playerMainClass ?: 'UNKNOWN',
                evidenceReports           : [
                        'reports/echo/standalone/release-signing-evidence.json',
                        'reports/echo/standalone/release-signing-failure-rehearsal.json',
                        'reports/echo/standalone/distribution-signing-setup.json',
                        'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                        'reports/echo/standalone/clean-install-capture-rehearsal.json',
                        'reports/echo/standalone/distribution-icons.json',
                        'reports/echo/standalone/distribution-installer.json',
                        'reports/echo/standalone/distribution-first-run-checks.json',
                        'reports/echo/standalone/distribution-version-metadata.json',
                        'reports/echo/standalone/distribution-package-reproducibility-strict.json',
                        'reports/echo/standalone/manual-playtest-report.json',
                        'reports/echo/standalone/audio-hardware-verification.json',
                        'reports/echo/standalone/manual-wallclock-helper-rehearsal.json',
                        'reports/echo/standalone/manual-wallclock-capture-rehearsal.json',
                        'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-30m.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json',
                        'reports/echo/standalone/full-workspace-build-smoke.json',
                        'reports/echo/standalone/full-mechanics-parity-audit.json',
                        'reports/echo/standalone/openlands-experience-contract.json',
                        'reports/echo/standalone/openlands-full-route-contract.json',
                        'reports/echo/standalone/player-runtime-authority.json',
                        'reports/echo/standalone/minecraft-mechanics-contract.json',
                        'reports/echo/standalone/public-release-external-evidence-handoff.json'
                ]
        ])

        file('reports/echo/standalone/release-acceptance-report.json').text = echoStandaloneJson([
                schema                    : 'echo.standalone.release_acceptance.v2',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePublicReleaseGateAudit',
                status                    : publicReleaseReady ? 'PASS' : 'BLOCKED',
                summary                   : publicReleaseReady
                        ? 'Public release acceptance passed.'
                        : 'Public release acceptance is blocked by incomplete release evidence.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                publicReleaseAccepted     : publicReleaseReady,
                publicReleaseGateStatus   : publicReleaseReady ? 'PASS' : 'BLOCKED',
                blockerCount              : blockers.size(),
                blockers                  : blockers,
                signingSetupStatus        : signing.status ?: 'UNKNOWN',
                cleanInstallUninstallStatus: install.status ?: 'UNKNOWN',
                manualPlaytestStatus      : manual.status ?: 'UNKNOWN',
                manualCaptureStatus       : manualCapture.status ?: 'UNKNOWN',
                manualCaptureValidatedCurrentArtifacts: manualCaptureValidatedCurrentArtifacts,
                audioHardwareStatus       : audioHardware.status ?: 'UNKNOWN',
                audioHardwareVerified     : audioHardwareVerified,
                openlandsPublicContentPolishStatus: openlandsFullRoute.publicReleasePolishStatus ?: openlandsFullRoute.status ?: 'UNKNOWN',
                openlandsPublicContentPolishReady: openlandsFullRoute.publicReleaseContentPolishReady == true,
                openlandsPublicAssetPolishReady: openlandsFullRoute.publicReleaseAssetPolishReady == true,
                playerRuntimeAuthorityStatus: playerRuntimeAuthority.status ?: 'UNKNOWN',
                playerRuntimeAuthorityReady: playerRuntimeAuthority.status == 'PASS',
                playerFacingRuntimePath   : playerRuntimeAuthority.playerFacingRuntimePath ?: 'UNKNOWN',
                playerMainClass           : playerRuntimeAuthority.playerMainClass ?: 'UNKNOWN',
                reproducibilityStatus     : reproducibility.status ?: 'UNKNOWN',
                packagedSmokeStatus       : smoke.status ?: 'UNKNOWN',
                strictRehearsalStatus     : strictRehearsal.status ?: 'UNKNOWN',
                strict30mStatus           : strict30m.status ?: 'UNKNOWN',
                strict60mStatus           : strict60m.status ?: 'UNKNOWN',
                workspaceBuildStatus      : workspace.status ?: 'UNKNOWN',
                mechanicsParityStatus     : mechanicsParity.status ?: 'UNKNOWN',
                externalEvidenceRequired  : true,
                replacesSigningEvidence   : false,
                replacesCleanInstallEvidence: false,
                replacesHumanPlaytest     : false,
                evidenceReports           : [
                        'reports/echo/standalone/public-release-gate.json',
                        'reports/echo/standalone/distribution-signing-setup.json',
                        'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                        'reports/echo/standalone/manual-playtest-report.json',
                        'reports/echo/standalone/audio-hardware-verification.json',
                        'reports/echo/standalone/distribution-package-reproducibility-strict.json',
                        'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-30m.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json',
                        'reports/echo/standalone/full-workspace-build-smoke.json',
