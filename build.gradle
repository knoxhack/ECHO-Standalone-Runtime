        dependsOn tasks.named('runStandalonePackagedOpenGlImageSmoke')
    } else {
        dependsOn tasks.named('writeStandaloneVisibleWindowLaunchOptInReports')
    }

    doLast {
        def appName = 'EchoStandaloneRuntime'
        def imageDir = new File(buildDir, "jpackage-opengl-client/${appName}")
        def exe = new File(imageDir, "${appName}.exe")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def stdout = new File(buildDir, 'tmp/packaged-opengl-client-strict-60m.stdout.log')
        def stderr = new File(buildDir, 'tmp/packaged-opengl-client-strict-60m.stderr.log')
        def report = file('reports/echo/standalone/packaged-exe-wallclock-strict-60m.json')
        echoStandaloneRequireWindowLaunchOptIn(
                'runStandalonePackagedOpenGlImageStrict60mMonitor',
                'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json',
                'echo.standalone.packaged_exe_wallclock_strict_60m.v1',
                [
                        summary               : 'Sixty-minute packaged OpenGL monitor was skipped before launching the visible EXE because window launch cleanup requires explicit opt-in.',
                        executable            : exe.absolutePath.replace('\\', '/'),
                        portableZipPath       : portableZip.absolutePath.replace('\\', '/'),
                        runId                 : 'packaged-opengl-strict-60m',
                        requiredSessionId     : 'packaged-opengl-60m',
                        requiredDurationSeconds: 3600,
                        releaseRunAccepted    : false,
                        replacesHumanPlaytest : false,
                        requiredNextAction    : 'Re-run with -PechoStandaloneAllowWindowLaunch=true when a visible EXE monitor is intended.'
                ]
        )
        stdout.parentFile.mkdirs()
        stdout.text = ''
        stderr.text = ''
        if (!exe.isFile()) {
            throw new GradleException("Missing packaged OpenGL client executable: ${exe}")
        }

        int requiredDurationSeconds = 3600
        int sampleIntervalSeconds = 5
        int visibilityGraceSeconds = 60
        def startedAt = java.time.Instant.now()
        def deadline = startedAt.plusSeconds(requiredDurationSeconds)
        def process = new ProcessBuilder(exe.absolutePath)
                .directory(rootProject.projectDir)
                .redirectOutput(stdout)
                .redirectError(stderr)
                .start()
        def samples = []
        int processSamples = 0
        int visibleSamples = 0
        int workingSetSamples = 0
        int missingProcessSamples = 0
        int invisibleSamplesAfterGrace = 0
        int firstVisibleSecond = 0
        int firstMissingProcessSecond = 0
        int firstInvisibleSecond = 0
        long firstWorkingSetBytes = 0L
        long lastWorkingSetBytes = 0L
        long maxWorkingSetBytes = 0L
        String windowTitle = ''

        while (java.time.Instant.now().isBefore(deadline)) {
            Thread.sleep(sampleIntervalSeconds * 1000L)
            def sampledAt = java.time.Instant.now()
            int elapsedSeconds = (int) Math.min(
                    Integer.MAX_VALUE,
                    java.time.Duration.between(startedAt, sampledAt).seconds
            )
            def sample = echoStandaloneWindowsProcessSample(process.pid())
            boolean alive = Boolean.valueOf(sample.pidAlive.toString())
            boolean visible = Boolean.valueOf(sample.visible.toString())
            long workingSetBytes = Long.valueOf(sample.workingSetBytes.toString())
            if (alive) {
                processSamples++
            } else {
                missingProcessSamples++
                if (firstMissingProcessSecond == 0) {
                    firstMissingProcessSecond = elapsedSeconds
                }
            }
            if (visible) {
                visibleSamples++
                if (firstVisibleSecond == 0) {
                    firstVisibleSecond = elapsedSeconds
                }
                if (windowTitle.isEmpty() && sample.windowTitle != null) {
                    windowTitle = sample.windowTitle.toString()
                }
            } else {
                if (firstInvisibleSecond == 0) {
                    firstInvisibleSecond = elapsedSeconds
                }
                if (elapsedSeconds > visibilityGraceSeconds) {
                    invisibleSamplesAfterGrace++
                }
            }
            if (workingSetBytes > 0L) {
                workingSetSamples++
                if (firstWorkingSetBytes == 0L) {
                    firstWorkingSetBytes = workingSetBytes
                }
                lastWorkingSetBytes = workingSetBytes
                maxWorkingSetBytes = Math.max(maxWorkingSetBytes, workingSetBytes)
            }
            samples.add([
                    elapsedSeconds : elapsedSeconds,
                    processCount   : Integer.valueOf(sample.processCount.toString()),
                    visible        : visible,
                    pidAlive       : alive,
                    workingSetBytes: workingSetBytes,
                    probeError     : sample.probeError ?: ''
            ])
            if (!alive) {
                break
            }
        }
        def endedAt = java.time.Instant.now()
        int completedDurationSeconds = (int) Math.min(
                Integer.MAX_VALUE,
                java.time.Duration.between(startedAt, endedAt).seconds
        )
        boolean aliveAfterProbe = process.isAlive()
        if (aliveAfterProbe) {
            new ProcessBuilder('cmd', '/c', 'taskkill', '/PID', Long.toString(process.pid()), '/T', '/F')
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
        }
        int exitCode = process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                ? process.exitValue()
                : -1
        boolean passed = completedDurationSeconds >= requiredDurationSeconds
                && processSamples == samples.size()
                && missingProcessSamples == 0
                && visibleSamples > 0
                && invisibleSamplesAfterGrace == 0
                && aliveAfterProbe

        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.packaged_exe_wallclock_strict_60m.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePackagedOpenGlImageStrict60mMonitor',
                status                    : passed ? 'PASS' : 'FAILED',
                summary                   : passed
                        ? 'Packaged OpenGL EXE remained process-alive and visibly windowed for the strict 60-minute monitor.'
                        : 'Packaged OpenGL EXE strict 60-minute monitor did not satisfy process and visible-window requirements.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesHumanPlaytest     : false,
                releaseRunAccepted        : passed,
                runId                     : 'packaged-opengl-strict-60m',
                requiredSessionId         : 'packaged-opengl-60m',
                requiredDurationSeconds   : requiredDurationSeconds,
                completedDurationSeconds  : completedDurationSeconds,
                sampleIntervalSeconds     : sampleIntervalSeconds,
                sampleCount               : samples.size(),
                executable                : exe.absolutePath.replace('\\', '/'),
                visibleWindow             : visibleSamples > 0,
                visibleSamples            : visibleSamples,
                processSamples            : processSamples,
                workingSetSamples         : workingSetSamples,
                missingProcessSamples     : missingProcessSamples,
                invisibleSamplesAfterGrace: invisibleSamplesAfterGrace,
                visibilityGraceSeconds    : visibilityGraceSeconds,
                firstVisibleSecond        : firstVisibleSecond,
                firstMissingProcessSecond : firstMissingProcessSecond,
                firstInvisibleSecond      : firstInvisibleSecond,
                windowTitle               : windowTitle,
                firstWorkingSetBytes      : firstWorkingSetBytes,
                lastWorkingSetBytes       : lastWorkingSetBytes,
                maxWorkingSetBytes        : maxWorkingSetBytes,
                memoryGrowthBytes         : lastWorkingSetBytes - firstWorkingSetBytes,
                aliveAfterProbe           : aliveAfterProbe,
                exitCodeAfterCleanup      : exitCode,
                portableZipPath           : portableZip.absolutePath.replace('\\', '/'),
                portableZipBytes          : portableZip.isFile() ? portableZip.length() : 0,
                portableZipSha256         : portableZip.isFile() ? echoStandaloneSha256(portableZip) : '',
                smokeEvidence             : 'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                manualPlaytestEvidence    : 'reports/echo/standalone/manual-playtest-report.json',
                remainingManualEvidence   : [
                        '30-minute human wall-clock packaged OpenGL EXE tester session',
                        '60-minute human wall-clock packaged OpenGL EXE tester session'
                ],
                stdoutPath                : stdout.absolutePath.replace('\\', '/'),
                stderrPath                : stderr.absolutePath.replace('\\', '/'),
                samples                   : samples
        ])
        if (!passed) {
            throw new GradleException("Packaged OpenGL client strict 60-minute monitor failed; see ${report}")
        }
    }
}

