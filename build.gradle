                        'packaging', false, ['PASS']),
                reportCheck('packaged.wallclock-smoke', 'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                        'packaging', false, ['PASS']),
                reportCheck('packaged.strict-rehearsal', 'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json',
                        'packaging', false, ['PASS']),
                reportCheck('manual.playtest', 'reports/echo/standalone/manual-playtest-report.json',
                        'human-playtest', false, ['PASS'])
        ]

        def nativeAbiReport = readReport('reports/echo/standalone/native-loader-abi-v1-smoke.json')
        def realModuleReport = readReport('reports/echo/standalone/real-module-execution-smoke.json')
        def addonArchiveReport = readReport('reports/echo/standalone/addon-archive-compatibility-smoke.json')
        def fullWorkspaceReport = readReport('reports/echo/standalone/full-workspace-build-smoke.json')
        def fullWorkspaceTask = tasks.named('runStandaloneFullWorkspaceBuildSmoke').get()
        def fullWorkspaceCurrentRunAccepted = fullWorkspaceTask.state.failure == null && !fullWorkspaceTask.state.skipped
        def officialModuleCount = realModuleReport.moduleIds instanceof Collection ? realModuleReport.moduleIds.size() : 0
        def nativeEntrypointCount = realModuleReport.nativeEntrypoints instanceof Collection
                ? realModuleReport.nativeEntrypoints.size()
                : 0
        def nativeAbiReady = nativeAbiReport.status == 'PASS'
                && nativeAbiReport.classloaderIsolated == true
                && nativeAbiReport.dependencyOrderedServiceLoad == true
                && nativeAbiReport.dependencyClassloaderDelegation == true
                && nativeAbiReport.runtimeConfigRevokedOnUnload == true
                && nativeAbiReport.runtimeAssetsRevokedOnUnload == true
                && nativeAbiReport.moduleSaveDataPersistedAfterUnload == true
                && nativeAbiReport.unknownPermissionExecuted == false
                && nativeAbiReport.classpathEscapeExecuted == false
        def officialModulesExecuted = realModuleReport.status == 'PASS'
                && officialModuleCount >= 90
                && nativeEntrypointCount >= 90
                && realModuleReport.loadReloadUnloadExecuted == true
                && realModuleReport.realDependencyChainExecuted == true
                && realModuleReport.adapterCoreNativeEntrypointExecuted == true
                && realModuleReport.nativeServiceRegisteredBeforeUnload == true
                && realModuleReport.nativeServiceRevokedOnUnload == true
                && Integer.valueOf(String.valueOf(realModuleReport.diagnosticCount ?: 0)) == 0
        def addonArchivesExecutable = addonArchiveReport.status == 'PASS'
