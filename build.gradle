        def runtimeJavaVersion = javaVersionMatcher.find() ? javaVersionMatcher.group(1) : ''
        def platformRoot = rootProject.projectDir.parentFile.parentFile
        def launcherRoot = new File(platformRoot, 'ECHOLauncher')
        def artifacts = [
                echoStandaloneArtifact('runtime-exe', 'windows-executable', exe, true),
                echoStandaloneArtifact('runtime-config', 'jpackage-config', cfg, true),
                echoStandaloneArtifact('runtime-release', 'bundled-runtime-release', releaseFile, true),
                echoStandaloneArtifact('runtime-java-library', 'bundled-runtime-library', javaLibrary, true),
                echoStandaloneArtifact('runtime-portable-zip', 'portable-zip', portableZip, false),
                echoStandaloneArtifact('launcher-exe', 'electron-executable',
                        new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe'), true),
                echoStandaloneArtifact('launcher-asar', 'electron-archive',
                        new File(launcherRoot, 'installer-artifacts/win-unpacked/resources/app.asar'), true),
                echoStandaloneArtifact('launcher-setup-exe', 'nsis-setup',
                        new File(launcherRoot, 'installer-artifacts/ECHO-Launcher-1.0.1-Setup.exe'), false),
                echoStandaloneArtifact('launcher-icon-ico', 'windows-icon',
                        new File(launcherRoot, 'installer-artifacts/win-unpacked/resources/app.asar.unpacked/build/icon.ico'), true),
                echoStandaloneArtifact('launcher-icon-png', 'portable-icon',
