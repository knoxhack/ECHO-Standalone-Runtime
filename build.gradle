                || !entities.entityMaterials.containsAll(['entity:player', 'entity:hostile'])
                || !entities.entityCommands.any { it.commandId == 'entity:player-001' }
                || !entities.entityCommands.any { it.commandId == 'entity:scavenger-001' }) {
            throw new GradleException('Phase 15.5 render entities report did not prove player and hostile rendering')
        }
        def particles = json.parse(file('reports/echo/standalone/render-particles.json'))
        if (particles.schema != 'echo.standalone.render_particles.v2'
