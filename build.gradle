tasks.register('verifyStandaloneUiRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.6 UI runtime artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneUiRuntimeSmoke')

    doLast {
        def requiredReports = [
                'reports/echo/standalone/runtime-ui.json',
