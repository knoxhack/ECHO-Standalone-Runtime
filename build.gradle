                        'reports/echo/standalone/manual-playtest-report.json'
                ]
        ])
        if (!blockers.isEmpty()) {
            throw new GradleException("Standalone beta readiness blocked; see reports/echo/standalone/beta-readiness-gate.json")
        }
    }
