tasks.register('runStandaloneFullMechanicsParityAudit') {
    group = 'verification'
    description = 'Writes public-release full mechanics parity gap evidence without failing while full-coverage mechanics reports remain incomplete.'
    dependsOn tasks.named('runStandaloneMinecraftMechanicsContractSmoke')
    dependsOn tasks.named('runStandaloneFullBlockBehaviorMatrixAudit')
    dependsOn tasks.named('runStandaloneFullPresentationMechanicsAudit')
    dependsOn tasks.named('runStandaloneFullCommandKeybindDebugChatAudit')
    dependsOn tasks.named('runStandaloneFullDataPackRuntimeCoverageAudit')
    dependsOn tasks.named('runStandaloneFullAddonExtensionSurfaceAudit')
    dependsOn tasks.named('runStandaloneFullProgressionStatisticsObjectivesAudit')
    dependsOn tasks.named('runStandaloneFullWorldgenDimensionsStructuresAudit')
    dependsOn tasks.named('runStandaloneFullEntityAiSpawnLoopAudit')
    dependsOn tasks.named('runStandaloneFullSurvivalPlayerLoopAudit')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath]
            }
            try {
                def parsed = new groovy.json.JsonSlurper().parse(reportFile)
                parsed.path = relativePath
                return parsed
            } catch (Exception exception) {
                return [status: 'INVALID_JSON', path: relativePath, error: exception.message]
            }
        }
        def count = { Object value ->
            try {
                value instanceof Collection ? value.size()
                        : value instanceof Map ? value.size()
                        : value instanceof Number ? value.intValue()
                        : String.valueOf(value ?: '0').toInteger()
            } catch (Exception ignored) {
                0
            }
        }
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def checks = []
        def addCheck = { Map check ->
            checks << [
                    id                 : check.id,
                    category           : check.category,
                    scope              : check.scope,
                    status             : check.status,
                    evidenceReport     : check.evidenceReport,
                    observedStatus     : check.observedStatus ?: 'UNKNOWN',
                    publicReleaseReady : bool(check.publicReleaseReady),
                    fullMechanicsCoverage: bool(check.fullMechanicsCoverage),
                    requiredEvidence   : check.requiredEvidence,
                    detail             : check.detail,
                    nextEvidence       : check.nextEvidence ?: []
            ]
        }

        def betaMechanics = readReport('reports/echo/standalone/minecraft-mechanics-contract.json')
        def betaCategories = betaMechanics.categoriesCovered instanceof Collection
                ? betaMechanics.categoriesCovered.collect { String.valueOf(it) }
                : []
        def requiredBetaCategories = [
                'blocks',
                'crafting',
                'entities',
                'fluids',
                'hazards',
                'items',
                'lighting',
                'persistence',
                'weather',
                'world'
        ]
        def betaMechanicsPassed = betaMechanics.status == 'PASS'
                && count(betaMechanics.checkCount) > 0
                && count(betaMechanics.checksPassed) == count(betaMechanics.checkCount)
                && betaCategories.containsAll(requiredBetaCategories)
        addCheck([
                id                   : 'mechanics.beta-minecraft-like-contract',
                category             : 'beta-subset',
                scope                : 'beta',
                status               : betaMechanicsPassed ? 'PASS' : 'BLOCKED',
                evidenceReport       : 'reports/echo/standalone/minecraft-mechanics-contract.json',
                observedStatus       : betaMechanics.status ?: 'UNKNOWN',
                publicReleaseReady   : false,
                fullMechanicsCoverage: false,
                requiredEvidence     : requiredBetaCategories.collect { "category:${it}" },
                detail               : betaMechanicsPassed
                        ? 'Beta-blocking Minecraft-like mechanics contract passes, but it is explicitly a subset and does not prove full public-release mechanics parity.'
                        : 'Beta-blocking Minecraft-like mechanics contract is missing or incomplete.',
                nextEvidence         : [
                        'Keep this report passing while full public-release mechanics reports are added.'
                ]
        ])

        def publicRequirements = [
                [
                        id              : 'mechanics.full-block-behavior-matrix',
                        category        : 'blocks',
                        report          : 'reports/echo/standalone/full-block-behavior-matrix.json',
                        requiredEvidence: [
                                'block state property matrix',
                                'collision and shape matrix',
                                'occlusion and transparency matrix',
                                'hardness/tool/drop matrix',
                                'placement, neighbor update, scheduled tick, and random tick matrix',
                                'block entity persistence and ticking matrix'
                        ]
                ],
                [
                        id              : 'mechanics.full-survival-player-loop',
                        category        : 'player-survival',
                        report          : 'reports/echo/standalone/full-survival-player-loop.json',
                        requiredEvidence: [
                                'health, hunger, damage source, armor, status effect, and difficulty matrix',
                                'death, respawn, XP, inventory retention/loss, and save/reload matrix',
                                'combat, projectile, tool durability, offhand, armor, and cursor-stack matrix'
                        ]
                ],
                [
                        id              : 'mechanics.full-entity-ai-spawn-loop',
                        category        : 'entities',
                        report          : 'reports/echo/standalone/full-entity-ai-spawn-loop.json',
                        requiredEvidence: [
                                'passive, hostile, and ambient entity lifecycle matrix',
                                'pathfinding, target selection, attack, despawn, and persistence matrix',
                                'spawn rules, biome rules, structure/POI hooks, and save/reload matrix'
                        ]
                ],
                [
                        id              : 'mechanics.full-worldgen-dimensions-structures',
                        category        : 'worldgen',
                        report          : 'reports/echo/standalone/full-worldgen-dimensions-structures.json',
                        requiredEvidence: [
                                'biome, cave, ore, feature, structure, and POI generation matrix',
                                'dimension lifecycle, portal/transition, and region-file persistence matrix',
                                'chunk ticket, streaming, unload safety, lighting, weather, and fluid interaction matrix'
                        ]
                ],
                [
                        id              : 'mechanics.full-data-pack-runtime-coverage',
                        category        : 'data-assets',
                        report          : 'reports/echo/standalone/full-data-pack-runtime-coverage.json',
                        requiredEvidence: [
                                'recipes, loot tables, tags, damage types, entities, biomes, structures, and dimensions',
                                'resource pack texture/model/blockstate/lang/sounds/particles/UI hot reload',
                                'conflict, priority, missing asset, and recovery behavior'
                        ]
                ],
                [
                        id              : 'mechanics.full-command-keybind-debug-chat',
                        category        : 'controls-commands',
                        report          : 'reports/echo/standalone/full-command-keybind-debug-chat.json',
                        requiredEvidence: [
                                'commands and permission handling',
                                'keybind registration and persistence',
                                'chat/console routing and debug overlay runtime behavior'
                        ]
                ],
                [
                        id              : 'mechanics.full-progression-statistics-objectives',
                        category        : 'progression',
                        report          : 'reports/echo/standalone/full-progression-statistics-objectives.json',
                        requiredEvidence: [
                                'advancement/objective equivalent lifecycle',
                                'statistics tracking and persistence',
                                'tutorial/progression recovery after save/load and addon changes'
                        ]
                ],
                [
                        id              : 'mechanics.full-audio-particles-weather-ambience',
                        category        : 'presentation',
                        report          : 'reports/echo/standalone/full-audio-particles-weather-ambience.json',
                        requiredEvidence: [
                                'audio, subtitles, particles, weather, ambience, and accessibility state',
                                'runtime reload, missing asset fallback, and support-bundle diagnostics'
                        ]
                ],
                [
                        id              : 'mechanics.full-addon-extension-surface',
                        category        : 'addons',
                        report          : 'reports/echo/standalone/full-addon-extension-surface.json',
                        requiredEvidence: [
                                'addon extension coverage across blocks, items, entities, worldgen, data, screens, commands, and networking',
                                'bad addon containment, disable/restart recovery, and save compatibility matrix'
                        ]
                ]
        ]
        publicRequirements.each { requirement ->
            def report = readReport(requirement.report)
            def bootstrapPlaceholder = String.valueOf(report.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1'
            def passed = report.status == 'PASS'
                    && !bootstrapPlaceholder
                    && report.publicReleaseReady == true
                    && report.fullMechanicsCoverage == true
            addCheck([
                    id                   : requirement.id,
                    category             : requirement.category,
                    scope                : 'public-release',
                    status               : passed ? 'PASS' : 'BLOCKED',
                    evidenceReport       : requirement.report,
                    observedStatus       : bootstrapPlaceholder ? 'BOOTSTRAP_PLACEHOLDER' : (report.status ?: 'MISSING'),
                    publicReleaseReady   : report.publicReleaseReady == true,
                    fullMechanicsCoverage: report.fullMechanicsCoverage == true,
                    requiredEvidence     : requirement.requiredEvidence,
                    detail               : passed
                            ? 'Dedicated public-release mechanics evidence passed with full coverage.'
                            : 'Dedicated public-release full mechanics evidence is missing or incomplete; beta subset evidence is not enough for this requirement.',
                    nextEvidence         : [
                            "Generate ${requirement.report} with status PASS.",
                            'Set publicReleaseReady=true and fullMechanicsCoverage=true only after the listed evidence is covered.'
                    ]
            ])
        }

        def blockers = checks.findAll { it.status != 'PASS' }
        def publicBlockers = checks.findAll { it.scope == 'public-release' && it.status != 'PASS' }
        def reportPayload = [
                schema                  : 'echo.standalone.full_mechanics_parity_audit.v1',
                generatedAt             : '1970-01-01T00:00:00Z',
                generator               : 'runStandaloneFullMechanicsParityAudit',
                status                  : publicBlockers.isEmpty() ? 'PASS' : 'BLOCKED',
                summary                 : publicBlockers.isEmpty()
                        ? 'Full public-release mechanics parity evidence passed.'
                        : 'Full public-release mechanics parity remains blocked; beta Minecraft-like mechanics evidence is passing but does not prove the wider parity matrix.',
                publicReleaseReady      : publicBlockers.isEmpty(),
                fullMechanicsCoverage   : publicBlockers.isEmpty(),
                betaMechanicsSubsetReady: betaMechanicsPassed,
                betaMechanicsEvidence   : [
                        path             : 'reports/echo/standalone/minecraft-mechanics-contract.json',
                        status           : betaMechanics.status ?: 'UNKNOWN',
                        checkCount       : betaMechanics.checkCount ?: 0,
                        checksPassed     : betaMechanics.checksPassed ?: 0,
                        categoriesCovered: betaCategories
                ],
                checkCount              : checks.size(),
                checksPassed            : checks.count { it.status == 'PASS' },
                publicBlockerCount      : publicBlockers.size(),
                blockers                : blockers,
                checks                  : checks,
                evidenceReports         : checks.collect { it.evidenceReport }.findAll { it }.unique()
        ]
        def reportFile = file('reports/echo/standalone/full-mechanics-parity-audit.json')
        reportFile.parentFile.mkdirs()
        reportFile.text = echoStandaloneJson(reportPayload)
    }
}

def echoStandaloneWindowsProcessSample = { long rootPid ->
    def script = '''
$ErrorActionPreference = "Stop"
$rootPid = __ROOT_PID__
$ids = New-Object System.Collections.Generic.List[int]
$ids.Add([int]$rootPid)
$changed = $true
while ($changed) {
  $changed = $false
  $all = @(Get-CimInstance Win32_Process)
  foreach ($proc in $all) {
    $procId = [int]$proc.ProcessId
    $parent = [int]$proc.ParentProcessId
    if ($ids.Contains($parent) -and -not $ids.Contains($procId)) {
      $ids.Add($procId)
      $changed = $true
    }
  }
}

$live = @()
foreach ($id in $ids) {
  $p = Get-Process -Id $id -ErrorAction SilentlyContinue
  if ($p) {
    $live += $p
  }
}

$typeDefinition = @"
using System;
using System.Runtime.InteropServices;
using System.Text;

public static class EchoStandaloneWindowProbe {
  public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

  [DllImport("user32.dll")]
  public static extern bool EnumWindows(EnumWindowsProc enumProc, IntPtr lParam);

  [DllImport("user32.dll")]
  public static extern bool IsWindowVisible(IntPtr hWnd);

  [DllImport("user32.dll", SetLastError = true)]
  public static extern int GetWindowThreadProcessId(IntPtr hWnd, out int processId);

  [DllImport("user32.dll", CharSet = CharSet.Unicode)]
  public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);

  [DllImport("user32.dll", CharSet = CharSet.Unicode)]
  public static extern int GetWindowTextLength(IntPtr hWnd);
}
"@
Add-Type -TypeDefinition $typeDefinition

$windows = @()
$callback = [EchoStandaloneWindowProbe+EnumWindowsProc] {
  param([IntPtr]$hWnd, [IntPtr]$lParam)
  if (-not [EchoStandaloneWindowProbe]::IsWindowVisible($hWnd)) {
    return $true
  }
  $windowPid = 0
  [void][EchoStandaloneWindowProbe]::GetWindowThreadProcessId($hWnd, [ref]$windowPid)
  if (-not $ids.Contains([int]$windowPid)) {
    return $true
  }
  $length = [EchoStandaloneWindowProbe]::GetWindowTextLength($hWnd)
  $builder = New-Object System.Text.StringBuilder ([Math]::Max($length + 1, 1))
  [void][EchoStandaloneWindowProbe]::GetWindowText($hWnd, $builder, $builder.Capacity)
  $title = $builder.ToString()
  if ($title.Length -gt 0) {
    $script:windows += [pscustomobject]@{
      pid = [int]$windowPid
      title = $title
    }
  }
  return $true
}
[void][EchoStandaloneWindowProbe]::EnumWindows($callback, [IntPtr]::Zero)

$workingSet = 0L
foreach ($p in $live) {
  $workingSet += [long]$p.WorkingSet64
}

[pscustomobject]@{
  pids = @($ids)
  processCount = @($live).Count
  pidAlive = (@($live).Count -gt 0)
  visible = (@($windows).Count -gt 0)
  windowTitle = if (@($windows).Count -gt 0) { $windows[0].title } else { "" }
  workingSetBytes = $workingSet
} | ConvertTo-Json -Compress
'''.replace('__ROOT_PID__', Long.toString(rootPid))
    def encodedScript = java.util.Base64.encoder.encodeToString(script.getBytes('UTF-16LE'))
    def process = new ProcessBuilder('powershell', '-NoProfile', '-NonInteractive', '-OutputFormat', 'Text', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', encodedScript)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8').trim()
    def exitCode = process.waitFor()
    def jsonOutput = output.readLines().reverse().find { it.trim().startsWith('{') && it.trim().endsWith('}') }
    if (exitCode != 0 || jsonOutput == null) {
        return [
                pids           : [rootPid],
                processCount   : 0,
                pidAlive       : false,
                visible        : false,
                windowTitle    : '',
                workingSetBytes: 0L,
                probeError     : output
        ]
    }
    try {
        new groovy.json.JsonSlurper().parseText(jsonOutput.trim())
    } catch (Exception ignored) {
        [
                pids           : [rootPid],
                processCount   : 0,
                pidAlive       : false,
                visible        : false,
                windowTitle    : '',
                workingSetBytes: 0L,
                probeError     : output
        ]
    }
}

def echoStandaloneZipEntryCount = { File file ->
    if (!file.isFile()) {
        return 0
    }
    def zip = new java.util.zip.ZipFile(file)
    try {
        return zip.size()
    } finally {
        zip.close()
    }
}

def echoStandaloneDeterministicZip = { File sourceDir, File zipFile ->
    if (!sourceDir.isDirectory()) {
        throw new GradleException("Cannot create portable zip; missing directory: ${sourceDir}")
    }
    if (zipFile.exists() && !zipFile.delete()) {
        throw new GradleException("Cannot replace portable zip: ${zipFile}")
    }
    zipFile.parentFile.mkdirs()
    def sourceRoot = sourceDir.toPath()
    def files = []
    sourceDir.eachFileRecurse { file ->
        if (file.isFile()) {
            files.add(file)
        }
    }
    files.sort { left, right ->
        sourceRoot.relativize(left.toPath()).toString().replace('\\', '/') <=>
                sourceRoot.relativize(right.toPath()).toString().replace('\\', '/')
    }
    zipFile.withOutputStream { output ->
        def zip = new java.util.zip.ZipOutputStream(new java.io.BufferedOutputStream(output))
        zip.setLevel(java.util.zip.Deflater.BEST_COMPRESSION)
        try {
            files.each { file ->
                def relativePath = sourceRoot.relativize(file.toPath()).toString().replace('\\', '/')
                def entry = new java.util.zip.ZipEntry(relativePath)
                entry.setTime(315532800000L)
                zip.putNextEntry(entry)
                file.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                        zip.write(buffer, 0, read)
                    }
                }
                zip.closeEntry()
            }
        } finally {
            zip.close()
        }
    }
}

def echoStandaloneArtifact = { String artifactId, String kind, File file, boolean required ->
    def exists = file.isFile()
    [
            artifactId: artifactId,
            kind      : kind,
            path      : file.absolutePath.replace('\\', '/'),
            bytes     : exists ? file.length() : 0L,
            sha256    : exists ? echoStandaloneSha256(file) : '',
            required  : required,
            exists    : exists
    ]
}

def echoStandaloneReadJsonFile = { File jsonFile ->
    if (!jsonFile.isFile()) {
        return [:]
    }
    try {
        return new groovy.json.JsonSlurper().parse(jsonFile)
    } catch (Exception ignored) {
        return [:]
    }
}

def echoStandaloneResolveLauncherRoot = {
    def configuredLauncherRoot = providers.gradleProperty('echoLauncherRoot')
            .orElse(providers.environmentVariable('ECHO_LAUNCHER_ROOT'))
            .orNull
    def githubRoot = rootProject.projectDir.parentFile
    def platformRoot = githubRoot.parentFile
    def candidates = ([
            configuredLauncherRoot ? file(configuredLauncherRoot) : null,
            new File(githubRoot, 'ECHO-Launcher'),
            new File(platformRoot, 'Github/ECHO-Launcher'),
            new File(platformRoot, 'ECHOLauncher'),
            new File(githubRoot, 'ECHOLauncher')
    ].findAll { it != null } as List<File>).unique { it.absolutePath.toLowerCase(java.util.Locale.ROOT) }
    def detected = candidates.find { candidate ->
        new File(candidate, 'package.json').isFile()
                && new File(candidate, 'installer-artifacts').isDirectory()
    }
    detected ?: (configuredLauncherRoot ? file(configuredLauncherRoot) : new File(platformRoot, 'ECHOLauncher'))
}

def echoStandaloneLauncherSetupExe = { File launcherRoot, Object launcherPackage ->
    def launcherVersion = launcherPackage?.version ?: '1.0.1'
    new File(launcherRoot, "installer-artifacts/ECHO-Launcher-${launcherVersion}-Setup.exe")
}

def echoStandaloneAuthenticode = { String artifactId, File file ->
    if (!file.isFile()) {
        return [
                artifactId: artifactId,
                path      : file.absolutePath.replace('\\', '/'),
                exists    : false,
                status    : 'MISSING',
                signed    : false,
                signerSubject: '',
                signerIssuer : '',
                signerThumbprint: '',
                timestampSubject: '',
                rawStatusMessage: ''
        ]
    }
    def script = """
\$signature = Get-AuthenticodeSignature -LiteralPath '${file.absolutePath.replace("'", "''")}'
[pscustomobject]@{
  status = [string]\$signature.Status
  statusMessage = [string]\$signature.StatusMessage
  signerSubject = if (\$signature.SignerCertificate) { [string]\$signature.SignerCertificate.Subject } else { "" }
  signerIssuer = if (\$signature.SignerCertificate) { [string]\$signature.SignerCertificate.Issuer } else { "" }
  signerThumbprint = if (\$signature.SignerCertificate) { [string]\$signature.SignerCertificate.Thumbprint } else { "" }
  timestampSubject = if (\$signature.TimeStamperCertificate) { [string]\$signature.TimeStamperCertificate.Subject } else { "" }
} | ConvertTo-Json -Compress
"""
    def encodedScript = java.util.Base64.encoder.encodeToString(script.getBytes('UTF-16LE'))
    def process = new ProcessBuilder('powershell', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', encodedScript)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8').trim()
    def exitCode = process.waitFor()
    def parsed = null
    def jsonOutput = output.readLines().reverse().find { it.trim().startsWith('{') && it.trim().endsWith('}') }
    if (exitCode == 0 && jsonOutput != null) {
        try {
            parsed = new groovy.json.JsonSlurper().parseText(jsonOutput.trim())
        } catch (Exception ignored) {
            parsed = null
        }
    }
    def status = parsed?.status ?: 'PROBE_FAILED'
    [
            artifactId       : artifactId,
            path             : file.absolutePath.replace('\\', '/'),
            exists           : true,
            status           : status,
            signed           : status == 'Valid',
            signerSubject    : parsed?.signerSubject ?: '',
            signerIssuer     : parsed?.signerIssuer ?: '',
            signerThumbprint : parsed?.signerThumbprint ?: '',
            timestampSubject : parsed?.timestampSubject ?: '',
            rawStatusMessage : parsed?.statusMessage ?: output
    ]
}

tasks.register('runStandaloneReleaseSigningEvidencePlan') {
    group = 'verification'
    description = 'Runs the release signing helper in verify mode so release-signing-evidence.json reflects current EXE signatures.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def launcherRoot = echoStandaloneResolveLauncherRoot()
        def launcherPackage = echoStandaloneReadJsonFile(new File(launcherRoot, 'package.json'))
        def setupExe = echoStandaloneLauncherSetupExe(launcherRoot, launcherPackage)
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def runtimeExe = new File(buildDir, 'jpackage-opengl-client/EchoStandaloneRuntime/EchoStandaloneRuntime.exe')
        def signingHelper = file('scripts/sign-release-artifacts.ps1')
        if (!signingHelper.isFile()) {
            throw new GradleException("Missing release signing helper: ${signingHelper}")
        }

        def signingHelperSha256 = echoStandaloneSha256(signingHelper)
        def releaseSigningEvidenceReport = file('reports/echo/standalone/release-signing-evidence.json')
        def currentArtifactShaById = [
                'runtime-exe'       : runtimeExe.isFile() ? echoStandaloneSha256(runtimeExe) : '',
                'launcher-exe'      : launcherExe.isFile() ? echoStandaloneSha256(launcherExe) : '',
                'launcher-setup-exe': setupExe.isFile() ? echoStandaloneSha256(setupExe) : ''
        ]
        if (releaseSigningEvidenceReport.isFile()) {
            try {
                def existingEvidence = echoStandaloneReadJsonFile(releaseSigningEvidenceReport)
                def existingArtifacts = existingEvidence.artifacts instanceof Collection ? existingEvidence.artifacts : []
                def existingArtifactsById = existingArtifacts.collectEntries { artifact ->
                    [(String.valueOf(artifact.artifactId)): artifact]
                }
                def existingSignedEvidenceStillCurrent = existingEvidence.status == 'PASS'
                        && existingEvidence.signRequested == true
                        && String.valueOf(existingEvidence.captureScriptSha256 ?: '').equalsIgnoreCase(signingHelperSha256)
                        && existingEvidence.signingAttestationReady == true
                        && existingEvidence.expectedUnsignedHashesConfigured == true
                        && existingEvidence.expectedUnsignedHashesMatched == true
                        && ['runtime-exe', 'launcher-exe', 'launcher-setup-exe'].every { artifactId ->
                    def artifact = existingArtifactsById[artifactId]
                    artifact != null
                            && artifact.publicReleaseSignatureReady == true
                            && String.valueOf(artifact.sha256 ?: '').equalsIgnoreCase(currentArtifactShaById[artifactId])
                }
                if (existingSignedEvidenceStillCurrent) {
                    return
                }
            } catch (Exception ignored) {
            }
        }

        def winConfig = launcherPackage.build?.win ?: [:]
        def textValue = { Object value -> String.valueOf(value ?: '').trim() }
        def normalizeThumbprint = { Object value -> textValue(value).replaceAll('[^A-Fa-f0-9]', '').toUpperCase(java.util.Locale.ROOT) }
        def publisherName = ''
        if (winConfig.publisherName instanceof Collection) {
            publisherName = textValue(winConfig.publisherName.find { textValue(it) })
        } else {
            publisherName = textValue(winConfig.publisherName)
        }

        def command = [
                'powershell',
                '-NoProfile',
                '-NonInteractive',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                signingHelper.absolutePath,
                '-RuntimeExePath',
                runtimeExe.absolutePath,
                '-LauncherExePath',
                launcherExe.absolutePath,
                '-LauncherSetupExePath',
                setupExe.absolutePath,
                '-OutputPath',
                file('reports/echo/standalone/release-signing-evidence.json').absolutePath,
                '-ExpectedRuntimeExeSha256',
                currentArtifactShaById['runtime-exe'],
                '-ExpectedLauncherExeSha256',
                currentArtifactShaById['launcher-exe'],
                '-ExpectedLauncherSetupExeSha256',
                currentArtifactShaById['launcher-setup-exe'],
                '-TimestampServer',
                'http://timestamp.digicert.com'
        ]
        def certificateThumbprint = normalizeThumbprint(winConfig.certificateSha1)
        def certificateSubject = textValue(winConfig.certificateSubject)
        if (certificateThumbprint) {
            command.addAll(['-CertificateThumbprint', certificateThumbprint])
        }
        if (certificateSubject) {
            command.addAll(['-CertificateSubject', certificateSubject])
        }
        if (publisherName) {
            command.addAll(['-PublisherName', publisherName])
        }

        def process = new ProcessBuilder(command)
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        if (output.trim()) {
            println output.trim()
        }
        if (!(exitCode in [0, 2])) {
            throw new GradleException("Release signing evidence helper failed with exit code ${exitCode}")
        }
    }
}

tasks.register('runStandaloneReleaseSigningFailureRehearsal') {
    group = 'verification'
    description = 'Runs the release signing helper with a missing certificate and proves signing requests fail closed with structured evidence.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def launcherRoot = echoStandaloneResolveLauncherRoot()
        def launcherPackage = echoStandaloneReadJsonFile(new File(launcherRoot, 'package.json'))
        def setupExe = echoStandaloneLauncherSetupExe(launcherRoot, launcherPackage)
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def runtimeExe = new File(buildDir, 'jpackage-opengl-client/EchoStandaloneRuntime/EchoStandaloneRuntime.exe')
        def signingHelper = file('scripts/sign-release-artifacts.ps1')
        def report = file('reports/echo/standalone/release-signing-failure-rehearsal.json')
        def rehearsalEvidenceFile = file('build/tmp/release-signing-failure-rehearsal/release-signing-evidence.json')
        report.parentFile.mkdirs()
        rehearsalEvidenceFile.parentFile.mkdirs()
        if (rehearsalEvidenceFile.isFile()) {
            rehearsalEvidenceFile.delete()
        }

        if (!signingHelper.isFile()) {
            throw new GradleException("Missing release signing helper: ${signingHelper}")
        }
        if (!runtimeExe.isFile()) {
            throw new GradleException("Missing runtime EXE for signing failure rehearsal: ${runtimeExe}")
        }

        def missingLauncherArtifacts = []
        if (!launcherExe.isFile()) {
            missingLauncherArtifacts.add([
                    id    : 'launcher-exe',
                    path  : launcherExe.absolutePath.replace('\\', '/'),
                    detail: 'Build the launcher unpacked Windows image before running the signing failure rehearsal.'
            ])
        }
        if (!setupExe.isFile()) {
            missingLauncherArtifacts.add([
                    id    : 'launcher-setup-exe',
                    path  : setupExe.absolutePath.replace('\\', '/'),
                    detail: 'Build the launcher NSIS setup artifact before running the signing failure rehearsal.'
            ])
        }
        if (!missingLauncherArtifacts.isEmpty()) {
            def signingHelperSha256 = echoStandaloneSha256(signingHelper)
            report.text = echoStandaloneJson([
                    schema                    : 'echo.standalone.release_signing_failure_rehearsal.v1',
                    generatedAt               : '1970-01-01T00:00:00Z',
                    generator                 : 'runStandaloneReleaseSigningFailureRehearsal',
                    status                    : 'BLOCKED_MISSING_ARTIFACTS',
                    summary                   : 'Release signing failure rehearsal could not run because external launcher artifacts are missing.',
                    rendererTarget            : 'opengl',
                    nativeModLoaderCommandUsed: false,
                    replacesSignedArtifacts   : false,
                    helperPath                : signingHelper.path.replace('\\', '/'),
                    helperSha256              : signingHelperSha256,
                    rehearsalEvidencePath     : rehearsalEvidenceFile.absolutePath.replace('\\', '/'),
                    helperExitCode            : null,
                    expectedHelperExitCode    : 2,
                    missingArtifactCount      : missingLauncherArtifacts.size(),
                    missingArtifacts          : missingLauncherArtifacts
            ])
            println "Release signing failure rehearsal blocked; missing launcher artifact(s): "
                    + missingLauncherArtifacts.collect { it.path }.join(', ')
            return
        }

        def fakeThumbprint = '0000000000000000000000000000000000000000'
        def signingHelperSha256 = echoStandaloneSha256(signingHelper)
        def command = [
                'powershell',
                '-NoProfile',
                '-NonInteractive',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                signingHelper.absolutePath,
                '-RuntimeExePath',
                runtimeExe.absolutePath,
                '-LauncherExePath',
                launcherExe.absolutePath,
                '-LauncherSetupExePath',
                setupExe.absolutePath,
                '-OutputPath',
                rehearsalEvidenceFile.absolutePath,
                '-CertificateThumbprint',
                fakeThumbprint,
                '-PublisherName',
                'ECHO Missing Signing Rehearsal',
                '-TimestampServer',
                'http://timestamp.digicert.com',
                '-Sign'
        ]
        def process = new ProcessBuilder(command)
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        if (output.trim()) {
            println output.trim()
        }
        if (!rehearsalEvidenceFile.isFile()) {
            throw new GradleException("Release signing failure rehearsal did not write evidence: ${rehearsalEvidenceFile}")
        }

        def evidence = echoStandaloneReadJsonFile(rehearsalEvidenceFile)
        def artifacts = evidence.artifacts instanceof Collection ? evidence.artifacts : []
        def preflightErrors = evidence.signingPreflightErrors instanceof Collection
                ? evidence.signingPreflightErrors.collect { String.valueOf(it) }
                : []
        def allArtifactsNotReady = artifacts.size() == 3 && artifacts.every {
            it.exists == true && it.publicReleaseSignatureReady == false
        }
        def passed = exitCode == 2
                && evidence.schema == 'echo.standalone.release_signing_evidence.v1'
                && evidence.status == 'FAILED'
                && evidence.signRequested == true
                && evidence.identityConfigured == true
                && evidence.certificateFound == false
                && String.valueOf(evidence.expectedCertificateThumbprint ?: '') == fakeThumbprint
                && String.valueOf(evidence.captureScriptSha256 ?: '').equalsIgnoreCase(signingHelperSha256)
                && preflightErrors.any { it.contains('No matching code signing certificate') }
                && allArtifactsNotReady

        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.release_signing_failure_rehearsal.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneReleaseSigningFailureRehearsal',
                status                    : passed ? 'PASS' : 'FAILED',
                summary                   : passed
                        ? 'Release signing helper wrote structured FAILED evidence and refused to sign with a missing certificate.'
                        : 'Release signing helper failure rehearsal did not satisfy fail-closed evidence checks.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesSignedArtifacts   : false,
                helperPath                : signingHelper.path.replace('\\', '/'),
                helperSha256              : signingHelperSha256,
                rehearsalEvidencePath     : rehearsalEvidenceFile.absolutePath.replace('\\', '/'),
                helperExitCode            : exitCode,
                expectedHelperExitCode    : 2,
                helperReportStatus        : evidence.status ?: 'UNKNOWN',
                signRequested             : evidence.signRequested == true,
                identityConfigured        : evidence.identityConfigured == true,
                certificateFound          : evidence.certificateFound == true,
                fakeCertificateThumbprint : fakeThumbprint,
                preflightErrors           : preflightErrors,
                artifactCount             : artifacts.size(),
                allArtifactsNotReady      : allArtifactsNotReady
        ])
        if (!passed) {
            throw new GradleException("Release signing failure rehearsal failed; see ${report}")
        }
    }
}

def echoStandaloneWriteDistributionReports = {
    File imageDir,
    File portableZip,
    File exe,
    File cfg,
    String portableZipSha256 ->
        def releaseFile = new File(imageDir, 'runtime/release')
        def javaLibrary = new File(imageDir, 'runtime/bin/java.dll')
        def appDir = new File(imageDir, 'app')
        def standaloneJarCount = appDir.isDirectory()
                ? appDir.listFiles().count { it.name.startsWith('echo-runtime-') && it.name.endsWith('.jar') }
                : 0
        def releaseText = releaseFile.isFile() ? releaseFile.getText('UTF-8') : ''
        def javaVersionMatcher = releaseText =~ /JAVA_VERSION="([^"]+)"/
        def runtimeJavaVersion = javaVersionMatcher.find() ? javaVersionMatcher.group(1) : ''
        def launcherRoot = echoStandaloneResolveLauncherRoot()
        def launcherPackageJson = new File(launcherRoot, 'package.json')
        def launcherPackage = echoStandaloneReadJsonFile(launcherPackageJson)
        def launcherSetupExe = echoStandaloneLauncherSetupExe(launcherRoot, launcherPackage)
        def launcherVersion = launcherPackage.version ?: '1.0.1'
        def artifacts = [
                echoStandaloneArtifact('runtime-exe', 'windows-executable', exe, true),
                echoStandaloneArtifact('runtime-config', 'jpackage-config', cfg, true),
                echoStandaloneArtifact('runtime-release', 'bundled-runtime-release', releaseFile, true),
                echoStandaloneArtifact('runtime-java-library', 'bundled-runtime-library', javaLibrary, true),
                echoStandaloneArtifact('runtime-portable-zip', 'portable-zip', portableZip, false),
                echoStandaloneArtifact('launcher-exe', 'electron-executable',
                        new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe'), true),
                echoStandaloneArtifact('launcher-asar', 'electron-archive',
                        new File(launcherRoot, 'installer-artifacts/win-unpacked/resources/app.asar'), true),
                echoStandaloneArtifact('launcher-setup-exe', 'nsis-setup',
                        launcherSetupExe, false),
                echoStandaloneArtifact('launcher-icon-ico', 'windows-icon',
                        new File(launcherRoot, 'installer-artifacts/win-unpacked/resources/app.asar.unpacked/build/icon.ico'), true),
                echoStandaloneArtifact('launcher-icon-png', 'portable-icon',
                        new File(launcherRoot, 'installer-artifacts/win-unpacked/resources/app.asar.unpacked/build/icon.png'), true),
                echoStandaloneArtifact('launcher-package-json', 'version-metadata',
                        new File(launcherRoot, 'package.json'), true),
                echoStandaloneArtifact('launcher-nsis', 'installer-script',
                        new File(launcherRoot, 'build/installer.nsh'), true)
        ]
        def artifactById = { String artifactId ->
            artifacts.find { it.artifactId == artifactId } ?: [
                    artifactId: artifactId,
                    kind      : 'missing',
                    path      : '',
                    bytes     : 0L,
                    sha256    : '',
                    required  : false,
                    exists    : false
            ]
        }
        def latestYml = new File(launcherRoot, 'installer-artifacts/latest.yml')
        def latestMetadata = echoStandaloneElectronLatestYml(latestYml)
        def launcherSetupSha512 = launcherSetupExe.isFile() ? echoStandaloneSha512Base64(launcherSetupExe) : ''
        def expectedSetupArtifactName = "ECHO-Launcher-${launcherVersion}-Setup.exe"
        def packageScript = launcherPackage.scripts?.'package:win' ?: ''
        def cfgText = cfg.isFile() ? cfg.getText('UTF-8') : ''
        def asarUnpack = launcherPackage.build?.asarUnpack instanceof List
                ? launcherPackage.build.asarUnpack.collect { String.valueOf(it) }
                : []
        def iconIco = artifactById('launcher-icon-ico')
        def iconPng = artifactById('launcher-icon-png')
        def launcherSetup = artifactById('launcher-setup-exe')
        def launcherNsis = artifactById('launcher-nsis')
        def missingRequired = artifacts.findAll { it.required && !it.exists }
        def releaseWarnings = [
                'Code signing is deferred until release certificates are available for: runtime-exe,launcher-exe,launcher-setup-exe.'
        ]
        def distributionStatus = missingRequired.isEmpty() ? 'PASS_WITH_WARNINGS' : 'FAILED'
        def iconsReady = iconIco.exists
                && iconPng.exists
                && launcherPackage.build?.win?.icon == 'build/icon.ico'
                && launcherPackage.build?.nsis?.installerIcon == 'build/icon.ico'
                && launcherPackage.build?.nsis?.uninstallerIcon == 'build/icon.ico'
                && asarUnpack.contains('build/icon.ico')
                && asarUnpack.contains('build/icon.png')
        def installerMetadataReady = launcherSetup.exists
                && launcherNsis.exists
                && packageScript.contains('electron-builder --win nsis')
                && launcherSetupExe.name == expectedSetupArtifactName
                && latestYml.isFile()
                && latestMetadata.version == launcherVersion
                && latestMetadata.path == launcherSetupExe.name
                && latestMetadata.fileUrl == launcherSetupExe.name
                && latestMetadata.fileSize == (launcherSetupExe.isFile() ? launcherSetupExe.length() : 0L)
                && latestMetadata.sha512 == launcherSetupSha512
                && latestMetadata.fileSha512 == launcherSetupSha512
        def firstRunConfigReady = exe.isFile()
                && cfg.isFile()
                && releaseFile.isFile()
                && javaLibrary.isFile()
                && standaloneJarCount >= 18
                && cfgText.contains('app.mainclass=dev.echo.standalone.runtime.client.EchoClientMain')
                && cfgText.contains('java-options=--enable-native-access=ALL-UNNAMED')
                && cfgText.contains('java-options=-Dfile.encoding=UTF-8')
        def versionMetadataReady = launcherVersion
                && latestYml.isFile()
                && latestMetadata.version == launcherVersion
                && launcherSetupExe.name == expectedSetupArtifactName
                && latestMetadata.path == expectedSetupArtifactName
                && latestMetadata.fileUrl == expectedSetupArtifactName
        def strictReproducibilityReportPath = 'reports/echo/standalone/distribution-package-reproducibility-strict.json'
        def strictReproducibilityReport = file(strictReproducibilityReportPath)
        def strictReproducibilityEvidence = null
        if (strictReproducibilityReport.isFile()) {
            try {
                strictReproducibilityEvidence = new groovy.json.JsonSlurper().parse(strictReproducibilityReport)
            } catch (Exception ignored) {
                strictReproducibilityEvidence = null
            }
        }
        def strictReproducibilityMatches = strictReproducibilityEvidence != null
                && strictReproducibilityEvidence.status == 'PASS'
                && strictReproducibilityEvidence.current?.sha256 == portableZipSha256
        def reproducibilityStatus = strictReproducibilityMatches ? 'PASS' : 'PASS_WITH_WARNINGS'
        file('reports/echo/standalone/distribution-artifacts.json').text = echoStandaloneJson([
                schema        : 'echo.standalone.distribution_artifacts.v2',
                generatedAt   : '1970-01-01T00:00:00Z',
                generator     : 'refreshStandalonePackagedRuntimeImage',
                phase         : '15.9',
                status        : distributionStatus,
                rendererTarget: 'opengl',
                launcherRoot  : launcherRoot.absolutePath.replace('\\', '/'),
                launcherVersion: launcherVersion,
                mainClass     : 'dev.echo.standalone.runtime.client.EchoClientMain',
                artifacts     : artifacts,
                signingSetupEvidence: 'reports/echo/standalone/distribution-signing-setup.json',
                installUninstallEvidence: 'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                releaseWarnings: releaseWarnings,
                missingRequiredArtifactIds: missingRequired.collect { it.artifactId }
        ])
        file('reports/echo/standalone/distribution-portable-image.json').text = echoStandaloneJson([
                schema        : 'echo.standalone.distribution_portable_image.v1',
                generatedAt   : '1970-01-01T00:00:00Z',
                generator     : 'refreshStandalonePackagedRuntimeImage',
                phase         : '15.9',
                status        : 'PASS',
                summary       : 'OpenGL standalone runtime app image is present and zipped for portable testing.',
