tasks.register('verifyStandaloneEntityRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.10 entity runtime prototype artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneEntityRuntimeSmoke')

    doLast {
        def requiredReports = [
                'reports/echo/standalone/runtime-entity.json',
                'reports/echo/standalone/entity-definitions.json',
                'reports/echo/standalone/entity-components.json',
                'reports/echo/standalone/entity-movement.json',
                'reports/echo/standalone/entity-health.json',
                'reports/echo/standalone/entity-ai.json',
                'reports/echo/standalone/entity-save-hooks.json',
        ]
        ([
                'docs/echo/standalone/ECHO_STANDALONE_ENTITY_RUNTIME.md',
        ] + requiredReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.10 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        requiredReports.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.10 entity report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (report.status != 'PASS') {
                throw new GradleException("Phase 14.10 entity report did not pass: ${requiredPath}")
            }
        }
        def runtimeEntity = json.parse(file('reports/echo/standalone/runtime-entity.json'))
        if (runtimeEntity.schema != 'echo.standalone.runtime_entity.v2'
                || runtimeEntity.serviceBound != true
                || runtimeEntity.storeBound != true
                || runtimeEntity.entityCount != 2
                || runtimeEntity.hostileCount != 1
                || runtimeEntity.playerId != 'player-001'
                || runtimeEntity.hostileId != 'scavenger-001'
                || runtimeEntity.saveHealthy != true) {
            throw new GradleException('Phase 14.10 runtime entity report did not prove service-bound debug entity runtime')
        }
        def definitions = json.parse(file('reports/echo/standalone/entity-definitions.json'))
        if (definitions.schema != 'echo.standalone.entity_definitions.v2'
                || definitions.definitionCount != 2
                || definitions.manualPlayerRegistered != true
                || definitions.ashfallHostileRegistered != true
                || !definitions.definitions.any { it.entityId == 'player-001' && it.definitionId == 'echo:debug_player' && it.kind == 'PLAYER' && it.maxHealth == 100 }
                || !definitions.definitions.any { it.entityId == 'scavenger-001' && it.definitionId == 'ashfall:hostile_scavenger' && it.kind == 'HOSTILE' && it.aiProfile == 'hostile_scavenger' }) {
            throw new GradleException('Phase 14.10 entity definition report did not prove player and Ashfall hostile definitions')
        }
        def components = json.parse(file('reports/echo/standalone/entity-components.json'))
        if (components.schema != 'echo.standalone.entity_components.v2'
                || !components.componentFamilies.containsAll(['position', 'health', 'movement', 'ai'])
                || components.playerComponents.health.current != 100
                || components.hostileComponents.health.current != 25
                || components.hostileComponents.ai.state != 'PURSUING'
                || components.hostileComponents.position.key != '2,0,0') {
            throw new GradleException('Phase 14.10 entity component report did not prove position, health, movement, and AI state')
        }
        def movement = json.parse(file('reports/echo/standalone/entity-movement.json'))
