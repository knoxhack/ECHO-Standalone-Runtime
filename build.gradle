                || debugWorld.worldTileCount != 16
                || debugWorld.blockedTileRepresented != true
                || debugWorld.blockedTilePixelDiffersFromBackground != true
                || !debugWorld.worldMaterials.containsAll(['terrain:crash_debris:hazard', 'terrain:scorched_flat:hazard', 'terrain:ash_dune', 'world:blocked'])
                || !debugWorld.tileCommands.any { it.material == 'world:blocked' }) {
            throw new GradleException('Phase 15.5 render debug world report did not prove rendered world tiles and blocked-cell output')
        }
        def entities = json.parse(file('reports/echo/standalone/render-entities.json'))
        if (entities.schema != 'echo.standalone.render_entities.v2'
                || entities.entityCommandCount != 2
                || entities.playerRepresented != true
                || entities.hostileRepresented != true
