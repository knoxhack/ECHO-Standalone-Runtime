        ([
                'docs/echo/standalone/ECHO_STANDALONE_NETWORK_RUNTIME.md',
        ] + requiredReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.15 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        requiredReports.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.15 network report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 14.15 network report did not pass: ${requiredPath} status=${report.status}")
            }
        }
        def runtimeNetwork = json.parse(file('reports/echo/standalone/runtime-network.json'))
        if (runtimeNetwork.schema != 'echo.standalone.runtime_network.v2'
                || runtimeNetwork.runtimeResultServiceBound != true
                || runtimeNetwork.packetRegistryServiceBound != true
                || runtimeNetwork.localTransportServiceBound != true
                || runtimeNetwork.diagnosticsServiceBound != true
                || runtimeNetwork.handshakeServiceBound != true
                || runtimeNetwork.syncServiceBound != true
                || runtimeNetwork.handshakeResultServiceBound != true
                || runtimeNetwork.protocolId != 'echo.standalone.protocol'
                || runtimeNetwork.version != 1
                || runtimeNetwork.packetTypeCount != 5
                || runtimeNetwork.sentPacketCount != 4
                || runtimeNetwork.handshakePacketCount != 2
                || runtimeNetwork.entitySnapshots != 2
                || runtimeNetwork.inventorySnapshots != 2
                || runtimeNetwork.inventoryItemStacks != 5
                || runtimeNetwork.diagnosticCount != 5
                || runtimeNetwork.errorCount != 0) {
            throw new GradleException('Phase 14.15 runtime network report did not prove service binding, packet flow, sync, and diagnostics')
        }
        def protocol = json.parse(file('reports/echo/standalone/network-protocol.json'))
        if (protocol.schema != 'echo.standalone.network_protocol.v2'
                || protocol.protocolId != 'echo.standalone.protocol'
                || protocol.version != 1
                || protocol.minCompatibleVersion != 1
                || !protocol.features.containsAll(['diagnostics', 'entity_sync', 'inventory_sync'])
                || protocol.clientEndpoint.role != 'CLIENT'
                || protocol.serverEndpoint.role != 'SERVER'
                || protocol.clientCompatibleWithServer != true
                || protocol.serverCompatibleWithClient != true) {
            throw new GradleException('Phase 14.15 network protocol report did not prove endpoint roles, features, and compatibility')
        }
        def packets = json.parse(file('reports/echo/standalone/network-packets.json'))
        if (packets.schema != 'echo.standalone.network_packets.v2'
                || packets.packetTypeCount != 5
                || !packets.packetTypes.typeId.containsAll(['echo:handshake', 'echo:handshake_ack', 'echo:entity_sync', 'echo:inventory_sync', 'echo:diagnostic'])
                || packets.sentPacketCount != 4
                || packets.sentKinds != ['HANDSHAKE', 'HANDSHAKE_ACK', 'ENTITY_SYNC', 'INVENTORY_SYNC']
                || packets.sequences != [1, 2, 3, 4]
                || packets.deterministicOrder != true
                || packets.reliableHandshakeAndSync != true) {
            throw new GradleException('Phase 14.15 network packets report did not prove packet registry and deterministic packet order')
        }
        def handshake = json.parse(file('reports/echo/standalone/network-handshake.json'))
        if (handshake.schema != 'echo.standalone.network_handshake.v2'
                || handshake.accepted != true
                || handshake.reason != 'protocol accepted'
                || handshake.requestPacket.kind != 'HANDSHAKE'
                || handshake.responsePacket.kind != 'HANDSHAKE_ACK'
                || handshake.requestSequence != 1
                || handshake.responseSequence != 2
                || handshake.requestPayloadContainsProtocol != true
                || handshake.responsePayloadAccepted != true
                || handshake.handshakePacketCount != 2) {
            throw new GradleException('Phase 14.15 network handshake report did not prove accepted protocol handshake')
        }
        def localTransport = json.parse(file('reports/echo/standalone/network-local-transport.json'))
        if (localTransport.schema != 'echo.standalone.network_local_transport.v2'
                || localTransport.socketless != true
                || localTransport.inMemoryPacketLog != true
                || localTransport.totalPackets != 4
                || localTransport.clientPacketCount != 3
                || localTransport.serverPacketCount != 1
                || !localTransport.clientPacketKinds.containsAll(['HANDSHAKE_ACK', 'ENTITY_SYNC', 'INVENTORY_SYNC'])
                || localTransport.serverPacketKinds != ['HANDSHAKE']
                || localTransport.orderedSequences != [1, 2, 3, 4]) {
            throw new GradleException('Phase 14.15 local transport report did not prove socketless deterministic packet delivery')
        }
        def entitySync = json.parse(file('reports/echo/standalone/network-entity-sync.json'))
        if (entitySync.schema != 'echo.standalone.network_entity_sync.v2'
                || entitySync.snapshotCount != 2
                || entitySync.packetSequence != 3
                || entitySync.packetKind != 'ENTITY_SYNC'
                || entitySync.payloadContainsPlayer != true
                || entitySync.payloadContainsScavenger != true
                || entitySync.payloadContainsHealth != true) {
            throw new GradleException('Phase 14.15 entity sync report did not prove player and hostile entity replication')
        }
        def inventorySync = json.parse(file('reports/echo/standalone/network-inventory-sync.json'))
        if (inventorySync.schema != 'echo.standalone.network_inventory_sync.v2'
                || inventorySync.snapshotCount != 2
                || inventorySync.detailCount != 5
                || inventorySync.packetSequence != 4
                || inventorySync.packetKind != 'INVENTORY_SYNC'
                || inventorySync.payloadContainsPlayerInventory != true
                || inventorySync.payloadContainsCrashCache != true
                || inventorySync.payloadContainsScavengerBlade != true) {
            throw new GradleException('Phase 14.15 inventory sync report did not prove player/cache inventory replication')
        }
        def diagnostics = json.parse(file('reports/echo/standalone/network-diagnostics.json'))
        if (diagnostics.schema != 'echo.standalone.network_diagnostics.v2'
                || diagnostics.diagnosticCount != 5
                || diagnostics.warningCount != 0
                || diagnostics.errorCount != 0
                || diagnostics.containsHandshakeAccepted != true
                || diagnostics.containsFourPacketSends != true) {
            throw new GradleException('Phase 14.15 network diagnostics report did not prove clean handshake and packet send diagnostics')
        }
        def boundaries = json.parse(file('reports/echo/standalone/network-boundaries.json'))
        if (boundaries.schema != 'echo.standalone.network_boundaries.v2'
                || boundaries.localTransportOnly != true
                || boundaries.socketlessTransport != true
                || boundaries.javaNetFreeRuntime != true
                || boundaries.nettyFreeRuntime != true
                || boundaries.minecraftFreeRuntime != true
                || boundaries.platformEndpointCount != 0
                || boundaries.endpointCount != 2
                || boundaries.serviceBoundTransport != true
                || boundaries.packetLogAuditable != true
                || boundaries.forbiddenBoundaryCheckedByVerifier != true) {
            throw new GradleException('Phase 14.15 network boundary report did not prove socketless standalone transport boundaries')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'sun.audio',
                'java.net',
                'javax.websocket',
                'io.netty',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-data/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-world/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-entity/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-item/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-gameplay/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-render/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-audio/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-network/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone network runtime source ${sourceFile}")
            }
        }
    }
