                evidenceTask : 'runStandaloneLauncherSmoke',
                summary      : 'Launcher smoke completed and support-bundle evidence is included in beta readiness aggregation.'
        ])
        new File(reportDir, 'beta-readiness-ci-policy.json').text = echoStandaloneJson([
                schema                    : 'echo.standalone.beta_readiness_ci_policy.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneBetaReadinessGate',
                status                    : 'PASS',
                summary                   : 'Beta readiness CI policy is current-run-safe: beta-blocking reports are backed by current Gradle task state and stale report JSON is blocked.',
                betaGateStatus            : status,
                betaReady                 : ready,
                blockerCount              : blockers.size(),
                warningCount              : warnings.size(),
                staleReportCount          : staleChecks.size(),
                currentRunEvidenceRequired: true,
                staleReportsRejected      : true,
                bootstrapPlaceholdersAccepted: false,
                fullWorkspaceBuildReady   : fullWorkspaceReady,
                fullWorkspaceBuildCurrentRunAccepted: fullWorkspaceCurrentRunAccepted,
                fullWorkspaceBuildTask    : 'runStandaloneFullWorkspaceBuildSmoke',
                evidenceReports           : [
                        'reports/echo/standalone/beta-readiness-gate.json',
                        'reports/echo/standalone/beta-readiness-checks.json',
                        'reports/echo/standalone/full-workspace-build-smoke.json'
                ]
        ])
        new File(reportDir, 'beta-native-loader-execution.json').text = echoStandaloneJson([
                schema                          : 'echo.standalone.beta_native_loader_execution.v1',
                generatedAt                     : '1970-01-01T00:00:00Z',
                generator                       : 'runStandaloneBetaReadinessGate',
                status                          : nativeLoaderExecutionCheck.status,
                standaloneBootPath              : 'echo-native-loader-abi-v1',
                minecraftNativeModLoaderCommandUsed: false,
                standaloneNativeLoaderAbiUsed   : nativeAbiReady,
                officialNativeModulesExecuted   : officialModulesExecuted,
                addonArchiveNativeExecutionUsed : addonArchivesExecutable,
                echoAddonPackageExecutionUsed   : addonArchiveReport.echoAddonLoadReloadUnload == true,
                unsafeEchoAddonRejected         : addonArchiveReport.unsafeEchoAddonRejected == true,
                unsafeEchoAddonEscapeDiagnostic : addonArchiveReport.unsafeEchoAddonEscapeDiagnostic == true,
                officialModuleCount             : officialModuleCount,
