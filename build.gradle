tasks.register('verifyStandaloneRuntimeArchitecture') {
    group = 'verification'
    description = 'Verifies the Phase 14.1 standalone runtime architecture lock and dependency boundary.'

    doLast {
        standaloneRuntimeModules.each { moduleName ->
            def moduleDir = project(":${moduleName}").projectDir
            if (!moduleDir.isDirectory()) {
                throw new GradleException("Missing standalone runtime module directory: ${moduleDir}")
            }
        }

        [
                'docs/echo/standalone/ECHO_STANDALONE_RUNTIME_ARCHITECTURE.md',
                'docs/echo/standalone/ECHO_STANDALONE_COMMAND_RUNTIME.md',
                'docs/echo/standalone/ECHO_RUNTIME_BOUNDARIES.md',
                'docs/echo/standalone/ECHO_STANDALONE_PHASES.md',
                'reports/echo/standalone/runtime-architecture.json',
                'reports/echo/standalone/runtime-contracts.json',
                'reports/echo/standalone/runtime-commands.json',
                'reports/echo/standalone/runtime-diagnostics.json',
                'reports/echo/standalone/runtime-boundaries.json',
        ].each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.1 artifact: ${requiredPath}")
            }
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def contractSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        }
        contractSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone contract source ${sourceFile}")
            }
        }

        def clientEngineSource = file('echo-runtime-client/src/main/java/dev/echo/standalone/runtime/client/EchoClientEngine.java')
        if (clientEngineSource.isFile()) {
            def engineText = clientEngineSource.getText('UTF-8')
            def forbiddenClientShellRuntimeSync = [
                    'streamAroundPlayer(',
                    'rebuildAtlas(',
                    'updateChunks(',
                    'gameplay.init(',
            ]
            def matches = forbiddenClientShellRuntimeSync.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must stay a native loop/input shell; runtime/render sync belongs in controllers. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientShellFlowOwnership = [
                    'savingTimer',
                    'updateLoading(',
                    'finishPendingWorldLoad(',
                    'EchoClientGameState.SAVING',
                    'EchoClientGameState.MOD_SCAN',
                    'EchoClientGameState.LOADING_',
            ]
            matches = forbiddenClientShellFlowOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own blocking loading/saving shell transitions. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientScreenPresentationOwnership = [
                    'updateSaveSlots(',
                    'updateResourcePacks(',
                    'updateScreenCatalog(',
                    'updateWorkbenchRecipes(',
                    'saveSlotSummaries(',
                    'resourcePackSummaries(',
                    'screenCatalog(',
                    'workbenchRecipeSummaries(',
                    'screens.handleInput(',
            ]
            matches = forbiddenClientScreenPresentationOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own runtime-backed screen presentation. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientSlotGridOwnership = [
                    'slotGridOpen(',
                    'SlotGridInput(',
                    'tickPassiveWorld(',
                    'updateSlotGridScreen(',
                    'tickInventoryGameplay(',
            ]
            matches = forbiddenClientSlotGridOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own slot-grid input mapping or passive UI gameplay ticking. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientSettingsRuntimeOwnership = [
                    'setMouseSensitivityPercent(',
                    'setRawMouseInput(',
                    'audio.applySettings(',
                    'applyRenderSettings(',
                    'applyWindowSettings(',
                    'settingsSaveFailed(',
                    'setFullscreen(',
                    'Options save failed',
            ]
            matches = forbiddenClientSettingsRuntimeOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own client settings side effects. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientScreenshotOwnership = [
                    'screenshotRequested',
                    'captureScreenshotIfRequested(',
                    'captureFramebuffer(',
                    'GLFW_KEY_F2',
                    'Screenshot queued',
                    'Screenshot saved',
                    'Screenshot failed',
                    'EchoClientScreenshotService',
            ]
            matches = forbiddenClientScreenshotOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own screenshot input or capture side effects. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientEngineAdapterOwnership = [
                    'new EchoClientScreenshotRuntimeController.InputGate',
                    'new EchoClientShellRuntimeController.InputGate',
                    'new EchoClientShellRuntimeController.Host',
                    'new EchoClientSlotGridRuntimeController.InputGate',
                    'new EchoClientGameplayRuntimeController.Host',
                    'new EchoClientCommandController.Host',
                    'consumeKeyPress(',
                    'consumeUiPrimaryClick(',
                    'consumeUiSecondaryClick(',
                    'consumeHotbarSlotKeyPress(',
                    'setCursorLocked(',
                    'clearGameplayTriggers(',
                    'requestClose(',
                    'GLFW_KEY_',
            ]
            matches = forbiddenClientEngineAdapterOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own controller host/input adapter wiring. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientStartupAssemblyOwnership = [
                    'EchoClientWorldTemplates.defaultTemplate(',
                    'EchoClientSettingsStore.openDefault(',
                    'new EchoGlfwWindow(',
                    'new EchoClientRuntimeServices(',
                    'new EchoClientScreenController(',
                    'new EchoClientWorldSessionController(',
                    'new EchoClientGameplayRuntimeController(',
                    'new EchoClientSlotGridController(',
                    'new EchoClientRenderRuntimeController(',
                    'new EchoClientSettingsRuntimeController(',
                    'new EchoClientSettingsController(',
                    'new EchoClientShellRuntimeController(',
                    'new EchoClientScreenRuntimeController(',
                    'new EchoClientScreenshotRuntimeController(',
                    'new EchoClientSlotGridRuntimeController(',
                    'new EchoClientEngineRuntimeBridge(',
                    'new EchoClientCommandController(',
                    'new EchoClientInput(',
                    'new EchoClientRenderer(',
                    'new EchoClientHud(',
                    'new EchoClientAudio(',
                    'window.create(',
                    'renderRuntime.attach(',
                    'runtimeServices.setAudio(',
                    'screenRuntime.showInitialMainMenu(',
                    'audio.init(',
                    'renderer.resize(',
                    'reloadMinecraftAssets(',
            ]
            matches = forbiddenClientStartupAssemblyOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own client runtime assembly or native resource startup wiring. Forbidden token(s) ${matches}"
                )
            }
        }
    }
}

