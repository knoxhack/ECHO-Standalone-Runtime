tasks.register('verifyStandaloneNetworkRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.15 network runtime artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneNetworkRuntimeSmoke')

    doLast {
        def requiredReports = [
                'reports/echo/standalone/runtime-network.json',
                'reports/echo/standalone/network-protocol.json',
                'reports/echo/standalone/network-packets.json',
                'reports/echo/standalone/network-handshake.json',
