tasks.register('verifyStandaloneRuntimeArchitecture') {
    group = 'verification'
    description = 'Verifies the Phase 14.1 standalone runtime architecture lock and dependency boundary.'

    doLast {
        standaloneRuntimeModules.each { moduleName ->
            def moduleDir = project(":${moduleName}").projectDir
            if (!moduleDir.isDirectory()) {
                throw new GradleException("Missing standalone runtime module directory: ${moduleDir}")
            }
        }

        [
                'docs/echo/standalone/ECHO_STANDALONE_RUNTIME_ARCHITECTURE.md',
                'docs/echo/standalone/ECHO_STANDALONE_COMMAND_RUNTIME.md',
                'docs/echo/standalone/ECHO_RUNTIME_BOUNDARIES.md',
                'docs/echo/standalone/ECHO_STANDALONE_PHASES.md',
                'reports/echo/standalone/runtime-architecture.json',
                'reports/echo/standalone/runtime-contracts.json',
                'reports/echo/standalone/runtime-commands.json',
                'reports/echo/standalone/runtime-diagnostics.json',
                'reports/echo/standalone/runtime-boundaries.json',
        ].each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.1 artifact: ${requiredPath}")
            }
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def contractSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        }
        contractSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone contract source ${sourceFile}")
            }
        }

        def clientEngineSource = file('echo-runtime-client/src/main/java/dev/echo/standalone/runtime/client/EchoClientEngine.java')
        if (clientEngineSource.isFile()) {
            def engineText = clientEngineSource.getText('UTF-8')
            def forbiddenClientShellRuntimeSync = [
                    'streamAroundPlayer(',
                    'rebuildAtlas(',
                    'updateChunks(',
                    'gameplay.init(',
            ]
            def matches = forbiddenClientShellRuntimeSync.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must stay a native loop/input shell; runtime/render sync belongs in controllers. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientShellFlowOwnership = [
                    'savingTimer',
                    'updateLoading(',
                    'finishPendingWorldLoad(',
                    'EchoClientGameState.SAVING',
                    'EchoClientGameState.MOD_SCAN',
                    'EchoClientGameState.LOADING_',
            ]
            matches = forbiddenClientShellFlowOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own blocking loading/saving shell transitions. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientScreenPresentationOwnership = [
                    'updateSaveSlots(',
                    'updateResourcePacks(',
                    'updateScreenCatalog(',
                    'updateWorkbenchRecipes(',
                    'saveSlotSummaries(',
                    'resourcePackSummaries(',
                    'screenCatalog(',
                    'workbenchRecipeSummaries(',
                    'screens.handleInput(',
            ]
            matches = forbiddenClientScreenPresentationOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own runtime-backed screen presentation. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientSlotGridOwnership = [
                    'slotGridOpen(',
                    'SlotGridInput(',
                    'tickPassiveWorld(',
                    'updateSlotGridScreen(',
                    'tickInventoryGameplay(',
            ]
            matches = forbiddenClientSlotGridOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own slot-grid input mapping or passive UI gameplay ticking. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientSettingsRuntimeOwnership = [
                    'setMouseSensitivityPercent(',
                    'setRawMouseInput(',
                    'audio.applySettings(',
                    'applyRenderSettings(',
                    'applyWindowSettings(',
                    'settingsSaveFailed(',
                    'setFullscreen(',
                    'Options save failed',
            ]
            matches = forbiddenClientSettingsRuntimeOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own client settings side effects. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientScreenshotOwnership = [
                    'screenshotRequested',
                    'captureScreenshotIfRequested(',
                    'captureFramebuffer(',
                    'GLFW_KEY_F2',
                    'Screenshot queued',
                    'Screenshot saved',
                    'Screenshot failed',
                    'EchoClientScreenshotService',
            ]
            matches = forbiddenClientScreenshotOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own screenshot input or capture side effects. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientEngineAdapterOwnership = [
                    'new EchoClientScreenshotRuntimeController.InputGate',
                    'new EchoClientShellRuntimeController.InputGate',
                    'new EchoClientShellRuntimeController.Host',
                    'new EchoClientSlotGridRuntimeController.InputGate',
                    'new EchoClientGameplayRuntimeController.Host',
                    'new EchoClientCommandController.Host',
                    'consumeKeyPress(',
                    'consumeUiPrimaryClick(',
                    'consumeUiSecondaryClick(',
                    'consumeHotbarSlotKeyPress(',
                    'setCursorLocked(',
                    'clearGameplayTriggers(',
                    'requestClose(',
                    'GLFW_KEY_',
            ]
            matches = forbiddenClientEngineAdapterOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own controller host/input adapter wiring. Forbidden token(s) ${matches}"
                )
            }
            def forbiddenClientStartupAssemblyOwnership = [
                    'EchoClientWorldTemplates.defaultTemplate(',
                    'EchoClientSettingsStore.openDefault(',
                    'new EchoGlfwWindow(',
                    'new EchoClientRuntimeServices(',
                    'new EchoClientScreenController(',
                    'new EchoClientWorldSessionController(',
                    'new EchoClientGameplayRuntimeController(',
                    'new EchoClientSlotGridController(',
                    'new EchoClientRenderRuntimeController(',
                    'new EchoClientSettingsRuntimeController(',
                    'new EchoClientSettingsController(',
                    'new EchoClientShellRuntimeController(',
                    'new EchoClientScreenRuntimeController(',
                    'new EchoClientScreenshotRuntimeController(',
                    'new EchoClientSlotGridRuntimeController(',
                    'new EchoClientEngineRuntimeBridge(',
                    'new EchoClientCommandController(',
                    'new EchoClientInput(',
                    'new EchoClientRenderer(',
                    'new EchoClientHud(',
                    'new EchoClientAudio(',
                    'window.create(',
                    'renderRuntime.attach(',
                    'runtimeServices.setAudio(',
                    'screenRuntime.showInitialMainMenu(',
                    'audio.init(',
                    'renderer.resize(',
                    'reloadMinecraftAssets(',
            ]
            matches = forbiddenClientStartupAssemblyOwnership.findAll { token -> engineText.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException(
                        "EchoClientEngine must not own client runtime assembly or native resource startup wiring. Forbidden token(s) ${matches}"
                )
            }
        }

        def reportDir = file('reports/echo/standalone')
        reportDir.mkdirs()
        def writeArchitectureReport = { String name, Map payload ->
            file("reports/echo/standalone/${name}").text =
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + System.lineSeparator()
        }
        def contractSourceCount = contractSources.files.size()
        def clientEngineBoundaryChecks = [
                'runtime-render-sync',
                'blocking-shell-flow',
                'runtime-backed-screen-presentation',
                'slot-grid-input-mapping',
                'client-settings-side-effects',
                'screenshot-side-effects',
                'controller-host-input-adapters',
                'startup-assembly'
        ]
        writeArchitectureReport('runtime-architecture.json', [
                schema                 : 'echo.standalone.runtime_architecture.v2',
                generatedAt            : '1970-01-01T00:00:00Z',
                generator              : 'verifyStandaloneRuntimeArchitecture',
                status                 : 'PASS',
                moduleCount            : standaloneRuntimeModules.size(),
                modules                : standaloneRuntimeModules,
                playerFacingClientModule: standaloneRuntimeModules.contains('echo-runtime-client'),
                contractFirstBoundary  : true,
                nativeModLoaderCommandUsed: false
        ])
        writeArchitectureReport('runtime-contracts.json', [
                schema                    : 'echo.standalone.runtime_contracts.v2',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'verifyStandaloneRuntimeArchitecture',
                status                    : 'PASS',
                contractSourceCount       : contractSourceCount,
                forbiddenPlatformTokens   : forbiddenTokens,
                forbiddenPlatformTokenHits: 0,
                contractsPlatformNeutral  : true,
                nativeModLoaderCommandUsed: false
        ])
        writeArchitectureReport('runtime-boundaries.json', [
                schema                    : 'echo.standalone.runtime_boundaries.v2',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'verifyStandaloneRuntimeArchitecture',
                status                    : 'PASS',
                checkedClientEngine       : clientEngineSource.isFile(),
                clientEngineBoundaryChecks: clientEngineBoundaryChecks,
                clientEngineBoundaryViolations: 0,
                contractFirstBoundary     : true,
                nativeModLoaderCommandUsed: false
        ])
        writeArchitectureReport('runtime-diagnostics.json', [
                schema                    : 'echo.standalone.runtime_diagnostics.v2',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'verifyStandaloneRuntimeArchitecture',
                status                    : 'PASS',
                diagnosticSinkContractPresent: file('echo-runtime-contracts/src/main/java/dev/echo/standalone/runtime/contracts/EchoRuntimeDiagnosticSink.java').isFile(),
                diagnosticCollectorPresent: file('echo-runtime-core/src/main/java/dev/echo/standalone/runtime/core/EchoRuntimeDiagnosticCollector.java').isFile(),
                commandReportPresent      : file('reports/echo/standalone/runtime-commands.json').isFile(),
                nativeModLoaderCommandUsed: false
        ])
    }
}

tasks.register('verifyStandaloneAppRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.2 headless app runtime artifacts and platform boundary.'
    dependsOn 'runStandaloneAppRuntimeSmoke'

    doLast {
        def requiredArtifacts = [
                'docs/echo/standalone/ECHO_STANDALONE_APP_RUNTIME.md',
                'reports/echo/standalone/runtime-boot.json',
                'reports/echo/standalone/runtime-lifecycle.json',
                'reports/echo/standalone/runtime-tick-loop.json',
                'reports/echo/standalone/runtime-crash-boundary.json',
                'reports/echo/standalone/runtime-app-boot-system-modules.json',
        ]
        requiredArtifacts.each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.2 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        requiredArtifacts.findAll { it.endsWith('.json') }.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (String.valueOf(report.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.2 app runtime report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status ?: 'UNKNOWN') != 'PASS') {
                throw new GradleException("Phase 14.2 app runtime report did not pass: ${requiredPath} status=${report.status ?: 'UNKNOWN'}")
            }
        }

        def runtimeBoot = json.parse(file('reports/echo/standalone/runtime-boot.json'))
        def runtimeBootHeadless = runtimeBoot.headless ?: [:]
        def runtimeBootPlayableBeta = runtimeBoot.playableBeta ?: [:]
        def runtimeBootPackagedTester = runtimeBoot.packagedTester ?: [:]
        if (String.valueOf(runtimeBoot.schema ?: '') != 'echo.standalone.runtime_boot.v2'
                || !Boolean.valueOf(String.valueOf(runtimeBootHeadless.adapterCoreRuntimeBridgeActive ?: false))
                || (runtimeBootHeadless.moduleDescriptors ?: 0) < 90
                || (runtimeBootHeadless.requiredSystemModules ?: 0) != 8
                || (runtimeBootHeadless.executableSystemModules ?: 0) != 8
                || !Boolean.valueOf(String.valueOf(runtimeBootPlayableBeta.adapterCoreRuntimeBridgeActive ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeBootPlayableBeta.ashfallFirstPlayableLoopReady ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeBootPackagedTester.adapterCoreRuntimeBridgeActive ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeBootPackagedTester.liveWindowWalkthroughReady ?: false))) {
            throw new GradleException('Phase 14.2 runtime boot report did not prove headless, playable-beta, packaged-tester, and AdapterCore bridge readiness')
        }

        def runtimeLifecycle = json.parse(file('reports/echo/standalone/runtime-lifecycle.json'))
        def lifecycleTrace = runtimeLifecycle.lifecycleTrace ?: []
        if (String.valueOf(runtimeLifecycle.schema ?: '') != 'echo.standalone.runtime_lifecycle.v2'
                || String.valueOf(runtimeLifecycle.finalLifecycle ?: '') != 'stopped'
                || !lifecycleTrace.contains('created')
                || !lifecycleTrace.contains('bootstrapping')
                || !lifecycleTrace.contains('loading_config')
                || !lifecycleTrace.contains('initializing_services')
                || !lifecycleTrace.contains('starting_game_loop')
                || !lifecycleTrace.contains('running')
                || !lifecycleTrace.contains('stopping')
                || !lifecycleTrace.contains('stopped')
                || !Boolean.valueOf(String.valueOf(runtimeLifecycle.lifecycleDiagnosticsPreserved ?: false))) {
            throw new GradleException('Phase 14.2 runtime lifecycle report did not prove the deterministic app lifecycle trace')
        }

        def runtimeTickLoop = json.parse(file('reports/echo/standalone/runtime-tick-loop.json'))
        def tickLayers = runtimeTickLoop.tickLayers ?: []
        if (String.valueOf(runtimeTickLoop.schema ?: '') != 'echo.standalone.runtime_tick_loop.v2'
                || (runtimeTickLoop.ticksRun ?: 0) != 3
                || !tickLayers.contains('pre_tick')
                || !tickLayers.contains('input')
                || !tickLayers.contains('network')
                || !tickLayers.contains('world')
                || !tickLayers.contains('entity')
                || !tickLayers.contains('player')
                || !tickLayers.contains('gameplay')
                || !tickLayers.contains('ui')
                || !tickLayers.contains('audio')
                || !tickLayers.contains('render')
                || !tickLayers.contains('save')
                || !tickLayers.contains('post_tick')
                || String.valueOf(runtimeTickLoop.shutdownHookReason ?: '') != 'headless_tick_loop_complete'
                || Boolean.valueOf(String.valueOf(runtimeTickLoop.shutdownHookUserRequested ?: false))
                || Boolean.valueOf(String.valueOf(runtimeTickLoop.shutdownHookSaveBeforeExit ?: false))) {
            throw new GradleException('Phase 14.2 runtime tick-loop report did not prove the deterministic tick layers and clean shutdown hook')
        }

        def runtimeCrashBoundary = json.parse(file('reports/echo/standalone/runtime-crash-boundary.json'))
        if (String.valueOf(runtimeCrashBoundary.schema ?: '') != 'echo.standalone.runtime_crash_boundary.v2'
                || String.valueOf(runtimeCrashBoundary.finalLifecycle ?: '') != 'crashed'
                || !Boolean.valueOf(String.valueOf(runtimeCrashBoundary.crashHandled ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeCrashBoundary.fatalDiagnosticEmitted ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeCrashBoundary.lifecycleDiagnosticsPreserved ?: false))) {
            throw new GradleException('Phase 14.2 runtime crash-boundary report did not prove handled fatal diagnostics')
        }

        def systemModules = json.parse(file('reports/echo/standalone/runtime-app-boot-system-modules.json'))
        if (String.valueOf(systemModules.schema ?: '') != 'echo.standalone.app_boot_system_modules.v1'
                || (systemModules.moduleDescriptors ?: 0) < 90
                || (systemModules.requiredSystemModules ?: 0) != 8
                || (systemModules.executableSystemModules ?: 0) != 8
                || !Boolean.valueOf(String.valueOf(systemModules.adapterCoreRuntimeBridgeActive ?: false))
                || !Boolean.valueOf(String.valueOf(systemModules.playableBetaAdapterCoreRuntimeBridgeActive ?: false))
                || !Boolean.valueOf(String.valueOf(systemModules.packagedTesterAdapterCoreRuntimeBridgeActive ?: false))
                || !Boolean.valueOf(String.valueOf(systemModules.ashfallFirstPlayableLoopReady ?: false))
                || !Boolean.valueOf(String.valueOf(systemModules.packagedTesterLiveWindowWalkthroughReady ?: false))) {
            throw new GradleException('Phase 14.2 app boot system-module report did not prove AdapterCore bridge and beta/tester readiness')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone app/runtime source ${sourceFile}")
            }
        }
    }
}

