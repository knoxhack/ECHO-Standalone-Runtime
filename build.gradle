            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.7 save report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 14.7 save report did not pass: ${requiredPath} status=${report.status}")
            }
        }
        def runtimeSave = json.parse(file('reports/echo/standalone/runtime-save.json'))
        if (runtimeSave.schema != 'echo.standalone.runtime_save.v2'
                || runtimeSave.runtimeResultServiceBound != true
                || runtimeSave.recoveryJournalServiceBound != true
                || runtimeSave.transactionCount < 2
                || runtimeSave.filesTracked < 2
                || runtimeSave.backupCount < 1
                || runtimeSave.migrationSteps < 1
                || runtimeSave.corruptionDetected != true
                || runtimeSave.journalEntries < 10) {
            throw new GradleException('Phase 14.7 runtime save report did not prove service binding, transactions, backup, migration, corruption, and journal coverage')
        }
        def manifest = json.parse(file('reports/echo/standalone/save-manifest.json'))
        if (manifest.schema != 'echo.standalone.save_manifest_evidence.v2'
                || manifest.manifestSchema != 'echo.standalone.save_manifest.v1'
                || manifest.fileCount < 2
                || !manifest.files.any { it.relativePath == 'player/state.json' }
                || !manifest.files.any { it.relativePath == 'world/summary.json' }
                || !manifest.backupIds.contains('slot-a-tx-002')
                || manifest.metadata.mission != 'terminal-online'
                || manifest.partialCommitPreservedUnchangedFiles != true) {
            throw new GradleException('Phase 14.7 save manifest report did not prove manifest integrity and partial commit merge behavior')
        }
        def transaction = json.parse(file('reports/echo/standalone/save-transaction.json'))
        if (transaction.schema != 'echo.standalone.save_transaction_evidence.v2'
                || transaction.firstTransactionFilesWritten != 2
                || transaction.firstTransactionCreatedBackup != false
                || transaction.secondTransactionFilesWritten != 1
                || transaction.secondTransactionCreatedBackup != true
                || transaction.secondTransactionMergedFileCount != 2
                || transaction.stagingRemovedAfterCommit != true
                || transaction.latestMissionMetadata != 'terminal-online') {
            throw new GradleException('Phase 14.7 save transaction report did not prove staged commit, backup, merge, and cleanup behavior')
        }
        def backup = json.parse(file('reports/echo/standalone/save-backup.json'))
        if (backup.schema != 'echo.standalone.save_backup_evidence.v2'
                || backup.backupId != 'slot-a-tx-002'
                || backup.dataFileCount != 2
                || backup.backupRootExists != true
                || backup.manifestRecordedBackupId != true) {
            throw new GradleException('Phase 14.7 save backup report did not prove previous-data backup capture')
        }
        def corruption = json.parse(file('reports/echo/standalone/save-corruption.json'))
        if (corruption.schema != 'echo.standalone.save_corruption_evidence.v2'
                || corruption.freshSaveHealthy != true
                || corruption.mergedSaveHealthy != true
                || corruption.corruptedSaveHealthy != false
                || corruption.checkedFilesBeforeCorruption < 2
                || corruption.checkedFilesAfterMerge < 2
                || corruption.issueCount < 1
                || corruption.checksumMismatchDetected != true) {
            throw new GradleException('Phase 14.7 save corruption report did not prove checksum mismatch detection')
        }
        def migration = json.parse(file('reports/echo/standalone/save-migration.json'))
        if (migration.schema != 'echo.standalone.save_migration_evidence.v2'
                || migration.fromVersion != 1
                || migration.toVersion != 2
                || migration.blocked != false
                || migration.stepCount != 1
                || migration.backupRequired != true) {
            throw new GradleException('Phase 14.7 save migration report did not prove forward backup-required migration planning')
        }
        def journal = json.parse(file('reports/echo/standalone/save-recovery-journal.json'))
        if (journal.schema != 'echo.standalone.save_recovery_journal_evidence.v2'
                || journal.entryCount < 10
                || journal.containsBegin != true
                || journal.containsStaged != true
                || journal.containsBackupCreated != true
                || journal.containsCommitted != true
                || journal.containsMigrationPlanned != true
                || journal.containsCorruptionChecked != true) {
            throw new GradleException('Phase 14.7 recovery journal report did not prove transaction, backup, migration, and corruption event logging')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone save runtime source ${sourceFile}")
            }
        }
    }
}

