    doLast {
        def json = new groovy.json.JsonSlurper()
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                throw new GradleException("Missing Minecraft mechanics evidence report: ${relativePath}")
            }
            def parsed
            try {
                parsed = json.parse(reportFile)
            } catch (Exception exception) {
                throw new GradleException("Invalid Minecraft mechanics evidence report ${relativePath}: ${exception.message}", exception)
            }
            if (String.valueOf(parsed.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Bootstrap placeholder is not accepted for Minecraft mechanics evidence: ${relativePath}")
            }
            if (String.valueOf(parsed.status ?: 'UNKNOWN') != 'PASS') {
                throw new GradleException("Minecraft mechanics evidence report did not pass: ${relativePath} status=${parsed.status ?: 'UNKNOWN'}")
            }
            parsed.path = relativePath
            parsed
        }
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def count = { Object value -> value instanceof Number ? value.intValue() : String.valueOf(value ?: '0').toInteger() }
        def number = { Object value -> value instanceof Number ? new BigDecimal(value.toString()) : new BigDecimal(String.valueOf(value ?: '0')) }
        def checks = []
        def requireCheck = { String id, String category, String reportPath, boolean passed, Object detail ->
            checks << [
                    id      : id,
                    category: category,
                    report  : reportPath,
                    status  : passed ? 'PASS' : 'FAILED',
                    detail  : detail
            ]
        }

        def blockModel = readReport('reports/echo/standalone/client-block-model-chunk-render.json')
        def blockCoverage = blockModel.coverage ?: [:]
        def requiredBlockCoverage = [
                'blockstateVariantSelection',
                'multipartModelSelection',
                'atlasKeyResolution',
                'parentTemplateFaceTextures',
                'jsonElementBounds',
                'multiElementMeshUpload',
                'arbitraryElementRotation',
                'uvlockTextureOrientation',
                'blockstateRotatedCullfaceTint',
                'abstractElementBackedParents'
        ]
        def requiredTemplates = ['slab', 'stair', 'wall', 'fence', 'pane', 'trapdoor', 'door', 'cross', 'crop', 'button', 'pressure_plate', 'block']
        def blockCoveragePassed = requiredBlockCoverage.every { bool(blockCoverage[it]) }
        def templatesPassed = ((List) (blockModel.vanillaTemplates ?: [])).containsAll(requiredTemplates)
        requireCheck('blocks.model-json-and-templates', 'blocks', blockModel.path, blockCoveragePassed && templatesPassed, [
                requiredCoverage: requiredBlockCoverage,
                requiredTemplates: requiredTemplates,
                templatesSeen    : blockModel.vanillaTemplates ?: []
        ])

        def biome = readReport('reports/echo/standalone/client-voxel-biome-rendering.json')
        def biomeCoverage = biome.coverage ?: [:]
        requireCheck('blocks.biome-render-metadata', 'blocks', biome.path,
                bool(biomeCoverage.generatedBiomeRegions)
                        && bool(biomeCoverage.blockStateBiomeMetadata)
                        && bool(biomeCoverage.openglChunkMaterialBiomeId)
                        && bool(biomeCoverage.openglChunkMaterialBiomeTint)
                        && bool(biomeCoverage.runtimeOnlyMachineMetadataIgnored),
                [
                        sampledBiomeCount: ((List) (biome.sampledBiomeIds ?: [])).size(),
                        spawnBiome       : biome.spawn?.biomeId ?: ''
                ])

        def itemRuntime = readReport('reports/echo/standalone/runtime-item.json')
        requireCheck('items.registry-inventory-loot-tooltip', 'items', itemRuntime.path,
                bool(itemRuntime.serviceBound)
                        && bool(itemRuntime.registryBound)
                        && bool(itemRuntime.inventoryStoreBound)
                        && bool(itemRuntime.craftingSystemBound)
                        && bool(itemRuntime.lootRuntimeBound)
                        && bool(itemRuntime.tooltipRendererBound)
                        && bool(itemRuntime.adapterCoreNativeLootBridge)
                        && count(itemRuntime.registryCount) >= 6
                        && bool(itemRuntime.saveHealthy),
                [
                        registryCount : itemRuntime.registryCount,
                        inventoryCount: itemRuntime.inventoryCount,
                        occupiedSlots : itemRuntime.occupiedSlots
                ])

        def dataRuntime = readReport('reports/echo/standalone/runtime-data.json')
        def dataRecipes = readReport('reports/echo/standalone/data-recipes.json')
        def dataRegistries = readReport('reports/echo/standalone/data-registries.json')
        requireCheck('items.data-registries-and-recipes', 'items', dataRuntime.path,
                bool(dataRuntime.serviceBound)
                        && bool(dataRuntime.validationOk)
