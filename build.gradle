    new File(reportDir, 'beta-readiness-checks.json').text = echoStandaloneJson([
            schema     : 'echo.standalone.beta_readiness_checks.v1',
            generatedAt: '1970-01-01T00:00:00Z',
            generator  : 'runStandaloneBetaReadinessGate.preflight',
            status     : 'BLOCKED',
            total      : 0,
            passed     : 0,
            warnings   : 0,
            blockers   : 1,
