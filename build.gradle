tasks.register('verifyStandaloneVerticalSliceRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.18 Ashfall standalone vertical slice artifacts and platform boundary.'

    doLast {
        [
                'docs/echo/standalone/ECHO_STANDALONE_VERTICAL_SLICE.md',
                'reports/echo/standalone/runtime-vertical-slice.json',
                'reports/echo/standalone/vertical-slice-boot.json',
                'reports/echo/standalone/vertical-slice-world.json',
                'reports/echo/standalone/vertical-slice-player.json',
                'reports/echo/standalone/vertical-slice-terminal.json',
                'reports/echo/standalone/vertical-slice-inventory.json',
                'reports/echo/standalone/vertical-slice-hazard-meter.json',
                'reports/echo/standalone/vertical-slice-objectives.json',
                'reports/echo/standalone/vertical-slice-render-audio.json',
                'reports/echo/standalone/vertical-slice-network-sync.json',
                'reports/echo/standalone/vertical-slice-save-load.json',
                'reports/echo/standalone/vertical-slice-clean-exit.json',
        ].each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.18 artifact: ${requiredPath}")
            }
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'sun.audio',
                'java.net',
                'javax.websocket',
                'io.netty',
                'javax.script',
                'ScriptEngine',
                'jdk.nashorn',
                'org.graalvm.polyglot',
                'groovy.lang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-data/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-world/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-entity/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-item/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-gameplay/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-render/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-audio/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-network/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-scripting/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-compat/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone vertical slice runtime source ${sourceFile}")
            }
        }
    }
}

