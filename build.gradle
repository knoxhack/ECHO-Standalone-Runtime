    dependsOn tasks.named('runStandaloneClientVoxelBiomeSmoke')
    dependsOn tasks.named('verifyStandaloneGameplayRuntime')
    dependsOn tasks.named('runStandaloneMinecraftMechanicsContractSmoke')
    dependsOn tasks.named('runStandaloneClientScreenRuntimeControllerSmoke')
    dependsOn tasks.named('runStandaloneClientSessionResilienceSmoke')
    dependsOn tasks.named('verifyStandaloneAshfallPlayableMission')
    dependsOn tasks.named('runStandaloneAshfallExperienceQaSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsExperienceSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsPlayableRouteSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsWorldgenSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsVoxelWorldSmoke')
    dependsOn tasks.named('runStandaloneClientOpenlandsSessionSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsFullRouteContractSmoke')
    dependsOn tasks.named('runStandaloneAshfallStabilitySoakSmoke')
    dependsOn tasks.named('runStandaloneSaveProfileFlowSmoke')
    dependsOn tasks.named('verifyStandaloneSaveProfileFlow')
    dependsOn tasks.named('runStandaloneWindowedRuntimeSmoke')
    dependsOn tasks.named('runStandaloneLauncherSmoke')
    dependsOn tasks.named('runStandaloneFullWorkspaceBuildSmoke')
    if (echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()) {
        dependsOn tasks.named('runStandalonePackagedOpenGlImageSmoke')
        dependsOn tasks.named('runStandalonePackagedOpenGlImageStrictRehearsal')
    } else {
        dependsOn tasks.named('writeStandaloneVisibleWindowLaunchOptInReports')
    }
    dependsOn tasks.named('runStandaloneBetaDistributionReleaseContractSmoke')
    dependsOn tasks.named('runStandaloneManualPlaytestEvidenceTemplate')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath, placeholder: false]
            }
            try {
                def parsed = new groovy.json.JsonSlurper().parse(reportFile)
                parsed.placeholder = parsed.schema == 'echo.standalone.evidence.bootstrap.v1'
                parsed.path = relativePath
                return parsed
            } catch (Exception exception) {
                return [status: 'INVALID_JSON', path: relativePath, placeholder: false, error: exception.message ?: '']
            }
        }
        def taskCheck = { String id, String taskName, String category, boolean betaBlocking ->
            def task = tasks.named(taskName).get()
            [
                    id          : id,
                    category    : category,
                    source      : 'gradle-task',
                    task        : taskName,
                    status      : task.state.failure == null ? 'PASS' : 'FAILED',
                    betaBlocking: betaBlocking,
                    didWork     : task.state.didWork,
                    skipped     : task.state.skipped,
                    failure     : task.state.failure == null ? '' : task.state.failure.message
            ]
        }
        def reportCheck = { String id, String relativePath, String category, boolean betaBlocking, List acceptedStatuses ->
            def report = readReport(relativePath)
            def reportStatus = String.valueOf(report.status ?: 'UNKNOWN')
            def placeholder = Boolean.valueOf(String.valueOf(report.placeholder ?: false))
            def passed = !placeholder && acceptedStatuses.contains(reportStatus)
            [
                    id              : id,
                    category        : category,
                    source          : 'report',
                    report          : relativePath,
                    status          : passed ? 'PASS' : (placeholder ? 'PLACEHOLDER' : reportStatus),
                    betaBlocking    : betaBlocking,
                    expectedStatuses: acceptedStatuses,
                    placeholder     : placeholder,
                    schema          : String.valueOf(report.schema ?: ''),
                    summary         : String.valueOf(report.summary ?: report.note ?: '')
            ]
        }

        def checks = [
                taskCheck('native-loader.abi', 'runStandaloneNativeLoaderAbiSmoke', 'native-loader', true),
                taskCheck('modules.real-execution', 'runStandaloneRealModuleExecutionSmoke', 'real-modules', true),
                taskCheck('addons.folder-jar-zip-echo-addon', 'runStandaloneAddonArchiveCompatibilitySmoke', 'addons', true),
                taskCheck('adaptercore.module-coverage', 'runStandaloneAdapterCoreModuleCoverageSmoke', 'adaptercore', true),
                taskCheck('adaptercore.ashfall-parity', 'runStandaloneAshfallAdapterCoreParitySmoke', 'adaptercore', true),
                taskCheck('assets.resource-pack-mounts', 'verifyStandaloneAssetRuntime', 'assets-data', true),
                taskCheck('playable.voxel-route', 'runStandalonePlayableVoxelSmoke', 'playable-loop', true),
                taskCheck('playable.save-load', 'runStandalonePlayableVoxelSaveSmoke', 'save-load', true),
