tasks.register('verifyStandaloneModuleRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.3 module runtime artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneModuleRuntimeSmoke')
    dependsOn tasks.named('runStandaloneNativeLoaderAbiSmoke')
    dependsOn tasks.named('runStandaloneRealModuleExecutionSmoke')
    dependsOn tasks.named('runStandaloneAddonArchiveCompatibilitySmoke')

    doLast {
        def descriptorReports = [
                'reports/echo/standalone/runtime-modules.json',
                'reports/echo/standalone/runtime-module-graph.json',
                'reports/echo/standalone/runtime-feature-graph.json',
                'reports/echo/standalone/runtime-services.json',
                'reports/echo/standalone/runtime-module-status.json',
        ]
        def executableReports = [
                'reports/echo/standalone/native-loader-abi-v1-smoke.json',
                'reports/echo/standalone/real-module-execution-smoke.json',
                'reports/echo/standalone/addon-archive-compatibility-smoke.json',
        ]
        ([
                'docs/echo/standalone/ECHO_STANDALONE_MODULE_RUNTIME.md',
        ] + descriptorReports + executableReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.3 artifact: ${requiredPath}")
            }
        }
        def json = new groovy.json.JsonSlurper()
        (descriptorReports + executableReports).each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.3 module report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 14.3 module report did not pass: ${requiredPath} status=${report.status}")
            }
        }

        def modulesReport = json.parse(file('reports/echo/standalone/runtime-modules.json'))
        if (modulesReport.schema != 'echo.standalone.runtime_modules.v2'
                || modulesReport.descriptorCount < 6
                || modulesReport.readyCount < 3
                || modulesReport.failedCount < 1
                || modulesReport.disabledCount < 1
                || modulesReport.descriptorOnly != true
                || modulesReport.classloaderCreationAllowed != false
                || modulesReport.moduleCodeExecutionAllowed != false
                || modulesReport.ignoredNeoForgeOnlyDescriptor != true) {
            throw new GradleException('Phase 14.3 descriptor-only module report did not prove safe standalone descriptor coverage')
        }
        def moduleGraphReport = json.parse(file('reports/echo/standalone/runtime-module-graph.json'))
        if (moduleGraphReport.schema != 'echo.standalone.runtime_module_graph.v2'
                || !moduleGraphReport.failedModuleIds.contains('broken-addon')
                || !moduleGraphReport.dependencyEdges.any { it.fromModuleId == 'echoashfallprotocol' && it.toModuleId == 'echo-core' && it.kind == 'requires' }) {
            throw new GradleException('Phase 14.3 module graph report did not prove dependency and failure coverage')
        }
        def featureGraphReport = json.parse(file('reports/echo/standalone/runtime-feature-graph.json'))
        if (featureGraphReport.schema != 'echo.standalone.runtime_feature_graph.v2'
                || !featureGraphReport.providersByFeature.containsKey('echo:services')
                || !featureGraphReport.consumersByFeature.'echo:services'.contains('echoashfallprotocol')) {
            throw new GradleException('Phase 14.3 feature graph report did not prove provider/consumer coverage')
        }
        def servicesReport = json.parse(file('reports/echo/standalone/runtime-services.json'))
        if (servicesReport.schema != 'echo.standalone.runtime_services.v2'
                || servicesReport.moduleRegistryBound != true
                || servicesReport.moduleGraphBound != true
                || servicesReport.featureGraphBound != true
                || servicesReport.sandboxPolicyBound != true
                || servicesReport.descriptorOnly != true
                || servicesReport.moduleCodeExecutionAllowed != false) {
            throw new GradleException('Phase 14.3 runtime services report did not prove safe module service binding')
        }
        def statusReport = json.parse(file('reports/echo/standalone/runtime-module-status.json'))
        if (statusReport.schema != 'echo.standalone.runtime_module_status.v2'
                || statusReport.runtimeStatuses.'echo-core' != 'runtime-active'
                || statusReport.runtimeStatuses.'echoreportcore' != 'runtime-tooling-only'
                || statusReport.runtimeStatuses.'signalosexample' != 'runtime-dev-only'
                || statusReport.runtimeStatuses.'minecraft-only' != 'runtime-disabled-with-reason'
                || statusReport.lifecycles.'broken-addon' != 'FAILED') {
            throw new GradleException('Phase 14.3 runtime module status report did not prove active/tooling/dev/disabled coverage')
        }
        def nativeReport = json.parse(file('reports/echo/standalone/native-loader-abi-v1-smoke.json'))
        if (nativeReport.schema != 'echo.standalone.native_loader_abi_v1_smoke.v2'
                || nativeReport.descriptorSchemaCoversExecutableAbiV1 != true
                || nativeReport.classloaderIsolated != true
                || nativeReport.dependencyOrderedServiceLoad != true
                || nativeReport.dependencyClassloaderDelegation != true
                || nativeReport.reverseDependencyUnload != true
                || nativeReport.reverseOptionalDependencyUnload != true
                || nativeReport.runtimeConfigRevokedOnUnload != true
                || nativeReport.runtimeAssetsRevokedOnUnload != true
                || nativeReport.moduleSaveDataPersistedAfterUnload != true
                || nativeReport.unknownPermissionExecuted != false
                || nativeReport.classpathEscapeExecuted != false
                || nativeReport.requiredDependencyFailureDiagnostic != true
                || nativeReport.unloadCrashDiagnostic != true
                || nativeReport.surfaceNativeServiceRevokedAfterUnload != true
                || nativeReport.legacyNativeServiceRevokedAfterUnload != true) {
            throw new GradleException('Phase 14.3 Native Loader ABI report did not prove lifecycle, sandbox, dependency, permission, and revocation coverage')
        }
        def realModuleReport = json.parse(file('reports/echo/standalone/real-module-execution-smoke.json'))
        if (realModuleReport.schema != 'echo.standalone.real_module_execution_smoke.v16'
                || realModuleReport.moduleIds.size() < 90
                || realModuleReport.loadReloadUnloadExecuted != true
                || realModuleReport.realDependencyChainExecuted != true
                || realModuleReport.legacyNativeBootstrapExecuted != true
                || realModuleReport.surfaceNativeEntrypointExecuted != true
                || realModuleReport.adapterCoreNativeEntrypointExecuted != true
                || realModuleReport.nativeServiceRegisteredBeforeUnload != true
                || realModuleReport.nativeServiceRevokedOnUnload != true
                || realModuleReport.diagnosticCount != 0) {
            throw new GradleException('Phase 14.3 real module execution report did not prove all-module native load/reload/unload coverage')
        }
        def addonReport = json.parse(file('reports/echo/standalone/addon-archive-compatibility-smoke.json'))
        if (addonReport.schema != 'echo.standalone.addon_archive_compatibility_smoke.v5'
                || addonReport.folderLoadReloadUnload != true
                || addonReport.jarLoadReloadUnload != true
                || addonReport.zipNativeLoadReloadUnload != true
                || addonReport.echoAddonLoadReloadUnload != true
                || addonReport.echoAddonInternalClassPath != 'classes'
                || addonReport.unsafeEchoAddonRejected != true
                || addonReport.unsafeEchoAddonLifecycle != 'FAILED'
                || addonReport.unsafeEchoAddonEscapeDiagnostic != true
                || addonReport.corruptArchiveRecovered != true
                || !addonReport.diagnosticCodes.contains('echo.runtime.module.execution_failed')
                || !addonReport.diagnosticCodes.contains('ECHO-STANDALONE-MODULE-ARCHIVE-SCAN-FAILED')) {
            throw new GradleException('Phase 14.3 addon archive report did not prove folder/jar/zip/.echo-addon load/reload/unload, internal .echo-addon classpath, unsafe .echo-addon classpath rejection, and corrupt archive recovery')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone module runtime source ${sourceFile}")
            }
        }
    }
}

