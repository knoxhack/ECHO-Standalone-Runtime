tasks.register('verifyStandaloneSaveProfileFlow') {
    group = 'verification'
    description = 'Verifies the Phase 15.8 save profile, continue, restore, and migration prompt artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneSaveProfileFlowSmoke')
    dependsOn tasks.named('runStandaloneClientSaveContinueSmoke')

    doLast {
        def requiredReports = [
                'docs/echo/standalone/ECHO_STANDALONE_SAVE_PROFILE_FLOW.md',
                'reports/echo/standalone/runtime-save-profile-flow.json',
                'reports/echo/standalone/save-profile-slots.json',
                'reports/echo/standalone/save-continue-flow.json',
                'reports/echo/standalone/client-save-continue.json',
                'reports/echo/standalone/save-new-game-flow.json',
                'reports/echo/standalone/save-autosave.json',
                'reports/echo/standalone/save-manual-save.json',
                'reports/echo/standalone/save-corruption-warning.json',
                'reports/echo/standalone/save-backup-restore-ui.json',
                'reports/echo/standalone/save-migration-prompt.json',
                'reports/echo/standalone/save-incompatible-mod-recovery.json',
        ]
        requiredReports.each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 15.8 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        def evidenceReports = requiredReports.findAll { it.endsWith('.json') }
        def reports = evidenceReports.collectEntries { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 15.8 save profile report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 15.8 save profile report did not pass: ${requiredPath} status=${report.status}")
            }
            [(requiredPath): report]
        }
        def runtime = reports['reports/echo/standalone/runtime-save-profile-flow.json']
        if (runtime.schema != 'echo.standalone.runtime_save_profile_flow.v2'
                || runtime.saveRuntimeServiceBound != true
                || runtime.saveProfileFlowServiceBound != true
                || runtime.modSetCompatibilityCheckerServiceBound != true
                || runtime.uiServiceBound != true
                || runtime.visibleSlots != 3
                || runtime.healthySlots != 2
                || runtime.warningCount != 2
                || runtime.blockedSlotCount != 1
                || runtime.backupCount < 4
                || runtime.migrationStepCount < 1
                || runtime.newGameReady != true
                || runtime.continueReady != true
                || runtime.autosaveReady != true
                || runtime.manualSaveReady != true
                || runtime.restoreReady != true
                || runtime.migrationPromptReady != true
                || runtime.incompatibleModSetPromptReady != true) {
            throw new GradleException('Phase 15.8 runtime save profile report did not prove slots, UI, backups, migration, and recovery readiness')
        }
        def slots = reports['reports/echo/standalone/save-profile-slots.json']
        if (slots.schema != 'echo.standalone.save_profile_slots.v2'
                || slots.slotCount != 3
                || slots.selectedSlotId != 'ashfall-camp-01'
                || slots.warningSlotCount != 2
                || slots.blockedSlotCount != 1
                || !slots.slots.any { it.slotId == 'ashfall-camp-01' && it.canContinue == true && it.selectedForContinue == true }
                || !slots.slots.any { it.slotId == 'ashfall-missing-module-01' && it.status == 'blocked' && it.canContinue == false && it.warningCode == 'MOD_SET_MISMATCH' }) {
            throw new GradleException('Phase 15.8 save slot report did not prove selected healthy slot plus blocked incompatible-mod slot')
        }
        def continueFlow = reports['reports/echo/standalone/save-continue-flow.json']
        if (continueFlow.schema != 'echo.standalone.save_continue_flow.v2'
                || continueFlow.selectedSlotId != 'ashfall-camp-01'
                || continueFlow.selectedSaveKind != 'manual'
                || continueFlow.newGameAvailable != true
                || continueFlow.continueAvailable != true
                || continueFlow.autosaveAvailable != true
                || continueFlow.manualSaveAvailable != true
                || continueFlow.selectedSlotCanContinue != true) {
            throw new GradleException('Phase 15.8 continue flow report did not prove all title save actions and selected continue slot')
        }
        def clientContinue = reports['reports/echo/standalone/client-save-continue.json']
        if (clientContinue.schema != 'echo.standalone.client_save_continue.v1'
                || clientContinue.coverage?.capturedOpenGlFramebufferThumbnail != true
                || clientContinue.coverage?.thumbnailPngPersisted != true
                || clientContinue.coverage?.thumbnailManifestMetadata != true
                || clientContinue.coverage?.worldSelectUsesCapturedTexture != true
                || clientContinue.coverage?.corruptThumbnailFallsBackToDeterministic != true
                || clientContinue.coverage?.diskContinueRestoresSlot != true
                || clientContinue.coverage?.worldSelectRestore != true
                || clientContinue.coverage?.runtimeContentMismatchBlocksContinue != true
                || clientContinue.coverage?.missingModuleBlocksContinue != true
                || clientContinue.coverage?.backupAndMigrationReady != true
                || clientContinue.coverage?.deleteWorldDisablesContinue != true
                || String.valueOf(clientContinue.thumbnail?.source ?: '') != 'opengl_framebuffer'
                || String.valueOf(clientContinue.thumbnail?.relativePath ?: '') != 'client/thumbnail.png'
                || clientContinue.thumbnail?.width != 160
                || clientContinue.thumbnail?.height != 90
                || ((clientContinue.thumbnail?.bytesBeforeCorruptionProbe ?: 0) as Long) < 100L
                || clientContinue.thumbnail?.textureEligible != true
                || clientContinue.thumbnail?.fallbackVerified != true) {
            throw new GradleException('Phase 15.8 client save/continue report did not prove captured OpenGL thumbnails, fallback, and disk restore')
        }
        def newGame = reports['reports/echo/standalone/save-new-game-flow.json']
        if (newGame.schema != 'echo.standalone.save_new_game_flow.v2'
                || newGame.expectedSaveKind != 'new_game'
                || newGame.manifestSaveKind != 'new_game'
                || newGame.ready != true
                || newGame.filesWritten != 3
                || newGame.backupCreated != false) {
            throw new GradleException('Phase 15.8 new-game report did not prove first-slot creation without backup')
        }
        def autosave = reports['reports/echo/standalone/save-autosave.json']
        if (autosave.schema != 'echo.standalone.save_autosave.v2'
                || autosave.manifestSaveKind != 'autosave'
                || autosave.ready != true
                || autosave.backupCreated != true
                || autosave.backupDataFileCount < 3) {
            throw new GradleException('Phase 15.8 autosave report did not prove backup-backed autosave')
        }
        def manualSave = reports['reports/echo/standalone/save-manual-save.json']
        if (manualSave.schema != 'echo.standalone.save_manual_save.v2'
                || manualSave.manifestSaveKind != 'manual'
                || manualSave.ready != true
                || manualSave.backupCreated != true
                || manualSave.backupDataFileCount < 3) {
            throw new GradleException('Phase 15.8 manual-save report did not prove backup-backed manual save')
        }
        def corruption = reports['reports/echo/standalone/save-corruption-warning.json']
        if (corruption.schema != 'echo.standalone.save_corruption_warning.v2'
                || corruption.warningShown != true
                || corruption.healthy != false
                || corruption.issueCount < 1
                || corruption.checksumMismatchDetected != true) {
            throw new GradleException('Phase 15.8 corruption warning report did not prove visible checksum warning')
        }
        def restore = reports['reports/echo/standalone/save-backup-restore-ui.json']
        if (restore.schema != 'echo.standalone.save_backup_restore_ui.v2'
                || restore.warningShown != true
                || restore.restored != true
                || restore.beforeRestoreHealthy != false
                || restore.afterRestoreHealthy != true
                || restore.restoredBackupDataFileCount < 2
                || !restore.beforeRestoreIssueCodes.contains('CHECKSUM_MISMATCH')) {
            throw new GradleException('Phase 15.8 backup restore UI report did not prove warning-before-restore and healthy-after-restore flow')
        }
        def migration = reports['reports/echo/standalone/save-migration-prompt.json']
        if (migration.schema != 'echo.standalone.save_migration_prompt.v2'
                || migration.visible != true
                || migration.fromVersion != 1
                || migration.toVersion != 2
                || migration.stepCount < 1
                || migration.backupRequired != true
                || migration.manualApprovalRequired != true
                || migration.executesAutomatically != false) {
            throw new GradleException('Phase 15.8 migration prompt report did not prove manual backup-required migration flow')
        }
        def incompatible = reports['reports/echo/standalone/save-incompatible-mod-recovery.json']
        if (incompatible.schema != 'echo.standalone.save_incompatible_mod_recovery.v2'
                || incompatible.compatible != false
                || incompatible.loadBlocked != true
                || incompatible.backupAvailable != true
                || incompatible.backupRequired != true
                || incompatible.manualApprovalRequired != true
                || incompatible.migrationPlanningRequired != true
                || incompatible.recoveryAction != 'restore_backup_or_open_migration_prompt'
                || !incompatible.missingModuleIds.contains('echoworldcore')
                || !incompatible.addedModuleIds.contains('echoscreencore')) {
            throw new GradleException('Phase 15.8 incompatible-mod recovery report did not prove blocked load and recovery action coverage')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'sun.audio',
                'java.net',
                'javax.websocket',
                'io.netty',
                'java.awt',
                'javafx',
                'glfw',
        ]
        def checkedSources = fileTree('echo-runtime-app/src/main/java') {
            include '**/EchoSaveProfile*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/EchoSaveBackupService.java'
            include '**/EchoSaveJournalEvent.java'
        } + fileTree('echo-runtime-testkit/src/main/java') {
            include '**/EchoRuntimeSaveProfileFlowSmokeHarness.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone save profile flow source ${sourceFile}")
            }
        }
    }
}

