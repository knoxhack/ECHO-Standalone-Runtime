                && addonArchiveReport.folderLoadReloadUnload == true
                && addonArchiveReport.jarLoadReloadUnload == true
                && addonArchiveReport.zipNativeLoadReloadUnload == true
                && addonArchiveReport.echoAddonLoadReloadUnload == true
                && addonArchiveReport.echoAddonInternalClassPath == 'classes'
                && addonArchiveReport.unsafeEchoAddonRejected == true
                && addonArchiveReport.unsafeEchoAddonLifecycle == 'FAILED'
                && addonArchiveReport.unsafeEchoAddonEscapeDiagnostic == true
                && addonArchiveReport.corruptArchiveRecovered == true
        def nativeLoaderExecutionReady = nativeAbiReady && officialModulesExecuted && addonArchivesExecutable
        def nativeLoaderExecutionCheck = [
                id                              : 'native-loader.execution-path',
                category                        : 'native-loader',
                source                          : 'report-aggregate',
                reports                         : [
                        'reports/echo/standalone/native-loader-abi-v1-smoke.json',
                        'reports/echo/standalone/real-module-execution-smoke.json',
                        'reports/echo/standalone/addon-archive-compatibility-smoke.json'
                ],
                status                          : nativeLoaderExecutionReady ? 'PASS' : 'BLOCKED',
                betaBlocking                    : true,
                standaloneNativeLoaderAbiUsed   : nativeAbiReady,
                officialNativeModulesExecuted   : officialModulesExecuted,
                addonArchiveNativeExecutionUsed : addonArchivesExecutable,
                echoAddonPackageExecutionUsed   : addonArchiveReport.echoAddonLoadReloadUnload == true,
                unsafeEchoAddonRejected         : addonArchiveReport.unsafeEchoAddonRejected == true,
                unsafeEchoAddonEscapeDiagnostic : addonArchiveReport.unsafeEchoAddonEscapeDiagnostic == true,
                officialModuleCount             : officialModuleCount,
                nativeEntrypointCount           : nativeEntrypointCount,
                minecraftNativeModLoaderCommandUsed: false,
                detail                          : nativeLoaderExecutionReady
                        ? 'Standalone ECHO Native Loader ABI v1 executed official modules and folder/jar/zip/.echo-addon packages, rejected unsafe .echo-addon archive classpaths, and used no Minecraft/NeoForge/Fabric boot path.'
                        : 'Standalone ECHO Native Loader ABI v1 aggregate evidence is missing or incomplete.'
        ]
        def fullWorkspaceCommand = String.valueOf(fullWorkspaceReport.command ?: '')
        def fullWorkspaceReady = fullWorkspaceCurrentRunAccepted
                && fullWorkspaceReport.status == 'PASS'
                && fullWorkspaceReport.placeholder != true
                && fullWorkspaceReport.evidence?.buildSuccessful == true
                && fullWorkspaceReport.evidence?.fullWorkspaceTask == true
                && fullWorkspaceReport.evidence?.detectedWorkspaceOwnsBuildEchoWorkspace == true
                && fullWorkspaceReport.noConfigurationCache == true
                && fullWorkspaceReport.noParallel == true
                && fullWorkspaceReport.rerunTasks == true
                && String.valueOf(fullWorkspaceReport.echoAddonSet ?: '') == 'all'
                && fullWorkspaceCommand.contains('buildEchoWorkspace')
                && fullWorkspaceCommand.contains('-PechoAddonSet=all')
                && fullWorkspaceCommand.contains('--no-configuration-cache')
                && fullWorkspaceCommand.contains('--no-parallel')
        def fullWorkspaceBuildCheck = [
                id                    : 'workspace.full-addon-build',
                category              : 'workspace',
                source                : 'report-aggregate',
                task                  : 'runStandaloneFullWorkspaceBuildSmoke',
                reports               : ['reports/echo/standalone/full-workspace-build-smoke.json'],
                status                : fullWorkspaceReady ? 'PASS' : (fullWorkspaceCurrentRunAccepted ? 'BLOCKED' : 'STALE'),
                betaBlocking          : true,
                currentRunTaskAccepted: fullWorkspaceCurrentRunAccepted,
                didWork               : fullWorkspaceTask.state.didWork,
                skipped               : fullWorkspaceTask.state.skipped,
                failure               : fullWorkspaceTask.state.failure == null ? '' : fullWorkspaceTask.state.failure.message,
                workspaceRoot         : String.valueOf(fullWorkspaceReport.workspaceRoot ?: ''),
                detectedWorkspaceRoot : String.valueOf(fullWorkspaceReport.detectedWorkspaceRoot ?: ''),
                command               : fullWorkspaceCommand,
                echoAddonSet          : String.valueOf(fullWorkspaceReport.echoAddonSet ?: ''),
                buildSuccessful       : fullWorkspaceReport.evidence?.buildSuccessful == true,
                fullWorkspaceTask     : fullWorkspaceReport.evidence?.fullWorkspaceTask == true,
                ownsBuildEchoWorkspace: fullWorkspaceReport.evidence?.detectedWorkspaceOwnsBuildEchoWorkspace == true,
                detail                : fullWorkspaceReady
                        ? 'Existing full-workspace evidence proves buildEchoWorkspace passed for echoAddonSet=all without configuration cache or parallel execution.'
                        : (fullWorkspaceCurrentRunAccepted
                                ? 'Run runStandaloneFullWorkspaceBuildSmoke before the beta gate so the standalone runtime has real full-addon workspace build evidence.'
                                : 'Full-workspace evidence was not accepted from the current Gradle invocation; stale full-workspace reports cannot satisfy beta readiness.')
        ]
        checks.add(3, nativeLoaderExecutionCheck)
        checks.add(4, fullWorkspaceBuildCheck)

        def blockers = checks.findAll { it.betaBlocking && it.status != 'PASS' }
        def staleChecks = checks.findAll { it.status == 'STALE' }
        def warnings = checks.findAll { !it.betaBlocking && it.status != 'PASS' }.collect {
            [
                    id      : it.id,
                    category: it.category,
                    status  : it.status,
                    evidence: it.report ?: it.task,
                    detail  : it.placeholder
