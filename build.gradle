tasks.register('verifyStandaloneAshfallPlayableMission') {
    group = 'verification'
    description = 'Verifies the Phase 15.7 Ashfall playable mission expansion artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneAshfallPlayableMissionSmoke')

    doLast {
        def requiredReports = [
                'docs/echo/standalone/ECHO_STANDALONE_ASHFALL_PLAYABLE_MISSION.md',
                'reports/echo/standalone/runtime-ashfall-playable-mission.json',
                'reports/echo/standalone/ashfall-playable-intro.json',
                'reports/echo/standalone/ashfall-playable-objectives.json',
                'reports/echo/standalone/ashfall-playable-terminal-flow.json',
                'reports/echo/standalone/ashfall-playable-inventory.json',
                'reports/echo/standalone/ashfall-playable-hazard-zones.json',
                'reports/echo/standalone/ashfall-playable-scavenger-encounter.json',
                'reports/echo/standalone/ashfall-playable-rewards.json',
                'reports/echo/standalone/ashfall-playable-fail-retry.json',
        ]
        requiredReports.each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 15.7 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        def reports = requiredReports.findAll { it.endsWith('.json') }.collectEntries { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 15.7 Ashfall playable mission report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 15.7 Ashfall playable mission report did not pass: ${requiredPath} status=${report.status}")
            }
            [(requiredPath): report]
        }
        def runtime = reports['reports/echo/standalone/runtime-ashfall-playable-mission.json']
        if (runtime.schema != 'echo.standalone.runtime_ashfall_playable_mission.v2'
                || runtime.missionId != 'ashfall:secure_crash_site_playable'
                || runtime.missionStatus != 'COMPLETED'
                || runtime.completedObjectives != runtime.totalObjectives
                || runtime.totalObjectives < 8
                || runtime.stepCount != 8
                || runtime.playerHealth <= 0
                || runtime.rewardGranted != true
                || runtime.failBranchCovered != true
                || runtime.retryRecovered != true
                || runtime.cleanExit != true
                || runtime.terminalCommandSubmitted != true
                || runtime.terminalCacheRouteVisible != true
                || runtime.scavengerRepelled != true
                || runtime.patchedFilterRewardPresent != true
                || runtime.audioDeviceClosed != true
                || runtime.renderFrames < 1) {
            throw new GradleException('Phase 15.7 runtime Ashfall playable mission report did not prove complete route, terminal, reward, retry, render, and audio shutdown coverage')
        }
        def intro = reports['reports/echo/standalone/ashfall-playable-intro.json']
        if (intro.schema != 'echo.standalone.ashfall_playable_intro.v2'
                || intro.firstStepId != 'intro'
                || intro.introPromptArmed != true
                || intro.notificationArmed != true
                || intro.playerHealth <= 0) {
            throw new GradleException('Phase 15.7 Ashfall intro report did not prove spawn/intro prompt readiness')
        }
        def objectives = reports['reports/echo/standalone/ashfall-playable-objectives.json']
        def requiredObjectiveIds = [
                'ashfall:intro_beacon',
                'ashfall:terminal_uplink',
                'ashfall:hydrate_survivor',
                'ashfall:cross_toxic_ash',
                'ashfall:recover_crash_cache',
                'ashfall:repel_scavenger',
                'ashfall:claim_reward',
                'ashfall:retry_path',
        ]
        if (objectives.schema != 'echo.standalone.ashfall_playable_objectives.v2'
                || objectives.allCompleted != true
                || objectives.completedObjectives != objectives.totalObjectives
                || !objectives.objectives.every { it.completed == true }
                || !requiredObjectiveIds.every { id -> objectives.objectives.any { it.objectiveId == id } }) {
            throw new GradleException('Phase 15.7 Ashfall objectives report did not prove all required route objectives completed')
        }
        def terminal = reports['reports/echo/standalone/ashfall-playable-terminal-flow.json']
        if (terminal.schema != 'echo.standalone.ashfall_playable_terminal_flow.v2'
                || terminal.uplinkCommandSubmitted != true
                || terminal.cacheRouteVisible != true
                || !terminal.history.contains('uplink cache')
                || !terminal.outputLines.any { String.valueOf(it).contains('cache route: 2,0,1') }) {
            throw new GradleException('Phase 15.7 Ashfall terminal report did not prove uplink command and cache route output')
        }
        def inventory = reports['reports/echo/standalone/ashfall-playable-inventory.json']
        if (inventory.schema != 'echo.standalone.ashfall_playable_inventory.v2'
                || inventory.waterRationUsed != true
                || inventory.rewardCrafted != true
                || inventory.craftedItemId != 'ashfall:patched_filter'
                || inventory.patchedFilterCount != 1
                || !inventory.inventoryMilestones.contains('ashfall:patched_filter_ready')) {
            throw new GradleException('Phase 15.7 Ashfall inventory report did not prove water use and patched filter reward')
        }
        def hazards = reports['reports/echo/standalone/ashfall-playable-hazard-zones.json']
        if (hazards.schema != 'echo.standalone.ashfall_playable_hazard_zones.v2'
                || !String.valueOf(hazards.hazardStepOutcome).contains('hazard=')
                || hazards.ashExposureAfterRoute <= 0
                || hazards.failBranchReason != 'player_down_in_toxic_ash'
                || hazards.failBranchHazardApplications < 1
                || hazards.retryRecovered != true) {
            throw new GradleException('Phase 15.7 Ashfall hazard report did not prove hazard traversal plus toxic-ash fail/retry branch')
        }
        def encounter = reports['reports/echo/standalone/ashfall-playable-scavenger-encounter.json']
        if (encounter.schema != 'echo.standalone.ashfall_playable_scavenger_encounter.v2'
                || encounter.attacks != 1
                || encounter.survived != true
                || encounter.repelled != true
                || encounter.resolution != 'repelled_after_cache_salvage'
                || encounter.survivorReputation < 25
                || encounter.scavengerReputation > -40) {
            throw new GradleException('Phase 15.7 Ashfall scavenger report did not prove encounter survival, resolution, and reputation effects')
        }
        def rewards = reports['reports/echo/standalone/ashfall-playable-rewards.json']
        if (rewards.schema != 'echo.standalone.ashfall_playable_rewards.v2'
                || rewards.rewardId != 'ashfall:patched_filter_reward'
                || rewards.itemId != 'ashfall:patched_filter'
                || rewards.granted != true
                || rewards.experienceAwarded < 1
                || rewards.totalExperience < 90
                || rewards.level < 2) {
            throw new GradleException('Phase 15.7 Ashfall reward report did not prove reward item, XP, and level progression')
        }
        def retry = reports['reports/echo/standalone/ashfall-playable-fail-retry.json']
        if (retry.schema != 'echo.standalone.ashfall_playable_fail_retry.v2'
                || retry.failed != true
                || retry.failureReason != 'player_down_in_toxic_ash'
                || retry.failureHealth != 0
                || retry.hazardApplications < 1
                || retry.retried != true
                || retry.retryOutcome != 'retry_recovered_main_route') {
            throw new GradleException('Phase 15.7 Ashfall fail/retry report did not prove recovery from toxic-ash failure')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'sun.audio',
                'java.net',
                'javax.websocket',
                'io.netty',
        ]
        def checkedSources = fileTree('echo-runtime-app/src/main/java') {
            include '**/EchoAshfallPlayableMission*.java'
            include '**/EchoAshfallScavengerEncounterResult.java'
            include '**/EchoAshfallFailRetryResult.java'
        } + fileTree('echo-runtime-testkit/src/main/java') {
            include '**/EchoRuntimeAshfallPlayableMissionSmokeHarness.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone Ashfall playable mission source ${sourceFile}")
            }
        }
    }
}

