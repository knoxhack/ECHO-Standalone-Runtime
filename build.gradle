tasks.register('verifyStandaloneLauncherRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.19 standalone launcher MVP artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneLauncherSmoke')

    doLast {
        [
                'docs/echo/standalone/ECHO_STANDALONE_LAUNCHER_MVP.md',
                'reports/echo/standalone/runtime-launcher.json',
                'reports/echo/standalone/launcher-detection.json',
                'reports/echo/standalone/launcher-verification.json',
                'reports/echo/standalone/launcher-repair-plan.json',
                'reports/echo/standalone/launcher-support-bundle.json',
                'reports/echo/standalone/launcher-handoff.json',
                'reports/echo/standalone/launcher-smoke.json',
        ].each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.19 artifact: ${requiredPath}")
            }
        }

        def launcherJson = new groovy.json.JsonSlurper()
        def readLauncherReport = { String relativePath ->
            def parsed = launcherJson.parse(file(relativePath))
            if (parsed.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.19 launcher report is still bootstrap placeholder evidence: ${relativePath}")
            }
            parsed
        }
        def runtimeLauncher = readLauncherReport('reports/echo/standalone/runtime-launcher.json')
        if (runtimeLauncher.schema != 'echo.standalone.runtime_launcher.v2'
                || runtimeLauncher.status != 'PASS'
                || runtimeLauncher.rendererTarget != 'opengl'
                || runtimeLauncher.nativeModLoaderCommandUsed != false
                || runtimeLauncher.ready != true
                || runtimeLauncher.launched != true
                || runtimeLauncher.launchSuccess != true
                || runtimeLauncher.launchTicksRun != 3
                || runtimeLauncher.supportBundleComplete != true
                || runtimeLauncher.platformHandoffPreserved != true
                || runtimeLauncher.brokenWorkspaceFailsClosed != true) {
            throw new GradleException('Phase 14.19 runtime launcher report did not prove ready launch, support bundle, platform handoff, and fail-closed behavior')
        }
        def detection = readLauncherReport('reports/echo/standalone/launcher-detection.json')
        if (detection.schema != 'echo.standalone.launcher_detection.v2'
                || detection.status != 'PASS'
                || detection.standaloneWorkspace != true
                || detection.settingsFilePresent != true
                || detection.buildFilePresent != true
                || detection.docsRootPresent != true
                || detection.reportsRootPresent != true
                || detection.brokenWorkspaceDetected != false) {
            throw new GradleException('Phase 14.19 launcher detection report did not prove workspace detection and broken-workspace rejection')
        }
        def verification = readLauncherReport('reports/echo/standalone/launcher-verification.json')
        if (verification.schema != 'echo.standalone.launcher_verification.v2'
                || verification.status != 'PASS'
                || verification.ready != true
                || verification.passedCount < 1
                || verification.failedCount != 0
                || verification.brokenWorkspaceReady != false
                || verification.brokenWorkspaceFailedCount < 1
                || verification.checks.size() < 1) {
            throw new GradleException('Phase 14.19 launcher verification report did not prove ready checks and broken-workspace failures')
        }
        def repairPlan = readLauncherReport('reports/echo/standalone/launcher-repair-plan.json')
        if (repairPlan.schema != 'echo.standalone.launcher_repair_plan.v2'
                || repairPlan.status != 'PASS'
                || repairPlan.planningOnly != true
                || repairPlan.actionCount != 0
                || repairPlan.brokenWorkspacePlanningOnly != true
                || repairPlan.brokenWorkspaceActionCount < 1) {
            throw new GradleException('Phase 14.19 launcher repair plan report did not prove no-op ready repair and planning-only broken repair')
        }
        def handoff = readLauncherReport('reports/echo/standalone/launcher-handoff.json')
        if (handoff.schema != 'echo.standalone.launcher_handoff.v2'
                || handoff.status != 'PASS'
                || handoff.rendererTarget != 'opengl'
                || handoff.launchesStandalone != true
                || handoff.standaloneOpenGlClientTarget != true
                || handoff.platformHandoffLaunched != false
                || handoff.platformHandoffPreserved != true
                || handoff.platformExternalCommandPreserved != true) {
            throw new GradleException('Phase 14.19 launcher handoff report did not prove OpenGL standalone handoff and external platform preservation')
        }
        def supportBundle = readLauncherReport('reports/echo/standalone/launcher-support-bundle.json')
        if (supportBundle.schema != 'echo.standalone.launcher_support_bundle.v2'
                || supportBundle.status != 'PASS'
                || supportBundle.complete != true
                || supportBundle.entryCount < 40
                || supportBundle.presentEntryCount != supportBundle.entryCount
                || supportBundle.manifestPresent != true
                || supportBundle.manifestEntryCount < supportBundle.entryCount
                || supportBundle.archivePresent != true
                || supportBundle.archiveByteSize <= 0
                || supportBundle.entries.size() < 40
                || supportBundle.diagnostics.size() < 5) {
            throw new GradleException('Phase 14.19 launcher support bundle report did not prove complete manifest/archive diagnostics')
        }
        def archiveLauncherReports = [
                'reports/echo/standalone/runtime-launcher.json'       : 'echo.standalone.runtime_launcher.v2',
                'reports/echo/standalone/launcher-detection.json'     : 'echo.standalone.launcher_detection.v2',
                'reports/echo/standalone/launcher-verification.json'  : 'echo.standalone.launcher_verification.v2',
                'reports/echo/standalone/launcher-repair-plan.json'   : 'echo.standalone.launcher_repair_plan.v2',
                'reports/echo/standalone/launcher-support-bundle.json': 'echo.standalone.launcher_support_bundle.v2',
                'reports/echo/standalone/launcher-handoff.json'       : 'echo.standalone.launcher_handoff.v2',
                'reports/echo/standalone/launcher-smoke.json'         : 'echo.standalone.launcher_smoke.v2',
        ]
        def supportBundleEntryPaths = supportBundle.entries.collect { String.valueOf(it.relativePath) }
        if (!supportBundleEntryPaths.containsAll(archiveLauncherReports.keySet())) {
            throw new GradleException('Phase 14.19 launcher support bundle manifest did not include every launcher evidence report')
        }
        def supportBundleArchive = file(String.valueOf(supportBundle.archivePath).replace('\\', '/'))
        if (!supportBundleArchive.isFile()) {
            throw new GradleException("Missing Phase 14.19 support bundle archive: ${supportBundleArchive}")
        }
        def supportZip = new java.util.zip.ZipFile(supportBundleArchive)
        try {
            archiveLauncherReports.each { relativePath, expectedSchema ->
                def entry = supportZip.getEntry(relativePath)
                if (entry == null) {
                    throw new GradleException("Phase 14.19 support bundle archive is missing ${relativePath}")
                }
                def archivedReport = launcherJson.parseText(supportZip.getInputStream(entry).getText('UTF-8'))
                if (archivedReport.schema == 'echo.standalone.evidence.bootstrap.v1'
                        || archivedReport.schema != expectedSchema
                        || archivedReport.status != 'PASS') {
                    throw new GradleException("Phase 14.19 support bundle archive contains invalid launcher evidence for ${relativePath}: schema=${archivedReport.schema} status=${archivedReport.status}")
                }
            }
        } finally {
            supportZip.close()
        }
        def launcherSmoke = readLauncherReport('reports/echo/standalone/launcher-smoke.json')
        if (launcherSmoke.schema == 'echo.standalone.evidence.bootstrap.v1') {
            throw new GradleException('Phase 14.19 launcher smoke report is still bootstrap placeholder evidence')
        }
        if (launcherSmoke.schema != 'echo.standalone.launcher_smoke.v2'
                || launcherSmoke.status != 'PASS'
                || launcherSmoke.rendererTarget != 'opengl'
                || launcherSmoke.nativeModLoaderCommandUsed != false
                || launcherSmoke.detectedStandaloneWorkspace != true
                || launcherSmoke.verificationReady != true
                || launcherSmoke.verificationPassedCount < 1
                || launcherSmoke.verificationFailedCount != 0
                || launcherSmoke.repairPlanningOnly != true
                || launcherSmoke.repairActionCount != 0
                || launcherSmoke.standaloneOpenGlClientTarget != true
                || launcherSmoke.launcherLaunched != true
                || launcherSmoke.launchSuccess != true
                || launcherSmoke.launchTicksRun != 3
                || launcherSmoke.supportBundleComplete != true
                || launcherSmoke.supportBundleEntryCount < 40
                || launcherSmoke.supportBundlePresentEntryCount != launcherSmoke.supportBundleEntryCount
                || launcherSmoke.supportBundleArchiveBytes <= 0
                || launcherSmoke.platformHandoffLaunched != false
                || launcherSmoke.platformHandoffPreserved != true
                || launcherSmoke.platformExternalCommandPreserved != true
