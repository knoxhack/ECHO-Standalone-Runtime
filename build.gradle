    if (!betaReadinessRequested) {
        return
    }
    def reportDir = file('reports/echo/standalone')
    reportDir.mkdirs()
    def pendingBlocker = [
            id      : 'current-run.incomplete',
            category: 'aggregation',
            status  : 'PENDING_CURRENT_RUN',
            detail  : 'Beta readiness aggregation was requested but has not completed in this Gradle invocation.'
