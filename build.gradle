def echoStandaloneSha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def echoStandaloneSha512Base64 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-512')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
            digest.update(buffer, 0, read)
        }
    }
    java.util.Base64.encoder.encodeToString(digest.digest())
}

def echoStandaloneStripYamlScalar = { String value ->
    def trimmed = value == null ? '' : value.trim()
    if (trimmed.length() >= 2) {
        def first = trimmed.charAt(0)
        def last = trimmed.charAt(trimmed.length() - 1)
        if ((first == (char) 39 && last == (char) 39)
                || (first == (char) 34 && last == (char) 34)) {
            return trimmed.substring(1, trimmed.length() - 1)
        }
    }
    trimmed
}

def echoStandaloneElectronLatestYml = { File latestYml ->
    def metadata = [
            version    : '',
            path       : '',
            sha512     : '',
            releaseDate: '',
            fileUrl    : '',
            fileSha512 : '',
            fileSize   : 0L
    ]
    if (!latestYml.isFile()) {
        return metadata
    }
    boolean inFiles = false
    latestYml.eachLine('UTF-8') { rawLine ->
        def trimmed = rawLine.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('#')) {
            return
        }
        if (trimmed == 'files:') {
            inFiles = true
            return
        }
        boolean indented = rawLine.startsWith(' ') || rawLine.startsWith('\t') || trimmed.startsWith('- ')
        if (!indented) {
            inFiles = false
        }
        def line = trimmed.startsWith('- ') ? trimmed.substring(2).trim() : trimmed
        int colon = line.indexOf(':')
        if (colon < 0) {
            return
        }
        def key = line.substring(0, colon).trim()
        def value = echoStandaloneStripYamlScalar(line.substring(colon + 1))
        if (inFiles) {
            if (key == 'url') {
                metadata.fileUrl = value
            } else if (key == 'sha512') {
                metadata.fileSha512 = value
            } else if (key == 'size') {
                metadata.fileSize = value.isInteger() ? value.toLong() : 0L
            }
            return
        }
        if (metadata.containsKey(key)) {
            metadata[key] = key == 'fileSize' && value.isInteger() ? value.toLong() : value
        }
    }
    metadata
}

def echoStandaloneJson = { Object value ->
    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)) + System.lineSeparator()
}

def echoStandaloneWindowsProcessSample = { long rootPid ->
    def script = '''
$ErrorActionPreference = "Stop"
$rootPid = __ROOT_PID__
$ids = New-Object System.Collections.Generic.List[int]
$ids.Add([int]$rootPid)
$changed = $true
while ($changed) {
  $changed = $false
  $all = @(Get-CimInstance Win32_Process)
  foreach ($proc in $all) {
    $procId = [int]$proc.ProcessId
    $parent = [int]$proc.ParentProcessId
    if ($ids.Contains($parent) -and -not $ids.Contains($procId)) {
      $ids.Add($procId)
      $changed = $true
    }
  }
}

$live = @()
foreach ($id in $ids) {
  $p = Get-Process -Id $id -ErrorAction SilentlyContinue
  if ($p) {
    $live += $p
  }
}

$typeDefinition = @"
using System;
using System.Runtime.InteropServices;
using System.Text;

public static class EchoStandaloneWindowProbe {
  public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

  [DllImport("user32.dll")]
  public static extern bool EnumWindows(EnumWindowsProc enumProc, IntPtr lParam);

  [DllImport("user32.dll")]
  public static extern bool IsWindowVisible(IntPtr hWnd);

  [DllImport("user32.dll", SetLastError = true)]
  public static extern int GetWindowThreadProcessId(IntPtr hWnd, out int processId);

  [DllImport("user32.dll", CharSet = CharSet.Unicode)]
  public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);

  [DllImport("user32.dll", CharSet = CharSet.Unicode)]
  public static extern int GetWindowTextLength(IntPtr hWnd);
}
"@
Add-Type -TypeDefinition $typeDefinition

$windows = @()
$callback = [EchoStandaloneWindowProbe+EnumWindowsProc] {
  param([IntPtr]$hWnd, [IntPtr]$lParam)
  if (-not [EchoStandaloneWindowProbe]::IsWindowVisible($hWnd)) {
    return $true
  }
  $windowPid = 0
  [void][EchoStandaloneWindowProbe]::GetWindowThreadProcessId($hWnd, [ref]$windowPid)
  if (-not $ids.Contains([int]$windowPid)) {
