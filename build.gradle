// echo-runtime-app (Swing/AWT) is superseded by echo-runtime-client (LWJGL).
// Kept for testkit coverage and backward compatibility; new development should target the client.
project(':echo-runtime-app') {
    apply plugin: 'application'

    dependencies {
        implementation project(':echo-runtime-core')
        implementation project(':echo-runtime-modules')
        implementation project(':echo-runtime-save')
        implementation project(':echo-runtime-world')
        implementation project(':echo-runtime-entity')
        implementation project(':echo-runtime-item')
        implementation project(':echo-runtime-gameplay')
        implementation project(':echo-runtime-ui')
        implementation project(':echo-runtime-render')
        implementation project(':echo-runtime-input')
        implementation project(':echo-runtime-player')
        implementation project(':echo-runtime-audio')
        implementation project(':echo-runtime-network')
        implementation project(':echo-runtime-scripting')
        implementation project(':echo-runtime-compat')
        implementation project(':echo-runtime-assets')
        implementation project(':echo-runtime-data')
    }

    application {
        mainClass = 'dev.echo.standalone.runtime.app.EchoRuntimeMain'
        applicationDefaultJvmArgs = [
                '--enable-native-access=ALL-UNNAMED',
                '-Dfile.encoding=UTF-8',
                '-Dsun.java2d.d3d=false',
                '-Dsun.java2d.opengl=false'
        ]
    }
}

project(':echo-runtime-client') {
    apply plugin: 'application'

    ext.lwjglVersion = '3.3.6'
    ext.lwjglNatives = 'natives-windows'

    dependencies {
        implementation project(':echo-runtime-core')
        implementation project(':echo-runtime-modules')
        implementation project(':echo-runtime-save')
        implementation project(':echo-runtime-world')
        implementation project(':echo-runtime-entity')
        implementation project(':echo-runtime-item')
        implementation project(':echo-runtime-gameplay')
        implementation project(':echo-runtime-render')
        implementation project(':echo-runtime-input')
        implementation project(':echo-runtime-player')
        implementation project(':echo-runtime-audio')
        implementation project(':echo-runtime-assets')
        implementation project(':echo-runtime-data')
        implementation project(':echo-runtime-compat')
        implementation project(':echo-runtime-ui')

        implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
        implementation 'org.lwjgl:lwjgl'
        implementation 'org.lwjgl:lwjgl-glfw'
        implementation 'org.lwjgl:lwjgl-opengl'
        implementation 'org.lwjgl:lwjgl-stb'
        runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    }

    application {
        mainClass = 'dev.echo.standalone.runtime.client.EchoClientMain'
        applicationDefaultJvmArgs = [
                '--enable-native-access=ALL-UNNAMED',
                '-Dfile.encoding=UTF-8'
        ]
    }
}

