                || camera.initialCamera.x != 0.5
                || camera.initialCamera.z != 0.5
                || camera.firstEastCamera.x != 1.5
                || camera.cacheCamera.x != 2.5
                || camera.cacheCamera.z != 1.5
                || camera.blockedCamera.x != 3.5
                || camera.blockedCamera.z != 2.5
                || camera.cameraFollowsPlayer != true
                || camera.stableAfterCollision != true) {
            throw new GradleException('Phase 15.4 player camera report did not prove follow rig and collision stability')
        }
        def targeting = json.parse(file('reports/echo/standalone/player-targeting.json'))
        if (targeting.schema != 'echo.standalone.player_targeting.v2'
                || targeting.initialTarget.id != 'ashfall:terminal_pod'
                || targeting.initialTarget.exact != true
                || targeting.nearbyCacheTarget.id != 'ashfall:crash_cache'
                || targeting.nearbyCacheTarget.exact != false
                || targeting.exactCacheTarget.id != 'ashfall:crash_cache'
                || targeting.exactCacheTarget.exact != true
                || targeting.terminalInteractionTarget.id != 'ashfall:terminal_pod'
                || targeting.cacheInteractionTarget.id != 'ashfall:crash_cache'
                || targeting.targetingStable != true) {
            throw new GradleException('Phase 15.4 player targeting report did not prove terminal/cache targeting transitions')
        }
        def shortcuts = json.parse(file('reports/echo/standalone/player-inventory-shortcuts.json'))
        if (shortcuts.schema != 'echo.standalone.player_inventory_shortcuts.v2'
                || shortcuts.shortcut.slotIndex != 0
                || shortcuts.shortcut.itemId != 'echoashfallprotocol:clean_water_bottle'
                || shortcuts.shortcut.used != true
                || shortcuts.shortcut.reason != 'hydrated'
                || shortcuts.waterRemainingAfterShortcut != 1
                || shortcuts.waterRemainingAfterCacheLoot != 2
                || shortcuts.quickSlotConsumedWater != true
                || !shortcuts.effects.contains('shortcut:hydrated')) {
            throw new GradleException('Phase 15.4 player inventory shortcut report did not prove quick-slot water consumption')
        }
        def hazard = json.parse(file('reports/echo/standalone/player-hazard-feedback.json'))
        if (hazard.schema != 'echo.standalone.player_hazard_feedback.v2'
                || hazard.firstMoveHazard.intensity != 0.72
                || hazard.firstMoveHazard.healthDamage != 4
                || hazard.cacheMoveHazard.intensity != 0.72
                || hazard.retainedHazard.message != 'Toxic ash is damaging suit seals.'
                || hazard.finalPlayerHealth != 84
                || hazard.hazardFeedbackApplied != true) {
            throw new GradleException('Phase 15.4 player hazard feedback report did not prove toxic-ash player feedback')
        }
        def traversal = json.parse(file('reports/echo/standalone/player-debug-traversal.json'))
        if (traversal.schema != 'echo.standalone.player_debug_traversal.v2'
                || traversal.terminalInteraction.handled != true
                || traversal.terminalInteraction.interaction.interactionId != 'ashfall:activate_terminal'
                || traversal.terminalInteraction.interaction.objectiveCompleted != true
                || traversal.cacheInteraction.handled != true
                || traversal.cacheInteraction.interaction.interactionId != 'ashfall:salvage_cache'
                || traversal.cacheInteraction.interaction.objectiveCompleted != true
                || traversal.focusTerminal.handled != true
                || traversal.focusTerminal.action != 'TERMINAL_FOCUS'
                || traversal.blockedByFocus.handled != false
                || !traversal.blockedByFocus.effects.contains('terminal-focus-blocks-gameplay')
                || traversal.blurTerminal.handled != true
                || traversal.blurTerminal.action != 'TERMINAL_BLUR'
                || traversal.missionCompleted != true
                || traversal.completedObjectives != 3
                || traversal.focusBlockedGameplay != true) {
            throw new GradleException('Phase 15.4 player debug traversal report did not prove interactions, mission completion, and focus gating')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'java.awt',
                'javafx',
                'glfw',
        ]
        def checkedSources = fileTree('echo-runtime-player/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-testkit/src/main/java') {
            include '**/EchoRuntimePlayerControllerSmokeHarness.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone player controller source ${sourceFile}")
            }
        }
    }
}

