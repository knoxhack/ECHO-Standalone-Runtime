tasks.register('verifyStandaloneCompatRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.17 compatibility and migration layer artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneCompatRuntimeSmoke')

    doLast {
        [
                'docs/echo/standalone/ECHO_STANDALONE_COMPATIBILITY_MIGRATION.md',
                'reports/echo/standalone/runtime-compatibility.json',
                'reports/echo/standalone/compatibility-boundary.json',
                'reports/echo/standalone/compatibility-mappings.json',
                'reports/echo/standalone/compatibility-source-records.json',
                'reports/echo/standalone/compatibility-target-validation.json',
                'reports/echo/standalone/compatibility-migration-policy.json',
                'reports/echo/standalone/compatibility-migration-plan.json',
                'reports/echo/standalone/compatibility-manual-review.json',
                'reports/echo/standalone/compatibility-diagnostics.json',
                'reports/echo/standalone/neoforge-compat-candidates.json',
        ].each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.17 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        [
                'reports/echo/standalone/runtime-compatibility.json',
                'reports/echo/standalone/compatibility-boundary.json',
                'reports/echo/standalone/compatibility-mappings.json',
                'reports/echo/standalone/compatibility-source-records.json',
                'reports/echo/standalone/compatibility-target-validation.json',
                'reports/echo/standalone/compatibility-migration-policy.json',
                'reports/echo/standalone/compatibility-migration-plan.json',
                'reports/echo/standalone/compatibility-manual-review.json',
                'reports/echo/standalone/compatibility-diagnostics.json',
                'reports/echo/standalone/neoforge-compat-candidates.json',
        ].each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (String.valueOf(report.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.17 compatibility report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status ?: 'UNKNOWN') != 'PASS') {
                throw new GradleException("Phase 14.17 compatibility report did not pass: ${requiredPath} status=${report.status ?: 'UNKNOWN'}")
            }
        }

        def runtimeCompatibility = json.parse(file('reports/echo/standalone/runtime-compatibility.json'))
        if (String.valueOf(runtimeCompatibility.schema ?: '') != 'echo.standalone.runtime_compatibility.v2'
                || (runtimeCompatibility.mappingCount ?: 0) < 7
                || (runtimeCompatibility.supportedMappingCount ?: 0) < 6
                || (runtimeCompatibility.manualReviewMappingCount ?: 0) < 1
                || String.valueOf(runtimeCompatibility.blockedMappingCount ?: 0) != '0'
                || (runtimeCompatibility.sourceRecordCount ?: 0) < 7
                || String.valueOf(runtimeCompatibility.targetValidationValid) != 'true'
                || String.valueOf(runtimeCompatibility.targetValidationErrors) != '0'
                || String.valueOf(runtimeCompatibility.migrationPlanBlocked) != 'false'
                || (runtimeCompatibility.migrationStepCount ?: 0) < 8
                || String.valueOf(runtimeCompatibility.migrationMutationStepCount) != '0'
                || (runtimeCompatibility.migrationManualReviewStepCount ?: 0) < 1
                || String.valueOf(runtimeCompatibility.diagnosticErrors) != '0'
                || (runtimeCompatibility.adapterCoreBindingCount ?: 0) < 30
                || runtimeCompatibility.adapterCoreReadyBindingCount != runtimeCompatibility.adapterCoreBindingCount
                || (runtimeCompatibility.adapterCoreRegistryCount ?: 0) < 30
                || String.valueOf(runtimeCompatibility.adapterCoreSupportsAllRuntimes) != 'true'
                || String.valueOf(runtimeCompatibility.rendererTarget ?: '') != 'opengl'
                || String.valueOf(runtimeCompatibility.neoforgeClassloaderCreated) != 'false'
                || String.valueOf(runtimeCompatibility.neoforgeModuleCodeExecuted) != 'false') {
            throw new GradleException('Phase 14.17 runtime compatibility report did not prove mappings, AdapterCore, OpenGL target, diagnostics, and safe NeoForge metadata handling')
        }

        def boundary = json.parse(file('reports/echo/standalone/compatibility-boundary.json'))
        if (String.valueOf(boundary.schema ?: '') != 'echo.standalone.compatibility_boundary.v2'
                || (boundary.adapterRuleCount ?: 0) < 6
                || String.valueOf(boundary.contractsStayAdapterFree) != 'true'
                || String.valueOf(boundary.minecraftNeoForgeBridgesStayOutOfContracts) != 'true'
                || String.valueOf(boundary.adapterCoreIdsCanonicalAcrossRuntimes) != 'true'
                || String.valueOf(boundary.liveClientRendererTarget ?: '') != 'opengl'
                || String.valueOf(boundary.migrationPlansBeforeMutation) != 'true') {
            throw new GradleException('Phase 14.17 compatibility boundary report did not prove adapter isolation, canonical AdapterCore ids, OpenGL target, and pre-mutation planning')
        }

        def mappings = json.parse(file('reports/echo/standalone/compatibility-mappings.json'))
        if (String.valueOf(mappings.schema ?: '') != 'echo.standalone.compatibility_mappings.v2'
                || (mappings.mappingCount ?: 0) < 7
                || (mappings.supportedCount ?: 0) < 6
                || (mappings.manualReviewCount ?: 0) < 1
                || String.valueOf(mappings.blockedCount) != '0'
                || String.valueOf(mappings.cleanWaterBottleTarget ?: '') != 'echoashfallprotocol:clean_water_bottle'
                || String.valueOf(mappings.secureCrashSiteTarget ?: '') != 'ashfall:secure_crash_site'
                || !(mappings.mappings ?: []).any { it.sourceId == 'echoashfallprotocol:world_hazard/toxic_ash' && it.targetId == 'ashfall:toxic_ash' }) {
            throw new GradleException('Phase 14.17 compatibility mappings report did not prove supported/manual-review mappings and canonical Ashfall targets')
        }

        def sourceRecords = json.parse(file('reports/echo/standalone/compatibility-source-records.json'))
        if (String.valueOf(sourceRecords.schema ?: '') != 'echo.standalone.compatibility_source_records.v2'
                || (sourceRecords.sourceRecordCount ?: 0) < 7
                || !(sourceRecords.sourceRecords ?: []).any { it.sourceId == 'echoashfallprotocol:item/clean_water_bottle' }
                || !(sourceRecords.sourceRecords ?: []).any { it.sourceId == 'echoashfallprotocol:mission/secure_crash_site' }) {
            throw new GradleException('Phase 14.17 compatibility source records report did not prove source inventory coverage')
        }

        def targetValidation = json.parse(file('reports/echo/standalone/compatibility-target-validation.json'))
        if (String.valueOf(targetValidation.schema ?: '') != 'echo.standalone.compatibility_target_validation.v2'
                || String.valueOf(targetValidation.valid) != 'true'
                || (targetValidation.warningCount ?: 0) < 1
                || String.valueOf(targetValidation.errorCount) != '0') {
            throw new GradleException('Phase 14.17 compatibility target validation report did not prove valid targets with warning-only manual review')
        }

        def migrationPolicy = json.parse(file('reports/echo/standalone/compatibility-migration-policy.json'))
        if (String.valueOf(migrationPolicy.schema ?: '') != 'echo.standalone.compatibility_migration_policy.v2'
                || String.valueOf(migrationPolicy.policyId ?: '') != 'echo:manual_migration_plan_only'
                || String.valueOf(migrationPolicy.manualOnly) != 'true'
                || String.valueOf(migrationPolicy.executeAutomatically) != 'false'
                || String.valueOf(migrationPolicy.mutateSourceAllowed) != 'false'
                || String.valueOf(migrationPolicy.backupRequired) != 'true') {
            throw new GradleException('Phase 14.17 migration policy report did not prove manual-only, backup-required, no-auto-mutation policy')
        }

        def migrationPlan = json.parse(file('reports/echo/standalone/compatibility-migration-plan.json'))
        if (String.valueOf(migrationPlan.schema ?: '') != 'echo.standalone.compatibility_migration_plan.v2'
                || String.valueOf(migrationPlan.blocked) != 'false'
                || (migrationPlan.stepCount ?: 0) < 8
                || String.valueOf(migrationPlan.firstAction ?: '') != 'REQUIRE_BACKUP'
                || (migrationPlan.manualReviewStepCount ?: 0) < 1
                || String.valueOf(migrationPlan.mutationStepCount) != '0'
                || String.valueOf(migrationPlan.requiresBackup) != 'true'
                || !(migrationPlan.steps ?: []).any { it.targetId == 'ashfall:toxic_ash' }
                || !(migrationPlan.steps ?: []).any { it.targetId == 'echo:manual_save_review/player_progress' }) {
            throw new GradleException('Phase 14.17 migration plan report did not prove backup-first, no-mutation, warning-only migration planning')
        }

        def manualReview = json.parse(file('reports/echo/standalone/compatibility-manual-review.json'))
        if (String.valueOf(manualReview.schema ?: '') != 'echo.standalone.compatibility_manual_review.v2'
                || (manualReview.manualReviewMappingCount ?: 0) < 1
                || (manualReview.manualReviewStepCount ?: 0) < 1
                || String.valueOf(manualReview.automaticExecutionAllowed) != 'false'
                || String.valueOf(manualReview.sourceMutationAllowed) != 'false'
                || String.valueOf(manualReview.backupRequired) != 'true'
                || String.valueOf(manualReview.manualReviewTargetId ?: '') != 'echo:manual_save_review/player_progress') {
            throw new GradleException('Phase 14.17 manual review report did not prove save review is manual, backed up, and non-mutating')
        }

        def diagnostics = json.parse(file('reports/echo/standalone/compatibility-diagnostics.json'))
        if (String.valueOf(diagnostics.schema ?: '') != 'echo.standalone.compatibility_diagnostics.v2'
                || (diagnostics.diagnosticCount ?: 0) < 5
                || (diagnostics.warningCount ?: 0) < 1
                || String.valueOf(diagnostics.errorCount) != '0'
                || String.valueOf(diagnostics.metadataFixtureErrorCount) != '0') {
            throw new GradleException('Phase 14.17 diagnostics report did not prove warning-only compatibility diagnostics')
        }

        def neoforgeCandidates = json.parse(file('reports/echo/standalone/neoforge-compat-candidates.json'))
        if (String.valueOf(neoforgeCandidates.schema ?: '') != 'echo.standalone.neoforge_compat_candidates.v1'
                || (neoforgeCandidates.counts?.candidates ?: 0) <= 0
                || String.valueOf(neoforgeCandidates.safety?.moduleActivation) != 'false'
                || String.valueOf(neoforgeCandidates.safety?.classloaderCreated) != 'false'
                || String.valueOf(neoforgeCandidates.safety?.moduleCodeExecuted) != 'false'
                || String.valueOf(neoforgeCandidates.safety?.runtimeStatus ?: '') != 'runtime-disabled-with-reason'
                || !(neoforgeCandidates.candidates ?: []).any { it.modId == 'echoadaptercore' && it.runtimeStatus == 'runtime-disabled-with-reason' }) {
            throw new GradleException('Phase 14.17 NeoForge candidate report did not prove diagnostics-only metadata discovery with no module activation or code execution')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'sun.audio',
                'java.net',
                'javax.websocket',
                'io.netty',
                'javax.script',
                'ScriptEngine',
                'jdk.nashorn',
                'org.graalvm.polyglot',
                'groovy.lang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-data/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-world/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-entity/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-item/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-gameplay/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-render/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-audio/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-network/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-scripting/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-compat/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone compatibility runtime source ${sourceFile}")
            }
        }
    }
}

