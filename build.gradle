            def report = json.parse(file(requiredPath))
            if (String.valueOf(report.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.4 PackOS report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status ?: 'UNKNOWN') != 'PASS') {
                throw new GradleException("Phase 14.4 PackOS report did not pass: ${requiredPath} status=${report.status ?: 'UNKNOWN'}")
            }
        }

        def packos = json.parse(file('reports/echo/standalone/runtime-packos.json'))
        if (String.valueOf(packos.schema ?: '') != 'echo.standalone.runtime_packos.v2'
                || String.valueOf(packos.packId ?: '') != 'ashfall'
                || String.valueOf(packos.launchAllowed) != 'true'
                || String.valueOf(packos.badProfileLaunchAllowed) != 'false'
                || (packos.badProfileBlockers ?: 0) <= 0
                || String.valueOf(packos.repairExecutionAllowed) != 'false') {
            throw new GradleException('Phase 14.4 runtime-packos report did not prove launch-allowed valid pack, refused broken pack, and plan-only repair policy')
        }

        def session = json.parse(file('reports/echo/standalone/runtime-pack-session.json'))
        if (String.valueOf(session.schema ?: '') != 'echo.standalone.runtime_pack_session.v2'
                || String.valueOf(session.packId ?: '') != 'ashfall'
                || (session.enabledModuleCount ?: 0) < 2
                || (session.enabledFeatureCount ?: 0) < 2
                || (session.lockedModuleCount ?: 0) < 2
                || (session.lockedFeatureCount ?: 0) < 2
                || String.valueOf(session.sessionServiceBound) != 'true'
                || String.valueOf(session.mountPlanServiceBound) != 'true'
                || String.valueOf(session.integrityReportServiceBound) != 'true'
                || String.valueOf(session.compatibilityReportServiceBound) != 'true') {
            throw new GradleException('Phase 14.4 runtime pack session report did not prove profile, lockfile, service binding, and launch readiness')
        }

        def integrity = json.parse(file('reports/echo/standalone/runtime-pack-integrity.json'))
        if (String.valueOf(integrity.schema ?: '') != 'echo.standalone.runtime_pack_integrity.v2'
                || String.valueOf(integrity.integrityReady) != 'true'
                || (integrity.integrityBlockers ?: 0) != 0
                || String.valueOf(integrity.compatible) != 'true'
                || (integrity.compatibilityBlockers ?: 0) != 0
                || String.valueOf(integrity.badProfileCompatible) != 'false'
                || (integrity.badProfileCompatibilityBlockers ?: 0) <= 0
                || String.valueOf(integrity.repairExecutionAllowed) != 'false'
                || String.valueOf(integrity.badProfileRepairExecutionAllowed) != 'false') {
            throw new GradleException('Phase 14.4 runtime pack integrity report did not prove integrity, compatibility blockers, and plan-only repair behavior')
        }

        def mountPlan = json.parse(file('reports/echo/standalone/runtime-pack-mount-plan.json'))
        if (String.valueOf(mountPlan.schema ?: '') != 'echo.standalone.runtime_pack_mount_plan.v2'
                || String.valueOf(mountPlan.packId ?: '') != 'ashfall'
                || (mountPlan.mountCount ?: 0) < 5
                || (mountPlan.assetMounts ?: 0) < 3
                || (mountPlan.dataMounts ?: 0) < 1
                || (mountPlan.themeMounts ?: 0) < 1
                || String.valueOf(mountPlan.runtimeDefaultsMounted) != 'true'
                || String.valueOf(mountPlan.theme ?: '') != 'ashfall_cyberglass') {
            throw new GradleException('Phase 14.4 runtime pack mount plan report did not prove ordered asset/data/theme mounts')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone PackOS runtime source ${sourceFile}")
            }
        }
    }
}

