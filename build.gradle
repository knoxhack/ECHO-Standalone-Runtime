                        version    : launcherVersion,
                        ready      : artifacts.find { it.artifactId == 'launcher-exe' }.exists
                                && artifacts.find { it.artifactId == 'launcher-asar' }.exists
                ],
                runtimeImage  : [
                        path       : imageDir.absolutePath.replace('\\', '/'),
                        executable : exe.name,
                        config     : 'app/EchoStandaloneRuntime.cfg',
                        mainClass  : 'dev.echo.standalone.runtime.client.EchoClientMain',
                        moduleJars : standaloneJarCount,
                        ready      : exe.isFile() && cfg.isFile()
                ],
                portableZip   : [
                        path  : portableZip.absolutePath.replace('\\', '/'),
                        bytes : portableZip.isFile() ? portableZip.length() : 0L,
