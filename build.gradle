                        'reports/echo/standalone/openlands-full-route-contract.json',
                        'reports/echo/standalone/player-runtime-authority.json'
                ]
        ])
    }
}

tasks.register('runStandalonePublicReleaseExternalEvidenceHandoff') {
    group = 'verification'
    description = 'Writes a machine-readable handoff manifest for the external signing, VM install, and human playtest release evidence runs.'
    dependsOn tasks.named('runStandalonePublicReleaseGateAudit')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath]
            }
            try {
                def parsed = new groovy.json.JsonSlurper().parse(reportFile)
                parsed.path = relativePath
                return parsed
            } catch (Exception ignored) {
                return [status: 'INVALID_JSON', path: relativePath]
            }
        }
        def text = { Object value -> String.valueOf(value ?: '').trim() }
        def commandLine = { List<String> args ->
            args.collect { value ->
                def stringValue = String.valueOf(value)
                (stringValue.contains(' ') || stringValue.contains('<') || stringValue.contains('>'))
                        ? "\"${stringValue.replace('"', '\\"')}\""
                        : stringValue
            }.join(' ')
        }

        def launcherRoot = echoStandaloneResolveLauncherRoot()
        def launcherPackage = echoStandaloneReadJsonFile(new File(launcherRoot, 'package.json'))
        def setupExe = echoStandaloneLauncherSetupExe(launcherRoot, launcherPackage)
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def runtimeExe = new File(buildDir, 'jpackage-opengl-client/EchoStandaloneRuntime/EchoStandaloneRuntime.exe')
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def signingHelper = file('scripts/sign-release-artifacts.ps1')
        def cleanInstallHelper = file('scripts/capture-clean-install-uninstall-evidence.ps1')
        def manualWallclockHelper = file('scripts/capture-manual-wallclock-playtest.ps1')
        def audioHardwareHelper = file('scripts/capture-audio-hardware-evidence.ps1')

        def publicGate = readReport('reports/echo/standalone/public-release-gate.json')
        def signingEvidence = readReport('reports/echo/standalone/release-signing-evidence.json')
        def signingAudit = readReport('reports/echo/standalone/distribution-signing-setup.json')
        def installEvidence = readReport('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        def installTemplate = readReport('reports/echo/standalone/distribution-install-uninstall-evidence-template.json')
        def manualEvidence = readReport('reports/echo/standalone/manual-playtest-report.json')
        def manualCapture = readReport('reports/echo/standalone/manual-wallclock-capture-rehearsal.json')
        def audioHardware = readReport('reports/echo/standalone/audio-hardware-verification.json')

        def runtimeExeSha256 = runtimeExe.isFile() ? echoStandaloneSha256(runtimeExe) : ''
        def launcherExeSha256 = launcherExe.isFile() ? echoStandaloneSha256(launcherExe) : ''
        def setupExeSha256 = setupExe.isFile() ? echoStandaloneSha256(setupExe) : ''
        def portableZipSha256 = portableZip.isFile() ? echoStandaloneSha256(portableZip) : ''
        def signingHelperSha256 = signingHelper.isFile() ? echoStandaloneSha256(signingHelper) : ''
        def cleanInstallHelperSha256 = cleanInstallHelper.isFile() ? echoStandaloneSha256(cleanInstallHelper) : ''
        def manualHelperSha256 = manualWallclockHelper.isFile() ? echoStandaloneSha256(manualWallclockHelper) : ''
        def audioHardwareHelperSha256 = audioHardwareHelper.isFile() ? echoStandaloneSha256(audioHardwareHelper) : ''

        def signingCommand = [
                'powershell',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                signingHelper.path.replace('\\', '/'),
                '-RuntimeExePath',
                runtimeExe.absolutePath.replace('\\', '/'),
                '-LauncherExePath',
                launcherExe.absolutePath.replace('\\', '/'),
                '-LauncherSetupExePath',
                setupExe.absolutePath.replace('\\', '/'),
                '-OutputPath',
                'reports/echo/standalone/release-signing-evidence.json',
                '-CertificateThumbprint',
                '<release-certificate-thumbprint>',
                '-PublisherName',
                '<publisher-name>',
                '-TimestampServer',
                'http://timestamp.digicert.com',
                '-ExpectedRuntimeExeSha256',
                runtimeExeSha256,
                '-ExpectedLauncherExeSha256',
                launcherExeSha256,
                '-ExpectedLauncherSetupExeSha256',
                setupExeSha256,
                '-SigningOperator',
                '<operator name>',
                '-SigningRunEvidence',
                '<signing machine or ticket/run id>',
                '-Sign'
        ]
        def cleanInstallCommand = [
                'powershell',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                cleanInstallHelper.path.replace('\\', '/'),
                '-SetupArtifactPath',
                setupExe.absolutePath.replace('\\', '/'),
                '-ExpectedSetupSha256',
                setupExeSha256,
                '-ExpectedLauncherExeSha256',
                launcherExeSha256,
                '-CaptureScriptSha256',
                cleanInstallHelperSha256,
                '-DisposableEnvironmentEvidence',
                '<VM snapshot, disposable user/profile, or CI VM run id>',
                '-FreshProfileOrVmSnapshotEvidence',
                '<fresh snapshot/profile proof>',
                '-PreInstallCleanStateEvidence',
                '<no existing ECHO install/process proof>',
                '-PostUninstallCleanStateEvidence',
                '<post-uninstall cleanup proof>',
                '-OutputPath',
                'reports/echo/standalone/manual-install-uninstall-evidence.json'
        ]
        def manualCommands = ['packaged-opengl-30m', 'packaged-opengl-60m'].collect { sessionId ->
            def command = [
                    'powershell',
                    '-ExecutionPolicy',
                    'Bypass',
                    '-File',
                    manualWallclockHelper.path.replace('\\', '/'),
                    '-SessionId',
                    sessionId,
                    '-PackagedExePath',
                    runtimeExe.absolutePath.replace('\\', '/'),
                    '-PortableZipPath',
                    portableZip.absolutePath.replace('\\', '/'),
                    '-ExpectedPackagedExeSha256',
                    runtimeExeSha256,
                    '-ExpectedPortableZipSha256',
                    portableZipSha256,
                    '-CaptureScriptSha256',
                    manualHelperSha256,
                    '-HumanTesterAttestation',
                    '<attest active human play for the full session>',
                    '-InteractionCoverageNote',
                    '<inventory, terminal, pause/resume, and alt-tab coverage>',
                    '-SaveLoadCheckpointNote',
                    '<save/quit/continue result>',
                    '-CrashFreeExitNote',
                    '<crash-free exit or softlock result>'
            ]
            [
                    sessionId     : sessionId,
                    command       : command,
                    commandLine   : commandLine(command),
                    outputReport  : 'reports/echo/standalone/manual-playtest-report.json'
            ]
        }
        def audioHardwareCommand = [
                'powershell',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                audioHardwareHelper.path.replace('\\', '/'),
                '-OutputPath',
                'reports/echo/standalone/audio-hardware-verification.json',
                '-ExpectedCaptureScriptSha256',
                audioHardwareHelperSha256,
                '-OutputDeviceLabel',
                '<physical speaker/headset device label>',
                '-WindowsAudioEndpointEvidence',
                '<Windows sound output device screenshot/settings path/run id>',
                '-PlaybackAppVersionEvidence',
                '<packaged EXE version/hash or tester build id>',
                '-HardwareTesterAttestation',
                '<attest music, UI, SFX, ambience, volume/mute, and diagnostics were checked on real hardware>',
                '-MusicCueNote',
                '<main-menu or survival music cue heard>',
                '-UiCueNote',
                '<button/menu UI cue heard>',
                '-SfxCueNote',
                '<pickup/footstep/world action SFX heard>',
                '-AmbienceCueNote',
                '<weather/biome ambience cue heard>',
                '-VolumeMuteNote',
                '<volume slider and mute behavior result>',
                '-FallbackDiagnosticsNote',
                '<Diagnostics/support bundle backend/device/fallback row result>',
                '-HeardMusic',
                '-HeardUi',
                '-HeardSfx',
                '-HeardAmbience',
                '-VolumeMuteChecked',
                '-AudioDeviceMatchedDiagnostics',
                '-SupportBundleAudioDiagnosticsCaptured',
                '-NoCrackleDropout',
                '-NoIssues'
        ]

        def supportReady = signingHelper.isFile()
                && cleanInstallHelper.isFile()
                && manualWallclockHelper.isFile()
                && audioHardwareHelper.isFile()
                && runtimeExe.isFile()
                && launcherExe.isFile()
                && setupExe.isFile()
                && portableZip.isFile()
                && signingEvidence.expectedUnsignedHashesConfigured == true
                && signingEvidence.expectedUnsignedHashesMatched == true
                && installEvidence.status in ['PENDING_MANUAL_OR_VM_RUN', 'PASS']
                && text(installTemplate.schema) == 'echo.standalone.manual_install_uninstall_evidence.v1'
                && audioHardware.status in ['PENDING_HARDWARE_AUDIO_RUN', 'PASS']
                && manualCapture.status == 'PASS'
                && (manualCapture.requiredCaptureFieldCount instanceof Number
                        ? manualCapture.requiredCaptureFieldCount.intValue() >= 16
                        : text(manualCapture.requiredCaptureFieldCount).isInteger()
                            && text(manualCapture.requiredCaptureFieldCount).toInteger() >= 16)

        def report = file('reports/echo/standalone/public-release-external-evidence-handoff.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.public_release_external_evidence_handoff.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePublicReleaseExternalEvidenceHandoff',
                status                    : supportReady ? 'READY_FOR_EXTERNAL_CAPTURE' : 'BLOCKED_SUPPORT_INPUTS',
                summary                   : supportReady
                        ? 'External release evidence handoff is ready; public release remains blocked until the listed signing, disposable install/uninstall, hardware audio, and human playtest evidence is captured.'
                        : 'External release evidence handoff is missing one or more local helper, artifact, or protocol inputs.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesExternalEvidence  : false,
                publicReleaseReady        : publicGate.publicReleaseReady == true,
                publicReleaseGate         : [
                        path        : 'reports/echo/standalone/public-release-gate.json',
                        status      : publicGate.status ?: 'UNKNOWN',
                        blockerCount: publicGate.blockerCount ?: 0,
                        blockers    : publicGate.blockers ?: []
                ],
                externalEvidenceComplete  : false,
                requiredExternalEvidence  : [
                        'attested release signing run on the signing machine',
                        'clean install/uninstall run in a disposable Windows profile or VM',
                        'real speaker/headset audio hardware verification run',
                        '30-minute human packaged OpenGL wall-clock session',
                        '60-minute human packaged OpenGL wall-clock session'
                ],
                artifacts                 : [
                        runtimeExe: [
                                path  : runtimeExe.absolutePath.replace('\\', '/'),
                                exists: runtimeExe.isFile(),
                                sha256: runtimeExeSha256
                        ],
                        launcherExe: [
                                path  : launcherExe.absolutePath.replace('\\', '/'),
                                exists: launcherExe.isFile(),
                                sha256: launcherExeSha256
                        ],
                        launcherSetupExe: [
                                path  : setupExe.absolutePath.replace('\\', '/'),
                                exists: setupExe.isFile(),
                                sha256: setupExeSha256
                        ],
                        portableZip: [
                                path  : portableZip.absolutePath.replace('\\', '/'),
                                exists: portableZip.isFile(),
                                sha256: portableZipSha256
                        ]
                ],
                helpers                   : [
                        signing: [
                                path  : signingHelper.path.replace('\\', '/'),
                                exists: signingHelper.isFile(),
                                sha256: signingHelperSha256
                        ],
                        cleanInstall: [
                                path  : cleanInstallHelper.path.replace('\\', '/'),
                                exists: cleanInstallHelper.isFile(),
                                sha256: cleanInstallHelperSha256
                        ],
                        manualWallclock: [
                                path  : manualWallclockHelper.path.replace('\\', '/'),
                                exists: manualWallclockHelper.isFile(),
                                sha256: manualHelperSha256
                        ],
                        audioHardware: [
                                path  : audioHardwareHelper.path.replace('\\', '/'),
                                exists: audioHardwareHelper.isFile(),
                                sha256: audioHardwareHelperSha256
                        ]
                ],
                signing                  : [
                        evidenceReport        : 'reports/echo/standalone/release-signing-evidence.json',
                        currentEvidenceStatus : signingEvidence.status ?: 'UNKNOWN',
                        setupAuditReport      : 'reports/echo/standalone/distribution-signing-setup.json',
                        setupAuditStatus      : signingAudit.status ?: 'UNKNOWN',
                        expectedUnsignedHashesConfigured: signingEvidence.expectedUnsignedHashesConfigured == true,
                        expectedUnsignedHashesMatched   : signingEvidence.expectedUnsignedHashesMatched == true,
                        signingEvidenceReady  : signingAudit.releaseSigningEvidence?.ready == true,
                        command               : signingCommand,
                        commandLine           : commandLine(signingCommand),
                        requiredFields        : [
                                'CertificateThumbprint or CertificateSubject',
                                'PublisherName matching release identity',
                                'ExpectedRuntimeExeSha256',
                                'ExpectedLauncherExeSha256',
                                'ExpectedLauncherSetupExeSha256',
                                'SigningOperator',
                                'SigningRunEvidence',
                                'TimestampServer'
                        ]
                ],
                cleanInstallUninstall    : [
                        evidenceReport        : 'reports/echo/standalone/manual-install-uninstall-evidence.json',
                        auditReport           : 'reports/echo/standalone/distribution-install-uninstall-evidence.json',
