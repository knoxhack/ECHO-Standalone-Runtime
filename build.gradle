                        ? 'Survival/player loop evidence passed for health, hunger, damage sources, armor, status effects, difficulty, death/respawn, XP, inventory retention/loss, save/reload, combat, projectile, tool durability, offhand, armor, cursor stack, AdapterCore coverage, and support-bundle inclusion.'
                        : 'Survival/player loop mechanics evidence remains blocked by missing or failed vitals, save, combat, inventory, progression, module, or bundle rows.',
