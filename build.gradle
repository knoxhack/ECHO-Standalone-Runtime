  }
  $length = [EchoStandaloneWindowProbe]::GetWindowTextLength($hWnd)
  $builder = New-Object System.Text.StringBuilder ([Math]::Max($length + 1, 1))
  [void][EchoStandaloneWindowProbe]::GetWindowText($hWnd, $builder, $builder.Capacity)
  $title = $builder.ToString()
  if ($title.Length -gt 0) {
    $script:windows += [pscustomobject]@{
      pid = [int]$windowPid
      title = $title
    }
  }
  return $true
}
[void][EchoStandaloneWindowProbe]::EnumWindows($callback, [IntPtr]::Zero)

$workingSet = 0L
foreach ($p in $live) {
  $workingSet += [long]$p.WorkingSet64
}

[pscustomobject]@{
  pids = @($ids)
  processCount = @($live).Count
  pidAlive = (@($live).Count -gt 0)
  visible = (@($windows).Count -gt 0)
  windowTitle = if (@($windows).Count -gt 0) { $windows[0].title } else { "" }
  workingSetBytes = $workingSet
} | ConvertTo-Json -Compress
'''.replace('__ROOT_PID__', Long.toString(rootPid))
    def encodedScript = java.util.Base64.encoder.encodeToString(script.getBytes('UTF-16LE'))
    def process = new ProcessBuilder('powershell', '-NoProfile', '-NonInteractive', '-OutputFormat', 'Text', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', encodedScript)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8').trim()
    def exitCode = process.waitFor()
    def jsonOutput = output.readLines().reverse().find { it.trim().startsWith('{') && it.trim().endsWith('}') }
    if (exitCode != 0 || jsonOutput == null) {
        return [
                pids           : [rootPid],
                processCount   : 0,
                pidAlive       : false,
                visible        : false,
                windowTitle    : '',
                workingSetBytes: 0L,
                probeError     : output
        ]
    }
    try {
        new groovy.json.JsonSlurper().parseText(jsonOutput.trim())
    } catch (Exception ignored) {
        [
                pids           : [rootPid],
                processCount   : 0,
                pidAlive       : false,
                visible        : false,
                windowTitle    : '',
                workingSetBytes: 0L,
                probeError     : output
        ]
    }
}

def echoStandaloneZipEntryCount = { File file ->
    if (!file.isFile()) {
        return 0
    }
    def zip = new java.util.zip.ZipFile(file)
    try {
        return zip.size()
    } finally {
        zip.close()
    }
}

def echoStandaloneDeterministicZip = { File sourceDir, File zipFile ->
    if (!sourceDir.isDirectory()) {
        throw new GradleException("Cannot create portable zip; missing directory: ${sourceDir}")
    }
    if (zipFile.exists() && !zipFile.delete()) {
        throw new GradleException("Cannot replace portable zip: ${zipFile}")
    }
    zipFile.parentFile.mkdirs()
    def sourceRoot = sourceDir.toPath()
    def files = []
    sourceDir.eachFileRecurse { file ->
        if (file.isFile()) {
            files.add(file)
        }
    }
    files.sort { left, right ->
        sourceRoot.relativize(left.toPath()).toString().replace('\\', '/') <=>
                sourceRoot.relativize(right.toPath()).toString().replace('\\', '/')
    }
    zipFile.withOutputStream { output ->
        def zip = new java.util.zip.ZipOutputStream(new java.io.BufferedOutputStream(output))
        zip.setLevel(java.util.zip.Deflater.BEST_COMPRESSION)
        try {
            files.each { file ->
                def relativePath = sourceRoot.relativize(file.toPath()).toString().replace('\\', '/')
                def entry = new java.util.zip.ZipEntry(relativePath)
                entry.setTime(315532800000L)
                zip.putNextEntry(entry)
                file.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                        zip.write(buffer, 0, read)
                    }
                }
                zip.closeEntry()
            }
        } finally {
            zip.close()
        }
    }
}

def echoStandaloneArtifact = { String artifactId, String kind, File file, boolean required ->
    def exists = file.isFile()
    [
            artifactId: artifactId,
            kind      : kind,
            path      : file.absolutePath.replace('\\', '/'),
            bytes     : exists ? file.length() : 0L,
            sha256    : exists ? echoStandaloneSha256(file) : '',
            required  : required,
            exists    : exists
    ]
}

def echoStandaloneAuthenticode = { String artifactId, File file ->
    if (!file.isFile()) {
        return [
                artifactId: artifactId,
                path      : file.absolutePath.replace('\\', '/'),
                exists    : false,
                status    : 'MISSING',
                signed    : false,
                signerSubject: '',
                signerIssuer : '',
                signerThumbprint: '',
                timestampSubject: '',
                rawStatusMessage: ''
        ]
    }
    def script = """
\$signature = Get-AuthenticodeSignature -LiteralPath '${file.absolutePath.replace("'", "''")}'
[pscustomobject]@{
  status = [string]\$signature.Status
  statusMessage = [string]\$signature.StatusMessage
  signerSubject = if (\$signature.SignerCertificate) { [string]\$signature.SignerCertificate.Subject } else { "" }
  signerIssuer = if (\$signature.SignerCertificate) { [string]\$signature.SignerCertificate.Issuer } else { "" }
  signerThumbprint = if (\$signature.SignerCertificate) { [string]\$signature.SignerCertificate.Thumbprint } else { "" }
  timestampSubject = if (\$signature.TimeStamperCertificate) { [string]\$signature.TimeStamperCertificate.Subject } else { "" }
} | ConvertTo-Json -Compress
"""
    def encodedScript = java.util.Base64.encoder.encodeToString(script.getBytes('UTF-16LE'))
    def process = new ProcessBuilder('powershell', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', encodedScript)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8').trim()
    def exitCode = process.waitFor()
    def parsed = null
    def jsonOutput = output.readLines().reverse().find { it.trim().startsWith('{') && it.trim().endsWith('}') }
    if (exitCode == 0 && jsonOutput != null) {
        try {
            parsed = new groovy.json.JsonSlurper().parseText(jsonOutput.trim())
        } catch (Exception ignored) {
            parsed = null
        }
    }
    def status = parsed?.status ?: 'PROBE_FAILED'
    [
            artifactId       : artifactId,
            path             : file.absolutePath.replace('\\', '/'),
            exists           : true,
            status           : status,
            signed           : status == 'Valid',
            signerSubject    : parsed?.signerSubject ?: '',
            signerIssuer     : parsed?.signerIssuer ?: '',
            signerThumbprint : parsed?.signerThumbprint ?: '',
            timestampSubject : parsed?.timestampSubject ?: '',
            rawStatusMessage : parsed?.statusMessage ?: output
    ]
}

