                        lootTables   : ['echoagent4:blocks/test_block'],
                        searchVisible: true
                ]],
                entities      : [[
                        id     : 'echoagent4:test_entity',
                        addon  : 'echoagent4',
                        model  : 'echoagent4:models/entity/test_entity',
                        texture: 'echoagent4:textures/entity/test_entity',
                        lang   : 'Agent 4 Test Entity',
                        langKey: 'entity.echoagent4.test_entity'
                ]],
                recipes       : [[
                        id     : 'echoagent4:test_recipe',
                        addon  : 'echoagent4',
                        type   : 'minecraft:crafting_shaped',
