                || layers.ui != 4
                || layers.diagnostic != 1
                || layers.statsClearCommands != 1
                || layers.statsTileCommands != 16
                || layers.statsSpriteCommands != 2
                || layers.statsParticleCommands != 5
                || layers.statsUiCommands != 4
                || layers.statsDebugCommands != 1
                || layers.softwarePasses != ['CLEAR', 'TILES', 'SPRITES', 'UI', 'LIGHTING', 'PARTICLES', 'DEBUG_OVERLAY']
                || layers.passOrderMatches != true) {
