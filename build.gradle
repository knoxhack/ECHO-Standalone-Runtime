                        && number(gameplayHazards.exposureDelta) > 0
                        && number(gameplayHazards.healthDamage) > 0
                        && number(gameplayHazards.playerHealthAfterHazard) < 100
                        && number(gameplayHazards.ashExposureAfterHazard).compareTo(number(gameplayHazards.exposureDelta)) == 0,
                [
                        entityId                : gameplayHazards.entityId,
                        hazardIntensity         : gameplayHazards.hazardIntensity,
