                || runtimeGameplay.survivalBound != true
                || runtimeGameplay.progressionBound != true
                || runtimeGameplay.factionRuntimeBound != true
                || runtimeGameplay.notificationLogBound != true
                || runtimeGameplay.missionId != 'ashfall:secure_crash_site'
                || runtimeGameplay.missionStatus != 'COMPLETED'
                || runtimeGameplay.objectiveCount != 3
                || runtimeGameplay.completedObjectiveCount != 3
                || runtimeGameplay.progressPercent != 100
                || runtimeGameplay.progressionLevel != 2
                || runtimeGameplay.notificationCount != 7
                || runtimeGameplay.playerHealth != 96
                || runtimeGameplay.saveHealthy != true) {
            throw new GradleException('Phase 14.12 runtime gameplay report did not prove service-bound completed gameplay loop')
        }
        def missions = json.parse(file('reports/echo/standalone/gameplay-missions.json'))
        if (missions.schema != 'echo.standalone.gameplay_missions.v2'
                || missions.missionCount != 1
                || missions.missionId != 'ashfall:secure_crash_site'
                || missions.missionStatus != 'COMPLETED'
                || missions.objectiveCount != 3
                || missions.completedObjectiveCount != 3
                || missions.progressPercent != 100
                || missions.missionCompleted != true
                || missions.completionMilestone != 'mission_secure_crash_site') {
            throw new GradleException('Phase 14.12 gameplay mission report did not prove completed secure-crash-site mission')
        }
        def objectives = json.parse(file('reports/echo/standalone/gameplay-objectives.json'))
        if (objectives.schema != 'echo.standalone.gameplay_objectives.v2'
                || objectives.objectiveCount != 3
                || objectives.completedObjectiveCount != 3
                || objectives.hydrateCompleted != true
                || objectives.terminalCompleted != true
                || objectives.salvageCompleted != true
                || !objectives.objectives.every { it.status == 'COMPLETED' && it.completed == true && it.progress == it.targetProgress }) {
            throw new GradleException('Phase 14.12 gameplay objective report did not prove all route objectives completed')
        }
        def progression = json.parse(file('reports/echo/standalone/gameplay-progression.json'))
        if (progression.schema != 'echo.standalone.gameplay_progression.v2'
                || progression.experience != 70
                || progression.level != 2
                || !progression.milestones.contains('mission_secure_crash_site')
                || progression.missionMilestoneRecorded != true
                || progression.deterministicLevelUp != true) {
            throw new GradleException('Phase 14.12 gameplay progression report did not prove deterministic XP, level, and milestone')
        }
        def hazards = json.parse(file('reports/echo/standalone/gameplay-hazards.json'))
        if (hazards.schema != 'echo.standalone.gameplay_hazards.v2'
                || hazards.entityId != 'player-001'
                || hazards.hazardIntensity != 0.72
                || hazards.exposureDelta != 7.2
                || hazards.healthDamage != 4
                || hazards.playerHealthAfterHazard != 96
                || hazards.ashExposureAfterHazard != 7.2
                || hazards.toxicAshApplied != true) {
            throw new GradleException('Phase 14.12 gameplay hazard report did not prove toxic ash damage and exposure')
        }
        def weather = json.parse(file('reports/echo/standalone/gameplay-weather.json'))
        if (weather.schema != 'echo.standalone.gameplay_weather.v2'
                || weather.profileId != 'ashfall:ash_storm'
                || weather.ashDensity != 0.67
                || weather.heatStressDelta != 2.86
                || weather.visibility != 42.0
                || weather.heatStressAfterWeather != 2.86
                || weather.ashStormApplied != true) {
            throw new GradleException('Phase 14.12 gameplay weather report did not prove ash-storm survival pressure')
        }
        def survival = json.parse(file('reports/echo/standalone/gameplay-survival.json'))
        if (survival.schema != 'echo.standalone.gameplay_survival.v2'
                || survival.playerId != 'player-001'
                || survival.hydration != 70.0
                || survival.ashExposure != 7.2
                || survival.heatStress != 2.86
                || survival.waterRemainingAfterDrink != 1
                || survival.waterRemainingFinal != 2
                || survival.hazardAndWeatherApplied != true
                || survival.waterInteractionRaisedHydration != true) {
            throw new GradleException('Phase 14.12 gameplay survival report did not prove hydration, exposure, and heat state')
        }
        def factions = json.parse(file('reports/echo/standalone/gameplay-factions.json'))
        if (factions.schema != 'echo.standalone.gameplay_factions.v2'
                || factions.factionCount != 2
                || factions.survivorReputation != 15
                || factions.scavengerReputation != -30
                || factions.scavengerHostile != true
                || factions.cacheSalvageAdjustedReputation != true
                || !factions.factions.any { it.factionId == 'ashfall:crash_survivors' && it.reputation == 15 && it.hostile == false }
                || !factions.factions.any { it.factionId == 'ashfall:wasteland_scavengers' && it.reputation == -30 && it.hostile == true }) {
            throw new GradleException('Phase 14.12 gameplay faction report did not prove cache-salvage reputation changes')
        }
        def interactions = json.parse(file('reports/echo/standalone/gameplay-interactions.json'))
        if (interactions.schema != 'echo.standalone.gameplay_interactions.v2'
                || interactions.water.success != true
                || interactions.water.objectiveCompleted != true
                || interactions.terminal.success != true
                || interactions.terminal.objectiveCompleted != true
                || interactions.moveToCache.moved != true
                || interactions.moveToCache.to.key != '2,0,1'
                || interactions.cache.success != true
                || interactions.cache.objectiveCompleted != true
                || interactions.allInteractionsSucceeded != true
                || interactions.waterRemainingAfterDrink != 1
                || interactions.waterRemainingFinal != 2) {
            throw new GradleException('Phase 14.12 gameplay interaction report did not prove water, terminal, movement, and cache route')
        }
        def notifications = json.parse(file('reports/echo/standalone/gameplay-notifications.json'))
        if (notifications.schema != 'echo.standalone.gameplay_notifications.v2'
                || notifications.notificationCount != 7
                || notifications.deterministicOrder != true
                || notifications.firstNotification != 'Crash-site mission started.'
                || notifications.lastNotification != 'Crash site secured.'
                || !notifications.notifications.any { it.notificationId == 'notification-007' && it.message == 'Crash site secured.' }) {
            throw new GradleException('Phase 14.12 gameplay notification report did not prove deterministic notification log')
        }
        def saveHooks = json.parse(file('reports/echo/standalone/gameplay-save-hooks.json'))
        if (saveHooks.schema != 'echo.standalone.gameplay_save_hooks.v2'
                || saveHooks.filesWritten != 6
                || saveHooks.manifestTrackedSummary != true
                || saveHooks.manifestTrackedMission != true
                || saveHooks.manifestTrackedSurvival != true
                || saveHooks.manifestTrackedProgression != true
                || saveHooks.manifestTrackedFactions != true
                || saveHooks.manifestTrackedNotifications != true
                || saveHooks.corruptionHealthy != true
                || !saveHooks.writtenPaths.contains('gameplay/notifications.json')) {
            throw new GradleException('Phase 14.12 gameplay save-hook report did not prove manifest and corruption coverage')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-data/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-world/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-entity/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-item/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-gameplay/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone gameplay runtime source ${sourceFile}")
            }
        }
    }
}

