tasks.register('verifyStandaloneRendererUpgradeRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 15.5 software renderer backend upgrade artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneRendererUpgradeSmoke')

    doLast {
        def requiredReports = [
                'reports/echo/standalone/runtime-renderer-upgrade.json',
                'reports/echo/standalone/renderer-upgrade-backend.json',
                'reports/echo/standalone/renderer-upgrade-framebuffer.json',
                'reports/echo/standalone/renderer-upgrade-pipeline.json',
                'reports/echo/standalone/renderer-upgrade-lighting.json',
                'reports/echo/standalone/renderer-upgrade-debug-overlays.json',
        ]
        ([
                'docs/echo/standalone/ECHO_STANDALONE_RENDERER_UPGRADE.md',
        ] + requiredReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 15.5 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        requiredReports.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 15.5 renderer upgrade report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 15.5 renderer upgrade report did not pass: ${requiredPath} status=${report.status}")
            }
        }
        def runtimeUpgrade = json.parse(file('reports/echo/standalone/runtime-renderer-upgrade.json'))
        if (runtimeUpgrade.schema != 'echo.standalone.runtime_renderer_upgrade.v2'
                || runtimeUpgrade.defaultBackendId != 'echo:software_renderer'
                || runtimeUpgrade.softwareBackendDefault != true
                || runtimeUpgrade.recordingBackendPreserved != true
                || runtimeUpgrade.recordingBackendId != 'echo:recording_renderer'
                || runtimeUpgrade.sceneId != 'ashfall-debug-scene'
                || runtimeUpgrade.frameCount != 1
                || runtimeUpgrade.recordingFrameCount != 1
                || runtimeUpgrade.commandCount != 29
                || runtimeUpgrade.submittedCommandCount != 29
                || runtimeUpgrade.framebufferWidth != 1280
                || runtimeUpgrade.framebufferHeight != 720
                || runtimeUpgrade.nonBackgroundPixels <= 0
                || runtimeUpgrade.checksum == '0'
                || runtimeUpgrade.headlessSafe != true) {
            throw new GradleException('Phase 15.5 renderer upgrade report did not prove software backend default, framebuffer output, and recording compatibility')
        }
        def backend = json.parse(file('reports/echo/standalone/renderer-upgrade-backend.json'))
        if (backend.schema != 'echo.standalone.renderer_upgrade_backend.v2'
                || backend.backendId != 'echo:software_renderer'
                || backend.implementsBackendContract != true
                || backend.softwareBackend != true
                || backend.recordingBackendId != 'echo:recording_renderer'
                || backend.recordingBackendAvailable != true
                || backend.logicalWindowOpen != true
                || backend.headlessMode != true
                || backend.framesRetained != 1
                || backend.framebufferRetained != true
                || backend.displayFree != true
                || backend.gpuContextFree != true
                || backend.nativeWindowFree != true
                || backend.jfxFree != true) {
            throw new GradleException('Phase 15.5 renderer backend report did not prove headless software adapter and device-free boundary')
        }
        def framebuffer = json.parse(file('reports/echo/standalone/renderer-upgrade-framebuffer.json'))
        if (framebuffer.schema != 'echo.standalone.renderer_upgrade_framebuffer.v2'
                || framebuffer.width != 1280
                || framebuffer.height != 720
                || framebuffer.pixelCount != 1280 * 720
                || framebuffer.argbLength != 1280 * 720
                || framebuffer.nonBackgroundPixels <= 0
                || framebuffer.checksum == '0'
                || framebuffer.checksumNonZero != true
                || framebuffer.playerSampleDiffersFromBackground != true
                || framebuffer.blockedTileSampleDiffersFromBackground != true
                || framebuffer.uiSampleDiffersFromBackground != true) {
            throw new GradleException('Phase 15.5 renderer framebuffer report did not prove deterministic ARGB output and sample coverage')
        }
        def pipeline = json.parse(file('reports/echo/standalone/renderer-upgrade-pipeline.json'))
        if (pipeline.schema != 'echo.standalone.renderer_upgrade_pipeline.v2'
                || pipeline.passes != ['CLEAR', 'TILES', 'SPRITES', 'UI', 'LIGHTING', 'PARTICLES', 'DEBUG_OVERLAY']
                || pipeline.passOrderMatches != true
                || pipeline.clearCommands != 1
                || pipeline.tileCommands != 16
                || pipeline.spriteCommands != 2
                || pipeline.uiCommands != 4
                || pipeline.lightingPassPresent != true
                || pipeline.particleCommands != 5
                || pipeline.debugCommands != 1
                || pipeline.sceneCommandCount != 29
                || pipeline.submittedCommandCount != 29) {
            throw new GradleException('Phase 15.5 renderer pipeline report did not prove software pass order and command counts')
        }
        def lighting = json.parse(file('reports/echo/standalone/renderer-upgrade-lighting.json'))
        if (lighting.schema != 'echo.standalone.renderer_upgrade_lighting.v2'
                || lighting.lightingPassPresent != true
                || lighting.litPixels != 1280 * 720
                || lighting.expectedPixels != 1280 * 720
                || lighting.litFullFramebuffer != true
                || lighting.nonBackgroundPixels <= 0
                || lighting.checksum == '0'
                || lighting.checksumNonZero != true) {
            throw new GradleException('Phase 15.5 renderer lighting report did not prove full-frame lighting and checksum output')
        }
        def overlays = json.parse(file('reports/echo/standalone/renderer-upgrade-debug-overlays.json'))
        if (overlays.schema != 'echo.standalone.renderer_upgrade_debug_overlays.v2'
                || overlays.diagnosticCommandCount != 1
                || overlays.debugCommands != 1
                || overlays.debugOverlayPassPresent != true
                || overlays.missionOverlayRepresented != true
                || overlays.frameDiagnosticCount != 2
                || overlays.containsPixelDiagnostic != true
                || overlays.containsPassDiagnostic != true
                || !overlays.frameDiagnostics.any { it.message.contains('software pixels=') }
                || !overlays.frameDiagnostics.any { it.message == 'software passes=7' }) {
            throw new GradleException('Phase 15.5 renderer debug overlay report did not prove diagnostic overlay and frame diagnostics')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'java.awt',
                'javafx',
                'glfw',
        ]
        def checkedSources = fileTree('echo-runtime-render/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/EchoWindowedRuntimeApplication.java'
        } + fileTree('echo-runtime-testkit/src/main/java') {
            include '**/EchoRuntimeRenderSmokeHarness.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone renderer upgrade source ${sourceFile}")
            }
        }
    }
}

