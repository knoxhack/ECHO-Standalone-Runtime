            throw new GradleException('Phase 15.5 render particles report did not prove Ashfall particle rendering')
        }
        def uiBridge = json.parse(file('reports/echo/standalone/render-ui-bridge.json'))
        if (uiBridge.schema != 'echo.standalone.render_ui_bridge.v2'
                || uiBridge.uiCommandCount != 4
                || uiBridge.uiStatsCommands != 4
                || uiBridge.hudSurfaceRepresented != true
                || uiBridge.missionTextRepresented != true
                || uiBridge.uiPixelDiffersFromBackground != true
