                            : 'Evidence is pending, stale, or incomplete for beta hardening.'
            ]
        }
        def ready = blockers.isEmpty()
        def status = ready && warnings.isEmpty() ? 'READY' : (ready ? 'READY_WITH_WARNINGS' : 'BLOCKED')
        def reportDir = file('reports/echo/standalone')
        reportDir.mkdirs()
        def onlyHumanWarnings = !warnings.isEmpty() && warnings.every { it.category == 'human-playtest' }
        def summary = ready
