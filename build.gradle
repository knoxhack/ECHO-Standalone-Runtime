def echoStandaloneBuildOpenGlPackage = {
    def appName = 'EchoStandaloneRuntime'
    def installLibDir = project(':echo-runtime-client')
            .layout
            .buildDirectory
            .dir('install/echo-runtime-client/lib')
            .get()
            .asFile
    if (!installLibDir.isDirectory()) {
        throw new GradleException("Missing OpenGL client install lib directory: ${installLibDir}")
    }
    def mainJar = installLibDir.listFiles()
            .find { it.name.startsWith('echo-runtime-client-') && it.name.endsWith('.jar') }
    if (mainJar == null) {
        throw new GradleException("Missing echo-runtime-client jar in ${installLibDir}")
    }

    def jpackageCommand = { File destinationBase, File runtimeImage ->
        def command = [
                'jpackage',
                '--type', 'app-image',
                '--name', appName,
                '--app-version', '0.1.0',
                '--vendor', 'ECHO',
                '--input', installLibDir.absolutePath,
                '--main-jar', mainJar.name,
                '--main-class', 'dev.echo.standalone.runtime.client.EchoClientMain',
                '--dest', destinationBase.absolutePath,
                '--java-options', '--enable-native-access=ALL-UNNAMED',
                '--java-options', '-Dfile.encoding=UTF-8',
                '--win-console'
        ]
        if (runtimeImage != null) {
            command.addAll(['--runtime-image', runtimeImage.absolutePath])
        }
        command
    }
    def runJpackage = { File destinationBase, File runtimeImage ->
        def process = new ProcessBuilder(jpackageCommand(destinationBase, runtimeImage))
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("jpackage OpenGL client image failed (${exitCode}):\n${output}")
        }
    }

    def runtimeCacheBase = new File(buildDir, 'jpackage-opengl-runtime-cache')
    def runtimeCacheDir = new File(runtimeCacheBase, 'runtime')
    def runtimeCacheRelease = new File(runtimeCacheDir, 'release')
    if (!runtimeCacheRelease.isFile()) {
        def seedBase = new File(buildDir, 'jpackage-opengl-runtime-seed')
        delete seedBase
        seedBase.mkdirs()
        runJpackage(seedBase, null)
        def seedRuntime = new File(seedBase, "${appName}/runtime")
        if (!new File(seedRuntime, 'release').isFile()) {
            throw new GradleException("jpackage seed did not create bundled runtime: ${seedRuntime}")
        }
        delete runtimeCacheBase
        runtimeCacheBase.mkdirs()
        copy {
            from seedRuntime
            into runtimeCacheDir
        }
        delete seedBase
    }

    def imageBase = new File(buildDir, 'jpackage-opengl-client')
    def imageDir = new File(imageBase, appName)
    def distributionsDir = new File(buildDir, 'distributions')
    def portableZip = new File(distributionsDir, 'EchoStandaloneRuntime-portable-opengl-client.zip')
    delete imageBase
    delete portableZip
    imageBase.mkdirs()
    distributionsDir.mkdirs()

    runJpackage(imageBase, runtimeCacheDir)

    def exe = new File(imageDir, "${appName}.exe")
    def cfg = new File(imageDir, "app/${appName}.cfg")
    if (!exe.isFile()) {
        throw new GradleException("jpackage did not create ${exe}")
    }
    if (!cfg.isFile()) {
        throw new GradleException("jpackage did not create ${cfg}")
    }
    def cfgText = cfg.getText('UTF-8')
    if (!cfgText.contains('dev.echo.standalone.runtime.client.EchoClientMain')) {
        throw new GradleException("Packaged runtime config does not target EchoClientMain")
    }
    if (cfgText.contains('dev.echo.standalone.runtime.app.EchoRuntimeMain')) {
        throw new GradleException("Packaged runtime config still targets superseded EchoRuntimeMain")
    }

    echoStandaloneDeterministicZip(imageBase, portableZip)

    def report = file('reports/echo/standalone/packaged-opengl-client-image.json')
    report.parentFile.mkdirs()
    def portableZipSha256 = echoStandaloneSha256(portableZip)
    report.text = echoStandaloneJson([
            schema                    : 'echo.standalone.packaged_opengl_client_image.v1',
            generatedAt               : '1970-01-01T00:00:00Z',
            generator                 : 'refreshStandalonePackagedRuntimeImage',
            status                    : 'PASS',
            summary                   : 'Packaged runtime image targets the current LWJGL/OpenGL standalone client.',
            rendererTarget            : 'opengl',
            nativeModLoaderCommandUsed: false,
            applicationName           : appName,
            mainClass                 : 'dev.echo.standalone.runtime.client.EchoClientMain',
            supersededMainClassAbsent : true,
            imagePath                 : imageDir.absolutePath.replace('\\', '/'),
            executable                : exe.absolutePath.replace('\\', '/'),
            configPath                : cfg.absolutePath.replace('\\', '/'),
            portableZipPath           : portableZip.absolutePath.replace('\\', '/'),
            executableBytes           : exe.length(),
            portableZipBytes          : portableZip.length(),
            executableSha256          : echoStandaloneSha256(exe),
            portableZipSha256         : portableZipSha256
    ])
    echoStandaloneWriteDistributionReports(imageDir, portableZip, exe, cfg, portableZipSha256)
    [
            imageDir        : imageDir,
            executable      : exe,
            config          : cfg,
            runtimeCache    : runtimeCacheDir,
            portableZip     : portableZip,
            portableZipBytes: portableZip.length(),
            portableZipSha256: portableZipSha256,
            portableZipEntryCount: echoStandaloneZipEntryCount(portableZip)
    ]
}

