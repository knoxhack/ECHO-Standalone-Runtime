            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.6 UI report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 14.6 UI report did not pass: ${requiredPath} status=${report.status}")
            }
        }
        def runtimeUi = json.parse(file('reports/echo/standalone/runtime-ui.json'))
        if (runtimeUi.schema != 'echo.standalone.runtime_ui.v2'
                || runtimeUi.serviceBound != true
                || runtimeUi.screenStackBound != true
                || runtimeUi.modalStackBound != true
                || runtimeUi.inputRouterBound != true
                || runtimeUi.themeRuntimeBound != true
                || runtimeUi.activeScreen != 'terminal'
                || runtimeUi.screenStackSize != 1
                || runtimeUi.modalStackSize != 0
                || runtimeUi.activeTheme != 'ashfall-terminal'
                || runtimeUi.frameTheme != 'ashfall-terminal'
                || runtimeUi.terminalHistoryCount != 4
                || runtimeUi.terminalLineCount != 11) {
            throw new GradleException('Phase 14.6 runtime UI report did not prove service binding, final Terminal state, theme binding, and command output')
        }
        def screenStack = json.parse(file('reports/echo/standalone/ui-screen-stack.json'))
        if (screenStack.schema != 'echo.standalone.ui_screen_stack.v2'
                || screenStack.menuScreen.id != 'ashfall:main_menu'
                || screenStack.bootScreen.id != 'boot'
                || screenStack.restoredTerminalScreen.id != 'terminal'
                || screenStack.finalScreen.id != 'terminal'
                || screenStack.pushPopRestoredTerminal != true
                || screenStack.screenStackSize != 1) {
            throw new GradleException('Phase 14.6 UI screen stack report did not prove menu, boot push/pop, and Terminal restoration')
        }
        def menu = json.parse(file('reports/echo/standalone/ui-menus.json'))
        if (menu.schema != 'echo.standalone.ui_menus.v2'
                || menu.menuId != 'ashfall:main_menu'
                || menu.optionCount != 4
                || menu.enabledCount != 3
                || menu.selectedOption != 'new_run'
                || menu.renderedDisabledOption != true
                || menu.enabledActionRouted != true
                || menu.disabledOptionBlocked != true
                || !(menu.selectedMenu.effects ?: []).contains('menu-action:menu:new_run')
                || !(menu.disabledMenu.effects ?: []).contains('menu-option-disabled:locked_extraction')) {
            throw new GradleException('Phase 14.6 UI menus report did not prove rendered options, enabled routing, and disabled-option blocking')
        }
        def inputRouter = json.parse(file('reports/echo/standalone/ui-input-router.json'))
        if (inputRouter.schema != 'echo.standalone.ui_input_router.v2'
                || inputRouter.statusCommand.handled != true
                || inputRouter.themeCommand.handled != true
                || inputRouter.echoCommand.handled != true
                || inputRouter.runtimeCommand.handled != true
                || !(inputRouter.statusCommand.effects ?: []).contains('terminal-command:status')
                || !(inputRouter.themeCommand.effects ?: []).contains('terminal-command:theme')
                || !(inputRouter.echoCommand.effects ?: []).contains('terminal-command:echo')
                || !(inputRouter.runtimeCommand.effects ?: []).contains('terminal-command:ashfall_status')
                || !(inputRouter.modalConsumed.effects ?: []).contains('modal-consumed:confirm')
                || inputRouter.modalDismissed.closeTopModal != true
                || inputRouter.modalFrame.modals.size() != 1
                || inputRouter.modalConsumesScreenInput != true
                || inputRouter.dismissClosesTopModal != true) {
            throw new GradleException('Phase 14.6 UI input router report did not prove Terminal routing, modal consumption, and dismissal')
        }
        def theme = json.parse(file('reports/echo/standalone/ui-theme-runtime.json'))
        if (theme.schema != 'echo.standalone.ui_theme_runtime.v2'
                || theme.loadedFromMountedAsset != true
                || theme.themeId != 'ashfall-terminal'
                || theme.displayName != 'Ashfall Terminal'
                || theme.accentColor != '#67e8f9'
                || theme.promptToken != 'ASH>'
                || theme.tokens['terminal.prompt'] != 'ASH>'
                || theme.activeThemeMatchesFrame != true) {
            throw new GradleException('Phase 14.6 UI theme report did not prove mounted asset theme loading and active frame binding')
        }
        def terminal = json.parse(file('reports/echo/standalone/ui-terminal-shell.json'))
        if (terminal.schema != 'echo.standalone.ui_terminal_shell.v2'
                || terminal.prompt != 'ASH>'
                || terminal.historyCount != 4
                || !terminal.history.containsAll(['status', 'theme', 'echo survivor online', 'ashfall_status'])
                || terminal.outputLineCount != 11
                || terminal.statusHandled != true
                || terminal.themeHandled != true
                || terminal.echoHandled != true
                || terminal.runtimeCommandHandled != true
                || terminal.echoResponsePresent != true
                || terminal.runtimeCommandResponsePresent != true
                || terminal.blockedModalCommandHidden != true) {
            throw new GradleException('Phase 14.6 UI Terminal shell report did not prove command history, output, runtime command, and modal blocking')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone UI runtime source ${sourceFile}")
            }
        }
    }
}

