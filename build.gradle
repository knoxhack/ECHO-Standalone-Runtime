        def containsText = { Object value, String token -> String.valueOf(value ?: '').contains(token) }
        def taskEvidenceNames = [
                'runStandaloneClientEntitySpawnSmoke',
                'runStandaloneClientEntitySpawnEggSmoke',
                'runStandaloneClientEntityAiSmoke',
                'runStandaloneClientEntityInteractionSmoke',
                'runStandaloneClientEntityCombatSmoke',
                'runStandaloneClientEntitySaveSmoke',
                'runStandaloneClientEntityRenderSmoke',
                'runStandaloneClientDroppedItemSmoke',
                'runStandaloneClientDroppedItemPhysicsSmoke',
                'runStandaloneClientDroppedItemRenderSmoke'
        ]
        def taskEvidence = taskEvidenceNames.collectEntries { String taskName ->
            def task = tasks.named(taskName).get()
