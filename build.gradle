                'docs/echo/standalone/ECHO_STANDALONE_SAVE_RUNTIME.md',
        ] + requiredReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.7 artifact: ${requiredPath}")
            }
        }
        def json = new groovy.json.JsonSlurper()
