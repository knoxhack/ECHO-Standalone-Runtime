                ])

        def save = readReport('reports/echo/standalone/runtime-save.json')
        def worldSave = readReport('reports/echo/standalone/world-save-hooks.json')
        def entitySave = readReport('reports/echo/standalone/entity-save-hooks.json')
        def itemSave = readReport('reports/echo/standalone/item-save-hooks.json')
        requireCheck('persistence.transactions-manifest-recovery', 'persistence', save.path,
                bool(save.runtimeResultServiceBound)
                        && bool(save.recoveryJournalServiceBound)
                        && count(save.transactionCount) >= 2
                        && count(save.filesTracked) >= 2
                        && count(save.backupCount) >= 1
                        && count(save.migrationSteps) >= 1
                        && bool(save.corruptionDetected)
                        && bool(worldSave.manifestTracksSummary)
                        && bool(worldSave.manifestTracksChunk)
                        && bool(worldSave.saveHealthy)
                        && bool(entitySave.manifestTrackedSummary)
                        && bool(entitySave.manifestTrackedPlayer)
                        && bool(entitySave.manifestTrackedHostile)
                        && bool(entitySave.corruptionHealthy)
                        && bool(itemSave.manifestTrackedSummary)
                        && bool(itemSave.manifestTrackedPlayerInventory)
                        && bool(itemSave.manifestTrackedCrashCache)
                        && bool(itemSave.corruptionHealthy),
                [
                        transactionCount: save.transactionCount,
                        backupCount     : save.backupCount,
                        migrationSteps  : save.migrationSteps,
                        worldFiles      : worldSave.writtenPaths,
                        entityFiles     : entitySave.writtenPaths,
                        itemFiles       : itemSave.writtenPaths
                ])

        def failed = checks.findAll { it.status != 'PASS' }
        def categories = checks.collect { it.category }.unique().sort()
        def reportPayload = [
                schema          : 'echo.standalone.minecraft_mechanics_contract.v1',
                generatedAt     : '1970-01-01T00:00:00Z',
                generator       : 'runStandaloneMinecraftMechanicsContractSmoke',
                status          : failed.isEmpty() ? 'PASS' : 'BLOCKED',
                summary         : failed.isEmpty()
                        ? 'Beta-blocking Minecraft mechanics contract covers blocks, items, crafting, world, entities, fluids, lighting, weather, hazards, and persistence.'
                        : 'Minecraft mechanics contract is blocked by missing or failed category evidence.',
                categoriesCovered: categories,
                checkCount      : checks.size(),
                checksPassed    : checks.count { it.status == 'PASS' },
                failedChecks    : failed,
                checks          : checks,
                evidenceReports : checks.collect { it.report }.unique()
        ]
        def reportFile = file('reports/echo/standalone/minecraft-mechanics-contract.json')
        reportFile.parentFile.mkdirs()
        reportFile.text = echoStandaloneJson(reportPayload)
        if (!failed.isEmpty()) {
            throw new GradleException("Minecraft mechanics contract blocked; see ${reportFile}")
        }
    }
}

tasks.register('runStandaloneFullPresentationMechanicsAudit') {
    group = 'verification'
    description = 'Writes full public-release presentation mechanics evidence across audio, subtitles, particles, weather, ambience, accessibility, fallback, reload, and diagnostics.'
    dependsOn tasks.named('verifyStandaloneAudioRuntime')
    dependsOn tasks.named('verifyStandaloneAudioDeviceRuntime')
    dependsOn tasks.named('verifyStandaloneRenderRuntime')
    dependsOn tasks.named('verifyStandaloneWorldRuntime')
    dependsOn tasks.named('verifyStandaloneGameplayRuntime')
    dependsOn tasks.named('verifyStandaloneAssetRuntime')
    dependsOn tasks.named('verifyStandaloneUiRuntime')
    dependsOn tasks.named('runStandaloneClientSubtitleOverlaySmoke')
    dependsOn tasks.named('runStandaloneClientUiAudioSmoke')
    dependsOn tasks.named('runStandaloneClientSettingsSmoke')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', schema: 'MISSING', path: relativePath]
            }
            try {
                def parsed = new groovy.json.JsonSlurper().parse(reportFile)
                parsed.path = relativePath
                if (String.valueOf(parsed.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                    parsed.status = 'BOOTSTRAP_PLACEHOLDER'
                }
                return parsed
            } catch (Exception exception) {
                return [status: 'INVALID_JSON', schema: 'INVALID_JSON', path: relativePath, error: exception.message]
            }
        }
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def count = { Object value ->
            try {
                value instanceof Collection ? value.size()
                        : value instanceof Map ? value.size()
                        : value instanceof Number ? value.intValue()
                        : String.valueOf(value ?: '0').toInteger()
            } catch (Exception ignored) {
                0
            }
        }
        def number = { Object value ->
            try {
                value instanceof Number ? new BigDecimal(value.toString()) : new BigDecimal(String.valueOf(value ?: '0'))
            } catch (Exception ignored) {
                BigDecimal.ZERO
            }
        }
        def statusPass = { Object report -> String.valueOf(report.status ?: 'UNKNOWN') == 'PASS' }
        def checks = []
        def addCheck = { String id, String category, String reportPath, boolean passed, Object detail ->
            checks << [
                    id       : id,
                    category : category,
                    report   : reportPath,
                    status   : passed ? 'PASS' : 'FAILED',
                    detail   : detail
            ]
        }

        def runtimeAudio = readReport('reports/echo/standalone/runtime-audio.json')
        def audioBuses = readReport('reports/echo/standalone/audio-buses.json')
        def audioClips = readReport('reports/echo/standalone/audio-clips.json')
        def audioAmbience = readReport('reports/echo/standalone/audio-ambience.json')
        def audioMusic = readReport('reports/echo/standalone/audio-music.json')
        def audioUi = readReport('reports/echo/standalone/audio-ui-sounds.json')
        def audioStingers = readReport('reports/echo/standalone/audio-mission-stingers.json')
        def audioCueCoverage = readReport('reports/echo/standalone/ashfall-audio-cue-coverage.json')
        def audioFallback = readReport('reports/echo/standalone/audio-device-fallback.json')
        def audioDeviceOutput = readReport('reports/echo/standalone/audio-device-output.json')
        def audioVolumeControls = readReport('reports/echo/standalone/audio-device-volume-controls.json')
        def audioDiagnostics = readReport('reports/echo/standalone/audio-diagnostics.json')
        def particles = readReport('reports/echo/standalone/render-particles.json')
        def worldWeather = readReport('reports/echo/standalone/world-weather.json')
        def gameplayWeather = readReport('reports/echo/standalone/gameplay-weather.json')
        def assetIndex = readReport('reports/echo/standalone/asset-index.json')
        def assetMissing = readReport('reports/echo/standalone/asset-missing.json')
        def resourcePackPlan = readReport('reports/echo/standalone/resource-pack-plan.json')
        def uiRuntime = readReport('reports/echo/standalone/runtime-ui.json')
        def uiMenus = readReport('reports/echo/standalone/ui-menus.json')
        def uiTheme = readReport('reports/echo/standalone/ui-theme-runtime.json')
        def renderDebug = readReport('reports/echo/standalone/renderer-upgrade-debug-overlays.json')

        def requiredBuses = ['MUSIC', 'AMBIENCE', 'SFX', 'UI', 'STINGER', 'ALERT']
        def busCounts = runtimeAudio.busCounts ?: [:]
        addCheck('presentation.audio-runtime-buses-clips', 'audio', 'reports/echo/standalone/runtime-audio.json',
                statusPass(runtimeAudio)
                        && bool(runtimeAudio.serviceBound)
                        && count(runtimeAudio.clipCount) >= 13
                        && requiredBuses.every { count(busCounts[it]) >= 1 }
                        && statusPass(audioBuses)
                        && ((List) (audioBuses.coveredBuses ?: [])).containsAll(requiredBuses)
                        && statusPass(audioClips)
                        && count(audioClips.clipCount) >= 13,
                [
                        serviceBound: runtimeAudio.serviceBound,
                        clipCount   : runtimeAudio.clipCount,
                        busCounts   : runtimeAudio.busCounts,
                        coveredBuses: audioBuses.coveredBuses ?: []
                ])
        addCheck('presentation.audio-cue-surfaces', 'audio', 'reports/echo/standalone/ashfall-audio-cue-coverage.json',
                statusPass(audioAmbience)
                        && statusPass(audioMusic)
                        && statusPass(audioUi)
                        && statusPass(audioStingers)
                        && statusPass(audioCueCoverage)
                        && bool(audioCueCoverage.adapterCoreSoundBacked)
                        && bool(audioCueCoverage.windAmbienceReady)
                        && bool(audioCueCoverage.miningHitReady)
                        && bool(audioCueCoverage.blockBreakReady)
                        && bool(audioCueCoverage.itemPickupReady)
                        && bool(audioCueCoverage.waterFoodUseReady)
                        && bool(audioCueCoverage.terminalBeepReady)
                        && bool(audioCueCoverage.powerRepairReady)
                        && bool(audioCueCoverage.extractionBeaconReady)
                        && bool(audioCueCoverage.dangerAlertReady),
                [
                        ambienceClip: audioAmbience.expectedClip,
                        musicClip   : audioMusic.expectedClip,
                        uiClip      : audioUi.expectedClip,
                        cueCoverage : audioCueCoverage
                ])
        addCheck('presentation.audio-device-fallback-volume-diagnostics', 'audio', 'reports/echo/standalone/audio-device-fallback.json',
                statusPass(audioFallback)
                        && bool(audioFallback.forcedFallbackActive)
                        && count(audioFallback.fallbackEvents) >= 4
                        && statusPass(audioDeviceOutput)
                        && count(audioDeviceOutput.events) >= 4
                        && statusPass(audioVolumeControls)
                        && number(audioVolumeControls.mutedGain).compareTo(BigDecimal.ZERO) == 0
                        && number(audioVolumeControls.quietUiGain) > BigDecimal.ZERO
                        && statusPass(audioDiagnostics)
                        && count(audioDiagnostics.diagnosticCount) >= 1,
                [
                        fallbackBackend: audioFallback.fallbackBackendId,
                        fallbackEvents : audioFallback.fallbackEvents,
                        mutedGain      : audioVolumeControls.mutedGain,
                        quietUiGain    : audioVolumeControls.quietUiGain,
                        diagnostics    : audioDiagnostics.diagnosticCount
                ])
        addCheck('presentation.subtitles-and-accessibility-settings', 'accessibility', 'task:runStandaloneClientSubtitleOverlaySmoke',
                statusPass(assetIndex)
                        && ((List) (assetIndex.logicalIds ?: [])).contains('ashfall:sounds.json')
                        && statusPass(uiRuntime)
                        && statusPass(uiMenus)
                        && statusPass(uiTheme),
                [
                        taskEvidence       : [
                                'runStandaloneClientSubtitleOverlaySmoke',
                                'runStandaloneClientUiAudioSmoke',
                                'runStandaloneClientSettingsSmoke'
                        ],
                        soundCatalogIndexed: ((List) (assetIndex.logicalIds ?: [])).contains('ashfall:sounds.json'),
                        uiRuntimeStatus    : uiRuntime.status,
                        settingsCoverage   : 'Client settings smoke covers subtitles, high contrast, reduced motion, language, audio sliders, and persistence.'
                ])
        addCheck('presentation.particles-weather-ambience', 'world-presentation', 'reports/echo/standalone/render-particles.json',
                statusPass(particles)
                        && count(particles.particleCommandCount) >= 5
                        && bool(particles.ashStormParticlesRepresented)
                        && ((List) (particles.particleMaterials ?: [])).contains('particle:ash:ashfall:ash_storm')
                        && statusPass(worldWeather)
                        && String.valueOf(worldWeather.weatherProfile ?: '') == 'ashfall:ash_storm'
                        && number(worldWeather.windSpeed) > BigDecimal.ZERO
                        && number(worldWeather.visibility) > BigDecimal.ZERO
                        && statusPass(gameplayWeather)
                        && bool(gameplayWeather.ashStormApplied)
                        && number(gameplayWeather.heatStressDelta) > BigDecimal.ZERO,
                [
                        particleCommandCount: particles.particleCommandCount,
                        weatherProfile      : worldWeather.weatherProfile,
                        gameplayWeather     : gameplayWeather
                ])
        addCheck('presentation.reload-missing-fallback', 'recovery', 'reports/echo/standalone/resource-pack-plan.json',
                statusPass(resourcePackPlan)
                        && ((List) (resourcePackPlan.hotReloadAdded ?: [])).contains('ashfall:icons/hazard.png')
                        && statusPass(assetMissing)
                        && bool(assetMissing.requiredMissingDetected)
                        && bool(audioFallback.forcedFallbackActive),
                [
                        hotReloadAdded        : resourcePackPlan.hotReloadAdded ?: [],
                        requiredMissingDetected: assetMissing.requiredMissingDetected,
                        fallbackActive        : audioFallback.forcedFallbackActive
                ])
        def supportBundleSource = file('echo-runtime-app/src/main/java/dev/echo/standalone/runtime/app/EchoStandaloneLauncherRuntime.java')
        addCheck('presentation.diagnostics-support-bundle-contract', 'diagnostics', supportBundleSource.path.replace('\\', '/'),
                statusPass(renderDebug)
                        && bool(renderDebug.debugOverlayPassPresent)
                        && bool(renderDebug.containsPixelDiagnostic)
                        && bool(renderDebug.containsPassDiagnostic)
                        && supportBundleSource.isFile()
                        && supportBundleSource.getText('UTF-8').contains('reports/echo/standalone/full-audio-particles-weather-ambience.json'),
                [
                        renderDebugStatus           : renderDebug.status,
                        debugOverlayPassPresent     : renderDebug.debugOverlayPassPresent,
                        supportBundleContractPresent: supportBundleSource.isFile()
                                && supportBundleSource.getText('UTF-8').contains('reports/echo/standalone/full-audio-particles-weather-ambience.json'),
                        archiveVerification         : 'runStandaloneLauncherSmoke requires this report in the exported support bundle.'
                ])

        def failed = checks.findAll { it.status != 'PASS' }
        def reportPayload = [
                schema               : 'echo.standalone.full_audio_particles_weather_ambience.v1',
                generatedAt          : '1970-01-01T00:00:00Z',
                generator            : 'runStandaloneFullPresentationMechanicsAudit',
                status               : failed.isEmpty() ? 'PASS' : 'BLOCKED',
                summary              : failed.isEmpty()
                        ? 'Audio, subtitles, particles, weather, ambience, accessibility, fallback, reload, and diagnostics presentation evidence passed for public-release mechanics parity.'
                        : 'Presentation mechanics evidence remains blocked by missing or failed presentation rows.',
                publicReleaseReady   : failed.isEmpty(),
                fullMechanicsCoverage: failed.isEmpty(),
                category             : 'presentation',
                checkCount           : checks.size(),
