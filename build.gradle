tasks.register('runStandaloneReleasePolicySummaryReports') {
    group = 'verification'
    description = 'Writes concrete beta CI policy and release acceptance summaries from current gate reports without launching runtime windows.'
    dependsOn tasks.named('runStandalonePublicReleaseGateAudit')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath, schema: '']
            }
            try {
                def parsed = new groovy.json.JsonSlurper().parse(reportFile)
                parsed.path = relativePath
                parsed.placeholder = parsed.schema == 'echo.standalone.evidence.bootstrap.v1'
                return parsed
            } catch (Exception exception) {
                return [status: 'INVALID_JSON', path: relativePath, schema: '', error: exception.message ?: '']
            }
        }
        def reportDir = file('reports/echo/standalone')
        reportDir.mkdirs()

        def betaGate = readReport('reports/echo/standalone/beta-readiness-gate.json')
        def betaChecks = readReport('reports/echo/standalone/beta-readiness-checks.json')
        def fullWorkspace = readReport('reports/echo/standalone/full-workspace-build-smoke.json')
        def betaGateConcrete = betaGate.placeholder != true
                && String.valueOf(betaGate.schema ?: '') == 'echo.standalone.beta_readiness_gate.v2'
        new File(reportDir, 'beta-readiness-ci-policy.json').text = echoStandaloneJson([
                schema                    : 'echo.standalone.beta_readiness_ci_policy.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneReleasePolicySummaryReports',
                status                    : betaGateConcrete ? 'PASS' : 'BLOCKED',
                summary                   : betaGateConcrete
                        ? 'Beta readiness CI policy summary is concrete; beta-blocking evidence rejects bootstrap placeholders and stale current-run reports.'
                        : 'Beta readiness CI policy summary is blocked because the beta gate report is missing, invalid, or placeholder evidence.',
                betaGateStatus            : String.valueOf(betaGate.status ?: 'UNKNOWN'),
                betaReady                 : betaGate.betaReady == true,
                blockerCount              : betaGate.blockerCount ?: 0,
                warningCount              : betaGate.warningCount ?: 0,
                staleReportCount          : betaGate.staleReportCount ?: 0,
                currentRunEvidenceRequired: true,
                staleReportsRejected      : true,
                bootstrapPlaceholdersAccepted: false,
                betaChecksStatus          : String.valueOf(betaChecks.status ?: 'UNKNOWN'),
                fullWorkspaceBuildStatus  : String.valueOf(fullWorkspace.status ?: 'UNKNOWN'),
                fullWorkspaceBuildReady   : fullWorkspace.status == 'PASS'
                        && fullWorkspace.evidence?.buildSuccessful == true
                        && fullWorkspace.evidence?.fullWorkspaceTask == true,
                evidenceReports           : [
                        'reports/echo/standalone/beta-readiness-gate.json',
                        'reports/echo/standalone/beta-readiness-checks.json',
                        'reports/echo/standalone/full-workspace-build-smoke.json'
                ]
        ])

        def publicGate = readReport('reports/echo/standalone/public-release-gate.json')
        def signing = readReport('reports/echo/standalone/distribution-signing-setup.json')
        def install = readReport('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        def manual = readReport('reports/echo/standalone/manual-playtest-report.json')
        def manualCapture = readReport('reports/echo/standalone/manual-wallclock-capture-rehearsal.json')
        def audioHardware = readReport('reports/echo/standalone/audio-hardware-verification.json')
        def reproducibility = readReport('reports/echo/standalone/distribution-package-reproducibility-strict.json')
        def packagedSmoke = readReport('reports/echo/standalone/packaged-exe-wallclock-smoke.json')
        def strictRehearsal = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json')
        def strict30m = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-30m.json')
        def strict60m = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-60m.json')
        def mechanics = readReport('reports/echo/standalone/full-mechanics-parity-audit.json')
        def publicGateConcrete = publicGate.placeholder != true
                && String.valueOf(publicGate.schema ?: '') == 'echo.standalone.public_release_gate.v1'
        def manualCaptureFresh = manualCapture.placeholder != true
                && String.valueOf(manualCapture.schema ?: '') == 'echo.standalone.manual_wallclock_capture_rehearsal.v1'
                && manualCapture.status == 'PASS'
                && manualCapture.manualEvidenceComplete == true
                && manualCapture.completedHumanEvidenceReady == true
                && manualCapture.packageHashConsistent == true
                && manualCapture.manualCaptureScriptSha256Matches == true
                && manualCapture.replacesHumanPlaytest == false
        def audioHardwareFresh = audioHardware.placeholder != true
                && String.valueOf(audioHardware.schema ?: '') == 'echo.standalone.audio_hardware_verification.v1'
                && audioHardware.status == 'PASS'
                && audioHardware.hardwareAudioEvidenceComplete == true
                && audioHardware.replacesAutomatedAudioEvidence == false
        def publicReleaseAccepted = publicGateConcrete
                && publicGate.publicReleaseReady == true
                && publicGate.manualCaptureValidatedCurrentArtifacts == true
                && publicGate.audioHardwareVerified == true
                && publicGate.openlandsPublicContentPolishReady == true
                && manualCaptureFresh
                && audioHardwareFresh
        def blockers = publicGate.blockers instanceof Collection ? publicGate.blockers : []
        new File(reportDir, 'release-acceptance-report.json').text = echoStandaloneJson([
                schema                    : 'echo.standalone.release_acceptance.v2',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneReleasePolicySummaryReports',
                status                    : publicReleaseAccepted ? 'PASS' : 'BLOCKED',
                summary                   : publicReleaseAccepted
                        ? 'Public release acceptance passed.'
                        : 'Public release acceptance is blocked by incomplete signing, install/uninstall, hardware audio, human playtest, Openlands public art/content polish, or player runtime authority evidence.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                publicReleaseAccepted     : publicReleaseAccepted,
                publicReleaseGateStatus   : String.valueOf(publicGate.status ?: 'UNKNOWN'),
                publicReleaseGateConcrete : publicGateConcrete,
                blockerCount              : blockers.size(),
                blockers                  : blockers,
                signingSetupStatus        : String.valueOf(signing.status ?: 'UNKNOWN'),
                cleanInstallUninstallStatus: String.valueOf(install.status ?: 'UNKNOWN'),
                manualPlaytestStatus      : String.valueOf(manual.status ?: 'UNKNOWN'),
                manualCaptureStatus       : String.valueOf(manualCapture.status ?: 'UNKNOWN'),
                manualCaptureFresh        : manualCaptureFresh,
                manualCaptureValidatedCurrentArtifacts: publicGate.manualCaptureValidatedCurrentArtifacts == true,
                audioHardwareStatus       : String.valueOf(audioHardware.status ?: 'UNKNOWN'),
                audioHardwareFresh        : audioHardwareFresh,
                audioHardwareVerified     : publicGate.audioHardwareVerified == true,
                openlandsPublicContentPolishStatus: String.valueOf(publicGate.openlandsPublicContentPolishStatus ?: 'UNKNOWN'),
                openlandsPublicContentPolishReady: publicGate.openlandsPublicContentPolishReady == true,
                openlandsPublicAssetPolishReady: publicGate.openlandsPublicAssetPolishReady == true,
                playerRuntimeAuthorityStatus: String.valueOf(publicGate.playerRuntimeAuthorityStatus ?: 'UNKNOWN'),
                playerRuntimeAuthorityReady: publicGate.playerRuntimeAuthorityReady == true,
                playerFacingRuntimePath   : String.valueOf(publicGate.playerFacingRuntimePath ?: 'UNKNOWN'),
                playerMainClass           : String.valueOf(publicGate.playerMainClass ?: 'UNKNOWN'),
                reproducibilityStatus     : String.valueOf(reproducibility.status ?: 'UNKNOWN'),
                packagedSmokeStatus       : String.valueOf(packagedSmoke.status ?: 'UNKNOWN'),
                strictRehearsalStatus     : String.valueOf(strictRehearsal.status ?: 'UNKNOWN'),
                strict30mStatus           : String.valueOf(strict30m.status ?: 'UNKNOWN'),
                strict60mStatus           : String.valueOf(strict60m.status ?: 'UNKNOWN'),
                mechanicsParityStatus     : String.valueOf(mechanics.status ?: 'UNKNOWN'),
                externalEvidenceRequired  : true,
                replacesSigningEvidence   : false,
                replacesCleanInstallEvidence: false,
                replacesHumanPlaytest     : false,
                evidenceReports           : [
                        'reports/echo/standalone/public-release-gate.json',
                        'reports/echo/standalone/distribution-signing-setup.json',
                        'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                        'reports/echo/standalone/manual-playtest-report.json',
                        'reports/echo/standalone/manual-wallclock-capture-rehearsal.json',
                        'reports/echo/standalone/audio-hardware-verification.json',
                        'reports/echo/standalone/distribution-package-reproducibility-strict.json',
                        'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-30m.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json',
                        'reports/echo/standalone/full-mechanics-parity-audit.json',
                        'reports/echo/standalone/openlands-experience-contract.json',
                        'reports/echo/standalone/openlands-full-route-contract.json',
                        'reports/echo/standalone/player-runtime-authority.json'
                ]
        ])
    }
}

tasks.register('verifyStandalonePublicReleaseDistribution') {
    group = 'verification'
    description = 'Runs public-release distribution gates and fails while signing, install/uninstall, or human playtest evidence is incomplete.'
    dependsOn tasks.named('runStandalonePublicReleaseGateAudit')

    doLast {
        def report = file('reports/echo/standalone/public-release-gate.json')
        if (!report.isFile()) {
            throw new GradleException("Missing public release distribution gate report: ${report}")
        }
        def parsed = new groovy.json.JsonSlurper().parse(report)
        if (parsed.status != 'PASS' || parsed.publicReleaseReady != true) {
            throw new GradleException("Public release distribution gate blocked; see ${report}")
        }
    }
}

tasks.register('runStandaloneBetaDistributionReleaseContractSmoke') {
    group = 'verification'
    description = 'Aggregates Phase 10 beta distribution evidence for portable runtime package, extract/run/remove smoke, reproducibility, packaged EXE smoke, strict rehearsal, and release blocker visibility.'
    dependsOn tasks.named('runStandalonePackageReproducibilityStrict')
    dependsOn tasks.named('runStandaloneDistributionSigningSetupAudit')
    if (echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()) {
        dependsOn tasks.named('runStandalonePortableZipInstallSmoke')
        dependsOn tasks.named('runStandalonePackagedOpenGlImageSmoke')
        dependsOn tasks.named('runStandalonePackagedOpenGlImageStrictRehearsal')
    } else {
        dependsOn tasks.named('writeStandaloneVisibleWindowLaunchOptInReports')
    }
    dependsOn tasks.named('verifyReleaseIndexProductRouting')

    doLast {
        def json = new groovy.json.JsonSlurper()
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                throw new GradleException("Missing beta distribution evidence report: ${relativePath}")
            }
            def parsed
            try {
                parsed = json.parse(reportFile)
            } catch (Exception exception) {
                throw new GradleException("Invalid beta distribution evidence report ${relativePath}: ${exception.message}", exception)
            }
            if (String.valueOf(parsed.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Bootstrap placeholder is not accepted for beta distribution evidence: ${relativePath}")
            }
            parsed.path = relativePath
            parsed
        }
        def optionalReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath]
            }
            try {
                def parsed = json.parse(reportFile)
                parsed.path = relativePath
                parsed
            } catch (Exception ignored) {
                [status: 'INVALID_JSON', path: relativePath]
            }
        }
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def count = { Object value -> value instanceof Number ? value.intValue() : String.valueOf(value ?: '0').toInteger() }
        def text = { Object value -> String.valueOf(value ?: '') }
        def checks = []
        def requireCheck = { String id, String category, String reportPath, boolean passed, Object detail ->
            checks << [
                    id      : id,
                    category: category,
                    report  : reportPath,
                    status  : passed ? 'PASS' : 'FAILED',
                    detail  : detail
            ]
        }

        def packageImage = readReport('reports/echo/standalone/packaged-opengl-client-image.json')
        requireCheck('distribution.runtime-package-image', 'runtime-package', packageImage.path,
                text(packageImage.status) == 'PASS'
                        && text(packageImage.rendererTarget) == 'opengl'
                        && bool(packageImage.supersededMainClassAbsent)
                        && text(packageImage.mainClass) == 'dev.echo.standalone.runtime.client.EchoClientMain'
                        && count(packageImage.executableBytes) > 0
                        && count(packageImage.portableZipBytes) > 0
                        && text(packageImage.executableSha256).length() == 64
                        && text(packageImage.portableZipSha256).length() == 64
                        && file(text(packageImage.executable)).isFile()
                        && file(text(packageImage.portableZipPath)).isFile(),
                [
                        executable      : packageImage.executable,
                        executableBytes : packageImage.executableBytes,
                        portableZipPath : packageImage.portableZipPath,
                        portableZipBytes: packageImage.portableZipBytes,
                        portableZipSha256: packageImage.portableZipSha256
                ])

        def portable = readReport('reports/echo/standalone/distribution-portable-image.json')
        def bundledRuntime = readReport('reports/echo/standalone/distribution-bundled-runtime.json')
        requireCheck('distribution.portable-bundled-runtime', 'runtime-package', portable.path,
                text(portable.status) == 'PASS'
                        && bool(portable.runtimeImage?.ready)
                        && bool(portable.portableZip?.ready)
                        && text(bundledRuntime.status) == 'PASS'
                        && bool(bundledRuntime.runtime?.bundledRuntimePresent)
                        && count(bundledRuntime.runtime?.moduleJars) >= 18
                        && text(bundledRuntime.runtime?.javaVersion).length() > 0,
                [
                        runtimeImage  : portable.runtimeImage,
                        portableZip   : portable.portableZip,
                        bundledRuntime: bundledRuntime.runtime
                ])

        def icons = readReport('reports/echo/standalone/distribution-icons.json')
        requireCheck('distribution.icons', 'launcher-package', icons.path,
                text(icons.schema) == 'echo.standalone.distribution_icons.v1'
                        && text(icons.status) == 'PASS'
                        && bool(icons.icons?.windowsIcon?.exists)
                        && bool(icons.icons?.portableIcon?.exists)
                        && count(icons.icons?.windowsIcon?.bytes) > 0
                        && count(icons.icons?.portableIcon?.bytes) > 0
                        && bool(icons.iconHashesPresent)
                        && bool(icons.configuredForWindows)
                        && bool(icons.configuredForNsis)
                        && bool(icons.unpackedForPackagedLauncher),
                [
                        windowsIcon      : icons.icons?.windowsIcon,
                        portableIcon     : icons.icons?.portableIcon,
                        packageReferences: icons.packageReferences
                ])

        def installer = readReport('reports/echo/standalone/distribution-installer.json')
        requireCheck('distribution.installer-metadata', 'launcher-package', installer.path,
                text(installer.schema) == 'echo.standalone.distribution_installer.v1'
                        && text(installer.status) == 'PASS'
                        && bool(installer.installer?.exists)
                        && count(installer.installer?.bytes) > 0
                        && bool(installer.installerScript?.exists)
                        && bool(installer.packageCommandUsesNsis)
                        && bool(installer.packageCommandPublishNever)
                        && bool(installer.setupFilenameMatchesPackageVersion)
                        && bool(installer.latestYml?.present)
                        && bool(installer.latestYml?.matchesSetup)
                        && bool(installer.replacesSigningEvidence) == false
                        && bool(installer.replacesManualInstallerEvidence) == false,
                [
                        installer      : installer.installer,
                        installerScript: installer.installerScript,
                        latestYml      : installer.latestYml,
                        electronBuilder: installer.electronBuilder
                ])

        def firstRun = readReport('reports/echo/standalone/distribution-first-run-checks.json')
        requireCheck('distribution.first-run-config', 'launcher-package', firstRun.path,
                text(firstRun.schema) == 'echo.standalone.distribution_first_run_checks.v1'
                        && text(firstRun.status) == 'PASS'
                        && text(firstRun.rendererTarget) == 'opengl'
                        && bool(firstRun.executable?.exists)
                        && bool(firstRun.config?.exists)
                        && bool(firstRun.runtimeRelease?.exists)
                        && bool(firstRun.runtimeJavaLibrary?.exists)
                        && text(firstRun.mainClass) == 'dev.echo.standalone.runtime.client.EchoClientMain'
                        && bool(firstRun.configMainClassPresent)
                        && bool(firstRun.nativeAccessEnabled)
                        && bool(firstRun.utf8EncodingEnabled)
                        && count(firstRun.standaloneModuleJarCount) >= 18
                        && bool(firstRun.bundledRuntimePresent)
                        && bool(firstRun.replacesPackagedExeSmoke) == false
                        && bool(firstRun.replacesHumanPlaytest) == false,
                [
                        executable      : firstRun.executable,
                        config          : firstRun.config,
                        runtimeJavaVersion: firstRun.runtimeJavaVersion,
                        standaloneModuleJarCount: firstRun.standaloneModuleJarCount
                ])

        def versionMetadata = readReport('reports/echo/standalone/distribution-version-metadata.json')
        requireCheck('distribution.version-metadata', 'launcher-package', versionMetadata.path,
                text(versionMetadata.schema) == 'echo.standalone.distribution_version_metadata.v1'
                        && text(versionMetadata.status) == 'PASS'
                        && text(versionMetadata.launcherVersion).length() > 0
                        && text(versionMetadata.expectedSetupArtifactName).contains(text(versionMetadata.launcherVersion))
                        && bool(versionMetadata.setupArtifact?.exists)
                        && count(versionMetadata.setupArtifact?.bytes) > 0
                        && text(versionMetadata.setupArtifact?.sha256).length() == 64
                        && text(versionMetadata.setupArtifact?.sha512).length() > 0
                        && bool(versionMetadata.latestYml?.present)
                        && bool(versionMetadata.latestYml?.versionMatchesPackageJson)
                        && bool(versionMetadata.latestYml?.pathMatchesSetup)
                        && bool(versionMetadata.latestYml?.fileUrlMatchesSetup)
                        && bool(versionMetadata.latestYml?.fileSizeMatchesSetupBytes)
                        && bool(versionMetadata.latestYml?.sha512MatchesSetupBytes)
                        && bool(versionMetadata.latestYml?.fileSha512MatchesSetupBytes),
                [
                        launcherVersion: versionMetadata.launcherVersion,
                        setupArtifact  : versionMetadata.setupArtifact,
                        latestYml      : versionMetadata.latestYml,
                        publish        : versionMetadata.publish
                ])

        def portableInstall = readReport('reports/echo/standalone/portable-zip-install-smoke.json')
        requireCheck('distribution.portable-zip-extract-run-remove', 'runtime-package', portableInstall.path,
                text(portableInstall.status) == 'PASS'
                        && text(portableInstall.rendererTarget) == 'opengl'
                        && bool(portableInstall.extractedExecutablePresent)
                        && bool(portableInstall.extractedConfigPresent)
                        && bool(portableInstall.extractedRuntimePresent)
                        && count(portableInstall.moduleJars) >= 18
                        && bool(portableInstall.currentClientMainClass)
                        && bool(portableInstall.supersededMainClassAbsent)
                        && count(portableInstall.processSamples) >= 10
                        && count(portableInstall.visibleSamples) >= 1
                        && count(portableInstall.missingProcessSamples) == 0
                        && bool(portableInstall.aliveAfterProbe)
                        && bool(portableInstall.installTreeRemoved)
                        && bool(portableInstall.replacesHumanPlaytest) == false
                        && bool(portableInstall.replacesManualInstallerEvidence) == false,
                [
                        portableZipSha256             : portableInstall.portableZipSha256,
                        extractedRoot                 : portableInstall.extractedRoot,
                        moduleJars                    : portableInstall.moduleJars,
                        processSamples                : portableInstall.processSamples,
                        visibleSamples                : portableInstall.visibleSamples,
                        installTreeRemoved            : portableInstall.installTreeRemoved,
                        replacesManualInstallerEvidence: portableInstall.replacesManualInstallerEvidence
                ])

        def reproducibility = readReport('reports/echo/standalone/distribution-package-reproducibility-strict.json')
        requireCheck('distribution.strict-reproducibility', 'reproducibility', reproducibility.path,
                text(reproducibility.status) == 'PASS'
                        && bool(reproducibility.stable?.bytesMatch)
                        && bool(reproducibility.stable?.entryCountMatch)
                        && bool(reproducibility.stable?.sha256Match)
                        && bool(reproducibility.deterministicZip?.sortedEntries)
                        && text(reproducibility.deterministicZip?.fixedEntryTimeUtc) == '1980-01-01T00:00:00Z'
                        && count(reproducibility.current?.entryCount) > 0
                        && text(reproducibility.current?.sha256).length() == 64
                        && bool(reproducibility.preservesStrictWallClockHash),
                [
                        current         : reproducibility.current,
                        stable          : reproducibility.stable,
                        deterministicZip: reproducibility.deterministicZip
                ])

        def smoke = readReport('reports/echo/standalone/packaged-exe-wallclock-smoke.json')
        requireCheck('distribution.packaged-exe-smoke', 'exe-smoke', smoke.path,
                text(smoke.status) == 'PASS'
                        && text(smoke.rendererTarget) == 'opengl'
                        && bool(smoke.aliveAfterProbe)
                        && count(smoke.durationSeconds) >= 15
                        && count(smoke.aliveSamples) >= 15
                        && text(smoke.portableZipSha256).length() == 64
                        && bool(smoke.replacesHumanPlaytest) == false,
                [
                        durationSeconds : smoke.durationSeconds,
                        aliveSamples    : smoke.aliveSamples,
                        aliveAfterProbe : smoke.aliveAfterProbe,
                        replacesHumanPlaytest: smoke.replacesHumanPlaytest
                ])

        def strict = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json')
        requireCheck('distribution.strict-visible-window-rehearsal', 'exe-smoke', strict.path,
                text(strict.status) == 'PASS'
                        && bool(strict.visibleWindow)
                        && bool(strict.aliveAfterProbe)
                        && count(strict.completedDurationSeconds) >= 20
                        && count(strict.processSamples) >= 20
                        && count(strict.visibleSamples) >= 1
                        && count(strict.missingProcessSamples) == 0
                        && count(strict.invisibleSamplesAfterGrace) == 0
                        && text(strict.windowTitle).length() > 0
                        && bool(strict.replacesHumanPlaytest) == false
                        && bool(strict.releaseRunAccepted) == false,
                [
                        completedDurationSeconds: strict.completedDurationSeconds,
                        visibleSamples          : strict.visibleSamples,
                        processSamples          : strict.processSamples,
                        windowTitle             : strict.windowTitle,
                        remainingManualEvidence : strict.remainingManualEvidence
                ])

        def manualCapture = readReport('reports/echo/standalone/manual-wallclock-capture-rehearsal.json')
        requireCheck('distribution.manual-wallclock-capture-rehearsal', 'human-playtest-support', manualCapture.path,
                text(manualCapture.status) == 'PASS'
                        && text(manualCapture.rendererTarget) == 'opengl'
                        && bool(manualCapture.captureProtocolReady)
                        && (bool(manualCapture.pendingHumanEvidence) || bool(manualCapture.completedHumanEvidenceReady))
                        && bool(manualCapture.replacesHumanPlaytest) == false
                        && bool(manualCapture.smokeEvidenceReady)
                        && bool(manualCapture.strictRehearsalReady)
                        && bool(manualCapture.packageHashConsistent)
                        && bool(manualCapture.strict30mMonitorReportConcrete)
                        && bool(manualCapture.strict60mMonitorReportConcrete)
                        && count(manualCapture.requiredSessionCount) == 2
                        && count(manualCapture.requiredCaptureFieldCount) >= 16
                        && bool(manualCapture.manualCaptureScriptSha256Matches),
                [
                        requiredSessions             : manualCapture.requiredSessions,
                        requiredCaptureFields        : manualCapture.requiredCaptureFields,
                        captureScript                : manualCapture.captureScript,
                        manualCaptureScriptSha256Matches: manualCapture.manualCaptureScriptSha256Matches,
                        strict30mMonitorReport       : manualCapture.strict30mMonitorReport,
                        strict60mMonitorReport       : manualCapture.strict60mMonitorReport,
                        manualEvidenceComplete       : manualCapture.manualEvidenceComplete,
                        completedHumanEvidenceReady  : manualCapture.completedHumanEvidenceReady,
                        replacesHumanPlaytest        : manualCapture.replacesHumanPlaytest
                ])

        def signing = readReport('reports/echo/standalone/distribution-signing-setup.json')
        def install = readReport('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        def publicRelease = optionalReport('reports/echo/standalone/public-release-gate.json')
        def workspace = optionalReport('reports/echo/standalone/full-workspace-build-smoke.json')
        def distribution = readReport('reports/echo/standalone/distribution-artifacts.json')
        def missingRequired = (List) (distribution.missingRequiredArtifactIds ?: [])
        def publicBlockers = []
        if (text(signing.status) != 'PASS' || bool(signing.publicReleaseReady) != true) {
            publicBlockers << [
                    id    : 'public.signing-and-installer',
                    status: text(signing.status ?: 'UNKNOWN'),
                    detail: 'Signing/setup audit is not public-release ready.',
                    report: signing.path,
                    blockers: signing.blockers ?: [:]
            ]
        }
        if (text(install.status) != 'PASS') {
            publicBlockers << [
                    id    : 'public.clean-install-uninstall',
                    status: text(install.status ?: 'UNKNOWN'),
                    detail: 'Clean install/uninstall evidence is pending from a disposable Windows profile or VM.',
                    report: install.path,
                    blockers: install.blockers ?: []
            ]
        }
        if (text(workspace.status) != 'PASS') {
            publicBlockers << [
                    id    : 'public.full-workspace-build',
                    status: text(workspace.status ?: 'UNKNOWN'),
                    detail: 'Full workspace build smoke has not passed with an owning Gradle wrapper.',
                    report: workspace.path,
                    outputTail: workspace.outputTail ?: []
            ]
        }
        if (!missingRequired.isEmpty()) {
            publicBlockers << [
                    id    : 'public.launcher-artifacts',
                    status: text(distribution.status ?: 'UNKNOWN'),
                    detail: 'Launcher installer artifacts are missing from the detected ECHO Launcher output.',
                    report: distribution.path,
                    missingRequiredArtifactIds: missingRequired
            ]
        }
        if (text(publicRelease.status) != 'PASS') {
            publicBlockers << [
                    id    : 'public.release-gate',
                    status: text(publicRelease.status ?: 'UNKNOWN'),
                    detail: 'Public release gate remains blocked; beta runtime package evidence does not replace public release evidence.',
                    report: publicRelease.path,
                    blockers: publicRelease.blockers ?: []
            ]
        }

        def strict30mWindowReport = optionalReport('reports/echo/standalone/packaged-exe-wallclock-strict-30m.json')
        def strict60mWindowReport = optionalReport('reports/echo/standalone/packaged-exe-wallclock-strict-60m.json')
        def windowLaunchBlocked = [
                portableInstall,
                smoke,
                strict,
                manualCapture,
                strict30mWindowReport,
                strict60mWindowReport
        ].any { bool(it.windowLaunchOptInRequired) }
        def failed = checks.findAll { it.status != 'PASS' }
        def reportPayload = [
                schema                   : 'echo.standalone.beta_distribution_release_contract.v1',
                generatedAt              : '1970-01-01T00:00:00Z',
                generator                : 'runStandaloneBetaDistributionReleaseContractSmoke',
                status                   : failed.isEmpty() ? 'PASS' : 'BLOCKED',
                summary                  : failed.isEmpty()
                        ? 'Beta distribution contract proves deterministic OpenGL runtime packaging, portable zip extract/run/remove, reproducibility, packaged EXE launch, and strict visible-window rehearsal; public release blockers are tracked separately.'
                        : (windowLaunchBlocked
                                ? 'Beta distribution contract is blocked because visible packaged EXE probes require explicit opt-in.'
                                : 'Beta distribution contract is blocked by runtime packaging or packaged EXE evidence failures.'),
                phase                    : 'Phase 10 - Beta Distribution Release',
                betaDistributionReady    : failed.isEmpty(),
                publicReleaseReady       : bool(signing.publicReleaseReady) && text(install.status) == 'PASS' && text(workspace.status) == 'PASS' && missingRequired.isEmpty(),
                replacesHumanPlaytest    : false,
                windowLaunchSkipped      : windowLaunchBlocked,
                windowLaunchOptInRequired: windowLaunchBlocked,
                checkCount               : checks.size(),
                checksPassed             : checks.count { it.status == 'PASS' },
                failedChecks             : failed,
                checks                   : checks,
                publicReleaseBlockerCount: publicBlockers.size(),
                publicReleaseBlockers    : publicBlockers,
                evidenceReports          : (checks.collect { it.report } + [
                        'reports/echo/standalone/distribution-signing-setup.json',
                        'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                        'reports/echo/standalone/manual-playtest-report.json',
                        'reports/echo/standalone/manual-wallclock-capture-rehearsal.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-30m.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json',
                        'reports/echo/standalone/distribution-artifacts.json',
                        'reports/echo/standalone/distribution-icons.json',
                        'reports/echo/standalone/distribution-installer.json',
                        'reports/echo/standalone/distribution-first-run-checks.json',
                        'reports/echo/standalone/distribution-version-metadata.json',
                        'reports/echo/standalone/full-workspace-build-smoke.json',
                        'reports/echo/standalone/public-release-gate.json'
                ]).unique()
        ]
        def reportFile = file('reports/echo/standalone/beta-distribution-release-contract.json')
        reportFile.parentFile.mkdirs()
        reportFile.text = echoStandaloneJson(reportPayload)
        if (!failed.isEmpty() && !windowLaunchBlocked) {
            throw new GradleException("Beta distribution contract blocked; see ${reportFile}")
        }
    }
}

tasks.register('runStandalonePackagedOpenGlImageSmoke') {
    group = 'verification'
    description = 'Launches the packaged OpenGL client briefly and writes package smoke evidence.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def appName = 'EchoStandaloneRuntime'
        def imageDir = new File(buildDir, "jpackage-opengl-client/${appName}")
        def exe = new File(imageDir, "${appName}.exe")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def stdout = new File(buildDir, 'tmp/packaged-opengl-client-smoke.stdout.log')
        def stderr = new File(buildDir, 'tmp/packaged-opengl-client-smoke.stderr.log')
        def report = file('reports/echo/standalone/packaged-exe-wallclock-smoke.json')
        echoStandaloneRequireWindowLaunchOptIn(
                'runStandalonePackagedOpenGlImageSmoke',
                'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                'echo.standalone.packaged_exe_wallclock_smoke.v1',
                [
                        summary              : 'Packaged OpenGL client smoke was skipped before launching the visible EXE because window launch cleanup requires explicit opt-in.',
                        executable           : exe.absolutePath.replace('\\', '/'),
                        portableZipPath      : portableZip.absolutePath.replace('\\', '/'),
                        replacesHumanPlaytest: false,
                        runId                : 'opengl-client-smoke',
                        requiredNextAction   : 'Re-run with -PechoStandaloneAllowWindowLaunch=true when a visible EXE probe is intended.'
                ]
        )
        stdout.parentFile.mkdirs()
        stdout.text = ''
        stderr.text = ''
        if (!exe.isFile()) {
            throw new GradleException("Missing packaged OpenGL client executable: ${exe}")
        }

        def startedAt = java.time.Instant.now()
        def process = new ProcessBuilder(exe.absolutePath)
                .directory(rootProject.projectDir)
                .redirectOutput(stdout)
                .redirectError(stderr)
                .start()
        def samples = []
        int aliveSamples = 0
        int durationSeconds = 15
        for (int second = 1; second <= durationSeconds; second++) {
            Thread.sleep(1000L)
            boolean alive = process.isAlive()
            if (alive) {
                aliveSamples++
            }
            samples.add([second: second, pidAlive: alive])
            if (!alive) {
                break
            }
        }
        def endedAt = java.time.Instant.now()
        boolean aliveAfterProbe = process.isAlive()
        if (aliveAfterProbe) {
            new ProcessBuilder('cmd', '/c', 'taskkill', '/PID', Long.toString(process.pid()), '/T', '/F')
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
        }
        int exitCode = process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                ? process.exitValue()
                : -1
        boolean passed = aliveSamples >= 10 && aliveAfterProbe

        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                 : 'echo.standalone.packaged_exe_wallclock_smoke.v1',
                generatedAt            : '1970-01-01T00:00:00Z',
                generator              : 'runStandalonePackagedOpenGlImageSmoke',
                status                 : passed ? 'PASS' : 'FAILED',
                summary                : passed
                        ? 'Packaged OpenGL client launched and stayed alive through the smoke probe.'
                        : 'Packaged OpenGL client did not stay alive through the smoke probe.',
                rendererTarget         : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesHumanPlaytest  : false,
                runId                  : 'opengl-client-smoke',
                startedAt              : startedAt.toString(),
                endedAt                : endedAt.toString(),
                durationSeconds        : durationSeconds,
                aliveSamples           : aliveSamples,
                aliveAfterProbe        : aliveAfterProbe,
                exitCodeAfterCleanup   : exitCode,
                executable             : exe.absolutePath.replace('\\', '/'),
                portableZipPath        : portableZip.absolutePath.replace('\\', '/'),
                portableZipBytes       : portableZip.isFile() ? portableZip.length() : 0,
                portableZipSha256      : portableZip.isFile() ? echoStandaloneSha256(portableZip) : '',
                stdoutPath             : stdout.absolutePath.replace('\\', '/'),
                stderrPath             : stderr.absolutePath.replace('\\', '/'),
                samples                : samples
        ])
        if (!passed) {
            throw new GradleException("Packaged OpenGL client smoke failed; see ${report}")
        }
    }
}

tasks.register('runStandalonePackagedOpenGlImageStrictRehearsal') {
    group = 'verification'
    description = 'Runs a 20-second current OpenGL packaged EXE rehearsal with process and visible-window samples.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')
    if (echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()) {
        dependsOn tasks.named('runStandalonePackagedOpenGlImageSmoke')
    } else {
        dependsOn tasks.named('writeStandaloneVisibleWindowLaunchOptInReports')
    }

    doLast {
        def appName = 'EchoStandaloneRuntime'
        def imageDir = new File(buildDir, "jpackage-opengl-client/${appName}")
        def exe = new File(imageDir, "${appName}.exe")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def stdout = new File(buildDir, 'tmp/packaged-opengl-client-strict-rehearsal.stdout.log')
        def stderr = new File(buildDir, 'tmp/packaged-opengl-client-strict-rehearsal.stderr.log')
        def report = file('reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json')
        echoStandaloneRequireWindowLaunchOptIn(
                'runStandalonePackagedOpenGlImageStrictRehearsal',
                'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json',
                'echo.standalone.packaged_exe_wallclock_strict.v1',
                [
                        summary                  : 'Packaged OpenGL strict rehearsal was skipped before launching the visible EXE because window launch cleanup requires explicit opt-in.',
                        executable               : exe.absolutePath.replace('\\', '/'),
                        portableZipPath          : portableZip.absolutePath.replace('\\', '/'),
                        runId                    : 'rehearsal',
                        releaseRunAccepted       : false,
                        replacesHumanPlaytest    : false,
                        requiredNextAction       : 'Re-run with -PechoStandaloneAllowWindowLaunch=true when a visible EXE probe is intended.'
                ]
        )
        stdout.parentFile.mkdirs()
        stdout.text = ''
        stderr.text = ''
        if (!exe.isFile()) {
            throw new GradleException("Missing packaged OpenGL client executable: ${exe}")
        }

        def startedAt = java.time.Instant.now()
        def process = new ProcessBuilder(exe.absolutePath)
                .directory(rootProject.projectDir)
                .redirectOutput(stdout)
                .redirectError(stderr)
                .start()
        def samples = []
        int durationSeconds = 20
        int visibilityGraceSeconds = 20
        int processSamples = 0
        int visibleSamples = 0
        int workingSetSamples = 0
        int missingProcessSamples = 0
        int invisibleSamplesAfterGrace = 0
        int firstVisibleSecond = 0
        int firstMissingProcessSecond = 0
        int firstInvisibleSecond = 0
        long firstWorkingSetBytes = 0L
        long lastWorkingSetBytes = 0L
        long maxWorkingSetBytes = 0L
        String windowTitle = ''

        for (int second = 1; second <= durationSeconds; second++) {
            Thread.sleep(1000L)
            def sample = echoStandaloneWindowsProcessSample(process.pid())
            boolean alive = Boolean.valueOf(sample.pidAlive.toString())
            boolean visible = Boolean.valueOf(sample.visible.toString())
            long workingSetBytes = Long.valueOf(sample.workingSetBytes.toString())
            if (alive) {
                processSamples++
            } else {
                missingProcessSamples++
                if (firstMissingProcessSecond == 0) {
                    firstMissingProcessSecond = second
                }
            }
            if (visible) {
                visibleSamples++
                if (firstVisibleSecond == 0) {
                    firstVisibleSecond = second
                }
                if (windowTitle.isEmpty() && sample.windowTitle != null) {
                    windowTitle = sample.windowTitle.toString()
                }
            } else {
                if (firstInvisibleSecond == 0) {
                    firstInvisibleSecond = second
                }
                if (second > visibilityGraceSeconds) {
                    invisibleSamplesAfterGrace++
                }
            }
            if (workingSetBytes > 0L) {
                workingSetSamples++
                if (firstWorkingSetBytes == 0L) {
                    firstWorkingSetBytes = workingSetBytes
                }
                lastWorkingSetBytes = workingSetBytes
                maxWorkingSetBytes = Math.max(maxWorkingSetBytes, workingSetBytes)
            }
            samples.add([
                    second         : second,
                    processCount   : Integer.valueOf(sample.processCount.toString()),
                    visible        : visible,
                    pidAlive       : alive,
                    workingSetBytes: workingSetBytes,
                    probeError     : sample.probeError ?: ''
            ])
            if (!alive) {
                break
            }
        }
        def endedAt = java.time.Instant.now()
        boolean aliveAfterProbe = process.isAlive()
        if (aliveAfterProbe) {
            new ProcessBuilder('cmd', '/c', 'taskkill', '/PID', Long.toString(process.pid()), '/T', '/F')
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
        }
        int exitCode = process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                ? process.exitValue()
                : -1
        int completedDurationSeconds = samples.isEmpty() ? 0 : Integer.valueOf(samples.last().second.toString())
        boolean passed = processSamples == durationSeconds
                && visibleSamples > 0
                && invisibleSamplesAfterGrace == 0
                && aliveAfterProbe

        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.packaged_exe_wallclock_strict.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePackagedOpenGlImageStrictRehearsal',
                status                    : passed ? 'PASS' : 'FAILED',
                summary                   : passed
                        ? 'Current packaged OpenGL EXE remained process-alive and visibly windowed for the strict rehearsal interval.'
                        : 'Current packaged OpenGL EXE strict rehearsal did not satisfy process and visible-window requirements.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                runId                     : 'rehearsal',
                startedAt                 : startedAt.toString(),
                endedAt                   : endedAt.toString(),
                durationSeconds           : durationSeconds,
                completedDurationSeconds  : completedDurationSeconds,
                executable                : exe.absolutePath.replace('\\', '/'),
                visibleWindow             : visibleSamples > 0,
                visibleSamples            : visibleSamples,
                processSamples            : processSamples,
                workingSetSamples         : workingSetSamples,
                missingProcessSamples     : missingProcessSamples,
                invisibleSamplesAfterGrace: invisibleSamplesAfterGrace,
                visibilityGraceSeconds    : visibilityGraceSeconds,
                firstVisibleSecond        : firstVisibleSecond,
                firstMissingProcessSecond : firstMissingProcessSecond,
                firstInvisibleSecond      : firstInvisibleSecond,
                windowTitle               : windowTitle,
                firstWorkingSetBytes      : firstWorkingSetBytes,
                lastWorkingSetBytes       : lastWorkingSetBytes,
                maxWorkingSetBytes        : maxWorkingSetBytes,
                memoryGrowthBytes         : lastWorkingSetBytes - firstWorkingSetBytes,
                aliveAfterProbe           : aliveAfterProbe,
                exitCodeAfterCleanup      : exitCode,
                portableZipPath           : portableZip.absolutePath.replace('\\', '/'),
                portableZipBytes          : portableZip.isFile() ? portableZip.length() : 0,
                portableZipSha256         : portableZip.isFile() ? echoStandaloneSha256(portableZip) : '',
                currentPackageEvidence    : 'reports/echo/standalone/packaged-opengl-client-image.json',
                smokeEvidence             : 'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                replacesHumanPlaytest     : false,
                releaseRunAccepted        : false,
                remainingManualEvidence   : [
                        '30-minute wall-clock packaged OpenGL EXE tester session',
                        '60-minute wall-clock packaged OpenGL EXE tester session'
                ],
                stdoutPath                : stdout.absolutePath.replace('\\', '/'),
                stderrPath                : stderr.absolutePath.replace('\\', '/'),
                samples                   : samples
        ])
        if (!passed) {
            throw new GradleException("Packaged OpenGL client strict rehearsal failed; see ${report}")
        }
    }
}

tasks.register('runStandalonePackagedOpenGlImageStrict30mMonitor') {
    group = 'verification'
    description = 'Runs the packaged OpenGL EXE for a strict 30-minute process/window monitor and writes release-run evidence.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')
    if (echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()) {
        dependsOn tasks.named('runStandalonePackagedOpenGlImageSmoke')
    } else {
        dependsOn tasks.named('writeStandaloneVisibleWindowLaunchOptInReports')
    }

    doLast {
        def appName = 'EchoStandaloneRuntime'
        def imageDir = new File(buildDir, "jpackage-opengl-client/${appName}")
        def exe = new File(imageDir, "${appName}.exe")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def stdout = new File(buildDir, 'tmp/packaged-opengl-client-strict-30m.stdout.log')
