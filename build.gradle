tasks.register('verifyStandaloneDataRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.8 data and registry runtime artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneDataRuntimeSmoke')

    doLast {
        def requiredReports = [
                'reports/echo/standalone/runtime-data.json',
                'reports/echo/standalone/data-registries.json',
                'reports/echo/standalone/data-schemas.json',
                'reports/echo/standalone/data-tags.json',
                'reports/echo/standalone/data-recipes.json',
                'reports/echo/standalone/data-loot.json',
                'reports/echo/standalone/data-freeze-policy.json',
        ]
        ([
                'docs/echo/standalone/ECHO_STANDALONE_DATA_RUNTIME.md',
        ] + requiredReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.8 artifact: ${requiredPath}")
            }
        }
        def json = new groovy.json.JsonSlurper()
        requiredReports.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.8 data report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 14.8 data report did not pass: ${requiredPath} status=${report.status}")
            }
        }
        def runtimeData = json.parse(file('reports/echo/standalone/runtime-data.json'))
        if (runtimeData.schema != 'echo.standalone.runtime_data.v2'
                || runtimeData.documents < 18
                || runtimeData.schemas < 1
                || runtimeData.registryEntries < 2
                || runtimeData.tags < 1
                || runtimeData.recipes < 3
                || runtimeData.lootTables < 3
                || runtimeData.missions < 1
                || runtimeData.worldgenStructures < 1
                || runtimeData.worldgenBiomes < 1
                || runtimeData.worldgenFeatures < 2
                || runtimeData.worldCoreRegions < 1
                || runtimeData.worldCoreHazards < 1
                || runtimeData.sounds < 2
                || runtimeData.validationOk != true
                || runtimeData.frozen != true
                || runtimeData.serviceBound != true
                || runtimeData.worldgenBiomeRegistryBound != true
                || runtimeData.worldCoreRegionRegistryBound != true
                || runtimeData.soundRegistryBound != true) {
            throw new GradleException('Phase 14.8 runtime data report did not prove loaded registries, worldgen, WorldCore, sounds, validation, and service binding')
        }
        def registries = json.parse(file('reports/echo/standalone/data-registries.json'))
        if (registries.schema != 'echo.standalone.data_registries.v2'
                || registries.registryCount < 1
                || registries.totalEntries < 2
                || registries.itemsFrozen != true
                || registries.ashSteelDisplayName != 'Ash Steel'
                || registries.toxicFilterStackSize != '16'
                || !registries.registries.any { it.registryId == 'items' && it.entryIds.contains('ashfall:ash_steel') && it.entryIds.contains('ashfall:toxic_filter') }) {
            throw new GradleException('Phase 14.8 data registry report did not prove item registry entries and freeze state')
        }
        def schemas = json.parse(file('reports/echo/standalone/data-schemas.json'))
        if (schemas.schema != 'echo.standalone.data_schemas.v2'
                || schemas.schemaCount < 1
                || schemas.validationOk != true
                || schemas.validationIssueCount != 0
                || schemas.frozen != true
                || !schemas.itemsSchemaRequiredFields.contains('displayName')
                || !schemas.itemsSchemaRequiredFields.contains('stackSize')) {
            throw new GradleException('Phase 14.8 data schema report did not prove schema validation and freeze state')
        }
        def tags = json.parse(file('reports/echo/standalone/data-tags.json'))
        if (tags.schema != 'echo.standalone.data_tags.v2'
                || tags.tagCount < 1
                || tags.frozen != true
                || !tags.scrapValues.contains('ashfall:ash_steel')) {
            throw new GradleException('Phase 14.8 data tag report did not prove tag loading and freeze state')
        }
        def recipes = json.parse(file('reports/echo/standalone/data-recipes.json'))
        if (recipes.schema != 'echo.standalone.data_recipes.v2'
                || recipes.recipeCount < 3
                || recipes.frozen != true
                || recipes.shapedPowerCellResult != 'ashfall:power_cell'
                || recipes.shapedPowerCellResultCount != 1
                || recipes.shapedPowerCellGroup != 'ashfall_power'
                || recipes.shapedPowerCellCategory != 'equipment'
                || !recipes.shapedPowerCellPattern.contains('CEC')
                || recipes.shapedPowerCellIngredientCounts['ashfall:circuit_board'] != 2
                || recipes.smeltingCleanGlassResult != 'ashfall:clean_glass'
                || recipes.smeltingCleanGlassResultCount != 2
                || recipes.smeltingCleanGlassIngredientCounts['ashfall:dirty_glass'] != 1) {
            throw new GradleException('Phase 14.8 data recipe report did not prove Minecraft/NeoForge-shaped recipe ingestion')
        }
        def loot = json.parse(file('reports/echo/standalone/data-loot.json'))
        if (loot.schema != 'echo.standalone.data_loot.v2'
                || loot.lootTableCount < 3
                || loot.frozen != true
                || !loot.crashCacheEntries.contains('ashfall:toxic_filter')
                || !loot.ashCampfireEntries.contains('echoashfallprotocol:ash_campfire')
                || !loot.wikiManualTargets.contains('ashfall:chests/radio_tower_cache')) {
            throw new GradleException('Phase 14.8 data loot report did not prove loot table and loot modifier ingestion')
        }
        def freeze = json.parse(file('reports/echo/standalone/data-freeze-policy.json'))
        if (freeze.schema != 'echo.standalone.data_freeze_policy.v2'
                || freeze.policy != 'FREEZE_AFTER_LOAD'
                || freeze.frozen != true
                || freeze.frozenRegistries < 1
                || freeze.frozenSupportingRegistries < 1
                || freeze.lateRegistryWriteRejected != true
                || freeze.registriesFrozen != true
                || freeze.schemasFrozen != true
                || freeze.tagsFrozen != true
                || freeze.recipesFrozen != true
                || freeze.lootFrozen != true
                || freeze.worldgenFrozen != true) {
            throw new GradleException('Phase 14.8 data freeze report did not prove freeze-after-load enforcement')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-data/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone data runtime source ${sourceFile}")
            }
        }
    }
}

