tasks.register('verifyStandaloneInputRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 15.3 input runtime artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneInputRuntimeSmoke')

    doLast {
        def requiredReports = [
                'reports/echo/standalone/runtime-input.json',
                'reports/echo/standalone/input-devices.json',
                'reports/echo/standalone/input-bindings.json',
                'reports/echo/standalone/input-rebinding.json',
                'reports/echo/standalone/input-focus.json',
                'reports/echo/standalone/input-routing.json',
        ]
        ([
                'docs/echo/standalone/ECHO_STANDALONE_INPUT_RUNTIME.md',
        ] + requiredReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 15.3 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        requiredReports.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 15.3 input report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (report.status != 'PASS') {
                throw new GradleException("Phase 15.3 input report did not pass: ${requiredPath}")
            }
        }
        def runtimeInput = json.parse(file('reports/echo/standalone/runtime-input.json'))
        if (runtimeInput.schema != 'echo.standalone.runtime_input.v2'
                || runtimeInput.serviceBound != true
                || runtimeInput.bindingsBound != true
                || runtimeInput.focusBound != true
                || runtimeInput.routerBound != true
                || runtimeInput.bindingCount != 40
                || runtimeInput.deviceCount != 3
                || !runtimeInput.contexts.containsAll(['GAMEPLAY', 'TERMINAL', 'UI'])
                || runtimeInput.finalFocusContext != 'GAMEPLAY'
                || runtimeInput.finalFocusPath != 'gameplay:world'
                || runtimeInput.finalPlayerPosition.key != '2,0,1'
                || runtimeInput.missionStatus != 'ACTIVE'
                || runtimeInput.terminalHistoryCount != 1
                || runtimeInput.terminalStatusOutput != true) {
            throw new GradleException('Phase 15.3 runtime input report did not prove service-bound input runtime routing')
        }
        def devices = json.parse(file('reports/echo/standalone/input-devices.json'))
        if (devices.schema != 'echo.standalone.input_devices.v2'
                || devices.deviceNeutral != true
                || devices.nativePollingRequired != false
                || !devices.deviceTypes.containsAll(['KEYBOARD', 'MOUSE', 'GAMEPAD'])
                || devices.keyboardBindingCount != 28
                || devices.mouseBindingCount != 6
                || devices.gamepadBindingCount != 6
                || devices.supportsTextInput != true
                || devices.supportsMouseLook != true
                || devices.supportsGamepadMovement != true) {
            throw new GradleException('Phase 15.3 input device report did not prove keyboard, mouse, gamepad, and terminal text support')
        }
        def bindings = json.parse(file('reports/echo/standalone/input-bindings.json'))
        if (bindings.schema != 'echo.standalone.input_bindings.v2'
                || bindings.bindingCount != 40
                || bindings.gameplayBindingCount != 25
                || bindings.uiBindingCount != 13
                || bindings.terminalBindingCount != 2
                || bindings.hasKeyboardMovement != true
                || bindings.hasMousePrimary != true
                || bindings.hasMouseSecondary != true
                || bindings.hasMouseLook != true
                || bindings.hasHotbarDigits != true
                || bindings.hasInventoryDrag != true
                || bindings.hasInventorySplit != true
                || bindings.hasInventoryHotbarAssign != true
                || bindings.hasInventoryTooltip != true
                || bindings.hasInventoryUse != true
                || bindings.hasPause != true
                || bindings.hasGamepadInteract != true
                || !bindings.bindings.any { it.context == 'GAMEPLAY' && it.control == 'keyboard:arrowright' && it.action == 'MOVE_EAST' }) {
            throw new GradleException('Phase 15.3 input binding report did not prove gameplay/UI/terminal binding map')
        }
        def rebinding = json.parse(file('reports/echo/standalone/input-rebinding.json'))
        if (rebinding.schema != 'echo.standalone.input_rebinding.v2'
                || rebinding.context != 'GAMEPLAY'
                || rebinding.action != 'MOVE_EAST'
                || rebinding.oldControl != 'keyboard:d'
                || rebinding.newControl != 'keyboard:arrowright'
                || rebinding.oldBindingRemoved != true
                || rebinding.newBindingActive != true
                || rebinding.staleKey.handled != false
                || !rebinding.staleKey.effects.contains('unbound:GAMEPLAY:keyboard:d')
                || rebinding.reboundRoute.handled != true
                || rebinding.reboundRoute.action != 'MOVE_EAST'
                || rebinding.reboundRoute.control != 'keyboard:arrowright'
                || rebinding.reboundRoute.movement.to.key != '1,0,0'
                || rebinding.playerPositionAfterRebound.key != '1,0,0') {
            throw new GradleException('Phase 15.3 input rebinding report did not prove stale-key removal and rebound routing')
        }
        def focus = json.parse(file('reports/echo/standalone/input-focus.json'))
        if (focus.schema != 'echo.standalone.input_focus.v2'
                || focus.focusTerminal.handled != true
                || focus.focusTerminal.action != 'TERMINAL_FOCUS'
                || !focus.focusTerminal.effects.contains('focus:terminal')
                || focus.terminalText.handled != true
                || focus.terminalText.target != 'UI'
                || focus.terminalText.action != 'TERMINAL_SUBMIT_TEXT'
                || focus.blockedMove.handled != false
                || !focus.blockedMove.effects.contains('terminal-focus-blocks-gameplay')
                || focus.blurTerminal.handled != true
                || focus.blurTerminal.action != 'TERMINAL_BLUR'
                || !focus.terminalHistory.contains('status')
                || focus.terminalStatusOutput != true
                || focus.blockedMovementPreservedPosition != true
                || focus.finalContext != 'GAMEPLAY'
                || focus.finalFocusPath != 'gameplay:world') {
            throw new GradleException('Phase 15.3 input focus report did not prove terminal focus, text, blocking, and blur')
        }
        def routing = json.parse(file('reports/echo/standalone/input-routing.json'))
        if (routing.schema != 'echo.standalone.input_routing.v2'
                || routing.quickSlot.handled != true
                || routing.quickSlot.action != 'QUICK_SLOT_1'
                || routing.quickSlot.interaction.interactionId != 'ashfall:drink_water'
                || routing.waterRemainingAfterQuickSlot != 1
                || routing.slotNine.handled != true
                || routing.slotNine.action != 'QUICK_SLOT_9'
                || !routing.slotNine.effects.contains('quick-slot:9')
                || routing.mouseLook.handled != true
                || !routing.mouseLook.effects.contains('mouse-look:captured')
                || routing.inventoryToggle.target != 'UI'
                || !routing.inventoryToggle.effects.contains('mouse:released')
                || routing.pauseToggle.target != 'UI'
                || !routing.pauseToggle.effects.contains('overlay:pause')
                || !routing.inventoryDrag.effects.contains('inventory:drag_move')
                || !routing.inventorySplit.effects.contains('inventory:split_stack')
                || !routing.inventoryAssign.effects.contains('inventory:assign_hotbar:4')
                || !routing.inventoryTooltip.effects.contains('inventory:show_tooltip')
                || !routing.inventoryUse.effects.contains('inventory:use_selected')
                || routing.gamepadEast.movement.to.key != '2,0,0'
                || routing.gamepadSouth.movement.to.key != '2,0,1'
                || routing.mouseInteract.interaction.interactionId != 'ashfall:salvage_cache'
                || routing.finalPlayerPosition.key != '2,0,1'
                || routing.routingCoveredGameplayUiAndTerminal != true) {
            throw new GradleException('Phase 15.3 input routing report did not prove gameplay, UI, and terminal routing coverage')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'java.awt',
                'javafx',
                'glfw',
        ]
        def checkedSources = fileTree('echo-runtime-input/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-testkit/src/main/java') {
            include '**/EchoRuntimeInputSmokeHarness.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone input runtime source ${sourceFile}")
            }
        }
    }
}

