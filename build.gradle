tasks.register('runStandaloneManualWallclockHelperRehearsal') {
    group = 'verification'
    description = 'Runs the manual wall-clock capture helper in no-launch rehearsal mode and proves it refuses to replace human playtest sessions.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def packageImage = echoStandaloneReadJsonFile(file('reports/echo/standalone/packaged-opengl-client-image.json'))
        def captureScript = file('scripts/capture-manual-wallclock-playtest.ps1')
        def report = file('reports/echo/standalone/manual-wallclock-helper-rehearsal.json')
        def rehearsalEvidenceFile = file('build/tmp/manual-wallclock-helper-rehearsal/manual-playtest-report.json')
        report.parentFile.mkdirs()
        rehearsalEvidenceFile.parentFile.mkdirs()
        if (rehearsalEvidenceFile.isFile()) {
            rehearsalEvidenceFile.delete()
        }

        def executable = file(String.valueOf(packageImage.executable ?: 'build/jpackage-opengl-client/EchoStandaloneRuntime/EchoStandaloneRuntime.exe'))
        def portableZip = file(String.valueOf(packageImage.portableZipPath ?: 'build/distributions/EchoStandaloneRuntime-portable-opengl-client.zip'))
        if (!executable.isFile()) {
            throw new GradleException("Missing packaged EXE for manual helper rehearsal: ${executable}")
        }
        if (!portableZip.isFile()) {
            throw new GradleException("Missing portable ZIP for manual helper rehearsal: ${portableZip}")
        }
        if (!captureScript.isFile()) {
            throw new GradleException("Missing manual wall-clock capture helper: ${captureScript}")
        }

        def executableSha256 = echoStandaloneSha256(executable)
        def portableZipSha256 = echoStandaloneSha256(portableZip)
        def captureScriptSha256 = echoStandaloneSha256(captureScript)
        def command = [
                'powershell',
                '-NoProfile',
                '-NonInteractive',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                captureScript.absolutePath,
                '-SessionId',
                'packaged-opengl-30m',
                '-PackagedExePath',
                executable.absolutePath,
                '-PortableZipPath',
                portableZip.absolutePath,
                '-OutputPath',
                rehearsalEvidenceFile.absolutePath,
                '-ExpectedPackagedExeSha256',
                executableSha256,
                '-ExpectedPortableZipSha256',
                portableZipSha256,
                '-CaptureScriptSha256',
                captureScriptSha256,
                '-SaveLoadCheckpointPassed',
                '-CrashFreeExitPassed',
                '-NoIssues',
                '-NonInteractive',
                '-SkipLaunch'
        ]
        def process = new ProcessBuilder(command)
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        if (output.trim()) {
            println output.trim()
        }
        if (!rehearsalEvidenceFile.isFile()) {
            throw new GradleException("Manual wall-clock helper rehearsal did not write evidence: ${rehearsalEvidenceFile}")
        }

        def evidence = echoStandaloneReadJsonFile(rehearsalEvidenceFile)
        def sessions = evidence.requiredSessions instanceof Collection ? evidence.requiredSessions : []
        def rehearsedSession = sessions.find { String.valueOf(it.id) == 'packaged-opengl-30m' } ?: [:]
        def pendingSession = sessions.find { String.valueOf(it.id) == 'packaged-opengl-60m' } ?: [:]
        def passed = exitCode == 2
                && evidence.schema == 'echo.standalone.manual_playtest_report.v1'
                && evidence.status == 'PENDING'
                && evidence.manualEvidenceComplete == false
                && evidence.replacesHumanPlaytest == false
                && rehearsedSession.status == 'FAILED'
                && (rehearsedSession.packagedExeSha256 ?: '').toString().equalsIgnoreCase(executableSha256)
                && (rehearsedSession.portableZipSha256 ?: '').toString().equalsIgnoreCase(portableZipSha256)
                && (rehearsedSession.captureScriptSha256 ?: '').toString().equalsIgnoreCase(captureScriptSha256)
                && (rehearsedSession.saveLoadCheckpointResult ?: '') == 'PASS'
                && (rehearsedSession.crashFreeExitResult ?: '') == 'PASS'
                && String.valueOf(rehearsedSession.issuesNote ?: '').trim().length() > 0
                && String.valueOf(rehearsedSession.humanTesterAttestation ?: '').trim().isEmpty()
                && String.valueOf(rehearsedSession.interactionCoverageNote ?: '').trim().isEmpty()
                && String.valueOf(rehearsedSession.saveLoadCheckpointNote ?: '').trim().isEmpty()
                && String.valueOf(rehearsedSession.crashFreeExitNote ?: '').trim().isEmpty()
                && ((rehearsedSession.processSamples ?: 0) as Integer) == 0
                && ((rehearsedSession.visibleSamples ?: 0) as Integer) == 0
                && pendingSession.status == 'PENDING'

        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.manual_wallclock_helper_rehearsal.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneManualWallclockHelperRehearsal',
                status                    : passed ? 'PASS' : 'FAILED',
                summary                   : passed
                        ? 'Manual wall-clock helper rehearsal wrote structured evidence and refused to replace the required human playtest session.'
                        : 'Manual wall-clock helper rehearsal did not satisfy no-launch evidence checks.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesHumanPlaytest     : false,
                helperPath                : captureScript.path.replace('\\', '/'),
                helperSha256              : captureScriptSha256,
                packagedExePath           : executable.absolutePath.replace('\\', '/'),
                packagedExeSha256         : executableSha256,
                portableZipPath           : portableZip.absolutePath.replace('\\', '/'),
                portableZipSha256         : portableZipSha256,
                rehearsalEvidencePath     : rehearsalEvidenceFile.absolutePath.replace('\\', '/'),
                helperExitCode            : exitCode,
                expectedHelperExitCode    : 2,
                helperReportStatus        : evidence.status ?: 'UNKNOWN',
                helperManualEvidenceComplete: evidence.manualEvidenceComplete == true,
                rehearsedSessionId        : rehearsedSession.id ?: '',
                rehearsedSessionStatus    : rehearsedSession.status ?: 'UNKNOWN',
                rehearsedSessionProcessSamples: rehearsedSession.processSamples ?: 0,
                rehearsedSessionVisibleSamples: rehearsedSession.visibleSamples ?: 0,
                rehearsedSessionHumanAttestationPresent: String.valueOf(rehearsedSession.humanTesterAttestation ?: '').trim().length() > 0,
                rehearsedSessionInteractionCoveragePresent: String.valueOf(rehearsedSession.interactionCoverageNote ?: '').trim().length() > 0,
                rehearsedSessionSaveLoadNotePresent: String.valueOf(rehearsedSession.saveLoadCheckpointNote ?: '').trim().length() > 0,
                rehearsedSessionCrashFreeNotePresent: String.valueOf(rehearsedSession.crashFreeExitNote ?: '').trim().length() > 0,
                pendingSessionPreserved   : pendingSession.status == 'PENDING'
        ])
        if (!passed) {
            throw new GradleException("Manual wall-clock helper rehearsal failed; see ${report}")
        }
    }
}

tasks.register('runStandaloneManualWallclockCaptureRehearsal') {
    group = 'verification'
    description = 'Verifies the manual wall-clock capture protocol against current packaged OpenGL evidence without replacing human sessions.'
    dependsOn tasks.named('runStandaloneManualPlaytestEvidenceTemplate')
    dependsOn tasks.named('runStandaloneManualWallclockHelperRehearsal')
    if (echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()) {
        dependsOn tasks.named('runStandalonePackagedOpenGlImageSmoke')
        dependsOn tasks.named('runStandalonePackagedOpenGlImageStrictRehearsal')
    } else {
        dependsOn tasks.named('writeStandaloneVisibleWindowLaunchOptInReports')
    }

    doLast {
        def json = new groovy.json.JsonSlurper()
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                throw new GradleException("Missing manual wall-clock capture input report: ${relativePath}")
            }
            def parsed = json.parse(reportFile)
            if (String.valueOf(parsed.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Bootstrap placeholder is not accepted for manual wall-clock capture input: ${relativePath}")
            }
            parsed.path = relativePath
            parsed
        }
        def text = { Object value -> String.valueOf(value ?: '') }
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def count = { Object value -> value instanceof Number ? value.intValue() : String.valueOf(value ?: '0').toInteger() }

        def manual = readReport('reports/echo/standalone/manual-playtest-report.json')
        def smoke = readReport('reports/echo/standalone/packaged-exe-wallclock-smoke.json')
        def strict = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json')
        def packageImage = readReport('reports/echo/standalone/packaged-opengl-client-image.json')
        def helperRehearsal = readReport('reports/echo/standalone/manual-wallclock-helper-rehearsal.json')
        def captureScript = file('scripts/capture-manual-wallclock-playtest.ps1')
        def captureScriptSha256 = captureScript.isFile() ? echoStandaloneSha256(captureScript) : ''
        def sessions = (manual.requiredSessions ?: []) as List
        def sessionIds = sessions.collect { text(it.id) }
        def requiredCaptureFields = [
                'tester identity',
                'session id',
                'start wall-clock timestamp',
                'end wall-clock timestamp',
                'duration minutes',
                'packaged EXE path',
                'packaged EXE SHA-256',
                'portable ZIP SHA-256',
                'capture script SHA-256',
                'human tester attestation',
                'interaction coverage note',
                'save/load checkpoint result',
                'save/load checkpoint note',
                'crash-free exit result',
                'crash-free exit note',
                'issues found or explicit no-issues note'
        ]
        def passLike = { Object value ->
            if (value == true) {
                return true
            }
            def normalized = text(value).trim().toUpperCase(java.util.Locale.ROOT)
            ['PASS', 'PASSED', 'TRUE', 'OK', 'YES'].contains(normalized)
        }
        def firstText = { Object object, List<String> keys ->
            for (String key : keys) {
                def value = object?."${key}"
                if (text(value).trim().length() > 0) {
                    return text(value).trim()
                }
            }
            ''
        }
        def firstPassLike = { Object object, List<String> keys ->
            keys.any { key -> passLike(object?."${key}") }
        }
        def expectedSessionMinutes = [
                'packaged-opengl-30m': 30,
                'packaged-opengl-60m': 60
        ]
        def currentExecutableSha256 = text(packageImage.executableSha256)
        def currentPortableZipSha256 = text(packageImage.portableZipSha256 ?: smoke.portableZipSha256)
        def sessionSummaries = sessions.collect { session ->
            def id = text(session.id)
            def requiredMinutes = expectedSessionMinutes[id] ?: 30
            def tester = firstText(session, ['tester', 'testerIdentity'])
            def startedAt = firstText(session, ['startedAt', 'startWallClockTimestamp', 'runStartedAt'])
            def endedAt = firstText(session, ['endedAt', 'endWallClockTimestamp', 'runEndedAt'])
            def packagedExePath = firstText(session, ['packagedExePath', 'packagedExecutablePath'])
            def packagedExeSha256 = firstText(session, ['packagedExeSha256', 'packagedExecutableSha256'])
            def portableZipSha256 = firstText(session, ['portableZipSha256'])
            def sessionCaptureScriptSha256 = firstText(session, ['captureScriptSha256'])
            def humanAttestation = firstText(session, ['humanTesterAttestation', 'humanAttestation'])
            def interactionCoverageNote = firstText(session, ['interactionCoverageNote', 'interactionNotes'])
            def durationMinutes = count(session.durationMinutes)
            def saveLoadPassed = firstPassLike(session, ['saveLoadCheckpointResult', 'saveLoadCheckpoint', 'saveLoadResult'])
            def saveLoadCheckpointNote = firstText(session, ['saveLoadCheckpointNote', 'saveLoadNote'])
            def crashFreePassed = firstPassLike(session, ['crashFreeExitResult', 'crashFreeExit'])
            def crashFreeExitNote = firstText(session, ['crashFreeExitNote', 'crashFreeNote'])
            def issuesNote = firstText(session, ['issuesNote', 'issuesFoundOrNoIssuesNote', 'notes'])
            def survivalRoutePassed = id == 'packaged-opengl-60m'
                    ? firstPassLike(session, ['survivalRouteCoverage', 'survivalRouteCovered'])
                    : true
            def deathRecoveryPassed = id == 'packaged-opengl-60m'
                    ? firstPassLike(session, ['deathRecoveryCoverage', 'deathRecoveryCovered'])
                    : true
            def packagedHashMatches = packagedExeSha256.length() == 64
                    && currentExecutableSha256.length() == 64
                    && packagedExeSha256.equalsIgnoreCase(currentExecutableSha256)
            def portableHashMatches = portableZipSha256.length() == 64
                    && currentPortableZipSha256.length() == 64
                    && portableZipSha256.equalsIgnoreCase(currentPortableZipSha256)
            def captureScriptHashMatches = captureScriptSha256.length() == 64
                    && sessionCaptureScriptSha256.equalsIgnoreCase(captureScriptSha256)
            def sessionPassed = text(session.status) == 'PASS'
                    && durationMinutes >= requiredMinutes
                    && tester.length() > 0
                    && startedAt.length() > 0
                    && endedAt.length() > 0
                    && packagedExePath.length() > 0
                    && packagedHashMatches
                    && portableHashMatches
                    && captureScriptHashMatches
                    && humanAttestation.length() > 0
                    && interactionCoverageNote.length() > 0
                    && saveLoadPassed
                    && saveLoadCheckpointNote.length() > 0
                    && crashFreePassed
                    && crashFreeExitNote.length() > 0
                    && issuesNote.length() > 0
                    && survivalRoutePassed
                    && deathRecoveryPassed
            [
                    id                         : id,
                    status                     : text(session.status ?: 'UNKNOWN'),
                    durationMinutes            : durationMinutes,
                    requiredMinutes            : requiredMinutes,
                    testerPresent              : tester.length() > 0,
                    startedAtPresent           : startedAt.length() > 0,
                    endedAtPresent             : endedAt.length() > 0,
                    packagedExePathPresent     : packagedExePath.length() > 0,
                    packagedExeSha256Matches   : packagedHashMatches,
                    portableZipSha256Matches   : portableHashMatches,
                    captureScriptSha256Matches  : captureScriptHashMatches,
                    humanTesterAttestationPresent: humanAttestation.length() > 0,
                    interactionCoverageNotePresent: interactionCoverageNote.length() > 0,
                    saveLoadCheckpointPassed   : saveLoadPassed,
                    saveLoadCheckpointNotePresent: saveLoadCheckpointNote.length() > 0,
                    crashFreeExitPassed        : crashFreePassed,
                    crashFreeExitNotePresent   : crashFreeExitNote.length() > 0,
                    issuesNotePresent          : issuesNote.length() > 0,
                    survivalRouteCoveragePassed: survivalRoutePassed,
                    deathRecoveryCoveragePassed: deathRecoveryPassed,
                    requiredEvidenceCount      : ((session.requiredEvidence ?: []) as List).size(),
                    passed                     : sessionPassed
            ]
        }
        def smokeReady = text(smoke.status) == 'PASS'
                && text(smoke.rendererTarget) == 'opengl'
                && bool(smoke.aliveAfterProbe)
                && count(smoke.aliveSamples) >= 15
                && bool(smoke.replacesHumanPlaytest) == false
        def strictReady = text(strict.status) == 'PASS'
                && text(strict.rendererTarget) == 'opengl'
                && bool(strict.visibleWindow)
                && bool(strict.aliveAfterProbe)
                && count(strict.completedDurationSeconds) >= 20
                && bool(strict.replacesHumanPlaytest) == false
                && bool(strict.releaseRunAccepted) == false
        def packageHashConsistent = text(smoke.portableZipSha256).length() == 64
                && text(smoke.portableZipSha256) == text(strict.portableZipSha256)
                && text(smoke.portableZipSha256) == text(packageImage.portableZipSha256)
        def helperRehearsalReady = text(helperRehearsal.status) == 'PASS'
                && bool(helperRehearsal.replacesHumanPlaytest) == false
                && count(helperRehearsal.helperExitCode) == 2
                && count(helperRehearsal.expectedHelperExitCode) == 2
                && text(helperRehearsal.helperReportStatus) == 'PENDING'
                && bool(helperRehearsal.helperManualEvidenceComplete) == false
                && text(helperRehearsal.rehearsedSessionStatus) == 'FAILED'
                && count(helperRehearsal.rehearsedSessionProcessSamples) == 0
                && count(helperRehearsal.rehearsedSessionVisibleSamples) == 0
                && bool(helperRehearsal.pendingSessionPreserved)
                && text(helperRehearsal.helperSha256).equalsIgnoreCase(captureScriptSha256)
                && text(helperRehearsal.packagedExeSha256).equalsIgnoreCase(currentExecutableSha256)
                && text(helperRehearsal.portableZipSha256).equalsIgnoreCase(currentPortableZipSha256)
        def pendingCaptureProtocolReady = text(manual.status) == 'PENDING'
                && bool(manual.manualEvidenceComplete) == false
                && bool(manual.nativeModLoaderCommandUsed) == false
                && bool(manual.replacesHumanPlaytest) == false
                && text(manual.captureScriptSha256).equalsIgnoreCase(captureScriptSha256)
                && sessions.size() == 2
                && sessionIds.containsAll(['packaged-opengl-30m', 'packaged-opengl-60m'])
                && sessions.every { session ->
                    count(session.durationMinutes) >= 30
                            && ((session.requiredEvidence ?: []) as List).size() >= 6
                }
        def completedHumanEvidenceReady = text(manual.status) == 'PASS'
                && bool(manual.manualEvidenceComplete)
                && bool(manual.nativeModLoaderCommandUsed) == false
                && bool(manual.replacesHumanPlaytest) == false
                && text(manual.captureScriptSha256).equalsIgnoreCase(captureScriptSha256)
                && sessions.size() == 2
                && sessionIds.containsAll(['packaged-opengl-30m', 'packaged-opengl-60m'])
                && sessionSummaries.every { it.passed }
        def captureProtocolReady = pendingCaptureProtocolReady || completedHumanEvidenceReady
        def strict30mReport = file('reports/echo/standalone/packaged-exe-wallclock-strict-30m.json')
        strict30mReport.parentFile.mkdirs()
        def strict30mParsed = null
        if (strict30mReport.isFile()) {
            try {
                strict30mParsed = json.parse(strict30mReport)
            } catch (Exception ignored) {
                strict30mParsed = null
            }
        }
        def strict30mPass = strict30mParsed != null
                && strict30mParsed.schema == 'echo.standalone.packaged_exe_wallclock_strict_30m.v1'
                && strict30mParsed.status == 'PASS'
                && strict30mParsed.rendererTarget == 'opengl'
                && strict30mParsed.replacesHumanPlaytest == false
                && strict30mParsed.releaseRunAccepted == true
                && count(strict30mParsed.requiredDurationSeconds) >= 1800
                && count(strict30mParsed.completedDurationSeconds) >= 1800
                && count(strict30mParsed.processSamples) == count(strict30mParsed.sampleCount)
                && count(strict30mParsed.missingProcessSamples) == 0
                && count(strict30mParsed.invisibleSamplesAfterGrace) == 0
                && strict30mParsed.visibleWindow == true
                && strict30mParsed.aliveAfterProbe == true
        def strict30mWindowLaunchBlocked = strict30mParsed != null
                && bool(strict30mParsed.windowLaunchOptInRequired)
        if (!strict30mPass && !strict30mWindowLaunchBlocked) {
            strict30mReport.text = echoStandaloneJson([
                    schema                    : 'echo.standalone.packaged_exe_wallclock_strict_30m.v1',
                    generatedAt               : '1970-01-01T00:00:00Z',
                    generator                 : 'runStandaloneManualWallclockCaptureRehearsal',
                    status                    : 'PENDING_MONITOR_NOT_RUN',
                    summary                   : 'Thirty-minute strict packaged EXE monitor remains pending; the current rehearsal proves the capture protocol but does not replace the required wall-clock run.',
                    rendererTarget            : 'opengl',
                    nativeModLoaderCommandUsed: false,
                    replacesHumanPlaytest     : false,
                    releaseRunAccepted        : false,
                    requiredDurationSeconds   : 1800,
                    completedDurationSeconds  : 0,
                    rehearsalEvidence         : strict.path,
                    smokeEvidence             : smoke.path,
                    manualPlaytestEvidence    : manual.path,
                    executable                : packageImage.executable ?: smoke.executable,
                    portableZipPath           : packageImage.portableZipPath ?: smoke.portableZipPath,
                    portableZipSha256         : smoke.portableZipSha256,
                    requiredSessionId         : 'packaged-opengl-30m',
                    requiredCaptureFields     : requiredCaptureFields,
                    monitorTask               : 'runStandalonePackagedOpenGlImageStrict30mMonitor',
                    requiredNextAction        : 'Run runStandalonePackagedOpenGlImageStrict30mMonitor to capture a real 30-minute packaged OpenGL EXE monitor; this still does not replace the required human playtest sessions.'
            ])
            strict30mParsed = json.parse(strict30mReport)
        }
        def strict30mConcrete = strict30mParsed.schema == 'echo.standalone.packaged_exe_wallclock_strict_30m.v1'
                && strict30mParsed.replacesHumanPlaytest == false
                && ((strict30mParsed.status == 'PENDING_MONITOR_NOT_RUN' && strict30mParsed.releaseRunAccepted == false)
                        || strict30mPass
                        || strict30mWindowLaunchBlocked)
        def strict60mReport = file('reports/echo/standalone/packaged-exe-wallclock-strict-60m.json')
        strict60mReport.parentFile.mkdirs()
        def strict60mParsed = null
        if (strict60mReport.isFile()) {
            try {
                strict60mParsed = json.parse(strict60mReport)
            } catch (Exception ignored) {
                strict60mParsed = null
            }
        }
        def strict60mPass = strict60mParsed != null
                && strict60mParsed.schema == 'echo.standalone.packaged_exe_wallclock_strict_60m.v1'
                && strict60mParsed.status == 'PASS'
                && strict60mParsed.rendererTarget == 'opengl'
                && strict60mParsed.replacesHumanPlaytest == false
                && strict60mParsed.releaseRunAccepted == true
                && count(strict60mParsed.requiredDurationSeconds) >= 3600
                && count(strict60mParsed.completedDurationSeconds) >= 3600
                && count(strict60mParsed.processSamples) == count(strict60mParsed.sampleCount)
                && count(strict60mParsed.missingProcessSamples) == 0
                && count(strict60mParsed.invisibleSamplesAfterGrace) == 0
                && strict60mParsed.visibleWindow == true
                && strict60mParsed.aliveAfterProbe == true
        def strict60mWindowLaunchBlocked = strict60mParsed != null
                && bool(strict60mParsed.windowLaunchOptInRequired)
        if (!strict60mPass && !strict60mWindowLaunchBlocked) {
            strict60mReport.text = echoStandaloneJson([
                    schema                    : 'echo.standalone.packaged_exe_wallclock_strict_60m.v1',
                    generatedAt               : '1970-01-01T00:00:00Z',
                    generator                 : 'runStandaloneManualWallclockCaptureRehearsal',
                    status                    : 'PENDING_MONITOR_NOT_RUN',
                    summary                   : 'Sixty-minute strict packaged EXE monitor remains pending; the current rehearsal proves the capture protocol but does not replace the required wall-clock run.',
                    rendererTarget            : 'opengl',
                    nativeModLoaderCommandUsed: false,
                    replacesHumanPlaytest     : false,
                    releaseRunAccepted        : false,
                    requiredDurationSeconds   : 3600,
                    completedDurationSeconds  : 0,
                    rehearsalEvidence         : strict.path,
                    smokeEvidence             : smoke.path,
                    manualPlaytestEvidence    : manual.path,
                    executable                : packageImage.executable ?: smoke.executable,
                    portableZipPath           : packageImage.portableZipPath ?: smoke.portableZipPath,
                    portableZipSha256         : smoke.portableZipSha256,
                    requiredSessionId         : 'packaged-opengl-60m',
                    requiredCaptureFields     : requiredCaptureFields,
                    monitorTask               : 'runStandalonePackagedOpenGlImageStrict60mMonitor',
                    requiredNextAction        : 'Run runStandalonePackagedOpenGlImageStrict60mMonitor to capture a real 60-minute packaged OpenGL EXE monitor; this still does not replace the required human playtest sessions.'
            ])
            strict60mParsed = json.parse(strict60mReport)
        }
        def strict60mConcrete = strict60mParsed.schema == 'echo.standalone.packaged_exe_wallclock_strict_60m.v1'
                && strict60mParsed.replacesHumanPlaytest == false
                && ((strict60mParsed.status == 'PENDING_MONITOR_NOT_RUN' && strict60mParsed.releaseRunAccepted == false)
                        || strict60mPass
                        || strict60mWindowLaunchBlocked)
        def passed = smokeReady && strictReady && packageHashConsistent && helperRehearsalReady && captureProtocolReady && strict30mConcrete && strict60mConcrete
        def windowLaunchBlocked = bool(smoke.windowLaunchOptInRequired)
                || bool(strict.windowLaunchOptInRequired)
                || strict30mWindowLaunchBlocked
                || strict60mWindowLaunchBlocked
        def report = file('reports/echo/standalone/manual-wallclock-capture-rehearsal.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                          : 'echo.standalone.manual_wallclock_capture_rehearsal.v1',
                generatedAt                     : '1970-01-01T00:00:00Z',
                generator                       : 'runStandaloneManualWallclockCaptureRehearsal',
                status                          : passed ? 'PASS' : 'BLOCKED',
                summary                         : passed
                        ? (completedHumanEvidenceReady
                                ? 'Manual wall-clock playtest evidence is complete and backed by current packaged EXE smoke/rehearsal evidence.'
                                : 'Manual wall-clock capture protocol is ready and backed by current packaged EXE smoke/rehearsal evidence; human sessions remain pending.')
                        : (windowLaunchBlocked
                                ? 'Manual wall-clock capture protocol is blocked because visible packaged EXE probes require explicit opt-in.'
                                : 'Manual wall-clock capture protocol is incomplete or backed by stale packaged EXE evidence.'),
                rendererTarget                  : 'opengl',
                nativeModLoaderCommandUsed      : false,
                manualEvidenceComplete          : completedHumanEvidenceReady,
                replacesHumanPlaytest           : false,
                windowLaunchSkipped             : windowLaunchBlocked,
                windowLaunchOptInRequired       : windowLaunchBlocked,
                captureProtocolReady            : captureProtocolReady,
                pendingHumanEvidence            : pendingCaptureProtocolReady,
                completedHumanEvidenceReady     : completedHumanEvidenceReady,
                smokeEvidenceReady              : smokeReady,
                strictRehearsalReady            : strictReady,
                packageHashConsistent           : packageHashConsistent,
                helperRehearsalReady            : helperRehearsalReady,
                helperRehearsalReport           : helperRehearsal.path,
                helperRehearsalStatus           : helperRehearsal.status,
                helperRehearsalExitCode         : helperRehearsal.helperExitCode,
                helperRehearsalReplacesHumanPlaytest: helperRehearsal.replacesHumanPlaytest,
                strict30mMonitorReportConcrete  : strict30mConcrete,
                strict30mMonitorStatus          : strict30mParsed.status,
                strict30mMonitorReleaseRunAccepted: strict30mParsed.releaseRunAccepted,
                strict30mMonitorReport          : 'reports/echo/standalone/packaged-exe-wallclock-strict-30m.json',
                strict60mMonitorReportConcrete  : strict60mConcrete,
                strict60mMonitorStatus          : strict60mParsed.status,
                strict60mMonitorReleaseRunAccepted: strict60mParsed.releaseRunAccepted,
                strict60mMonitorReport          : 'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json',
                requiredSessionCount            : sessions.size(),
                requiredSessions                : sessionSummaries,
                requiredCaptureFieldCount       : requiredCaptureFields.size(),
                requiredCaptureFields           : requiredCaptureFields,
                captureScript                   : captureScript.path.replace('\\', '/'),
                captureScriptSha256             : captureScriptSha256,
                manualCaptureScriptSha256Matches: text(manual.captureScriptSha256).equalsIgnoreCase(captureScriptSha256),
                executable                      : packageImage.executable ?: smoke.executable,
                portableZipPath                 : packageImage.portableZipPath ?: smoke.portableZipPath,
                portableZipSha256               : smoke.portableZipSha256,
                automatedEvidence               : [
                        smoke.path,
                        strict.path,
                        packageImage.path,
                        helperRehearsal.path,
                        'reports/echo/standalone/packaged-exe-wallclock-strict-30m.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-60m.json'
                ],
                remainingManualEvidence         : [
                ] + (completedHumanEvidenceReady ? [] : [
                        '30-minute wall-clock packaged OpenGL EXE tester session',
                        '60-minute wall-clock packaged OpenGL EXE tester session'
                ]),
                blockers                        : passed ? [] : [
                        [
                                id     : 'manual.capture.protocol',
                                status : windowLaunchBlocked ? 'BLOCKED_WINDOW_LAUNCH_OPT_IN_REQUIRED' : 'BLOCKED',
                                detail : windowLaunchBlocked
                                        ? 'Visible packaged EXE smoke/rehearsal evidence was intentionally skipped unless -PechoStandaloneAllowWindowLaunch=true is supplied.'
                                        : 'Capture protocol, completed human evidence, smoke evidence, strict rehearsal, or package hash consistency failed.',
                                sessions: sessionSummaries
                        ]
                ]
        ])
        if (!passed && !windowLaunchBlocked) {
            throw new GradleException("Manual wall-clock capture rehearsal failed; see ${report}")
        }
    }
}

