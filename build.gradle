tasks.register('prepareStandaloneAgent4RegistryContentFixture') {
    group = 'verification'
    description = 'Creates a deterministic Agent 4 registry/content fixture for the standalone data smoke.'

    doLast {
        def fixtureRoot = layout.buildDirectory.dir('tmp/agent4-registry-content').get().asFile
        delete fixtureRoot
        def resourceRoot = new File(fixtureRoot, 'src/main/resources')
        def filesByRelativePath = [:]

        def writeText = { String relativePath, String text ->
            def target = new File(resourceRoot, relativePath)
            target.parentFile.mkdirs()
            target.setText(text.stripIndent().trim() + System.lineSeparator(), 'UTF-8')
            filesByRelativePath[relativePath] = target
            target
        }
        def writeBytes = { String relativePath, byte[] bytes ->
            def target = new File(resourceRoot, relativePath)
            target.parentFile.mkdirs()
            target.bytes = bytes
            filesByRelativePath[relativePath] = target
            target
        }
        def jsonText = { value ->
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value))
        }

        writeText('assets/echoagent4/blockstates/test_block.json', jsonText([
                variants: [
                        '': [model: 'echoagent4:block/test_block']
                ]
        ]))
        writeText('assets/echoagent4/models/block/test_block.json', jsonText([
                parent  : 'minecraft:block/cube_all',
                textures: [all: 'echoagent4:block/test_block']
        ]))
        writeText('assets/echoagent4/models/item/test_item.json', jsonText([
                parent  : 'minecraft:item/generated',
                textures: [layer0: 'echoagent4:item/test_item']
        ]))
        writeText('assets/echoagent4/models/entity/test_entity.json', jsonText([
                parent  : 'minecraft:item/generated',
                textures: [layer0: 'echoagent4:entity/test_entity']
        ]))
        writeBytes('assets/echoagent4/textures/block/test_block.png', 'agent4-block-texture'.getBytes('UTF-8'))
        writeBytes('assets/echoagent4/textures/item/test_item.png', 'agent4-item-texture'.getBytes('UTF-8'))
        writeBytes('assets/echoagent4/textures/entity/test_entity.png', 'agent4-entity-texture'.getBytes('UTF-8'))
        writeText('assets/echoagent4/lang/en_us.json', jsonText([
                'block.echoagent4.test_block'  : 'Agent 4 Test Block',
                'item.echoagent4.test_item'    : 'Agent 4 Test Item',
                'entity.echoagent4.test_entity': 'Agent 4 Test Entity'
        ]))
        writeText('assets/echoagent4/sounds.json', jsonText([
                test_ping: [sounds: ['echoagent4:test_ping']]
        ]))
        writeBytes('assets/echoagent4/sounds/test_ping.ogg', 'agent4-sound'.getBytes('UTF-8'))
        writeText('assets/echoagent4/themes/test_theme.json', jsonText([
                id     : 'echoagent4:themes/test_theme',
                palette: [primary: '#5a8dee']
        ]))
        writeText('assets/echoagent4/textureforge/specs/test_spec.json', jsonText([
                styleFamily     : 'agent4-fixture',
                defaultResolution: '16x16',
                assets          : [[
                        id        : 'generated/test_block',
                        outputPath: 'textures/block/generated_test_block.png',
                        status    : 'ready',
                        notes     : 'deterministic fixture'
                ]]
        ]))
        writeText('data/echoagent4/recipes/test_recipe.json', jsonText([
                type       : 'minecraft:crafting_shaped',
                pattern    : ['A'],
                key        : [A: [item: 'minecraft:stone']],
                result     : [id: 'echoagent4:test_item', count: 1],
                echoOutputs: ['echoagent4:test_item']
        ]))
        writeText('data/echoagent4/loot_tables/blocks/test_block.json', jsonText([
                entries: ['echoagent4:test_item']
        ]))
        def tagA = writeText('data/minecraft/tags/block/mineable/pickaxe.json', jsonText([
                replace: false,
                values : ['echoagent4:test_block', 'echoagent4:test_item', 'echoagent4:test_entity']
        ]))
        writeText('data/echoagent4/structures/test_structure.json', jsonText([
                references: ['echoagent4:test_block']
        ]))
        writeText('data/echoagent4/echoindex/entries/test_item.json', jsonText([
                id        : 'echoagent4:test_item',
                title     : 'Agent 4 Test Item',
                references: ['echoagent4:test_item']
        ]))
        writeText('data/echoagent4/echoterminal/pages/agent4/test.json', jsonText([
                id        : 'echoagent4:echoterminal/pages/agent4/test',
                references: ['echoagent4:test_item']
        ]))
        writeText('data/echoagent4/missioncore/missions/test_mission.json', jsonText([
                id        : 'echoagent4:missioncore/missions/test_mission',
                references: ['echoagent4:test_block']
        ]))
        writeText('data/echoagent4/echoworldcore/world_regions/test_region.json', jsonText([
                id        : 'echoagent4:echoworldcore/world_regions/test_region',
                references: ['echoagent4:test_block']
        ]))
        writeText('data/echoagent4/echoworldcore/world_hazards/test_hazard.json', jsonText([
                id        : 'echoagent4:echoworldcore/world_hazards/test_hazard',
                references: ['echoagent4:test_block']
        ]))

        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            digest.digest(file.bytes).encodeHex().toString()
        }
        def entry = { String kind, String id, String relativePath ->
            def file = filesByRelativePath[relativePath]
            if (file == null || !file.isFile()) {
                throw new GradleException("Missing Agent 4 fixture resource: ${relativePath}")
            }
            [
                    kind     : kind,
                    id       : id,
                    namespace: id.contains(':') ? id.substring(0, id.indexOf(':')) : 'echoagent4',
                    addon    : 'echoagent4',
                    path     : file.absolutePath.replace('\\', '/'),
                    sha256   : sha256(file),
                    size     : file.length()
            ]
        }
        def tagEntry = { File file ->
            [
                    kind     : 'tags',
                    id       : 'minecraft:tags/block/mineable/pickaxe',
                    namespace: 'minecraft',
                    addon    : 'echoagent4',
                    path     : file.absolutePath.replace('\\', '/'),
                    sha256   : sha256(file),
                    size     : file.length()
            ]
        }
        def entries = [
                entry('blockstates', 'echoagent4:blockstates/test_block', 'assets/echoagent4/blockstates/test_block.json'),
                entry('models', 'echoagent4:models/block/test_block', 'assets/echoagent4/models/block/test_block.json'),
                entry('models', 'echoagent4:models/item/test_item', 'assets/echoagent4/models/item/test_item.json'),
                entry('models', 'echoagent4:models/entity/test_entity', 'assets/echoagent4/models/entity/test_entity.json'),
                entry('textures', 'echoagent4:textures/block/test_block', 'assets/echoagent4/textures/block/test_block.png'),
                entry('textures', 'echoagent4:textures/item/test_item', 'assets/echoagent4/textures/item/test_item.png'),
                entry('textures', 'echoagent4:textures/entity/test_entity', 'assets/echoagent4/textures/entity/test_entity.png'),
                entry('lang', 'echoagent4:lang/en_us', 'assets/echoagent4/lang/en_us.json'),
                entry('sounds', 'echoagent4:sounds', 'assets/echoagent4/sounds.json'),
                entry('assets', 'echoagent4:sounds/test_ping', 'assets/echoagent4/sounds/test_ping.ogg'),
                entry('assets', 'echoagent4:textureforge/specs/test_spec', 'assets/echoagent4/textureforge/specs/test_spec.json'),
                entry('uiThemes', 'echoagent4:themes/test_theme', 'assets/echoagent4/themes/test_theme.json'),
                entry('recipes', 'echoagent4:test_recipe', 'data/echoagent4/recipes/test_recipe.json'),
                entry('lootTables', 'echoagent4:blocks/test_block', 'data/echoagent4/loot_tables/blocks/test_block.json'),
                tagEntry(tagA),
                entry('structures', 'echoagent4:test_structure', 'data/echoagent4/structures/test_structure.json'),
                entry('data', 'echoagent4:echoindex/entries/test_item', 'data/echoagent4/echoindex/entries/test_item.json'),
