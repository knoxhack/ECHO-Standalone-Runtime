tasks.register('verifyStandalonePlayableLoopRuntime') {
    group = 'verification'
    description = 'Verifies the Agent 3 standalone playable-loop checklist artifact and platform boundary.'
    dependsOn tasks.named('runStandalonePlayableLoopSmoke')

    doLast {
        [
                'reports/echo/standalone/standalone-playable-loop.json',
        ].each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing standalone playable-loop artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        def playableLoop = json.parse(file('reports/echo/standalone/standalone-playable-loop.json'))
        if (String.valueOf(playableLoop.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
            throw new GradleException('Standalone playable-loop report is still bootstrap placeholder evidence')
        }
        if (String.valueOf(playableLoop.status ?: 'UNKNOWN') != 'PASS') {
            throw new GradleException("Standalone playable-loop report did not pass: status=${playableLoop.status ?: 'UNKNOWN'}")
        }
        if (String.valueOf(playableLoop.schema ?: '') != 'echo.standalone.playable_loop.v2'
                || String.valueOf(playableLoop.ready) != 'true'
                || String.valueOf(playableLoop.newGame) != 'true'
                || String.valueOf(playableLoop.spawn) != 'true'
                || String.valueOf(playableLoop.move) != 'true'
                || String.valueOf(playableLoop.openTerminal) != 'true'
                || String.valueOf(playableLoop.completeObjective) != 'true'
                || String.valueOf(playableLoop.interactWithHazard) != 'true'
                || String.valueOf(playableLoop.useItem) != 'true'
                || String.valueOf(playableLoop.save) != 'true'
                || String.valueOf(playableLoop.load) != 'true'
                || String.valueOf(playableLoop.continueGame) != 'true'
                || String.valueOf(playableLoop.exitCleanly) != 'true'
                || !String.valueOf(playableLoop.shellSummary ?: '').contains('newGame=true')
                || !String.valueOf(playableLoop.playableSummary ?: '').contains('route=17/17')
                || !String.valueOf(playableLoop.playableSummary ?: '').contains('mission=63/63')
                || !String.valueOf(playableLoop.saveSummary ?: '').contains('midRoute=true')
                || !String.valueOf(playableLoop.exitSummary ?: '').contains('lifecycle=STOPPED')) {
            throw new GradleException('Standalone playable-loop report did not prove new game, spawn, movement, terminal, objective, hazard, item, save/load, continue, and clean exit')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
                'sun.audio',
                'java.net',
                'javax.websocket',
                'io.netty',
        ]
        def checkedSources = fileTree('echo-runtime-app/src/main/java') {
            include '**/EchoStandalonePlayableLoop*.java'
        } + fileTree('echo-runtime-testkit/src/main/java') {
            include '**/EchoRuntimePlayableLoopSmokeHarness.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone playable-loop source ${sourceFile}")
            }
        }
    }
}

