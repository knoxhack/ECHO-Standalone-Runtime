tasks.register('writeStandaloneVisibleWindowLaunchOptInReports') {
    group = 'verification'
    description = 'Writes blocked evidence for standalone tasks that would launch and then clean up visible Windows EXEs unless explicitly opted in.'
    onlyIf {
        !echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()
    }
    doLast {
        echoStandaloneVisibleWindowReportSpecs().each { spec ->
            echoStandaloneWriteWindowLaunchBlockedReport(
                    spec.taskName.toString(),
                    spec.reportPath.toString(),
                    spec.schema.toString(),
                    (Map) spec.details
            )
        }
    }
}

def echoStandaloneRequireWindowLaunchOptIn = { String taskName, String reportPath, String schema, Map details = [:] ->
    if (echoStandaloneWindowLaunchOptIn.get().toString().toBoolean()) {
        return
    }
    echoStandaloneWriteWindowLaunchBlockedReport(taskName, reportPath, schema, details)
    throw new GradleException("${taskName} launches a visible standalone window and terminates its own process after sampling. Re-run with -PechoStandaloneAllowWindowLaunch=true when that is intentional.")
}

