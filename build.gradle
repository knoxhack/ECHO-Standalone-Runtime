tasks.register('verifyStandaloneWorldRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.9 world runtime prototype artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneWorldRuntimeSmoke')

    doLast {
        def requiredReports = [
                'reports/echo/standalone/runtime-world.json',
                'reports/echo/standalone/world-dimensions.json',
                'reports/echo/standalone/world-regions.json',
                'reports/echo/standalone/world-chunks.json',
                'reports/echo/standalone/world-hazards.json',
                'reports/echo/standalone/world-weather.json',
                'reports/echo/standalone/world-pois.json',
                'reports/echo/standalone/world-save-hooks.json',
        ]
        ([
                'docs/echo/standalone/ECHO_STANDALONE_WORLD_RUNTIME.md',
        ] + requiredReports).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.9 artifact: ${requiredPath}")
            }
        }
        def json = new groovy.json.JsonSlurper()
        requiredReports.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.9 world report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status) != 'PASS') {
                throw new GradleException("Phase 14.9 world report did not pass: ${requiredPath} status=${report.status}")
            }
        }
        def runtimeWorld = json.parse(file('reports/echo/standalone/runtime-world.json'))
        if (runtimeWorld.schema != 'echo.standalone.runtime_world.v2'
                || runtimeWorld.worldId != 'ashfall-debug-world'
                || runtimeWorld.seed != 1409
                || runtimeWorld.dimensionCount != 1
                || runtimeWorld.regionCount != 1
                || runtimeWorld.chunkCount != 1
                || runtimeWorld.cellCount != 16
                || runtimeWorld.hazardCount != 1
                || runtimeWorld.poiCount != 2
                || runtimeWorld.worldRuntimeServiceBound != true
                || runtimeWorld.worldStateServiceBound != true
                || runtimeWorld.queryOriginTerrain != 'crash_debris'
                || runtimeWorld.queryHazardIntensity != 0.72
                || runtimeWorld.queryTerminalLabel != 'Emergency Terminal Pod'
                || runtimeWorld.queryDimensionEnvironment != 'toxic_wasteland'
                || runtimeWorld.savedFileCount != 2
                || runtimeWorld.saveHealthy != true) {
            throw new GradleException('Phase 14.9 runtime world report did not prove debug world shape, queries, and save health')
        }
        def dimensions = json.parse(file('reports/echo/standalone/world-dimensions.json'))
        if (dimensions.schema != 'echo.standalone.world_dimensions.v2'
                || dimensions.dimensionCount != 1
                || dimensions.ashfallSurfaceEnvironment != 'toxic_wasteland'
                || dimensions.ashfallSurfaceOwnsCrashSite != true
                || !dimensions.dimensions.any { it.id == 'ashfall:surface' && it.regionIds.contains('ashfall:crash_site') }) {
            throw new GradleException('Phase 14.9 world dimension report did not prove Ashfall surface dimension ownership')
        }
        def regions = json.parse(file('reports/echo/standalone/world-regions.json'))
        if (regions.schema != 'echo.standalone.world_regions.v2'
                || regions.regionCount != 1
                || regions.crashSiteDangerLevel <= 0
                || !regions.crashSiteHazards.contains('ashfall:toxic_ash')
                || regions.crashSiteWeatherProfile != 'ashfall:ash_storm') {
            throw new GradleException('Phase 14.9 world region report did not prove crash-site region hazards/weather')
        }
        def chunks = json.parse(file('reports/echo/standalone/world-chunks.json'))
        if (chunks.schema != 'echo.standalone.world_chunks.v2'
                || chunks.chunkCount != 1
                || chunks.cellCount != 16
                || chunks.originTerrain != 'crash_debris'
                || chunks.crashDebrisCellCount <= 0
                || !chunks.chunks.any { it.id == '0,0' && it.cellCount == 16 && it.hazardCount == 1 && it.poiCount == 2 }) {
            throw new GradleException('Phase 14.9 world chunk report did not prove chunk/cell/hazard/POI layout')
        }
        def hazards = json.parse(file('reports/echo/standalone/world-hazards.json'))
        if (hazards.schema != 'echo.standalone.world_hazards.v2'
                || hazards.hazardCount != 1
                || hazards.toxicAshId != 'ashfall:toxic_ash'
                || hazards.toxicAshType != 'airborne_toxicity'
                || hazards.toxicAshIntensity != 0.72
                || hazards.toxicAshRadiusCells < 1
                || hazards.queryCenterIntensity != 0.72) {
            throw new GradleException('Phase 14.9 world hazard report did not prove toxic ash query intensity')
        }
        def weather = json.parse(file('reports/echo/standalone/world-weather.json'))
        if (weather.schema != 'echo.standalone.world_weather.v2'
                || weather.weatherProfile != 'ashfall:ash_storm'
                || weather.regionWeatherProfile != 'ashfall:ash_storm'
                || weather.ashDensity <= 0
                || weather.visibility <= 0) {
            throw new GradleException('Phase 14.9 world weather report did not prove ash storm weather field')
        }
        def pois = json.parse(file('reports/echo/standalone/world-pois.json'))
        if (pois.schema != 'echo.standalone.world_pois.v2'
                || pois.poiCount != 2
                || pois.terminalLabel != 'Emergency Terminal Pod'
                || pois.crashCacheQueryable != true
                || !pois.pois.any { it.id == 'ashfall:terminal_pod' }
                || !pois.pois.any { it.id == 'ashfall:crash_cache' }) {
            throw new GradleException('Phase 14.9 world POI report did not prove terminal/cache query coverage')
        }
        def saveHooks = json.parse(file('reports/echo/standalone/world-save-hooks.json'))
        if (saveHooks.schema != 'echo.standalone.world_save_hooks.v2'
                || saveHooks.filesWritten != 2
                || !saveHooks.writtenPaths.contains('world/summary.json')
                || !saveHooks.writtenPaths.contains('world/chunks/0_0.json')
                || saveHooks.manifestTracksSummary != true
                || saveHooks.manifestTracksChunk != true
                || saveHooks.saveHealthy != true
                || saveHooks.commitMetadata.worldId != 'ashfall-debug-world') {
            throw new GradleException('Phase 14.9 world save-hook report did not prove save manifest and corruption-check coverage')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-data/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-ui/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-save/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-world/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone world runtime source ${sourceFile}")
            }
        }
    }
}

