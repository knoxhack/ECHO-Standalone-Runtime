                        version       : latestMetadata.version,
                        versionMatchesPackageJson: latestMetadata.version == launcherVersion,
                        pathValue     : latestMetadata.path,
                        pathMatchesSetup: latestMetadata.path == expectedSetupArtifactName,
                        fileUrl       : latestMetadata.fileUrl,
                        fileUrlMatchesSetup: latestMetadata.fileUrl == expectedSetupArtifactName,
                        fileSize      : latestMetadata.fileSize,
                        fileSizeMatchesSetupBytes: latestMetadata.fileSize == (launcherSetupExe.isFile() ? launcherSetupExe.length() : 0L),
                        sha512MatchesSetupBytes: latestMetadata.sha512 == launcherSetupSha512,
                        fileSha512MatchesSetupBytes: latestMetadata.fileSha512 == launcherSetupSha512
                ],
                publish: launcherPackage.build?.publish ?: []
        ])
        def zipEntryCount = echoStandaloneZipEntryCount(portableZip)
        file('reports/echo/standalone/distribution-package-reproducibility.json').text = echoStandaloneJson([
                schema        : 'echo.standalone.distribution_package_reproducibility.v1',
                generatedAt   : '1970-01-01T00:00:00Z',
                generator     : 'refreshStandalonePackagedRuntimeImage',
                status        : reproducibilityStatus,
                summary       : strictReproducibilityMatches
                        ? 'Current OpenGL portable package matches strict two-refresh reproducibility evidence.'
                        : 'Current OpenGL portable package fingerprint is recorded; matching strict two-refresh evidence is pending or stale.',
                rendererTarget: 'opengl',
                portableZip   : portableZip.absolutePath.replace('\\', '/'),
                runtimeImage  : imageDir.absolutePath.replace('\\', '/'),
                current       : [
                        bytes     : portableZip.isFile() ? portableZip.length() : 0L,
                        entryCount: zipEntryCount,
                        sha256    : portableZipSha256
                ],
                stable        : strictReproducibilityMatches ? strictReproducibilityEvidence.stable : null,
                strictEvidenceReport: strictReproducibilityReportPath,
                preservesStrictWallClockHash: strictReproducibilityMatches,
                releaseWarning: strictReproducibilityMatches ? '' : 'Strict two-refresh reproducibility should be rerun after final packaging inputs settle.'
        ])
        file('reports/echo/standalone/runtime-distribution.json').text = echoStandaloneJson([
                schema        : 'echo.standalone.distribution_runtime.v2',
                generatedAt   : '1970-01-01T00:00:00Z',
                generator     : 'refreshStandalonePackagedRuntimeImage',
