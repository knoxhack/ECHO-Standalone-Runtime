            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.12 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        requiredReports.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.12 gameplay report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (report.status != 'PASS') {
                throw new GradleException("Phase 14.12 gameplay report did not pass: ${requiredPath}")
            }
        }
        def runtimeGameplay = json.parse(file('reports/echo/standalone/runtime-gameplay.json'))
