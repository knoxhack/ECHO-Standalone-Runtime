    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    if (!['echo-runtime-testkit', 'echo-runtime-devtools'].contains(project.name)) {
        sourceSets.named('main') {
            java.exclude '**/*Smoke*.java'
            java.exclude '**/*Harness*.java'
            java.exclude '**/*Verifier.java'
            java.exclude '**/*Acceptance.java'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

