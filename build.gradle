tasks.register('verifyStandaloneAssetRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 14.5 resource and asset runtime artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneAssetRuntimeSmoke')
    dependsOn tasks.named('runStandaloneRegistryAssetCoverageAudit')

    doLast {
        def requiredReports = [
                'docs/echo/standalone/ECHO_STANDALONE_ASSET_RUNTIME.md',
                'reports/echo/standalone/asset-index.json',
                'reports/echo/standalone/asset-mounts.json',
                'reports/echo/standalone/asset-missing.json',
                'reports/echo/standalone/asset-conflicts.json',
                'reports/echo/standalone/resource-pack-plan.json',
                'reports/echo/standalone/registry-asset-coverage.json',
        ]
        requiredReports.each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 14.5 artifact: ${requiredPath}")
            }
        }
        def json = new groovy.json.JsonSlurper()
        requiredReports.findAll { it.endsWith('.json') }.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (report.schema == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 14.5 asset report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status ?: 'UNKNOWN') != 'PASS'
                    && !(requiredPath.endsWith('registry-asset-coverage.json') && String.valueOf(report.status ?: '') == 'PASS_WITH_GAPS')) {
                throw new GradleException("Phase 14.5 asset report did not pass: ${requiredPath} status=${report.status ?: 'UNKNOWN'}")
            }
        }
        def assetIndex = json.parse(file('reports/echo/standalone/asset-index.json'))
        if (assetIndex.schema != 'echo.standalone.asset_index.v2'
                || assetIndex.entryCount < 27
                || assetIndex.namespaceCount < 4
                || !assetIndex.namespaces.containsAll(['ashfall', 'echo', 'ziptest', 'jartest'])
                || assetIndex.archiveBytesIndexed != true
                || assetIndex.jarBytesIndexed != true
                || assetIndex.directoryAssetsIndexed != true
                || assetIndex.dataDefinitionsIndexed != true) {
            throw new GradleException('Phase 14.5 asset index report did not prove directory/archive asset and data indexing')
        }
        def assetMounts = json.parse(file('reports/echo/standalone/asset-mounts.json'))
        if (assetMounts.schema != 'echo.standalone.asset_mounts.v2'
                || assetMounts.mountCount < 5
                || assetMounts.folderMounts < 3
                || assetMounts.archiveMounts < 2
                || assetMounts.jarMounts < 1
                || assetMounts.overrideWins != true
                || assetMounts.serviceResolverBound != true
                || !assetMounts.mountSources.containsAll(['runtime-defaults', 'pack-base', 'dev-override', 'archive-pack', 'jar-pack'])) {
            throw new GradleException('Phase 14.5 asset mount report did not prove folder/archive mounts, resolver binding, and override ordering')
        }
        def missing = json.parse(file('reports/echo/standalone/asset-missing.json'))
        if (missing.schema != 'echo.standalone.asset_missing.v2'
                || missing.missingCount != 1
                || missing.requiredMissingDetected != true
                || !missing.missingLogicalIds.contains('ashfall:missing/not_found.json')) {
            throw new GradleException('Phase 14.5 asset missing report did not prove required missing asset detection')
        }
        def conflicts = json.parse(file('reports/echo/standalone/asset-conflicts.json'))
        if (conflicts.schema != 'echo.standalone.asset_conflicts.v2'
                || conflicts.conflictCount < 1
                || conflicts.overrideConflictDetected != true
                || !conflicts.conflictLogicalIds.contains('ashfall:textures/gui/terminal.png')) {
            throw new GradleException('Phase 14.5 asset conflict report did not prove override conflict detection')
        }
        def packPlan = json.parse(file('reports/echo/standalone/resource-pack-plan.json'))
        if (packPlan.schema != 'echo.standalone.resource_pack_plan.v2'
                || packPlan.supportsFolderMounts != true
                || packPlan.supportsZipMounts != true
                || packPlan.supportsJarMounts != true
                || packPlan.packMetadataRead != true
                || packPlan.jarPackMetadataRead != true
                || !packPlan.archiveNamespaces.contains('ziptest')
                || !packPlan.jarArchiveNamespaces.contains('jartest')
                || packPlan.archiveTextureCount < 2
                || packPlan.archiveModelCount < 2
                || packPlan.archiveBlockstateCount < 1
                || packPlan.archiveLangCount < 1
                || packPlan.jarArchiveTextureCount < 2
                || packPlan.jarArchiveModelCount < 2
                || packPlan.jarArchiveBlockstateCount < 1
                || packPlan.jarArchiveLangCount < 1
                || packPlan.minecraftStyleResolvers != true
                || !packPlan.hotReloadAdded.contains('ashfall:icons/hazard.png')) {
            throw new GradleException('Phase 14.5 resource-pack plan report did not prove folder/zip/jar resource-pack, metadata, resolver, and hot-reload coverage')
        }

        def registryAssetCoverage = json.parse(file('reports/echo/standalone/registry-asset-coverage.json'))
        if (registryAssetCoverage.schema == 'echo.standalone.evidence.bootstrap.v1') {
            throw new GradleException('registry-asset-coverage.json is still bootstrap placeholder evidence')
        }
        if (registryAssetCoverage.schema != 'echo.standalone.registry_asset_coverage.v1') {
            throw new GradleException("Unexpected registry asset coverage schema: ${registryAssetCoverage.schema}")
        }
        if (!['PASS', 'PASS_WITH_GAPS'].contains(String.valueOf(registryAssetCoverage.status))) {
            throw new GradleException("Registry asset coverage audit did not pass: ${registryAssetCoverage.status}")
        }
        if ((registryAssetCoverage.counts?.registryEntries ?: 0) <= 0
                || (registryAssetCoverage.counts?.blockstatesPresent ?: 0) <= 0
                || (registryAssetCoverage.counts?.itemModelsPresent ?: 0) <= 0) {
            throw new GradleException('Registry asset coverage audit did not prove live blockstate and item model resolution')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-modules/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-packos/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-assets/src/main/java') {
            include '**/*.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone asset runtime source ${sourceFile}")
            }
        }
    }
}

