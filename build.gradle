tasks.register('runStandalonePackageReproducibilityStrict') {
    group = 'verification'
    description = 'Builds the OpenGL portable package twice and verifies byte, entry-count, and SHA-256 reproducibility.'
    dependsOn ':echo-runtime-client:installDist'

    doLast {
        def firstStartedAt = java.time.Instant.now()
        def first = echoStandaloneBuildOpenGlPackage()
        def firstEndedAt = java.time.Instant.now()
        def secondStartedAt = java.time.Instant.now()
        def second = echoStandaloneBuildOpenGlPackage()
        def secondEndedAt = java.time.Instant.now()
        def bytesMatch = first.portableZipBytes == second.portableZipBytes
        def entryCountMatch = first.portableZipEntryCount == second.portableZipEntryCount
        def sha256Match = first.portableZipSha256 == second.portableZipSha256
        def stable = bytesMatch && entryCountMatch && sha256Match

        def report = file('reports/echo/standalone/distribution-package-reproducibility-strict.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                       : 'echo.standalone.distribution_package_reproducibility.v1',
                generatedAt                  : '1970-01-01T00:00:00Z',
                generator                    : 'runStandalonePackageReproducibilityStrict',
                status                       : stable ? 'PASS' : 'FAILED',
                summary                      : stable
                        ? 'Strict two-refresh OpenGL portable package reproducibility passed.'
                        : 'Strict two-refresh OpenGL portable package reproducibility failed.',
                rendererTarget               : 'opengl',
                nativeModLoaderCommandUsed   : false,
                portableZip                  : second.portableZip.absolutePath.replace('\\', '/'),
                runtimeImage                 : second.imageDir.absolutePath.replace('\\', '/'),
                runtimeCache                 : [
                        path  : second.runtimeCache.absolutePath.replace('\\', '/'),
                        bytes : new File(second.runtimeCache, 'lib/modules').isFile()
                                ? new File(second.runtimeCache, 'lib/modules').length()
                                : 0,
                        sha256: new File(second.runtimeCache, 'lib/modules').isFile()
                                ? echoStandaloneSha256(new File(second.runtimeCache, 'lib/modules'))
                                : ''
                ],
                current                      : [
                        bytes     : second.portableZipBytes,
                        entryCount: second.portableZipEntryCount,
                        sha256    : second.portableZipSha256
                ],
                stable                       : [
                        refreshes      : 2,
                        bytesMatch     : bytesMatch,
                        entryCountMatch: entryCountMatch,
                        sha256Match    : sha256Match,
                        first          : [
                                startedAt : firstStartedAt.toString(),
                                endedAt   : firstEndedAt.toString(),
                                bytes     : first.portableZipBytes,
                                entryCount: first.portableZipEntryCount,
                                sha256    : first.portableZipSha256
                        ],
                        second         : [
                                startedAt : secondStartedAt.toString(),
                                endedAt   : secondEndedAt.toString(),
                                bytes     : second.portableZipBytes,
                                entryCount: second.portableZipEntryCount,
                                sha256    : second.portableZipSha256
                        ]
                ],
                deterministicZip             : [
                        sortedEntries    : true,
                        fixedEntryTimeUtc: '1980-01-01T00:00:00Z',
                        compression      : 'BEST_COMPRESSION'
                ],
                preservesStrictWallClockHash : stable,
                releaseWarning               : stable ? '' : 'Package inputs are still unstable across two refreshes.'
        ])
        echoStandaloneWriteDistributionReports(second.imageDir, second.portableZip, second.executable, second.config, second.portableZipSha256)
        if (!stable) {
            throw new GradleException("OpenGL package reproducibility failed; see ${report}")
        }
    }
}

tasks.register('runStandaloneInstallUninstallEvidenceAudit') {
    group = 'verification'
    description = 'Audits manual or VM-backed clean install/uninstall evidence for the standalone OpenGL launcher setup.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def platformRoot = rootProject.projectDir.parentFile.parentFile
        def launcherRoot = new File(platformRoot, 'ECHOLauncher')
        def launcherPackageJson = new File(launcherRoot, 'package.json')
        def launcherPackage = launcherPackageJson.isFile()
                ? new groovy.json.JsonSlurper().parse(launcherPackageJson)
                : [:]
        def setupExe = new File(launcherRoot, 'installer-artifacts/ECHO-Launcher-1.0.1-Setup.exe')
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def manualEvidenceFile = file('reports/echo/standalone/manual-install-uninstall-evidence.json')
        def templateFile = file('reports/echo/standalone/distribution-install-uninstall-evidence-template.json')
        def report = file('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        report.parentFile.mkdirs()

        def setupSha256 = setupExe.isFile() ? echoStandaloneSha256(setupExe) : ''
        def launcherSha256 = launcherExe.isFile() ? echoStandaloneSha256(launcherExe) : ''
        def setupSignature = setupExe.isFile()
                ? echoStandaloneAuthenticode('launcher-setup-exe', setupExe)
                : [artifactId: 'launcher-setup-exe', path: setupExe.absolutePath.replace('\\', '/'), exists: false, status: 'MISSING', signed: false]
        def template = [
                schema                         : 'echo.standalone.manual_install_uninstall_evidence.v1',
                status                         : 'PENDING_MANUAL_OR_VM_RUN',
                rendererTarget                 : 'opengl',
                nativeModLoaderCommandUsed     : false,
                tester                         : '',
                runStartedAt                   : '',
                runEndedAt                     : '',
                machineId                      : '',
                osVersion                      : '',
                setupArtifactPath              : setupExe.absolutePath.replace('\\', '/'),
                setupArtifactSha256            : setupSha256,
                installerExitCode              : null,
                installDir                     : 'C:/Users/<tester>/AppData/Local/Programs/ECHO Launcher',
                installedLauncherExePath       : 'C:/Users/<tester>/AppData/Local/Programs/ECHO Launcher/ECHO Launcher.exe',
                installedLauncherExeExists     : false,
                installedLauncherExeSha256     : '',
                installedLauncherExeSignatureStatus: '',
                startMenuShortcutPresent       : false,
                desktopShortcutPresent         : false,
                uninstallRegistryKeyPresent    : false,
                aumid                          : '',
                launcherFirstRunOpened         : false,
                runtimeDetected                : false,
                supportBundleExported          : false,
                supportBundleArchiveSha256     : '',
                uninstallerExitCode            : null,
                uninstallRemovedInstallDir     : false,
                uninstallRemovedShortcuts      : false,
                residualFilesOnlyAppData       : false,
                oldSpacedInstallDirMigrationStatus: 'SKIPPED_NOT_APPLICABLE',
                notes                          : 'Run in a disposable Windows profile or VM against the exact setupArtifactSha256 above.'
        ]
        templateFile.text = echoStandaloneJson(template)

        def evidence = null
        def parseStatus = 'MISSING'
        if (manualEvidenceFile.isFile()) {
            try {
                evidence = new groovy.json.JsonSlurper().parse(manualEvidenceFile)
                parseStatus = 'PASS'
            } catch (Exception ignored) {
                evidence = null
                parseStatus = 'INVALID_JSON'
            }
        }

        def checks = []
        def addCheck = { String id, boolean passed, Object actual, Object expected, String detail ->
            checks.add([
                    id      : id,
                    passed  : passed,
                    actual  : actual,
                    expected: expected,
                    detail  : detail
            ])
        }
        if (evidence != null) {
            addCheck('manualEvidence.status', evidence.status == 'PASS', evidence.status, 'PASS',
                    'Manual or VM install/uninstall evidence must be explicitly marked PASS.')
            addCheck('manualEvidence.rendererTarget', evidence.rendererTarget == 'opengl', evidence.rendererTarget, 'opengl',
                    'Evidence must target the OpenGL standalone runtime.')
            addCheck('manualEvidence.nativeModLoaderCommandUsed', evidence.nativeModLoaderCommandUsed == false,
                    evidence.nativeModLoaderCommandUsed, false,
                    'Clean install/uninstall evidence must not use the native mod loader command.')
            addCheck('setup.sha256', setupSha256 && evidence.setupArtifactSha256 == setupSha256,
                    evidence.setupArtifactSha256 ?: '', setupSha256,
                    'Evidence must match the current setup artifact hash.')
            addCheck('installer.exitCode', evidence.installerExitCode == 0, evidence.installerExitCode, 0,
                    'Installer must exit successfully.')
            addCheck('installed.launcherExists', evidence.installedLauncherExeExists == true,
                    evidence.installedLauncherExeExists, true,
                    'Installed launcher executable must exist after install.')
            addCheck('installed.launcherSha256', (evidence.installedLauncherExeSha256 ?: '').toString().trim().length() > 0,
                    evidence.installedLauncherExeSha256 ?: '', 'non-empty SHA-256',
                    'Installed launcher executable hash must be recorded.')
            addCheck('shortcut.startMenu', evidence.startMenuShortcutPresent == true,
                    evidence.startMenuShortcutPresent, true,
                    'Start menu shortcut must be present after install.')
            addCheck('registry.uninstallKey', evidence.uninstallRegistryKeyPresent == true,
                    evidence.uninstallRegistryKeyPresent, true,
                    'Uninstall registry key must be present after install.')
            addCheck('launcher.firstRun', evidence.launcherFirstRunOpened == true,
                    evidence.launcherFirstRunOpened, true,
                    'Launcher must open successfully on first run.')
            addCheck('launcher.runtimeDetected', evidence.runtimeDetected == true,
                    evidence.runtimeDetected, true,
                    'Launcher must detect the standalone OpenGL runtime.')
            addCheck('launcher.supportBundleExported', evidence.supportBundleExported == true,
                    evidence.supportBundleExported, true,
                    'Launcher must export the support bundle from the installed app.')
            addCheck('uninstaller.exitCode', evidence.uninstallerExitCode == 0, evidence.uninstallerExitCode, 0,
                    'Uninstaller must exit successfully.')
            addCheck('uninstall.removedInstallDir', evidence.uninstallRemovedInstallDir == true,
                    evidence.uninstallRemovedInstallDir, true,
                    'Uninstall must remove the install directory.')
            addCheck('uninstall.removedShortcuts', evidence.uninstallRemovedShortcuts == true,
                    evidence.uninstallRemovedShortcuts, true,
                    'Uninstall must remove shortcuts.')
            addCheck('uninstall.residualFiles', evidence.residualFilesOnlyAppData == true,
                    evidence.residualFilesOnlyAppData, true,
                    'Only expected AppData profile/cache residue may remain after uninstall.')
            def migrationStatus = evidence.oldSpacedInstallDirMigrationStatus ?: ''
            addCheck('migration.oldSpacedInstallDir',
                    ['PASS', 'SKIPPED_NOT_APPLICABLE'].contains(migrationStatus),
                    migrationStatus, 'PASS or SKIPPED_NOT_APPLICABLE',
                    'Old spaced install directory migration must either pass or be explicitly not applicable.')
        }
        def failedChecks = checks.findAll { it.passed != true }
        def evidenceStatus = evidence == null
                ? (parseStatus == 'INVALID_JSON' ? 'INVALID_JSON' : 'PENDING_MANUAL_OR_VM_RUN')
                : (failedChecks.isEmpty() ? 'PASS' : 'FAILED')
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.distribution_install_uninstall_evidence.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneInstallUninstallEvidenceAudit',
                status                    : evidenceStatus,
                summary                   : evidenceStatus == 'PASS'
                        ? 'Clean install/uninstall evidence matches the current OpenGL launcher setup artifact.'
                        : 'Clean install/uninstall evidence is pending or incomplete; template generated for a disposable Windows profile or VM run.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                manualEvidenceInput       : manualEvidenceFile.path.replace('\\', '/'),
                manualEvidencePresent     : manualEvidenceFile.isFile(),
                manualEvidenceParseStatus : parseStatus,
                requiredEvidenceTemplate  : templateFile.path.replace('\\', '/'),
                currentArtifacts          : [
                        setupExe       : setupExe.absolutePath.replace('\\', '/'),
                        setupExePresent: setupExe.isFile(),
                        setupExeBytes  : setupExe.isFile() ? setupExe.length() : 0L,
                        setupExeSha256 : setupSha256,
                        setupSignature : setupSignature,
                        launcherExe    : launcherExe.absolutePath.replace('\\', '/'),
                        launcherExePresent: launcherExe.isFile(),
                        launcherExeSha256 : launcherSha256,
                        launcherVersion: launcherPackage.version ?: '',
                        portableZip    : portableZip.absolutePath.replace('\\', '/'),
                        portableZipPresent: portableZip.isFile(),
                        portableZipSha256 : portableZip.isFile() ? echoStandaloneSha256(portableZip) : ''
                ],
                checks                    : checks,
                blockers                  : evidence == null
                        ? [[id: 'manualEvidence.recorded', status: evidenceStatus, detail: 'Record manual-install-uninstall-evidence.json from the generated template.']]
                        : failedChecks.collect { [id: it.id, status: 'FAILED', detail: it.detail, actual: it.actual, expected: it.expected] },
                requiredNextActions       : evidenceStatus == 'PASS' ? [] : [
                        'Run the current setup EXE in a disposable Windows profile or VM.',
                        'Launch the installed ECHO Launcher once and export a support bundle.',
                        'Uninstall from that profile and record the result in reports/echo/standalone/manual-install-uninstall-evidence.json.'
                ]
        ])
    }
}

tasks.register('runStandaloneDistributionSigningSetupAudit') {
    group = 'verification'
    description = 'Audits Windows signing, launcher signing config, and setup/uninstall metadata for public release readiness.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')
    dependsOn tasks.named('runStandaloneInstallUninstallEvidenceAudit')

    doLast {
        def platformRoot = rootProject.projectDir.parentFile.parentFile
        def launcherRoot = new File(platformRoot, 'ECHOLauncher')
        def launcherPackageJson = new File(launcherRoot, 'package.json')
        def launcherPackage = launcherPackageJson.isFile()
                ? new groovy.json.JsonSlurper().parse(launcherPackageJson)
                : [:]
        def setupExe = new File(launcherRoot, 'installer-artifacts/ECHO-Launcher-1.0.1-Setup.exe')
        def launcherExe = new File(launcherRoot, 'installer-artifacts/win-unpacked/ECHOLauncher.exe')
        def runtimeExe = new File(buildDir, 'jpackage-opengl-client/EchoStandaloneRuntime/EchoStandaloneRuntime.exe')
        def installerScript = new File(launcherRoot, 'build/installer.nsh')
        def latestYml = new File(launcherRoot, 'installer-artifacts/latest.yml')
        def setupBlockmap = new File(setupExe.parentFile, "${setupExe.name}.blockmap")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def installEvidenceReport = file('reports/echo/standalone/distribution-install-uninstall-evidence.json')
        def installEvidence = installEvidenceReport.isFile()
                ? new groovy.json.JsonSlurper().parse(installEvidenceReport)
                : [status: 'MISSING']
        def signableArtifacts = [
                echoStandaloneAuthenticode('runtime-exe', runtimeExe),
                echoStandaloneAuthenticode('launcher-exe', launcherExe),
                echoStandaloneAuthenticode('launcher-setup-exe', setupExe)
        ]
        def missingSignable = signableArtifacts.findAll { !it.exists }
        def unsignedSignable = signableArtifacts.findAll { it.exists && !it.signed }
        def winConfig = launcherPackage.build?.win ?: [:]
        def nsisConfig = launcherPackage.build?.nsis ?: [:]
        def signingConfig = [
                packageJson         : launcherPackageJson.absolutePath.replace('\\', '/'),
                signAndEditExecutable: winConfig.signAndEditExecutable,
                signingDisabled     : winConfig.signAndEditExecutable == false,
                certificateSubject  : winConfig.certificateSubject ?: '',
                certificateSha1     : winConfig.certificateSha1 ?: '',
                certificateFile     : winConfig.certificateFile ?: '',
                publisherName       : winConfig.publisherName ?: ''
        ]
        def packageVersion = launcherPackage.version ?: ''
        def expectedSetupArtifactName = packageVersion
                ? "ECHO-Launcher-${packageVersion}-Setup.exe"
                : ''
        def latestMetadata = echoStandaloneElectronLatestYml(latestYml)
        def setupSha512 = setupExe.isFile() ? echoStandaloneSha512Base64(setupExe) : ''
        def latestSizeMatches = setupExe.isFile() && latestMetadata.fileSize == setupExe.length()
        def latestTopLevelShaMatches = setupExe.isFile() && latestMetadata.sha512 == setupSha512
        def latestFileShaMatches = setupExe.isFile() && latestMetadata.fileSha512 == setupSha512
        def latestYmlMatchesSetupBytes = latestSizeMatches && latestTopLevelShaMatches && latestFileShaMatches
        def updateMetadata = [
                packageJsonVersion                 : packageVersion,
                expectedSetupArtifactName          : expectedSetupArtifactName,
                setupFilenameMatchesPackageVersion : setupExe.name == expectedSetupArtifactName,
                latestYmlPresent                   : latestYml.isFile(),
                latestYmlPath                      : latestYml.absolutePath.replace('\\', '/'),
                latestYmlVersion                   : latestMetadata.version,
                latestYmlVersionMatchesPackageJson : packageVersion && latestMetadata.version == packageVersion,
                latestYmlPathValue                 : latestMetadata.path,
                latestYmlPathMatchesSetup          : latestMetadata.path == setupExe.name,
                latestYmlFileUrl                   : latestMetadata.fileUrl,
                latestYmlFileUrlMatchesSetup       : latestMetadata.fileUrl == setupExe.name,
                latestYmlSize                      : latestMetadata.fileSize,
                latestYmlSizeMatchesSetupBytes     : latestSizeMatches,
                latestYmlSha512                    : latestMetadata.sha512,
                latestYmlSha512MatchesSetupBytes   : latestTopLevelShaMatches,
                latestYmlFileSha512                : latestMetadata.fileSha512,
                latestYmlFileSha512MatchesSetupBytes: latestFileShaMatches,
                latestYmlMatchesSetupBytes         : latestYmlMatchesSetupBytes,
                blockmapPresent                    : setupBlockmap.isFile(),
                blockmapPath                       : setupBlockmap.absolutePath.replace('\\', '/'),
                blockmapBytes                      : setupBlockmap.isFile() ? setupBlockmap.length() : 0L,
                blockmapSha256                     : setupBlockmap.isFile() ? echoStandaloneSha256(setupBlockmap) : '',
                blockmapMatchesSetupName           : setupBlockmap.name == "${setupExe.name}.blockmap",
                publishProvider                    : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.provider ?: '' : '',
                publishOwner                       : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.owner ?: '' : '',
                publishRepo                        : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.repo ?: '' : '',
                publishReleaseType                 : launcherPackage.build?.publish ? launcherPackage.build.publish[0]?.releaseType ?: '' : ''
        ]
        def updateMetadataReady = updateMetadata.setupFilenameMatchesPackageVersion
                && updateMetadata.latestYmlPresent
                && updateMetadata.latestYmlVersionMatchesPackageJson
                && updateMetadata.latestYmlPathMatchesSetup
                && updateMetadata.latestYmlFileUrlMatchesSetup
                && updateMetadata.latestYmlMatchesSetupBytes
                && updateMetadata.blockmapPresent
                && updateMetadata.blockmapMatchesSetupName
        def setupMetadata = [
                packageScript                  : launcherPackage.scripts?.get('package:win') ?: '',
                setupArtifactPresent           : setupExe.isFile(),
                setupArtifactPath              : setupExe.absolutePath.replace('\\', '/'),
                setupArtifactBytes             : setupExe.isFile() ? setupExe.length() : 0L,
                setupArtifactSha256            : setupExe.isFile() ? echoStandaloneSha256(setupExe) : '',
                installerScriptPresent         : installerScript.isFile(),
                installerScriptPath            : installerScript.absolutePath.replace('\\', '/'),
                target                         : winConfig.target ?: [],
                artifactName                   : winConfig.artifactName ?: '',
                oneClick                       : nsisConfig.oneClick,
                perMachine                     : nsisConfig.perMachine,
                allowToChangeInstallationDirectory: nsisConfig.allowToChangeInstallationDirectory,
                shortcutName                   : nsisConfig.shortcutName ?: '',
                uninstallDisplayName           : nsisConfig.uninstallDisplayName ?: '',
                installerIcon                  : nsisConfig.installerIcon ?: '',
                uninstallerIcon                : nsisConfig.uninstallerIcon ?: '',
                cleanInstallUninstallEvidence  : installEvidence.status ?: 'UNKNOWN',
                cleanInstallUninstallEvidenceReady: installEvidence.status == 'PASS',
                cleanInstallUninstallEvidenceReport: 'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                cleanInstallUninstallEvidenceTemplate: installEvidence.requiredEvidenceTemplate ?: 'reports/echo/standalone/distribution-install-uninstall-evidence-template.json'
        ]
        def setupReady = setupExe.isFile()
                && installerScript.isFile()
                && nsisConfig.uninstallDisplayName
                && nsisConfig.shortcutName
                && updateMetadataReady
                && installEvidence.status == 'PASS'
        def signingReady = missingSignable.isEmpty()
                && unsignedSignable.isEmpty()
                && signingConfig.signAndEditExecutable != false
        def publicReleaseReady = signingReady && setupReady
        def status = missingSignable.isEmpty()
                ? (publicReleaseReady ? 'PASS' : 'PENDING_SIGNING')
                : 'FAILED'
        def report = file('reports/echo/standalone/distribution-signing-setup.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.distribution_signing_setup.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandaloneDistributionSigningSetupAudit',
                status                    : status,
                summary                   : publicReleaseReady
                        ? 'Windows signing and setup metadata are ready for public release.'
                        : 'Windows signing/setup audit captured current blockers; public release remains held until signable artifacts are validly signed and install/uninstall is evidenced.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                publicReleaseReady        : publicReleaseReady,
                signableArtifacts         : signableArtifacts,
                signing                   : signingConfig,
                setup                     : setupMetadata,
                updateMetadata            : updateMetadata,
                installUninstallEvidence  : installEvidence,
                stablePortablePackage     : [
                        path  : portableZip.absolutePath.replace('\\', '/'),
                        bytes : portableZip.isFile() ? portableZip.length() : 0L,
                        sha256: portableZip.isFile() ? echoStandaloneSha256(portableZip) : '',
                        reproducibilityEvidence: 'reports/echo/standalone/distribution-package-reproducibility-strict.json'
                ],
                blockers                  : [
                        missingSignableArtifacts: missingSignable.collect { it.artifactId },
                        unsignedArtifacts       : unsignedSignable.collect { it.artifactId },
                        signingConfigDisabled   : signingConfig.signingDisabled,
                        updateMetadataReady      : updateMetadataReady,
                        cleanInstallUninstallEvidence: installEvidence.status ?: 'UNKNOWN',
                        cleanInstallUninstallEvidenceReady: installEvidence.status == 'PASS',
                        cleanInstallUninstallEvidenceReport: 'reports/echo/standalone/distribution-install-uninstall-evidence.json'
                ],
                requiredNextActions       : [
                        'Enable Windows signing config with a release certificate.',
                        'Sign runtime-exe, launcher-exe, and launcher-setup-exe.',
                        'Record clean install and uninstall evidence from the generated template in a disposable Windows profile or VM.'
                ]
        ])
    }
}

tasks.register('verifyStandalonePublicReleaseDistribution') {
    group = 'verification'
    description = 'Runs public-release distribution gates and fails while signing, install/uninstall, or human playtest evidence is incomplete.'
    dependsOn tasks.named('runStandalonePackageReproducibilityStrict')
    dependsOn tasks.named('runStandaloneDistributionSigningSetupAudit')
    dependsOn tasks.named('verifyReleaseIndexProductRouting')

    doLast {
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                return [status: 'MISSING', path: relativePath]
            }
            try {
                return new groovy.json.JsonSlurper().parse(reportFile)
            } catch (Exception ignored) {
                return [status: 'INVALID_JSON', path: relativePath]
            }
        }
        def signing = readReport('reports/echo/standalone/distribution-signing-setup.json')
        def reproducibility = readReport('reports/echo/standalone/distribution-package-reproducibility-strict.json')
        def manual = readReport('reports/echo/standalone/manual-playtest-report.json')
        def smoke = readReport('reports/echo/standalone/packaged-exe-wallclock-smoke.json')
        def strictRehearsal = readReport('reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json')

        def manualSessions = manual.requiredSessions ?: []
        def pendingManualSessions = manualSessions.findAll { it.status != 'PASS' }.collect { it.id ?: 'unknown-session' }
        def blockers = []
        if (signing.status != 'PASS' || signing.publicReleaseReady != true) {
            blockers.add([
                    id            : 'distribution.signing-setup',
                    status        : signing.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/distribution-signing-setup.json',
                    detail        : 'Signing/setup audit must pass with signed EXEs and clean install/uninstall evidence from the dedicated install/uninstall audit.'
            ])
        }
        if (reproducibility.status != 'PASS'
                || reproducibility.stable?.sha256Match != true
                || reproducibility.stable?.bytesMatch != true
                || reproducibility.stable?.entryCountMatch != true) {
            blockers.add([
                    id            : 'distribution.reproducibility',
                    status        : reproducibility.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/distribution-package-reproducibility-strict.json',
                    detail        : 'Strict two-refresh portable package reproducibility must pass.'
            ])
        }
        if (manual.manualEvidenceComplete != true || !pendingManualSessions.isEmpty()) {
            blockers.add([
                    id            : 'manual.wallclock',
                    status        : manual.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/manual-playtest-report.json',
                    detail        : "Pending human sessions: ${pendingManualSessions.join(', ')}"
            ])
        }
        if (smoke.status != 'PASS') {
            blockers.add([
                    id            : 'packaged.smoke',
                    status        : smoke.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                    detail        : 'Packaged OpenGL smoke must pass.'
            ])
        }
        if (strictRehearsal.status != 'PASS') {
            blockers.add([
                    id            : 'packaged.strict-rehearsal',
                    status        : strictRehearsal.status ?: 'UNKNOWN',
                    evidenceReport: 'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json',
                    detail        : 'Packaged OpenGL strict rehearsal must pass.'
            ])
        }

        def publicReleaseReady = blockers.isEmpty()
        def report = file('reports/echo/standalone/public-release-gate.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.public_release_gate.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'verifyStandalonePublicReleaseDistribution',
                status                    : publicReleaseReady ? 'PASS' : 'BLOCKED',
                summary                   : publicReleaseReady
                        ? 'Public release distribution gate passed.'
                        : 'Public release distribution gate is blocked by incomplete release evidence.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                publicReleaseReady        : publicReleaseReady,
                blockerCount              : blockers.size(),
                blockers                  : blockers,
                evidenceReports           : [
                        'reports/echo/standalone/distribution-signing-setup.json',
                        'reports/echo/standalone/distribution-install-uninstall-evidence.json',
                        'reports/echo/standalone/distribution-package-reproducibility-strict.json',
                        'reports/echo/standalone/manual-playtest-report.json',
                        'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                        'reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json'
                ]
        ])
        if (!publicReleaseReady) {
            throw new GradleException("Public release distribution gate blocked; see ${report}")
        }
    }
}

tasks.register('runStandalonePackagedOpenGlImageSmoke') {
    group = 'verification'
    description = 'Launches the packaged OpenGL client briefly and writes package smoke evidence.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def appName = 'EchoStandaloneRuntime'
        def imageDir = new File(buildDir, "jpackage-opengl-client/${appName}")
        def exe = new File(imageDir, "${appName}.exe")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def stdout = new File(buildDir, 'tmp/packaged-opengl-client-smoke.stdout.log')
        def stderr = new File(buildDir, 'tmp/packaged-opengl-client-smoke.stderr.log')
        stdout.parentFile.mkdirs()
        stdout.text = ''
        stderr.text = ''
        if (!exe.isFile()) {
            throw new GradleException("Missing packaged OpenGL client executable: ${exe}")
        }

        def startedAt = java.time.Instant.now()
        def process = new ProcessBuilder(exe.absolutePath)
                .directory(rootProject.projectDir)
                .redirectOutput(stdout)
                .redirectError(stderr)
                .start()
        def samples = []
        int aliveSamples = 0
        int durationSeconds = 15
        for (int second = 1; second <= durationSeconds; second++) {
            Thread.sleep(1000L)
            boolean alive = process.isAlive()
            if (alive) {
                aliveSamples++
            }
            samples.add([second: second, pidAlive: alive])
            if (!alive) {
                break
            }
        }
        def endedAt = java.time.Instant.now()
        boolean aliveAfterProbe = process.isAlive()
        if (aliveAfterProbe) {
            new ProcessBuilder('cmd', '/c', 'taskkill', '/PID', Long.toString(process.pid()), '/T', '/F')
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
        }
        int exitCode = process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                ? process.exitValue()
                : -1
        boolean passed = aliveSamples >= 10 && aliveAfterProbe

        def report = file('reports/echo/standalone/packaged-exe-wallclock-smoke.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                 : 'echo.standalone.packaged_exe_wallclock_smoke.v1',
                generatedAt            : '1970-01-01T00:00:00Z',
                generator              : 'runStandalonePackagedOpenGlImageSmoke',
                status                 : passed ? 'PASS' : 'FAILED',
                summary                : passed
                        ? 'Packaged OpenGL client launched and stayed alive through the smoke probe.'
                        : 'Packaged OpenGL client did not stay alive through the smoke probe.',
                rendererTarget         : 'opengl',
                nativeModLoaderCommandUsed: false,
                replacesHumanPlaytest  : false,
                runId                  : 'opengl-client-smoke',
                startedAt              : startedAt.toString(),
                endedAt                : endedAt.toString(),
                durationSeconds        : durationSeconds,
                aliveSamples           : aliveSamples,
                aliveAfterProbe        : aliveAfterProbe,
                exitCodeAfterCleanup   : exitCode,
                executable             : exe.absolutePath.replace('\\', '/'),
                portableZipPath        : portableZip.absolutePath.replace('\\', '/'),
                portableZipBytes       : portableZip.isFile() ? portableZip.length() : 0,
                portableZipSha256      : portableZip.isFile() ? echoStandaloneSha256(portableZip) : '',
                stdoutPath             : stdout.absolutePath.replace('\\', '/'),
                stderrPath             : stderr.absolutePath.replace('\\', '/'),
                samples                : samples
        ])
        if (!passed) {
            throw new GradleException("Packaged OpenGL client smoke failed; see ${report}")
        }
    }
}

tasks.register('runStandalonePackagedOpenGlImageStrictRehearsal') {
    group = 'verification'
    description = 'Runs a 20-second current OpenGL packaged EXE rehearsal with process and visible-window samples.'
    dependsOn tasks.named('refreshStandalonePackagedRuntimeImage')

    doLast {
        def appName = 'EchoStandaloneRuntime'
        def imageDir = new File(buildDir, "jpackage-opengl-client/${appName}")
        def exe = new File(imageDir, "${appName}.exe")
        def portableZip = new File(buildDir, 'distributions/EchoStandaloneRuntime-portable-opengl-client.zip')
        def stdout = new File(buildDir, 'tmp/packaged-opengl-client-strict-rehearsal.stdout.log')
        def stderr = new File(buildDir, 'tmp/packaged-opengl-client-strict-rehearsal.stderr.log')
        stdout.parentFile.mkdirs()
        stdout.text = ''
        stderr.text = ''
        if (!exe.isFile()) {
            throw new GradleException("Missing packaged OpenGL client executable: ${exe}")
        }

        def startedAt = java.time.Instant.now()
        def process = new ProcessBuilder(exe.absolutePath)
                .directory(rootProject.projectDir)
                .redirectOutput(stdout)
                .redirectError(stderr)
                .start()
        def samples = []
        int durationSeconds = 20
        int visibilityGraceSeconds = 20
        int processSamples = 0
        int visibleSamples = 0
        int workingSetSamples = 0
        int missingProcessSamples = 0
        int invisibleSamplesAfterGrace = 0
        int firstVisibleSecond = 0
        int firstMissingProcessSecond = 0
        int firstInvisibleSecond = 0
        long firstWorkingSetBytes = 0L
        long lastWorkingSetBytes = 0L
        long maxWorkingSetBytes = 0L
        String windowTitle = ''

        for (int second = 1; second <= durationSeconds; second++) {
            Thread.sleep(1000L)
            def sample = echoStandaloneWindowsProcessSample(process.pid())
            boolean alive = Boolean.valueOf(sample.pidAlive.toString())
            boolean visible = Boolean.valueOf(sample.visible.toString())
            long workingSetBytes = Long.valueOf(sample.workingSetBytes.toString())
            if (alive) {
                processSamples++
            } else {
                missingProcessSamples++
                if (firstMissingProcessSecond == 0) {
                    firstMissingProcessSecond = second
                }
            }
            if (visible) {
                visibleSamples++
                if (firstVisibleSecond == 0) {
                    firstVisibleSecond = second
                }
                if (windowTitle.isEmpty() && sample.windowTitle != null) {
                    windowTitle = sample.windowTitle.toString()
                }
            } else {
                if (firstInvisibleSecond == 0) {
                    firstInvisibleSecond = second
                }
                if (second > visibilityGraceSeconds) {
                    invisibleSamplesAfterGrace++
                }
            }
            if (workingSetBytes > 0L) {
                workingSetSamples++
                if (firstWorkingSetBytes == 0L) {
                    firstWorkingSetBytes = workingSetBytes
                }
                lastWorkingSetBytes = workingSetBytes
                maxWorkingSetBytes = Math.max(maxWorkingSetBytes, workingSetBytes)
            }
            samples.add([
                    second         : second,
                    processCount   : Integer.valueOf(sample.processCount.toString()),
                    visible        : visible,
                    pidAlive       : alive,
                    workingSetBytes: workingSetBytes,
                    probeError     : sample.probeError ?: ''
            ])
            if (!alive) {
                break
            }
        }
        def endedAt = java.time.Instant.now()
        boolean aliveAfterProbe = process.isAlive()
        if (aliveAfterProbe) {
            new ProcessBuilder('cmd', '/c', 'taskkill', '/PID', Long.toString(process.pid()), '/T', '/F')
                    .redirectErrorStream(true)
                    .start()
                    .waitFor()
        }
        int exitCode = process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                ? process.exitValue()
                : -1
        int completedDurationSeconds = samples.isEmpty() ? 0 : Integer.valueOf(samples.last().second.toString())
        boolean passed = processSamples == durationSeconds
                && visibleSamples > 0
                && invisibleSamplesAfterGrace == 0
                && aliveAfterProbe

        def report = file('reports/echo/standalone/packaged-exe-wallclock-strict-rehearsal.json')
        report.parentFile.mkdirs()
        report.text = echoStandaloneJson([
                schema                    : 'echo.standalone.packaged_exe_wallclock_strict.v1',
                generatedAt               : '1970-01-01T00:00:00Z',
                generator                 : 'runStandalonePackagedOpenGlImageStrictRehearsal',
                status                    : passed ? 'PASS' : 'FAILED',
                summary                   : passed
                        ? 'Current packaged OpenGL EXE remained process-alive and visibly windowed for the strict rehearsal interval.'
                        : 'Current packaged OpenGL EXE strict rehearsal did not satisfy process and visible-window requirements.',
                rendererTarget            : 'opengl',
                nativeModLoaderCommandUsed: false,
                runId                     : 'rehearsal',
                startedAt                 : startedAt.toString(),
                endedAt                   : endedAt.toString(),
                durationSeconds           : durationSeconds,
                completedDurationSeconds  : completedDurationSeconds,
                executable                : exe.absolutePath.replace('\\', '/'),
                visibleWindow             : visibleSamples > 0,
                visibleSamples            : visibleSamples,
                processSamples            : processSamples,
                workingSetSamples         : workingSetSamples,
                missingProcessSamples     : missingProcessSamples,
                invisibleSamplesAfterGrace: invisibleSamplesAfterGrace,
                visibilityGraceSeconds    : visibilityGraceSeconds,
                firstVisibleSecond        : firstVisibleSecond,
                firstMissingProcessSecond : firstMissingProcessSecond,
                firstInvisibleSecond      : firstInvisibleSecond,
                windowTitle               : windowTitle,
                firstWorkingSetBytes      : firstWorkingSetBytes,
                lastWorkingSetBytes       : lastWorkingSetBytes,
                maxWorkingSetBytes        : maxWorkingSetBytes,
                memoryGrowthBytes         : lastWorkingSetBytes - firstWorkingSetBytes,
                aliveAfterProbe           : aliveAfterProbe,
                exitCodeAfterCleanup      : exitCode,
                portableZipPath           : portableZip.absolutePath.replace('\\', '/'),
                portableZipBytes          : portableZip.isFile() ? portableZip.length() : 0,
                portableZipSha256         : portableZip.isFile() ? echoStandaloneSha256(portableZip) : '',
                currentPackageEvidence    : 'reports/echo/standalone/packaged-opengl-client-image.json',
                smokeEvidence             : 'reports/echo/standalone/packaged-exe-wallclock-smoke.json',
                replacesHumanPlaytest     : false,
                releaseRunAccepted        : false,
                remainingManualEvidence   : [
                        '30-minute wall-clock packaged OpenGL EXE tester session',
                        '60-minute wall-clock packaged OpenGL EXE tester session'
                ],
                stdoutPath                : stdout.absolutePath.replace('\\', '/'),
                stderrPath                : stderr.absolutePath.replace('\\', '/'),
                samples                   : samples
        ])
        if (!passed) {
            throw new GradleException("Packaged OpenGL client strict rehearsal failed; see ${report}")
        }
    }
}

tasks.register('runStandaloneFullWorkspaceBuildSmoke') {
    group = 'verification'
    description = 'Runs the parent Echo workspace build smoke and writes release-readiness evidence.'

    doLast {
        def standaloneRoot = rootProject.projectDir
        def configuredWorkspaceRoot = providers.gradleProperty('echoWorkspaceRoot')
                .orElse(providers.environmentVariable('ECHO_WORKSPACE_ROOT'))
                .orNull
        def workspaceRoot = configuredWorkspaceRoot
                ? file(configuredWorkspaceRoot)
                : standaloneRoot.parentFile
        def gradleWrapper = new File(workspaceRoot,
                System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows')
                        ? 'gradlew.bat'
                        : 'gradlew')
        def reportFile = file('reports/echo/standalone/full-workspace-build-smoke.json')
        reportFile.parentFile.mkdirs()

        if (!gradleWrapper.isFile()) {
            throw new GradleException("Missing workspace Gradle wrapper: ${gradleWrapper}. Set -PechoWorkspaceRoot or ECHO_WORKSPACE_ROOT when the full ECHO workspace is outside the parent directory.")
        }

        def command = [
                gradleWrapper.absolutePath,
                'buildEchoWorkspace',
                '-PechoAddonSet=all',
                '--no-configuration-cache',
                '--console=plain'
        ]
        def start = System.nanoTime()
        def process = new ProcessBuilder(command)
                .directory(workspaceRoot)
                .redirectErrorStream(true)
                .start()
        def outputText = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        def durationMillis = ((System.nanoTime() - start) / 1_000_000L) as long
        def passed = exitCode == 0 && outputText.contains('BUILD SUCCESSFUL')
        def outputLines = outputText.replace('\r\n', '\n').replace('\r', '\n').readLines()
        def outputTail = outputLines.size() > 40
                ? outputLines.subList(outputLines.size() - 40, outputLines.size())
                : outputLines
        def payload = [
                schema: 'echo.standalone.full_workspace_build_smoke.v1',
                generatedAt: '1970-01-01T00:00:00Z',
                generator: 'phase15.agent3-full-workspace-build-smoke',
                status: passed ? 'PASS' : 'FAILED',
                summary: passed
                        ? 'Parent Echo workspace build passed for the full addon set.'
                        : 'Parent Echo workspace build failed; see outputTail.',
                workspaceRoot: workspaceRoot.absolutePath.replace('\\', '/'),
                command: command.collect { it.toString() }.join(' '),
                noConfigurationCache: true,
                echoAddonSet: 'all',
                exitCode: exitCode,
                durationMillis: durationMillis,
                evidence: [
                        buildSuccessful: outputText.contains('BUILD SUCCESSFUL'),
                        fullWorkspaceTask: outputText.contains('Task :buildEchoWorkspace'),
                        configurationCacheDisabled: true
                ],
                outputTail: outputTail
        ]
        reportFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + System.lineSeparator()
        if (!passed) {
            throw new GradleException("Parent Echo workspace build smoke failed; report written to ${reportFile}")
        }
    }
}

