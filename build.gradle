tasks.register('verifyStandaloneWindowedRuntime') {
    group = 'verification'
    description = 'Verifies the Phase 15.2 windowed runtime lifecycle artifacts and platform boundary.'
    dependsOn tasks.named('runStandaloneWindowedRuntimeSmoke')

    doLast {
        def requiredReports = [
                'docs/echo/standalone/ECHO_STANDALONE_WINDOWED_RUNTIME.md',
                'reports/echo/standalone/runtime-windowed.json',
                'reports/echo/standalone/window-lifecycle.json',
                'reports/echo/standalone/window-resize.json',
                'reports/echo/standalone/window-mode-switch.json',
                'reports/echo/standalone/window-close.json',
                'reports/echo/standalone/window-crash-shutdown.json',
        ]
        requiredReports.each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing Phase 15.2 artifact: ${requiredPath}")
            }
        }

        def json = new groovy.json.JsonSlurper()
        requiredReports.findAll { it.endsWith('.json') }.each { requiredPath ->
            def report = json.parse(file(requiredPath))
            if (String.valueOf(report.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Phase 15.2 window report is still bootstrap placeholder evidence: ${requiredPath}")
            }
            if (String.valueOf(report.status ?: 'UNKNOWN') != 'PASS') {
                throw new GradleException("Phase 15.2 window report did not pass: ${requiredPath} status=${report.status ?: 'UNKNOWN'}")
            }
        }

        def runtimeWindowed = json.parse(file('reports/echo/standalone/runtime-windowed.json'))
        if (String.valueOf(runtimeWindowed.schema ?: '') != 'echo.standalone.windowed_runtime.v2'
                || !Boolean.valueOf(String.valueOf(runtimeWindowed.headlessSmoke ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeWindowed.windowedAshfallFirstPlayableLoopReady ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeWindowed.windowedWalkthroughReady ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeWindowed.deterministicLiveWalkthroughReady ?: false))
                || !Boolean.valueOf(String.valueOf(runtimeWindowed.crashBootHandled ?: false))) {
            throw new GradleException('Phase 15.2 runtime-windowed report did not prove headless-safe window lifecycle, playable loop, walkthrough, and crash recovery evidence')
        }

        def windowLifecycle = json.parse(file('reports/echo/standalone/window-lifecycle.json'))
        if (String.valueOf(windowLifecycle.schema ?: '') != 'echo.standalone.window_lifecycle.v2'
                || !Boolean.valueOf(String.valueOf(windowLifecycle.created ?: false))
                || !Boolean.valueOf(String.valueOf(windowLifecycle.resized ?: false))
                || !Boolean.valueOf(String.valueOf(windowLifecycle.fullscreenEntered ?: false))
                || !Boolean.valueOf(String.valueOf(windowLifecycle.windowedEntered ?: false))) {
            throw new GradleException('Phase 15.2 window lifecycle report did not prove create, resize, fullscreen, and restore events')
        }

        def windowClose = json.parse(file('reports/echo/standalone/window-close.json'))
        if (String.valueOf(windowClose.schema ?: '') != 'echo.standalone.window_close.v2'
                || !Boolean.valueOf(String.valueOf(windowClose.closeRequested ?: false))
                || !Boolean.valueOf(String.valueOf(windowClose.closed ?: false))
                || !Boolean.valueOf(String.valueOf(windowClose.closedSafely ?: false))) {
            throw new GradleException('Phase 15.2 window close report did not prove close-request and safe close events')
        }

        def windowCrash = json.parse(file('reports/echo/standalone/window-crash-shutdown.json'))
        if (String.valueOf(windowCrash.schema ?: '') != 'echo.standalone.window_crash_shutdown.v2'
                || !Boolean.valueOf(String.valueOf(windowCrash.crashHandled ?: false))
                || !Boolean.valueOf(String.valueOf(windowCrash.closedSafely ?: false))
                || !Boolean.valueOf(String.valueOf(windowCrash.crashSafeClosed ?: false))) {
            throw new GradleException('Phase 15.2 window crash shutdown report did not prove fail-closed crash handling')
        }

        def forbiddenTokens = [
                'net.minecraft',
                'net.neoforged',
                'net.minecraftforge',
                'cpw.mods',
                'com.mojang',
                'org.lwjgl',
        ]
        def checkedSources = fileTree('echo-runtime-contracts/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-core/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-app/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-render/src/main/java') {
            include '**/*.java'
        } + fileTree('echo-runtime-testkit/src/main/java') {
            include '**/EchoRuntimeWindowedSmokeHarness.java'
        }
        checkedSources.files.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            def matches = forbiddenTokens.findAll { token -> text.contains(token) }
            if (!matches.isEmpty()) {
                throw new GradleException("Forbidden platform token(s) ${matches} in standalone windowed runtime source ${sourceFile}")
            }
        }
    }
}

