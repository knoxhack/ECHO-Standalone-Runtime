def echoStandaloneSha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def echoStandaloneSha512Base64 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-512')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
            digest.update(buffer, 0, read)
        }
    }
    java.util.Base64.encoder.encodeToString(digest.digest())
}

def echoStandaloneStripYamlScalar = { String value ->
    def trimmed = value == null ? '' : value.trim()
    if (trimmed.length() >= 2) {
        def first = trimmed.charAt(0)
        def last = trimmed.charAt(trimmed.length() - 1)
        if ((first == (char) 39 && last == (char) 39)
                || (first == (char) 34 && last == (char) 34)) {
            return trimmed.substring(1, trimmed.length() - 1)
        }
    }
    trimmed
}

def echoStandaloneElectronLatestYml = { File latestYml ->
    def metadata = [
            version    : '',
            path       : '',
            sha512     : '',
            releaseDate: '',
            fileUrl    : '',
            fileSha512 : '',
            fileSize   : 0L
    ]
    if (!latestYml.isFile()) {
        return metadata
    }
    boolean inFiles = false
    latestYml.eachLine('UTF-8') { rawLine ->
        def trimmed = rawLine.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('#')) {
            return
        }
        if (trimmed == 'files:') {
            inFiles = true
            return
        }
        boolean indented = rawLine.startsWith(' ') || rawLine.startsWith('\t') || trimmed.startsWith('- ')
        if (!indented) {
            inFiles = false
        }
        def line = trimmed.startsWith('- ') ? trimmed.substring(2).trim() : trimmed
        int colon = line.indexOf(':')
        if (colon < 0) {
            return
        }
        def key = line.substring(0, colon).trim()
        def value = echoStandaloneStripYamlScalar(line.substring(colon + 1))
        if (inFiles) {
            if (key == 'url') {
                metadata.fileUrl = value
            } else if (key == 'sha512') {
                metadata.fileSha512 = value
            } else if (key == 'size') {
                metadata.fileSize = value.isInteger() ? value.toLong() : 0L
            }
            return
        }
        if (metadata.containsKey(key)) {
            metadata[key] = key == 'fileSize' && value.isInteger() ? value.toLong() : value
        }
    }
    metadata
}

def echoStandaloneJson = { Object value ->
    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)) + System.lineSeparator()
}

def echoStandaloneWriteWindowLaunchBlockedReport = { String taskName, String reportPath, String schema, Map details = [:] ->
    def reportFile = file(reportPath)
    reportFile.parentFile.mkdirs()
    reportFile.text = echoStandaloneJson([
            schema                         : schema,
            generatedAt                    : '1970-01-01T00:00:00Z',
            generator                      : taskName,
            status                         : 'BLOCKED_WINDOW_LAUNCH_OPT_IN_REQUIRED',
            summary                        : 'Visible standalone window launch was skipped because this task can close the process it launches after sampling.',
            rendererTarget                 : 'opengl',
            nativeModLoaderCommandUsed     : false,
            windowLaunchSkipped            : true,
            windowLaunchOptInRequired      : true,
            optInProperty                  : 'echoStandaloneAllowWindowLaunch',
            optInEnvironmentVariable       : 'ECHO_STANDALONE_ALLOW_WINDOW_LAUNCH',
            optInCommand                   : "./gradlew.bat ${taskName} -PechoStandaloneAllowWindowLaunch=true",
            doesNotReplaceHumanPlaytest    : true
    ] + details)
}

