tasks.register('runStandaloneFullWorkspaceBuildSmoke') {
    group = 'verification'
    description = 'Runs the parent Echo workspace build smoke and writes release-readiness evidence.'

    doLast {
        def standaloneRoot = rootProject.projectDir
        def configuredWorkspaceRoot = providers.gradleProperty('echoWorkspaceRoot')
                .orElse(providers.environmentVariable('ECHO_WORKSPACE_ROOT'))
                .orNull
        def wrapperName = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows')
                ? 'gradlew.bat'
                : 'gradlew'
        def hasBuildEchoWorkspaceTask = { File candidateRoot ->
            ['build.gradle', 'build.gradle.kts'].any { buildFileName ->
                def buildFile = new File(candidateRoot, buildFileName)
                buildFile.isFile() && buildFile.getText('UTF-8').contains('buildEchoWorkspace')
            }
        }
        def parentWorkspaceRoot = standaloneRoot.parentFile
        def candidateWorkspaceRoots = ([
                configuredWorkspaceRoot ? file(configuredWorkspaceRoot) : null,
                parentWorkspaceRoot,
                new File(parentWorkspaceRoot, 'ECHO-Modules'),
                new File(parentWorkspaceRoot, 'ECHO-Native-Platform'),
                standaloneRoot
        ].findAll { it != null } as List<File>).unique { it.absolutePath.toLowerCase(java.util.Locale.ROOT) }
        def detectedWorkspaceRoot = configuredWorkspaceRoot
                ? file(configuredWorkspaceRoot)
                : candidateWorkspaceRoots.find { candidate ->
                    new File(candidate, wrapperName).isFile() && hasBuildEchoWorkspaceTask(candidate)
                }
        def workspaceRoot = detectedWorkspaceRoot ?: parentWorkspaceRoot
        def gradleWrapper = new File(workspaceRoot, wrapperName)
        def reportFile = file('reports/echo/standalone/full-workspace-build-smoke.json')
        reportFile.parentFile.mkdirs()

        if (!gradleWrapper.isFile()) {
            def candidateWrappers = []
            candidateWorkspaceRoots.findAll { it.isDirectory() }.each { root ->
                root.eachFileRecurse(groovy.io.FileType.FILES) { candidate ->
                    if (candidateWrappers.size() < 20 && candidate.name.equalsIgnoreCase(wrapperName)) {
                        candidateWrappers.add(candidate.absolutePath.replace('\\', '/'))
                    }
                }
            }
            def payload = [
                    schema: 'echo.standalone.full_workspace_build_smoke.v1',
                    generatedAt: '1970-01-01T00:00:00Z',
                    generator: 'phase15.agent3-full-workspace-build-smoke',
                    status: 'BLOCKED',
                    summary: 'Parent Echo workspace build could not start because the configured workspace root has no Gradle wrapper.',
                    workspaceRoot: workspaceRoot.absolutePath.replace('\\', '/'),
                    expectedGradleWrapper: gradleWrapper.absolutePath.replace('\\', '/'),
                    configuredWorkspaceRoot: configuredWorkspaceRoot ?: '',
                    candidateWorkspaceRoots: candidateWorkspaceRoots.collect { [
                            path: it.absolutePath.replace('\\', '/'),
                            wrapperPresent: new File(it, wrapperName).isFile(),
                            ownsBuildEchoWorkspace: hasBuildEchoWorkspaceTask(it)
                    ] },
                    candidateWrappers: candidateWrappers,
                    command: '',
                    noDaemon: true,
                    noConfigurationCache: true,
                    noParallel: true,
                    rerunTasks: true,
                    echoAddonSet: 'all',
                    exitCode: null,
                    durationMillis: 0L,
                    evidence: [
                            buildStarted: false,
                            buildSuccessful: false,
                            fullWorkspaceTask: false,
                            daemonDisabled: true,
                            configurationCacheDisabled: true,
                            parallelExecutionDisabled: true,
                            missingWorkspaceGradleWrapper: true
                    ],
                    outputTail: [
                            "Missing workspace Gradle wrapper: ${gradleWrapper}.",
                            'Set -PechoWorkspaceRoot or ECHO_WORKSPACE_ROOT to the Gradle workspace that owns buildEchoWorkspace.'
                    ]
            ]
            reportFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + System.lineSeparator()
            throw new GradleException("Missing workspace Gradle wrapper: ${gradleWrapper}. Set -PechoWorkspaceRoot or ECHO_WORKSPACE_ROOT when the full ECHO workspace is outside the parent directory.")
        }

        def command = [
                gradleWrapper.absolutePath,
                '--no-daemon',
                'buildEchoWorkspace',
                '-PechoAddonSet=all',
                '--no-configuration-cache',
                '--no-parallel',
                '--rerun-tasks',
                '--console=plain'
        ]
        def start = System.nanoTime()
        def process = new ProcessBuilder(command)
                .directory(workspaceRoot)
                .redirectErrorStream(true)
                .start()
        def outputText = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        def durationMillis = ((System.nanoTime() - start) / 1_000_000L) as long
        def passed = exitCode == 0 && outputText.contains('BUILD SUCCESSFUL')
        def outputLines = outputText.replace('\r\n', '\n').replace('\r', '\n').readLines()
        def outputTail = outputLines.size() > 40
                ? outputLines.subList(outputLines.size() - 40, outputLines.size())
                : outputLines
        def payload = [
                schema: 'echo.standalone.full_workspace_build_smoke.v1',
                generatedAt: '1970-01-01T00:00:00Z',
                generator: 'phase15.agent3-full-workspace-build-smoke',
                status: passed ? 'PASS' : 'FAILED',
                summary: passed
                        ? 'Parent Echo workspace build passed for the full addon set.'
                        : 'Parent Echo workspace build failed; see outputTail.',
                workspaceRoot: workspaceRoot.absolutePath.replace('\\', '/'),
                configuredWorkspaceRoot: configuredWorkspaceRoot ?: '',
                detectedWorkspaceRoot: detectedWorkspaceRoot ? detectedWorkspaceRoot.absolutePath.replace('\\', '/') : '',
                candidateWorkspaceRoots: candidateWorkspaceRoots.collect { [
                        path: it.absolutePath.replace('\\', '/'),
                        wrapperPresent: new File(it, wrapperName).isFile(),
                        ownsBuildEchoWorkspace: hasBuildEchoWorkspaceTask(it)
                ] },
                command: command.collect { it.toString() }.join(' '),
                noDaemon: true,
                noConfigurationCache: true,
                noParallel: true,
                rerunTasks: true,
                echoAddonSet: 'all',
                exitCode: exitCode,
                durationMillis: durationMillis,
                evidence: [
                        buildSuccessful: outputText.contains('BUILD SUCCESSFUL'),
                        fullWorkspaceTask: outputText.contains(':buildEchoWorkspace') || outputText.contains('buildEchoWorkspace'),
                        daemonDisabled: true,
                        detectedWorkspaceOwnsBuildEchoWorkspace: hasBuildEchoWorkspaceTask(workspaceRoot),
                        configurationCacheDisabled: true,
                        parallelExecutionDisabled: true
                ],
                outputTail: outputTail
        ]
        reportFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + System.lineSeparator()
        if (!passed) {
            throw new GradleException("Parent Echo workspace build smoke failed; report written to ${reportFile}")
        }
    }
}

tasks.register('runStandaloneBetaReadinessGate') {
    group = 'verification'
    description = 'Aggregates concrete standalone beta evidence and replaces bootstrap beta placeholder reports.'
    dependsOn tasks.named('runStandaloneNativeLoaderAbiSmoke')
    dependsOn tasks.named('runStandaloneRealModuleExecutionSmoke')
