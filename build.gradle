tasks.register('runStandaloneOpenlandsFullRouteContractSmoke') {
    group = 'verification'
    description = 'Aggregates beta-blocking Openlands Phase 9 evidence for biomes, creatures, tutorials, progression, waystones, worldgen, client session, and save/reload state.'
    dependsOn tasks.named('runStandaloneOpenlandsExperienceSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsPlayableRouteSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsWorldgenSmoke')
    dependsOn tasks.named('runStandaloneOpenlandsVoxelWorldSmoke')
    dependsOn tasks.named('runStandaloneClientOpenlandsSessionSmoke')

    doLast {
        def json = new groovy.json.JsonSlurper()
        def readReport = { String relativePath ->
            def reportFile = file(relativePath)
            if (!reportFile.isFile()) {
                throw new GradleException("Missing Openlands full-route evidence report: ${relativePath}")
            }
            def parsed
            try {
                parsed = json.parse(reportFile)
            } catch (Exception exception) {
                throw new GradleException("Invalid Openlands full-route evidence report ${relativePath}: ${exception.message}", exception)
            }
            if (String.valueOf(parsed.schema ?: '') == 'echo.standalone.evidence.bootstrap.v1') {
                throw new GradleException("Bootstrap placeholder is not accepted for Openlands full-route evidence: ${relativePath}")
            }
            if (String.valueOf(parsed.status ?: 'UNKNOWN') != 'PASS') {
                throw new GradleException("Openlands full-route evidence report did not pass: ${relativePath} status=${parsed.status ?: 'UNKNOWN'}")
            }
            parsed.path = relativePath
            parsed
        }
        def bool = { Object value -> Boolean.valueOf(String.valueOf(value ?: false)) }
        def count = { Object value -> value instanceof Number ? value.intValue() : String.valueOf(value ?: '0').toInteger() }
        def checks = []
        def requireCheck = { String id, String category, String reportPath, boolean passed, Object detail ->
            checks << [
                    id      : id,
                    category: category,
                    report  : reportPath,
                    status  : passed ? 'PASS' : 'FAILED',
                    detail  : detail
            ]
        }

        def experience = readReport('reports/echo/standalone/openlands-experience-contract.json')
        def requiredDomains = [
                'blocks',
                'items',
                'creatures',
                'biomes',
                'progression',
                'playtests',
                'tutorials',
                'saves',
                'worldgen',
                'waystones'
        ]
        def domains = (List) (experience.adapterCore?.domains ?: [])
        def playtestRequiredRouteSteps = (List) (experience.playtestRequiredRouteSteps ?: [])
        def openlandsContractLockedForBeta = bool(experience.adapterCore?.contractLockedForBeta)
        def openlandsContractRequiredForPass = bool(experience.adapterCore?.contractRequiredForPass)
        def openlandsAssetCoverage = experience.assetCoverage ?: [:]
        def openlandsPublicReleaseAssetPolishReady = bool(openlandsAssetCoverage.publicReleaseAssetPolishReady)
        def openlandsPublicReleaseContentPolishReady = bool(experience.publicReleaseContentPolishReady)
                && openlandsPublicReleaseAssetPolishReady
        def openlandsPlaceholderBetaOnly = bool(experience.placeholderAssetPolicyAcceptedForBetaOnly)
                || bool(openlandsAssetCoverage.placeholderCoverageAcceptedForBetaOnly)
        def openlandsPublicReleasePolishStatus = openlandsPublicReleaseContentPolishReady
                ? 'PASS'
                : 'BLOCKED_PUBLIC_ART_REVIEW'
        def openlandsPublicReleasePolishBlockers = experience.publicReleasePolishBlockers instanceof Collection
                ? experience.publicReleasePolishBlockers
                : []
        requireCheck('openlands.experience-source-contract', 'experience', experience.path,
                String.valueOf(experience.moduleId ?: '') == 'echoopenlandsprotocol'
                        && String.valueOf(experience.adapterCore?.coverageStatus ?: '') == 'active'
                        && openlandsContractLockedForBeta
                        && openlandsContractRequiredForPass
                        && requiredDomains.every { domains.contains(it) }
                        && ((List) (experience.runtimeTargets ?: [])).containsAll(['echo_native', 'echo_runtime_standalone', 'neoforge'])
                        && count(experience.contentCounts?.biomes) >= 4
                        && count(experience.contentCounts?.creatures) >= 10
                        && count(experience.contentCounts?.tutorialPrompts) >= 10
                        && playtestRequiredRouteSteps.containsAll([
                                'safe_spawn',
                                'first_gathering',
                                'first_tools',
                                'first_shelter',
                                'sleep_and_recover',
                                'first_exploration_hook',
                                'first_waystone'
                        ])
                        && count(experience.contentCounts?.waystoneStates) >= 8
                        && count(experience.warningCount) == 0
                        && bool(experience.evidence?.firstHourRouteVisible)
                        && bool(experience.evidence?.playtestAcceptanceVisible)
                        && bool(experience.evidence?.waystoneStateMachineVisible),
                [
                        adapterCore   : [
                                coverageStatus         : String.valueOf(experience.adapterCore?.coverageStatus ?: ''),
                                contractLockedForBeta  : openlandsContractLockedForBeta,
                                contractRequiredForPass: openlandsContractRequiredForPass,
                                nativeEntrypointDeclared: bool(experience.adapterCore?.nativeEntrypointDeclared)
                        ],
                        domains       : domains,
                        contentCounts : experience.contentCounts,
                        runtimeTargets: experience.runtimeTargets,
                        playtestRequiredRouteSteps: playtestRequiredRouteSteps,
                        assetCoverage : openlandsAssetCoverage,
                        publicReleaseContentPolishReady: openlandsPublicReleaseContentPolishReady,
                        placeholderAssetPolicyAcceptedForBetaOnly: openlandsPlaceholderBetaOnly,
                        publicReleasePolishStatus: openlandsPublicReleasePolishStatus
                ])

        def route = readReport('reports/echo/standalone/openlands-playable-route.json')
        def requiredRouteSteps = [
                'safe_spawn',
                'first_gathering',
                'first_tools',
                'first_shelter',
                'sleep_and_recover',
                'first_exploration_hook',
                'first_waystone'
        ]
        def requiredSaveFields = [
                'inventory',
                'hotbar',
                'placedBlocks',
                'chestContents',
                'bedrollSpawn',
                'campfireLitState',
                'shelterScore',
                'waystoneState',
                'holomapRegionDiscovery'
        ]
        def routeSteps = (List) (route.routeStepsCompleted ?: [])
        def sourceRouteSteps = (List) (route.sourceRouteSteps ?: [])
        def saveFields = (List) (route.saveFieldsPersisted ?: [])
        requireCheck('openlands.first-hour-playable-route', 'route', route.path,
                bool(route.firstHourComplete)
                        && bool(route.runtimePlaytestPass)
                        && bool(route.saveReloadPass)
                        && bool(route.waystoneSaveReloadPass)
                        && routeSteps == requiredRouteSteps
                        && sourceRouteSteps == requiredRouteSteps
                        && requiredSaveFields.every { saveFields.contains(it) }
                        && count(route.inventoryItemCount) >= 17
                        && count(route.placedBlockCount) >= 10
                        && count(route.shelterScore) >= 60
                        && String.valueOf(route.waystoneState ?: '') == 'stone_repaired'
                        && String.valueOf(route.restoredWaystoneState ?: '') == 'stone_repaired'
                        && count(route.saveFilesWritten) >= 8
                        && bool(route.evidence?.inventoryRuntimeState)
                        && bool(route.evidence?.shelterRuntimeState)
                        && bool(route.evidence?.holomapDiscoveryRuntimeState)
                        && bool(route.evidence?.waystoneRuntimeState)
                        && bool(route.evidence?.saveReloadVerified),
                [
                        routeSteps          : routeSteps,
                        inventoryItemCount  : route.inventoryItemCount,
                        shelterScore        : route.shelterScore,
                        waystoneState       : route.waystoneState,
                        restoredWaystoneState: route.restoredWaystoneState,
                        saveFieldsPersisted : saveFields
                ])

        def worldgen = readReport('reports/echo/standalone/openlands-worldgen.json')
        def starterGuarantees = worldgen.starterGuarantees ?: [:]
        def requiredGuarantees = [
                'woodWithin32',
                'waterWithin96',
                'twoLooseStoneNodesWithin32',
                'fiberWithin48',
                'caveRoadOrRuinWithin128',
                'foodWithin48'
        ]
        requireCheck('openlands.worldgen-biomes-creatures-landmarks', 'worldgen', worldgen.path,
                bool(worldgen.worldgenComplete)
                        && bool(worldgen.biomePalettesBound)
                        && bool(worldgen.spawnTablesBound)
                        && bool(worldgen.landmarkPoolsBound)
                        && bool(worldgen.starterSpawnGuaranteesBound)
                        && bool(worldgen.saveReloadPass)
                        && count(worldgen.sourceBiomeCount) >= 4
                        && count(worldgen.sourceLandmarkCount) >= 8
                        && count(worldgen.sourceCreatureCount) >= 10
                        && count(worldgen.generatedLandmarkCount) == count(worldgen.sourceLandmarkCount)
                        && count(worldgen.generatedCreatureSpawnCount) >= count(worldgen.sourceCreatureCount)
                        && String.valueOf(worldgen.starterBiomeId ?: '') == 'meadows'
                        && requiredGuarantees.every { starterGuarantees.containsKey(it) && String.valueOf(starterGuarantees[it]).length() > 0 }
                        && ((List) (worldgen.evidenceIds ?: [])).containsAll([
                                'biome_palettes_bound',
                                'spawn_tables_bound',
                                'landmark_pools_bound',
                                'starter_spawn_guarantees_bound'
                        ])
                        && bool(worldgen.evidence?.saveReloadVerified),
                [
                        starterBiomeId            : worldgen.starterBiomeId,
                        sourceBiomeCount          : worldgen.sourceBiomeCount,
                        generatedLandmarkCount    : worldgen.generatedLandmarkCount,
                        generatedCreatureSpawnCount: worldgen.generatedCreatureSpawnCount,
                        starterGuarantees         : starterGuarantees
                ])

        def voxel = readReport('reports/echo/standalone/openlands-voxel-world.json')
        def voxelGuarantees = voxel.starterGuarantees ?: [:]
        requireCheck('openlands.voxel-world-starter-region', 'world', voxel.path,
                String.valueOf(voxel.worldId ?: '') == 'echoopenlandsprotocol:standalone_first_hour'
                        && count(voxel.loadedChunkCount) >= 9
                        && String.valueOf(voxel.biomeSource ?: '') == 'echoopenlandsprotocol:openlands_biomes'
                        && count(voxel.mvpBiomeCount) >= 4
                        && String.valueOf(voxel.spawnBiome ?: '') == 'echoopenlandsprotocol:meadows'
                        && count(voxel.minecraftReferences) == 0
                        && !voxelGuarantees.isEmpty()
                        && voxelGuarantees.values().every { bool(it) },
                [
                        worldId          : voxel.worldId,
                        loadedChunkCount : voxel.loadedChunkCount,
                        spawnBiome       : voxel.spawnBiome,
                        starterGuarantees: voxelGuarantees
                ])

        def client = readReport('reports/echo/standalone/client-openlands-session.json')
        requireCheck('openlands.client-session-save-reload', 'client-session', client.path,
                String.valueOf(client.worldId ?: '') == 'echoopenlandsprotocol:standalone_first_hour'
                        && String.valueOf(client.spawnBiome ?: '') == 'echoopenlandsprotocol:meadows'
                        && count(client.loadedChunkCount) >= 25
                        && ((List) (client.starterHotbar ?: [])).containsAll([
                                'echoopenlandsprotocol:branchwood_planks',
                                'echoopenlandsprotocol:campfire'
                        ])
                        && bool(client.starterSatchelFood)
                        && bool(client.starterRecipeFiberBinding)
                        && bool(client.standardHazardsDisabled)
                        && count(client.bridge?.openlandsBlocks) >= 53
                        && count(client.bridge?.openlandsItems) >= 50
                        && count(client.bridge?.openlandsBiomes) >= 4
                        && bool(client.bridge?.brokenWaystoneResolvable)
                        && bool(client.bridge?.crudePickResolvable)
                        && bool(client.saveReload?.worldIdPreserved)
                        && bool(client.saveReload?.hotbarPreserved)
                        && String.valueOf(client.runtimeAssembly?.worldId ?: '') == 'echoopenlandsprotocol:standalone_first_hour'
                        && bool(client.runtimeAssembly?.standardHazardsDisabled),
                [
                        worldId         : client.worldId,
                        loadedChunkCount: client.loadedChunkCount,
                        starterHotbar   : client.starterHotbar,
                        bridge          : client.bridge,
                        saveReload      : client.saveReload
                ])

        def failed = checks.findAll { it.status != 'PASS' }
        def openlandsPublicReleaseBlockers = openlandsPublicReleaseContentPolishReady
                ? []
                : [[
                           id            : 'openlands.public-art-content-polish',
                           status        : openlandsPublicReleasePolishStatus,
                           evidenceReport: 'reports/echo/standalone/openlands-experience-contract.json',
                           detail        : 'Openlands route evidence can pass for beta, but public release requires final art/content review and cannot ship beta-only placeholder asset coverage.',
                           blockers      : openlandsPublicReleasePolishBlockers
                   ]]
        def reportPayload = [
                schema          : 'echo.standalone.openlands_full_route_contract.v1',
                generatedAt     : '1970-01-01T00:00:00Z',
                generator       : 'runStandaloneOpenlandsFullRouteContractSmoke',
                status          : failed.isEmpty() ? 'PASS' : 'BLOCKED',
                summary         : failed.isEmpty()
                        ? (openlandsPublicReleaseContentPolishReady
                        ? 'Openlands Phase 9 contract covers source content, first-hour route, public art/content polish, biomes, creatures, tutorials, progression, waystones, worldgen, client session, and save/reload state.'
                        : 'Openlands Phase 9 beta route contract covers source content, first-hour route, biomes, creatures, tutorials, progression, waystones, worldgen, client session, and save/reload state; public art/content polish remains blocked by beta-only placeholder asset coverage.')
                        : 'Openlands Phase 9 contract is blocked by missing or failed route evidence.',
                phase           : 'Phase 9 - Openlands Full Playable Route',
                contractLockedForBeta: openlandsContractLockedForBeta,
                contractRequiredForPass: openlandsContractRequiredForPass,
                publicReleaseContentPolishReady: openlandsPublicReleaseContentPolishReady,
                publicReleaseAssetPolishReady: openlandsPublicReleaseAssetPolishReady,
                publicReleaseAllowedWithPlaceholders: bool(openlandsAssetCoverage.publicReleaseAllowedWithPlaceholders),
                placeholderAssetPolicyAcceptedForBetaOnly: openlandsPlaceholderBetaOnly,
                publicReleasePolishStatus: openlandsPublicReleasePolishStatus,
                publicReleasePolishBlockers: openlandsPublicReleasePolishBlockers,
                publicReleaseBlockerCount: openlandsPublicReleaseBlockers.size(),
                publicReleaseBlockers: openlandsPublicReleaseBlockers,
                checkCount      : checks.size(),
                checksPassed    : checks.count { it.status == 'PASS' },
                failedChecks    : failed,
                categoriesCovered: checks.collect { it.category }.unique().sort(),
                checks          : checks,
                evidenceReports : checks.collect { it.report }.unique()
        ]
        def reportFile = file('reports/echo/standalone/openlands-full-route-contract.json')
        reportFile.parentFile.mkdirs()
        reportFile.text = echoStandaloneJson(reportPayload)
        if (!failed.isEmpty()) {
            throw new GradleException("Openlands full-route contract blocked; see ${reportFile}")
        }
    }
}

tasks.register('runStandaloneMinecraftMechanicsContractSmoke') {
    group = 'verification'
    description = 'Aggregates beta-blocking Minecraft mechanics evidence across blocks, items, crafting, world, entities, fluids, lighting, weather, hazards, and persistence.'
    dependsOn tasks.named('verifyStandaloneWorldRuntime')
    dependsOn tasks.named('verifyStandaloneEntityRuntime')
    dependsOn tasks.named('verifyStandaloneItemRuntime')
    dependsOn tasks.named('verifyStandaloneSaveRuntime')
